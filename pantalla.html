<!--
  La pantalla del gym (docs/PANTALLA_GYM.md, migración 152). Dos modos en el mismo archivo:

  /pantalla?k=<llave>   La tele. No inicia sesión (el cliente no guarda ninguna aunque alguien
                        haya entrado en este navegador): lee todo por gym_screen_state(), que
                        pide la llave de la pantalla. La llave se recuerda en el aparato, así
                        que después basta /pantalla.
  /pantalla?control     El control, en el teléfono del admin: usa la sesión que ya tiene en la
                        app (mismo origen) para encender la tele, cambiar el idioma o la llave,
                        recargarla y copiar su dirección.

  Quién sale lo decide cada socio en la app (Perfil → Pantalla del gym); quien no lo activó
  nunca llega aquí, solo se cuenta. La rutina la arma HabitScreen.effectiveExercises, la misma
  regla que la hoja de entreno.

  Se entera de los cambios por Realtime en gym_screen_pings (una fila sin datos personales que
  tocan triggers de reservas, entrenos y series) y, por si el socket se cae, vuelve a leer cada
  60 s. Nunca consulta Vercel. Se recarga sola con versión nueva, cada noche a las 4:00 y con
  el botón «Recargar tele» del control.

  Doble clic o la tecla F: pantalla completa.
-->
<style>
:root{
  --black:#141518;--card:#1c1e23;--card2:#24272d;--blue:#2563eb;--bl:#7fb0ff;--white:#f7f7f4;--gray:#8f96a3;--gl:#c9ced7;
  --green:#20d492;--amber:#f5b84b;--red:#ff6464;--line:rgba(255,255,255,.07);
  --pad:clamp(14px,2.2vw,44px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 70% 55% at 50% -14%,rgba(37,99,235,.2),transparent 70%),var(--black)}
body.idle{cursor:none}
.watermark{position:fixed;right:-9vh;bottom:-11vh;width:64vh;height:64vh;opacity:.03;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,24px);padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));padding-bottom:max(var(--pad),env(safe-area-inset-bottom))}

/* ── Encabezado ── */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(12px,2vw,32px);padding-bottom:clamp(10px,1.6vh,22px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:clamp(10px,1vw,16px);min-width:0}
.brand img{width:clamp(34px,6vh,74px);height:clamp(34px,6vh,74px);object-fit:contain;flex-shrink:0}
.brand-name{font-size:clamp(18px,3.2vh,40px);font-weight:900;letter-spacing:.12em;line-height:1}
.brand-sub{font-size:clamp(8px,1.15vh,14px);font-weight:800;letter-spacing:.24em;color:var(--bl);text-transform:uppercase;margin-top:.45em}
.title{text-align:center;min-width:0}
.kicker{font-size:clamp(10px,1.5vh,19px);font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--bl)}
h1{font-size:clamp(20px,4.2vh,56px);font-weight:900;line-height:1.05;margin-top:.2em;white-space:nowrap}
h1::first-letter{text-transform:uppercase}
.status{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.4vw,22px)}
.live{display:inline-flex;align-items:center;gap:.6em;border:1px solid rgba(32,212,146,.32);background:rgba(32,212,146,.1);color:var(--green);border-radius:999px;padding:.55em 1.05em;font-size:clamp(10px,1.4vh,17px);font-weight:900;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.live i{width:.62em;height:.62em;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:pulse 1.6s ease-in-out infinite}
.live.warn{border-color:rgba(245,184,75,.35);background:rgba(245,184,75,.1);color:var(--amber)}
.clock{font-size:clamp(18px,3.6vh,46px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--gl)}
@keyframes pulse{50%{opacity:.35}}

/* ── Quién está ── */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,22px)}
.grid{flex:1;min-height:0;display:grid;gap:clamp(12px,1.4vw,28px);grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.card{position:relative;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,16px);background:var(--card);border-radius:clamp(14px,2vh,26px);padding:clamp(14px,2.2vh,30px) clamp(16px,1.6vw,32px);overflow:hidden}
.card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:clamp(5px,.5vw,9px);background:var(--c,var(--blue))}
.c-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;min-width:0}
.c-name{font-size:calc(var(--fs)*1.35);font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-when{font-size:calc(var(--fs)*.62);font-weight:700;color:var(--gray);margin-top:.35em;font-variant-numeric:tabular-nums}
.c-timer{font-size:calc(var(--fs)*1.25);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;color:var(--white);white-space:nowrap}
.c-routine{display:flex;align-items:center;gap:.6em;min-width:0;font-size:calc(var(--fs)*.82);font-weight:800}
.c-routine b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;display:inline-flex;align-items:center;gap:.45em;padding:.38em .8em;border-radius:999px;font-size:calc(var(--fs)*.5);font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.07);color:var(--gl);white-space:nowrap}
.pill.on{background:rgba(32,212,146,.14);color:var(--green)}
.pill.on:before{content:'';width:.6em;height:.6em;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
.pill.done{background:rgba(127,176,255,.14);color:var(--bl)}
.pill.pause{background:rgba(245,184,75,.14);color:var(--amber)}
.bar{height:clamp(6px,.8vh,11px);border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c,var(--blue));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.c-prog{display:flex;align-items:center;gap:.8em}
.c-prog .bar{flex:1}
.c-count{flex:none;font-size:calc(var(--fs)*.58);font-weight:700;color:var(--gray);font-variant-numeric:tabular-nums}
.exs{list-style:none;display:flex;flex-direction:column;gap:clamp(4px,.6vh,8px);flex:1 1 auto;min-height:0;overflow:hidden}
/* Una sola persona: la tarjeta es toda la pantalla y la lista va en dos columnas. */
.grid.solo .exs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;column-gap:clamp(12px,1.4vw,28px)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:.5em .75em;border-radius:12px;font-size:calc(var(--fs)*.66)}
.ex .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .n small{display:block;font-size:.78em;font-weight:600;color:var(--gray);margin-top:.15em}
.ex .s{display:flex;gap:.28em;align-items:center}
.ex .s i{width:.62em;height:.62em;border-radius:50%;background:rgba(255,255,255,.14)}
.ex .s i.d{background:var(--c,var(--blue))}
.ex .s em{font-style:normal;font-weight:800;color:var(--gl);font-variant-numeric:tabular-nums}
.ex.done{color:var(--gray)}
.ex.now{background:var(--card2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ex.now .n{color:var(--white)}
.ex.swapped .n{text-decoration:line-through;text-decoration-thickness:.06em;color:var(--gray)}
.ex-more{font-size:calc(var(--fs)*.56);font-weight:700;color:var(--gray);padding:0 .75em}
.c-note{font-size:calc(var(--fs)*.62);color:var(--gray);font-weight:600}
.card.slim{justify-content:center}
/* ── En vivo (fase 2) ── */
.card.is-live{box-shadow:0 0 0 2px rgba(32,212,146,.55),0 14px 50px rgba(32,212,146,.12)}
.card.is-live.stale{box-shadow:none;opacity:.55}
.pill.cast{background:rgba(32,212,146,.16);color:var(--green)}
.pill.cast:before{content:'';width:.6em;height:.6em;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
.card.stale .pill.cast{background:rgba(245,184,75,.14);color:var(--amber)}
.card.stale .pill.cast:before{animation:none}
.c-now{background:var(--card2);border-radius:14px;padding:.55em .8em;min-width:0}
.c-now-n{font-size:calc(var(--fs)*1);font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-now-s{font-size:calc(var(--fs)*.64);font-weight:800;color:var(--c,var(--bl));margin-top:.25em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-rest{display:none;flex-direction:column;align-items:flex-end;gap:.2em;min-width:0}
.card.resting .c-rest{display:flex}
.card.resting .c-timer{display:none}
.c-rest .lbl{font-size:calc(var(--fs)*.5);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.c-rest b{font-size:calc(var(--fs)*1.6);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--amber)}
.c-rest.go b{color:var(--green);font-size:calc(var(--fs)*1.05)}
.c-rest .rb{display:block;width:calc(var(--fs)*4.2);height:calc(var(--fs)*.16);border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.c-rest .rb i{display:block;height:100%;background:var(--amber);border-radius:inherit;transition:width 1s linear}
.c-rest.go .rb{visibility:hidden}

/* ── Zonas de la tele ── */
.pv,.dv{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,22px)}
[hidden]{display:none!important}
/* ── La rutina del día ── */
.dv-head{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,24px);min-width:0}
.dv-k{flex:none;font-size:clamp(11px,1.7vh,22px);font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--bl))}
.dv-head h2{min-width:0;font-size:clamp(22px,4.4vh,60px);font-weight:900;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-n{flex:none;margin-left:auto;font-size:clamp(11px,1.7vh,22px);font-weight:700;color:var(--gray)}
.dv-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:center;justify-items:center;gap:clamp(10px,1.2vw,26px)}
.dt{margin:0;display:flex;flex-direction:column;align-items:center;gap:.4em;width:var(--mw,100%);min-width:0;font-size:var(--fs,18px)}
.dt-m{position:relative;width:var(--mw,100%);height:var(--mh,auto);aspect-ratio:9/16;border-radius:clamp(10px,1.4vh,20px);overflow:hidden;background:var(--card2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.dt-m iframe,.dt-m video,.dt-m img{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.dt-m video,.dt-m img.pic{object-fit:cover}
.dt-m img.anim{object-fit:contain;padding:8%}
.dt-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--fs,18px)*3.2);font-weight:900;color:rgba(255,255,255,.08)}
.dt-num{position:absolute;left:.45em;top:.45em;min-width:1.9em;height:1.9em;padding:0 .4em;border-radius:.6em;display:grid;place-items:center;background:var(--c,var(--blue));color:#fff;font-weight:900;font-size:calc(var(--fs,18px)*1.05);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dt figcaption{width:100%;text-align:center;line-height:1.15;min-width:0}
.dt figcaption b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.dt figcaption span{display:block;margin-top:.25em;font-weight:900;font-size:1.15em;color:var(--c,var(--bl));font-variant-numeric:tabular-nums}
/* ── Sin nadie: el reloj grande ── */
.empty{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
.big-clock{font-size:clamp(64px,min(18vw,26vh),420px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big-clock span{color:var(--bl);font-size:.42em;margin-left:.08em}
.empty h2{font-size:clamp(20px,3.6vh,46px);font-weight:900}
.empty p{font-size:clamp(13px,2vh,26px);color:var(--gray);max-width:46ch;line-height:1.4}
.empty img{width:clamp(70px,14vh,160px);height:clamp(70px,14vh,160px);opacity:.5}

/* ── Más tarde y pie ── */
.later{display:flex;align-items:center;gap:clamp(10px,1.2vw,22px);min-width:0;overflow:hidden;white-space:nowrap;font-size:clamp(12px,1.9vh,24px)}
.later .tag{flex:none;color:var(--bl);font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.78em}
.later .it{flex:none;display:inline-flex;align-items:center;gap:.55em;background:var(--card);border-radius:999px;padding:.5em .95em;font-weight:700}
.later .it b{font-variant-numeric:tabular-nums;color:var(--gl)}
.later .it u{text-decoration:none;color:var(--gray);font-weight:600}
.later .dot{width:.6em;height:.6em;border-radius:50%;background:var(--c,var(--blue))}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:clamp(8px,1.4vh,18px);border-top:1px solid var(--line);font-size:clamp(11px,1.6vh,20px);color:var(--gray);font-weight:600;min-height:1.6em}

.fs-btn{position:fixed;right:14px;bottom:14px;z-index:20;border:1px solid rgba(255,255,255,.14);background:rgba(20,20,22,.85);color:var(--gl);border-radius:12px;padding:10px 14px;font:700 12px 'Inter',sans-serif;letter-spacing:.06em;cursor:pointer;opacity:.85;transition:opacity .3s}
body.idle .fs-btn{opacity:0;pointer-events:none}

/* ── Celular / vertical: una columna que se desplaza ── */
@media (max-width:760px),(orientation:portrait) and (max-width:1100px){
  html,body{overflow:auto}
  .stage{height:auto;min-height:100dvh}
  .top{grid-template-columns:minmax(0,1fr) auto}
  .title{grid-column:1/-1;grid-row:2;text-align:left}
  h1{white-space:normal;font-size:24px}
  .clock{display:none}
  .grid{display:flex;flex-direction:column}
  .card{min-height:auto}
  .later{flex-wrap:wrap;white-space:normal}
  .dv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dt,.dt-m{width:100%}
  .dt-m{height:auto}
  .dv-head{flex-wrap:wrap}
  .dv-head h2{white-space:normal}
  .fs-btn{display:none}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── Control (teléfono del admin) ── */
body.control{overflow:auto;height:auto}
body.control .stage{height:auto;min-height:100dvh;max-width:560px;margin:0 auto}
.ctl{display:flex;flex-direction:column;gap:14px}
.ctl h2{font-size:22px;font-weight:900}
.ctl p{color:var(--gray);font-size:14px;line-height:1.45}
.ctl .box{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ctl .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:700}
.ctl .seg{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px}
.ctl .seg button{border:0;background:none;color:var(--gl);font:700 14px 'Inter',sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer}
.ctl .seg button.on{background:var(--blue);color:#fff}
.ctl .url{font:600 13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--card2);border-radius:10px;padding:10px 12px;color:var(--gl)}
.ctl .btn{border:0;border-radius:13px;padding:13px 16px;font:800 15px 'Inter',sans-serif;cursor:pointer;background:#e9eef5;color:#060607}
.ctl .btn.ghost{background:var(--card2);color:var(--white)}
.ctl .btn.danger{background:rgba(255,100,100,.14);color:var(--red)}
.ctl .msg{font-size:13px;color:var(--green);min-height:1.2em}
.ctl .sel{width:100%;background:var(--card2);color:var(--white);border:0;border-radius:12px;padding:12px;font:700 15px 'Inter',sans-serif}
.ctl .msg.err{color:var(--red)}
</style>
</head>

<button class="fs-btn" id="fs" type="button"></button>

<script>
const PANTALLA_VERSION='20261127-2';
const SUPABASE_URL='https://pmpjteuqjusbiduevbwq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGp0ZXVxanVzYmlkdWV2YndxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2OTI1NjUsImV4cCI6MjA5MzI2ODU2NX0.XbMzZoo2yqtrD8znLnyo_1zDfrdJAvAPj1lqGOyXnLw';

const H=window.HabitScreen;

const params=new URLSearchParams(location.search);
// ?lite: la rutina del día con fotos en lugar de videos, para una tele que no aguante varios.
const LITE=params.has('lite');
const narrowMq=matchMedia('(max-width:760px),(orientation:portrait) and (max-width:1100px)');
const CONTROL=params.has('control');
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}}};

// La tele no guarda sesión: aunque alguien haya entrado a la app en este navegador, aquí se
// lee como anon. El control sí usa la sesión del admin (misma llave de almacenamiento que la app).
const tv=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,CONTROL
  ?{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}
  :{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

let lang='es';
const t=()=>H.T(lang);
const fmtTime=d=>new Intl.DateTimeFormat(lang==='en'?'en-US':'es-MX',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Mazatlan'}).format(d);
const fmtDay=d=>new Intl.DateTimeFormat(lang==='en'?'en-US':'es-MX',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Mazatlan'}).format(d);
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s).padStart(2,'0');
}



// ── Demostración: /pantalla?demo (y &lang=en) ────────────────────────────────
// Datos inventados para enseñar cómo se ve la tele sin depender de quién reservó hoy: no
// pide llave ni lee la base. Una serie se palomea cada pocos segundos para ver cómo se mueve.
const DEMO=params.has('demo');
const DEMO_LABEL={es:'Demostración',en:'Demo'};
// ?demo=rutina: nadie en el gym, así que se ve la rutina del día.
const DEMO_ROUTINE=DEMO&&params.get('demo')==='rutina';
// La rutina del día de la demostración usa las figuras animadas del repo (skill-anim), que
// no dependen de nadie; la tele real usa los videos del gym de la rutina básica que toca.

  const ex=(name,sets,reps,slug,extra)=>Object.assign({name,sets:String(sets),reps,media:['/skill-anim/'+slug+'.svg']},extra||{});
  return {id:'demo',title:'Parada de manos · básica',color:'#2563eb',exercises:[
    ex('Preparación de muñecas',1,'60s','preparacion-de-munecas',{repsType:'time'}),
    ex('Encogimientos en pica',3,'10','encogimientos-en-pica'),
    ex('Hollow hold',3,'30s','hollow-hold',{repsType:'time'}),
    ex('Patadas de conejo',3,'8','patadas-de-conejo'),
    ex('Patada a la pared',3,'6','patada-a-la-pared'),
    ex('Parada de manos en pared',3,'30s','parada-de-manos-en-pared',{repsType:'time'}),
    ex('Toques de hombro en pared',3,'10','toques-de-hombro-en-pared'),
    ex('Caminata en pared',3,'4','caminata-en-pared')]};

function makeDemo(){
  const t0=Date.now(),iso=ms=>new Date(ms).toISOString(),min=60000;
  const ex=(id,name,sets,reps,extra)=>Object.assign({id,name,sets:String(sets),reps},extra||{});
  const legs=[ex('a','Sentadilla trasera',4,'6-8'),ex('b','Peso muerto rumano',3,'8-10'),ex('c','Zancada búlgara',3,'10'),
    ex('d','Extensión de cuádriceps',3,'12'),ex('e','Curl femoral',3,'12'),ex('f','Elevación de talones',4,'15'),ex('g','Plancha',3,'40s',{repsType:'time'})];
  const push=[ex('p1','Press banca',4,'8'),ex('p2','Press militar con mancuernas',3,'10'),ex('p3','Fondos en paralelas',3,'al fallo'),
    ex('p4','Aperturas en polea',3,'12-15'),ex('p5','Extensión de tríceps con cuerda',3,'12')];
  const pull=[ex('q1','Dominadas',4,'6'),ex('q2','Remo con barra',4,'8-10'),ex('q3','Jalón al pecho',3,'12'),ex('q4','Curl con barra',3,'10')];
  const weights={a:[80,85,85,87.5],b:[60,60,62.5],c:[16,16,16],d:[45,45,50],e:[35,35,35],f:[60,60,60,60],p1:[50,55,55,57.5],p2:[18,18,20],p4:[12,12,12],p5:[20,20,22.5],q1:[0,0,0,0],q2:[50,50,55,55],q3:[45,45,50],q4:[25,25,27.5]};
  const setsFor=(list,doneUpTo)=>{const out=[];let n=0;list.forEach(e=>{const k=e.id,c=+e.sets;for(let i=0;i<c;i++){out.push({k,i,d:n<doneUpTo,w:(weights[k]||[])[i]||null});n++;}});return out;};
  const people=[
    {key:'d1',name:'Ana R.',start_at:iso(t0-45*min),end_at:iso(t0+45*min),visibility:'routine',
      routine:{source:'session',title:'Pierna A',color:'#22c55e',status:'in_progress',board_id:'b1',started_at:iso(t0-38*min),paused_at:null,paused_seconds:0,exercises:legs,overlay:[],sets:setsFor(legs,7)},
      // Ana pasó su entreno a la pantalla: la tele sabe qué serie hace y cuánto le queda de descanso.
      live:{focus_key:'c',focus_idx:0,rest_end_at:iso(t0+18000),rest_frozen_s:0,rest_total_s:20,paused:false,updated_at:iso(t0)}},
    {key:'d2',name:'Carlos M.',start_at:iso(t0-15*min),end_at:iso(t0+75*min),visibility:'routine',
      routine:{source:'session',title:'Empuje',color:'#2563eb',status:'in_progress',board_id:'b2',started_at:iso(t0-9*min),paused_at:null,paused_seconds:0,exercises:push,overlay:[],sets:setsFor(push,2)}},
    {key:'d3',name:'Sofía L.',start_at:iso(t0-80*min),end_at:iso(t0+10*min),visibility:'routine',
      routine:{source:'session',title:'Tirón',color:'#a855f7',status:'done',board_id:'b3',started_at:iso(t0-75*min),completed_at:iso(t0-4*min),exercises:pull,overlay:[],sets:setsFor(pull,99)}},
    {key:'d4',name:'Diego T.',start_at:iso(t0-5*min),end_at:iso(t0+85*min),visibility:'name',routine:null},
    {key:'d5',name:'Lucía G.',start_at:iso(t0+55*min),end_at:iso(t0+145*min),visibility:'routine',
      routine:{source:'plan',title:'Pierna B',color:'#f97316',status:'planned',board_id:'b4',exercises:legs,overlay:[],sets:[]}},
    {key:'d6',name:'Mario P.',start_at:iso(t0+115*min),end_at:iso(t0+205*min),visibility:'name',routine:null}
  ];
  // En ?demo=rutina nadie está en el gym todavía: solo quedan las reservas de más tarde.
  const shown=DEMO_ROUTINE?people.filter(p=>Date.parse(p.start_at)>t0+10*min):people;
  return {ok:true,mode:'on',name:'Demo',lang:params.get('lang')==='en'?'en':'es',now:iso(t0),hidden_now:DEMO_ROUTINE?0:1,people:shown};
}
// Cada pocos segundos, la siguiente serie pendiente de quien está entrenando se palomea; al
// terminar todo, vuelve a empezar.
function advanceDemo(state){
  const nowMs=Date.now();
  state.people.forEach(p=>{if(p.live)p.live.updated_at=new Date(nowMs).toISOString();});
  // Quien transmite no avanza mientras descansa: así se ve la cuenta llegar a cero.
  const live=state.people.filter(p=>p.routine&&p.routine.status==='in_progress'
    &&!(p.live&&Date.parse(p.live.rest_end_at)>nowMs-3000));
  const p=live[Math.floor(Math.random()*live.length)];if(!p)return;
  const next=p.routine.sets.find(s=>!s.d);
  if(next)next.d=true;else p.routine.sets.forEach(s=>{s.d=false;});
  if(p.live){
    // Tras palomear: la siguiente serie es la que toca y arranca un descanso de 20 s.
    const after=p.routine.sets.find(s=>!s.d);
    p.live.focus_key=after?after.k:null;p.live.focus_idx=after?after.i:null;
    p.live.rest_end_at=new Date(nowMs+20000).toISOString();p.live.rest_total_s=20;
  }
  state.now=new Date().toISOString();
}

// La tele
// ═════════════════════════════════════════════════════════════════════════════
function initTv(){
  let key=params.get('k');
  const demoState=DEMO?makeDemo():null;
  if(key&&!DEMO){store.set(KEY_STORE,key);}else if(!DEMO)key=store.get(KEY_STORE);
  // La llave no se queda en la barra de direcciones a la vista de quien pase.
  if(params.has('k'))history.replaceState(null,'',location.pathname);

  let data=null,view='loading',fetchOk=true,skew=0,nonce=null,peopleSig='';
  // La rutina del día (migración 156): cambia una vez al día, así que se pide cada 10 min y
  // no con cada aviso. Sin la 156 se queda en null y la tele enseña el reloj como antes.
  let daily=DEMO?makeDemoDaily():null,dailyAt=0,dailySig='';
  const DAILY_MS=10*60000;
  async function loadDaily(){
    if(DEMO||!key||Date.now()-dailyAt<DAILY_MS)return;
    dailyAt=Date.now();
    try{
      const{data:res,error}=await tv.rpc('gym_screen_daily',{p_screen:SCREEN_ID,p_key:key});
      if(error){daily=null;return;}
      daily=res&&res.ok&&res.board&&Array.isArray(res.board.exercises)&&res.board.exercises.length?res.board:null;
    }catch(_){dailyAt=0;}
  }
  const serverNow=()=>new Date(Date.now()+skew);

  async function load(){
    if(DEMO){
      demoState.now=new Date().toISOString();
      data=JSON.parse(JSON.stringify(demoState));skew=0;
      if(data.lang!==lang){lang=data.lang;document.documentElement.lang=lang;}
      view='ok';return;
    }
    if(!key){view='key';data=null;return;}
    const{data:res,error}=await tv.rpc('gym_screen_state',{p_screen:SCREEN_ID,p_key:key});
    if(error){
      if(/gym_screen_state|schema cache|does not exist|42883|PGRST202/i.test((error.message||'')+' '+(error.code||''))){view='missing';data=null;return;}
      throw error;
    }
    if(!res||res.ok===false){view='key';data=null;store.set(KEY_STORE,null);return;}
    skew=Date.parse(res.now)-Date.now();
    data=res;
    if(res.mode!=='off')await loadDaily();
    if(res.lang&&res.lang!==lang){lang=res.lang;document.documentElement.lang=lang;}
    view=res.mode==='off'?'off':'ok';
  }
  let inflight=false,again=false;
  async function refresh(){
    if(inflight){again=true;return;}
    inflight=true;
    try{await load();fetchOk=true;}
    catch(e){console.warn('pantalla:',e);fetchOk=false;}
    inflight=false;
    render();
    if(again){again=false;refresh();}
  }
  let debounceT=null;
  // Un entreno en curso toca la fila con cada serie; se juntan los avisos de un segundo.
  const scheduleRefresh=()=>{clearTimeout(debounceT);debounceT=setTimeout(refresh,800);};

  // ── Pintado ────────────────────────────────────────────────────────────────
  function render(){
    paintChrome();
    const main=$('main'),foot=$('foot');
    if(view!=='ok'){
      peopleSig='';dailySig='';
      const T=t();
      const [title,sub]=view==='loading'?[T.loading,'']:view==='missing'?[T.missing,T.missingSub]
        :view==='key'?[T.badKey,T.badKeySub]:[T.off,T.offSub];
      main.innerHTML='<div class="empty">'+(view==='off'?bigClockHtml():'<img src="/icons/logo-original.png" alt="">')
        +'<h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>';
      foot.textContent='';
      return;
    }
    const now=serverNow();
    const people=(data.people||[]).map(p=>({...p,start:Date.parse(p.start_at),end:Date.parse(p.end_at)}));
    // «En el gym» desde 10 min antes de su reserva, como la puerta.
    const inGym=people.filter(p=>now>=p.start-10*60000&&now<p.end);
    const later=people.filter(p=>now<p.start-10*60000);
    // Nadie en pantalla: la rutina del día ocupa el lugar del reloj grande.
    const showDaily=!inGym.length&&!!(daily&&daily.exercises&&daily.exercises.length);
    if(!$('pv'))main.innerHTML='<div class="pv" id="pv"></div><div class="dv" id="dv" hidden></div><div id="lv"></div>';
    const sig=JSON.stringify([inGym.map(p=>p.key),later.map(p=>p.key),data.people,showDaily]);
    if(sig!==peopleSig){
      peopleSig=sig;
      $('pv').innerHTML=inGym.length?gridHtml(inGym):showDaily?'':emptyHtml(later.length);
      $('pv').hidden=showDaily;
      $('lv').innerHTML=later.length?laterHtml(later):'';
      fitCards();
    }
    paintDaily(showDaily);
    tickTimers();
    const hidden=data.hidden_now|0;
    foot.textContent=hidden?t().hiddenNow(hidden):'';
  }
  function paintChrome(){
    const T=t(),now=serverNow();
    $('kicker').textContent=T.inGym;
    $('title').textContent=fmtDay(now);
    const live=$('live');
    live.className='live'+(fetchOk?'':' warn');
    live.querySelector('span').textContent=DEMO?DEMO_LABEL[lang]:fetchOk?T.live:T.reconnecting;
    $('fs').textContent=document.fullscreenElement?T.exitFullscreen:T.fullscreen;
    document.title='HABIT · '+T.inGym;
  }
  // ── La rutina del día: cada ejercicio en su cuadro, todos a la vista ───────
  function paintDaily(show){
    const dv=$('dv');if(!dv)return;
    if(!show){if(dailySig){dv.innerHTML='';dailySig='';}dv.hidden=true;return;}
    dv.hidden=false;
    const sig=JSON.stringify(daily)+'|'+lang+'|'+LITE;
    if(sig!==dailySig){dailySig=sig;dv.innerHTML=dailyHtml(daily);wireDailyMedia(dv);}
    layoutDaily();
  }
  function dailyHtml(b){
    const T=t(),list=b.exercises||[];
    return '<div class="dv-head" style="--c:'+safeColor(b.color)+'"><span class="dv-k">'+esc(T.daily)+'</span>'
      +'<h2>'+esc(b.title||'')+'</h2><span class="dv-n">'+esc(T.dailyCount(list.length))+'</span></div>'
      +'<div class="dv-grid" style="--c:'+safeColor(b.color)+'">'+list.map((ex,i)=>{
        const target=H.targetLabel({total:H.plannedSetCount(ex),reps:ex.reps||'',repsType:ex.repsType||''});
        return '<figure class="dt"><div class="dt-m">'+mediaHtml(H.pickMedia(ex.media),i)+'<span class="dt-num">'+(i+1)+'</span></div>'
          +'<figcaption><b>'+esc(ex.name||'')+'</b>'+(target?'<span>'+esc(target)+'</span>':'')+'</figcaption></figure>';
      }).join('')+'</div>';
  }
  // Los videos del gym son YouTube Shorts verticales: van mudos, en bucle y sin controles,
  // como un GIF. Con ?lite (para una tele que no aguante varios videos a la vez) va la foto.
  function mediaHtml(m,i){
    const ph='<div class="dt-ph">'+(i+1)+'</div>';
    if(!m)return ph;
    if(m.kind==='image')return '<img class="'+(m.anim?'anim':'pic')+'" src="'+esc(m.url)+'" alt="" decoding="async">';
    if(m.kind==='video')return '<video src="'+esc(m.url)+'" autoplay muted loop playsinline preload="auto"></video>';
    if(m.kind==='youtube'){
      if(LITE)return '<img class="pic" src="https://i.ytimg.com/vi/'+esc(m.id)+'/hqdefault.jpg" alt="">';
      const q='autoplay=1&mute=1&loop=1&playlist='+encodeURIComponent(m.id)+'&controls=0&modestbranding=1&playsinline=1&rel=0&disablekb=1&iv_load_policy=3&fs=0';
      return '<iframe src="https://www.youtube-nocookie.com/embed/'+esc(m.id)+'?'+q+'" allow="autoplay; encrypted-media" tabindex="-1" title="" loading="eager"></iframe>';
    }
    // Drive no deja reproducir sin un toque: su foto.
    if(m.kind==='drive')return '<img class="pic" src="https://drive.google.com/thumbnail?id='+esc(m.id)+'&sz=w640" alt="">';
    return ph;
  }
  // Una foto o un GIF que no carga deja el número en su lugar, no un cuadro roto.
  function wireDailyMedia(root){
    root.querySelectorAll('.dt-m img,.dt-m video').forEach(el=>el.addEventListener('error',()=>{
      const box=el.closest('.dt-m'),n=box&&box.querySelector('.dt-num');
      el.remove();if(box&&!box.querySelector('.dt-ph'))box.insertAdjacentHTML('afterbegin','<div class="dt-ph">'+esc(n?n.textContent:'')+'</div>');
    }));
  }
  // Cuántas filas y de qué tamaño para que todo quepa sin desplazar: cada cuadro es vertical
  // (9:16, como los videos del gym) con su texto abajo. Gana el acomodo con el cuadro más grande.
  function layoutDaily(){
    const grid=document.querySelector('#dv .dv-grid');if(!grid)return;
    if(narrowMq.matches){grid.style.removeProperty('--cols');return;}
    const n=grid.children.length;if(!n)return;
    const W=grid.clientWidth,Hh=grid.clientHeight,gap=Math.max(10,Math.min(26,innerWidth*.012));
    let best=null;
    for(let r=1;r<=4;r++){
      const cols=Math.ceil(n/r),colW=(W-gap*(cols-1))/cols,rowH=(Hh-gap*(r-1))/r;
      const cap=Math.max(52,Math.min(rowH*.3,colW*.42));
      let mh=Math.min(colW*16/9,rowH-cap),mw=mh*9/16;
      if(mw>colW){mw=colW;mh=mw*16/9;}
      if(mh<=0)continue;
      const fs=Math.max(12,Math.min(cap/3.1,colW*.11,40));
      if(!best||mw*mh>best.mw*best.mh+1)best={cols,mw,mh,cap,fs};
    }
    if(!best)return;
    grid.style.setProperty('--cols',best.cols);
    grid.style.setProperty('--mw',Math.floor(best.mw)+'px');
    grid.style.setProperty('--mh',Math.floor(best.mh)+'px');
    grid.style.setProperty('--fs',Math.floor(best.fs)+'px');
  }
  function bigClockHtml(){return '<div class="big-clock" id="big-clock"></div>';}
  function emptyHtml(hasLater){
    const T=t();
    return '<div class="empty">'+bigClockHtml()+'<h2>'+esc(T.noOne)+'</h2><p>'+esc(T.noOneSub)+'</p></div>';
  }
  function gridHtml(list){
    const n=list.length;
    // 1 → una tarjeta grande; 2 y 3 lado a lado; 4 → 2×2 (el cupo del gym).
    const cols=n===4?2:Math.min(n,3);
    const rows=Math.ceil(n/cols);
    const fs=n===1?'clamp(20px,4.4vh,56px)':rows>1?'clamp(14px,2.6vh,34px)':n===2?'clamp(16px,3.4vh,44px)':'clamp(14px,2.9vh,38px)';
    // Tope de partida; fitCards() quita después lo que de verdad no cabe en cada tarjeta.
    const maxEx=n===1?16:rows>1?6:10;
    return '<div class="grid'+(n===1?' solo':'')+'" style="--cols:'+cols+';--fs:'+fs+'">'+list.map(p=>cardHtml(p,maxEx)).join('')+'</div>';
  }
  function statusOf(r){
    if(!r)return null;
    if(r.status==='in_progress')return r.paused_at?'paused':'in_progress';
    return r.status==='done'?'done':'planned';
  }
  function cardHtml(p,maxEx){
    const T=t();
    const name=p.name||T.member;
    const when=T.until(fmtTime(new Date(p.end)));
    if(p.visibility!=='routine'){
      return '<article class="card slim"><div class="c-name">'+esc(name)+'</div><div class="c-when">'+esc(when)+'</div></article>';
    }
    const r=p.routine;
    if(!r){
      return '<article class="card slim"><div class="c-name">'+esc(name)+'</div><div class="c-when">'+esc(when)+'</div>'
        +'<div class="c-note">'+esc(T.noRoutine)+'</div></article>';
    }
    const st=statusOf(r);
    const pr=H.progress(r);
    // Transmitiendo (fase 2): la serie que toca la dice el teléfono, no la primera pendiente.
    const live=p.live&&typeof p.live==='object'?p.live:null;
    let current=pr.current;
    if(live&&live.focus_key){const i=pr.items.findIndex(it=>it.key===live.focus_key&&!it.replaced);if(i>=0)current=i;}
    const pct=pr.total?Math.round(pr.done/pr.total*100):0;
    const color=safeColor(r.color);
    const pillCls=st==='in_progress'?'on':st==='done'?'done':st==='paused'?'pause':'';
    const timer=st==='in_progress'||st==='paused'
      ?'<div class="c-timer" data-start="'+esc(r.started_at||'')+'" data-paused="'+(r.paused_seconds|0)+'" data-pausedat="'+esc(r.paused_at||'')+'"></div>':'';
    // Una ventana de ejercicios alrededor del que va: el anterior para ver de dónde viene,
    // y los que siguen.
    const items=pr.items;
    let from=0;
    if(live&&st!=='done'&&current>=0)from=current+1; // el de ahora va en grande arriba: la lista es lo que sigue
    else if(items.length>maxEx&&current>0)from=Math.min(Math.max(0,current-1),items.length-maxEx);
    const shown=items.slice(from,from+maxEx);
    const exs=shown.map((it,i)=>{
      const idx=from+i;
      const cls=it.replaced?'swapped':idx===current&&st!=='planned'?'now':it.done>=it.total&&it.total?'done':'';
      const dots=it.total<=8
        ?Array.from({length:it.total},(_,k)=>'<i'+(k<it.done?' class="d"':'')+'></i>').join('')
        :'<em>'+it.done+'/'+it.total+'</em>';
      const sub=[H.targetLabel(it),it.lastWeight?fmtKg(it.lastWeight)+' kg':''].filter(Boolean).join(' · ');
      return '<li class="ex '+cls+'"><div class="n">'+esc(it.name||'—')+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><div class="s">'+dots+'</div></li>';
    }).join('');
    const rest=items.length-(from+shown.length);
    // En vivo: el ejercicio y la serie de ahora en grande, y el descanso en lugar del cronómetro.
    let nowHtml='',restHtml='',liveAttrs='';
    if(live){
      const it=items[current];
      if(it&&st!=='done'){
        const rows=H.setsByKey(r.sets)[it.key]||[];
        const setIdx=live.focus_idx!=null?live.focus_idx:Math.min(it.done,Math.max(0,it.total-1));
        const row=rows.find(x=>x.set_idx===setIdx);
        const reps=(row&&row.reps_target)||it.reps||'';
        const w=(row&&row.weight)||it.lastWeight;
        const detail=[T.setOf(setIdx+1,Math.max(it.total,setIdx+1)),reps?(/^\d+$/.test(String(reps))?reps+' reps':reps):'',w?fmtKg(w)+' kg':''].filter(Boolean).join(' · ');
        nowHtml='<div class="c-now"><div class="c-now-n">'+esc(it.name||'—')+'</div><div class="c-now-s">'+esc(detail)+'</div></div>';
      }
      restHtml='<div class="c-rest"><span class="lbl"></span><b></b><span class="rb"><i></i></span></div>';
      liveAttrs=' data-live="1" data-upd="'+esc(live.updated_at||'')+'" data-restend="'+esc(live.rest_end_at||'')+'" data-frozen="'+(live.rest_frozen_s|0)+'" data-total="'+(live.rest_total_s|0)+'"';
    }
    const pill=live?'<span class="pill cast">'+esc(T.liveNow)+'</span>':'<span class="pill '+pillCls+'">'+esc(T.st[st])+'</span>';
    return '<article class="card'+(live?' is-live':'')+'" style="--c:'+color+'" data-rest="'+rest+'" data-min="'+(live?0:1)+'"'+liveAttrs+'>'
      +'<div class="c-top"><div style="min-width:0"><div class="c-name">'+esc(name)+'</div><div class="c-when">'+esc(when)+'</div></div>'+timer+restHtml+'</div>'
      +'<div class="c-routine"><b>'+esc(r.title||T.freeTraining)+'</b>'+pill+'</div>'
      +nowHtml
      +'<div class="c-prog"><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<span class="c-count">'+esc(pr.total?T.sets(pr.done,pr.total):T.exercises(items.length))+'</span></div>'
      +'<ul class="exs">'+exs+'</ul><div class="ex-more"></div>'
      +'</article>';
  }
  // Lo que no cabe se quita desde abajo (el que va siempre queda: la ventana empieza uno
  // antes de él) y se cuenta en «+N más». En el celular la lista se desplaza y no se recorta.
  function fitCards(){
    if(narrowMq.matches)return;
    document.querySelectorAll('#main .card[data-rest]').forEach(card=>{
      const ul=card.querySelector('.exs'),more=card.querySelector('.ex-more');
      let rest=+card.dataset.rest||0;
      const label=()=>{more.textContent=rest>0?t().more(rest):'';};
      label();
      const min=card.dataset.min==null?1:+card.dataset.min;
      while(ul.children.length>min&&ul.scrollHeight>ul.clientHeight+1){ul.lastElementChild.remove();rest++;label();}
    });
  }
  function laterHtml(list){
    const T=t();
    return '<div class="later"><span class="tag">'+esc(T.next)+'</span>'+list.slice(0,8).map(p=>{
      const r=p.visibility==='routine'?p.routine:null;
      return '<span class="it" style="--c:'+safeColor(r&&r.color)+'"><b>'+esc(fmtTime(new Date(p.start)))+'</b>'+esc(p.name||T.member)
        +(r?'<span class="dot"></span><u>'+esc(r.title||T.freeTraining)+'</u>':'')+'</span>';
    }).join('')+'</div>';
  }
  function fmtKg(v){const n=Number(v);return Number.isInteger(n)?String(n):String(+n.toFixed(1));}
  // El color viene de la rutina: solo se acepta un hex, nada que pueda escaparse del style.
  function safeColor(c){return /^#[0-9a-f]{3,8}$/i.test(String(c||''))?c:'#2563eb';}

  // ── Cada segundo: relojes y cronómetros, sin repintar las tarjetas ───────────
  function tickTimers(){
    const now=serverNow();
    $('clock').textContent=fmtTime(now);
    const big=document.getElementById('big-clock');
    if(big){
      const s=new Intl.DateTimeFormat('en-US',{second:'2-digit',timeZone:'America/Mazatlan'}).format(now);
      big.innerHTML=esc(fmtTime(now))+'<span>'+esc(String(s).padStart(2,'0'))+'</span>';
    }
    // Descanso de quien transmite: cuenta con la hora del servidor; congelado si está en pausa.
    // Al llegar a cero dice «¡A la serie!» unos segundos.
    document.querySelectorAll('#main .card[data-live]').forEach(card=>{
      const T=t(),box=card.querySelector('.c-rest');if(!box)return;
      const frozen=+card.dataset.frozen||0,total=+card.dataset.total||0,end=Date.parse(card.dataset.restend);
      let left=null,label=T.rest;
      if(frozen>0){left=frozen;label=T.restPaused;}
      else if(end)left=(end-now)/1000;
      const resting=left!=null&&left>-8;
      card.classList.toggle('resting',resting);
      if(resting){
        const go=left<=0;
        box.classList.toggle('go',go);
        box.querySelector('.lbl').textContent=go?'':label;
        box.querySelector('b').textContent=go?T.goSet:fmtDur(Math.ceil(left));
        box.querySelector('.rb i').style.width=(go||!total?0:Math.max(0,Math.min(100,left/total*100)))+'%';
      }
      const upd=Date.parse(card.dataset.upd);
      const stale=!!upd&&now-upd>90000;
      card.classList.toggle('stale',stale);
      const pill=card.querySelector('.pill.cast');if(pill)pill.textContent=stale?T.noSignal:T.liveNow;
    });
    document.querySelectorAll('.c-timer').forEach(el=>{
      const start=Date.parse(el.dataset.start);
      if(!start){el.textContent='';return;}
      const pausedAt=Date.parse(el.dataset.pausedat);
      const end=pausedAt||+now;
      el.textContent=fmtDur((end-start)/1000-(+el.dataset.paused||0));
    });
  }
  let lastMinute=-1;
  setInterval(()=>{
    tickTimers();
    // Cada minuto se vuelve a decidir quién está «en el gym» y quién «más tarde».
    const m=Math.floor(Date.now()/60000);
    if(m!==lastMinute){lastMinute=m;if(view==='ok'){peopleSig='';render();}}
  },1000);

  // ── Realtime + respaldo ────────────────────────────────────────────────────
  if(DEMO)setInterval(()=>{advanceDemo(demoState);refresh();},4000);
  else tv.channel('gym-screen-'+SCREEN_ID)
    .on('postgres_changes',{event:'*',schema:'public',table:'gym_screen_pings',filter:'screen_id=eq.'+SCREEN_ID},payload=>{
      const n=payload&&payload.new&&payload.new.reload_nonce;
      if(n!=null&&nonce!=null&&n!==nonce){location.reload();return;}
      if(n!=null)nonce=n;
      scheduleRefresh();
    })
    .subscribe();
  if(!DEMO)tv.from('gym_screen_pings').select('reload_nonce').eq('screen_id',SCREEN_ID).maybeSingle()
    .then(({data})=>{if(data)nonce=data.reload_nonce;});
  setInterval(refresh,POLL_MS);

  // ── Versión nueva: se compara contra el archivo estático (sin funciones de Vercel) ──
  setInterval(async()=>{
    try{
      const res=await fetch('/pantalla.html?probe='+Date.now(),{cache:'no-store'});
      const m=(await res.text()).match(/PANTALLA_VERSION='([^']+)'/);
      if(m&&m[1]!==PANTALLA_VERSION)location.reload();
    }catch(_){}
  },VERSION_CHECK_MS);
  // Y cada noche a las 4:00 de Mazatlán, por si algo se quedó atorado.
  setInterval(()=>{
    const hm=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'America/Mazatlan'}).format(new Date());
    if(hm==='04:00'&&performance.now()>5*60000)location.reload();
  },30000);

  let resizeT=null;
  const relayout=()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{peopleSig='';render();layoutDaily();},200);};
  addEventListener('resize',relayout);
  if(narrowMq.addEventListener)narrowMq.addEventListener('change',relayout);

  screenBehaviour(refresh);
  render();
  refresh();
}

// ── Pantalla: completa, que no se apague, cursor que se esconde ───────────────
function screenBehaviour(onVisible){
  let wakeLock=null;
  async function keepAwake(){
    try{if('wakeLock' in navigator&&!document.hidden&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}
    catch(_){}
  }
  function toggleFullscreen(){
    if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  }
  let idleT=null;
  function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000);}
  $('fs').addEventListener('click',toggleFullscreen);
  addEventListener('dblclick',toggleFullscreen);
  addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFullscreen();});
  addEventListener('mousemove',wake);
  addEventListener('touchstart',wake,{passive:true});
  document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?t().exitFullscreen:t().fullscreen;});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){onVisible();keepAwake();}});
  addEventListener('online',onVisible);
  wake();keepAwake();
}

// Los textos del control, en los dos idiomas (requisito permanente). Mientras la app no tenga
// selector de idioma, manda el del teléfono.

  en:{kicker:'Control',title:'Gym screen',screen:'Screen',on:'On',off:'Off',
    onHelp:'Members now see the option in Profile, and anyone with a booking is asked once whether they want to show up.',
    offHelp:'While it’s off, the app shows nothing to anyone and the TV only shows the time.',
    tvLang:'TV language',address:'TV address',
    addressHelp:o=>'Open it once on the TV device: it’s remembered, and after that '+o+'/pantalla is enough. Without the key nothing shows.',
    copy:'Copy address',preview:'Preview the TV here',reload:'Reload the TV',rotate:'Change the key',
    rotateHelp:'Changing the key disconnects the TV until you open the new address on it. Use it if the address got out of the gym.',

    missing:'The database isn’t ready',missingSub:'Run migration 152 in Supabase.',
    readFail:'Couldn’t read the screen',noAdmin:'Admins only',
    noAdminSub:'Sign in to HABIT with your admin account in this same browser, then open this page again.',

    reloading:'The TV will reload',rotated:'New key: open the new address on the TV',
    copied:'Address copied',copyManual:'Select it and copy it',
    casting:'Live workouts',castOn:'Allowed',castOff:'Off',
    castHelp:n=>'During their booking, a member can put their live workout on the TV from the workout sheet (HABIT Crew for now). Live right now: '+n+'.',
    castOffHelp:'Nobody can put their workout on the TV. Turning it off removes whoever is live.',
    castOnDone:'Live workouts allowed',castOffDone:'Live workouts off',
    daily:'Workout of the day',dailyAuto:'Automatic: rotates the basic routines',
    dailyHelp:'Shown on the TV when nobody is on screen. On automatic it changes every day, one basic routine after another.',
    dailyToday:n=>'Today: '+n,dailyDone:'Workout of the day changed'}

function initControl(){
  const C=CONTROL_TEXT[/^en\b/i.test(navigator.language||'')?'en':'es'];
  document.documentElement.lang=C===CONTROL_TEXT.en?'en':'es';
  document.body.classList.add('control');
  $('fs').remove();
  $('kicker').textContent=C.kicker;
  $('title').textContent=C.title;
  $('live').style.display='none';
  $('clock').style.display='none';
  const main=$('main');
  let screen=null,msg='',msgErr=false,dailyOpts=null;

  async function load(){
    const{data:{session}}=await tv.auth.getSession();
    if(!session){paintNoAdmin();return;}
    const{data,error}=await tv.rpc('gym_screen_admin',{p_screen:SCREEN_ID});
    if(error){
      if(/gym_screen_admin|schema cache|PGRST202|42883/i.test((error.message||'')+' '+(error.code||'')))return paintMsgOnly(C.missing,C.missingSub);
      if(/NOT_ADMIN/.test(error.message||''))return paintNoAdmin();
      return paintMsgOnly(C.readFail,error.message||'');
    }
    screen=data;
    // Sin la 156 no hay rutina del día que elegir: la sección no sale.
    const o=await tv.rpc('gym_screen_daily_options',{p_screen:SCREEN_ID});
    dailyOpts=o.error?null:o.data;
    paint();
  }
  function paintMsgOnly(title,sub){main.innerHTML='<div class="ctl"><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div>';}
  function paintNoAdmin(){paintMsgOnly(C.noAdmin,C.noAdminSub);}
  function tvUrl(){return location.origin+'/pantalla?k='+encodeURIComponent(screen.access_key);}
  function paint(){
    const on=screen.mode==='on';
    main.innerHTML='<div class="ctl">'
      +'<div class="box"><div class="row"><span>'+esc(C.screen)+'</span><span class="seg"><button data-c="mode" data-v="on" class="'+(on?'on':'')+'">'+esc(C.on)+'</button><button data-c="mode" data-v="off" class="'+(on?'':'on')+'">'+esc(C.off)+'</button></span></div>'
      +'<p>'+esc(on?C.onHelp:C.offHelp)+'</p></div>'
      +(screen.casting==null?'':'<div class="box"><div class="row"><span>'+esc(C.casting)+'</span><span class="seg"><button data-c="casting" data-v="1" class="'+(screen.casting?'on':'')+'">'+esc(C.castOn)+'</button><button data-c="casting" data-v="0" class="'+(screen.casting?'':'on')+'">'+esc(C.castOff)+'</button></span></div>'
      +'<p>'+esc(screen.casting?C.castHelp(screen.casts_now|0):C.castOffHelp)+'</p></div>')
      +dailyBoxHtml()
      +'<div class="box"><div class="row"><span>'+esc(C.tvLang)+'</span><span class="seg"><button data-c="lang" data-v="es" class="'+(screen.lang==='es'?'on':'')+'">Español</button><button data-c="lang" data-v="en" class="'+(screen.lang==='en'?'on':'')+'">English</button></span></div></div>'
      +'<div class="box"><div class="row"><span>'+esc(C.address)+'</span></div>'
      +'<div class="url" id="tv-url">'+esc(tvUrl())+'</div>'
      +'<p>'+esc(C.addressHelp(location.origin))+'</p>'
      +'<button class="btn" data-c="copy">'+esc(C.copy)+'</button>'
      +'<button class="btn ghost" data-c="preview">'+esc(C.preview)+'</button></div>'
      +'<div class="box"><button class="btn ghost" data-c="reload">'+esc(C.reload)+'</button>'
      +'<button class="btn danger" data-c="rotate">'+esc(C.rotate)+'</button>'
      +'<p>'+esc(C.rotateHelp)+'</p></div>'
      +'<div class="msg'+(msgErr?' err':'')+'" id="ctl-msg">'+esc(msg)+'</div>'
      +'</div>';
  }
  function dailyBoxHtml(){
    if(!dailyOpts)return '';
    const list=dailyOpts.starters||[],today=list.find(b=>b.id===dailyOpts.today);
    return '<div class="box"><div class="row"><span>'+esc(C.daily)+'</span></div>'
      +'<select class="sel" data-c="daily"><option value="">'+esc(C.dailyAuto)+'</option>'
      +list.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===dailyOpts.fixed?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select>'
      +'<p>'+esc(C.dailyHelp)+(today?' '+esc(C.dailyToday(today.name))+'.':'')+'</p></div>';
  }
  function note(text,err){msg=text;msgErr=!!err;const el=$('ctl-msg');if(el){el.textContent=text;el.className='msg'+(err?' err':'');}}
  async function configure(args,done){
    const{data,error}=await tv.rpc('gym_screen_configure',Object.assign({p_screen:SCREEN_ID},args));
    if(error){note(C.failed+(error.message||''),true);return;}
    screen=data;msg=done||'';msgErr=false;paint();
  }
  main.addEventListener('change',async e=>{
    const sel=e.target.closest('select[data-c="daily"]');if(!sel)return;
    const{data,error}=await tv.rpc('gym_screen_set_daily',{p_screen:SCREEN_ID,p_board:sel.value||null});
    if(error){note(C.failed+(error.message||''),true);return;}
    dailyOpts=data;msg=C.dailyDone;msgErr=false;paint();
  });
  main.addEventListener('click',async e=>{
    const b=e.target.closest('[data-c]');if(!b||!screen)return;
    const c=b.dataset.c;
    if(c==='mode')configure({p_mode:b.dataset.v},b.dataset.v==='on'?C.turnedOn:C.turnedOff);
    else if(c==='lang')configure({p_lang:b.dataset.v},C.langDone);
    else if(c==='casting')configure({p_casting:b.dataset.v==='1'},b.dataset.v==='1'?C.castOnDone:C.castOffDone);
    else if(c==='reload')configure({p_reload:true},C.reloading);
    else if(c==='rotate'){if(confirm(C.rotateAsk))configure({p_rotate_key:true},C.rotated);}
    else if(c==='copy'){
      try{await navigator.clipboard.writeText(tvUrl());note(C.copied);}
      catch(_){const r=document.createRange();r.selectNodeContents($('tv-url'));const s=getSelection();s.removeAllRanges();s.addRange(r);note(C.copyManual);}
    }
    else if(c==='preview')window.open(tvUrl(),'_blank','noopener');
  });
  load();
}

// Al final: las tablas de textos de arriba son const y tienen que existir antes de arrancar.
if(CONTROL)initControl();else initTv();
