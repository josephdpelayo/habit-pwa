async function saveNewFood(mealId){
  const name=$('nfName').value.trim();
  if(!name) return alert(t('food.errFoodName'));
  const num=id=>{const v=Number($(id).value);return Number.isFinite(v)&&v>=0?v:0;};
  const row={
    user_id:state.user.id,name,brand:null,source:'manual',
    kcal_100g:num('nfKcal'),protein_100g:num('nfP'),carbs_100g:num('nfC'),fat_100g:num('nfF')
  };
  // upsert, no insert: el mismo índice único (usuario, nombre, marca) de rememberFood — volver a
  // "crear" un alimento que ya tecleaste antes actualiza sus macros en vez de tronar por
  // duplicado.
  const {data:food,error}=await sb.from('skandi_foods')
    .upsert(row,{onConflict:'user_id,name,brand',ignoreDuplicates:false}).select().single();
  if(error) return alert(error.message);
  await loadNutrition();
  openFoodPortion(food.id,mealId);
}

// state.foods (loadNutrition) trae como mucho 300 filas, ordenadas por times_used desc -- lo
// suficiente para navegar sin escribir nada, instantáneo, sin red. Pero filtrar la BÚSQUEDA
// sobre esa misma copia local dejaba invisible cualquier alimento fuera de esos 300: todo lo
// que rememberMealItems() y backfillFoodsFromMealHistory() guardan entra con times_used=0, así
// que se va justo al fondo de ese orden -- lo contrario de lo que se buscaba al construir esas
// dos funciones. Escribir algo dispara, con un pequeño debounce, una búsqueda real al servidor
// (ilike, sin el límite de 300) en vez de seguir filtrando la copia local capada; mientras esa
// búsqueda resuelve se sigue mostrando el filtro local, para que la lista no se quede vacía en
// lo que responde la red.
let foodSearchDebounce=null;
let foodSearchToken=0;
function renderFoodList(q){
  state.foodPicker.query=q;
  $('foodList').innerHTML=foodListHtml(q);
  clearTimeout(foodSearchDebounce);
  const needle=(q||'').trim();
  if(!needle) return;
  const token=++foodSearchToken;
  foodSearchDebounce=setTimeout(async()=>{
    const results=await searchFoodsServer(needle);
    if(token!==foodSearchToken) return; // una búsqueda más nueva ya está en curso o resuelta
    const list=$('foodList');
    if(list) list.innerHTML=foodRowsHtml(results);
  },250);
}

async function searchFoodsServer(q){
  // ',' y '(' rompen la sintaxis del filtro or= de PostgREST -- no es una vulnerabilidad (no es
  // SQL crudo), pero sí tumbaría la búsqueda con un error si alguien las escribe.
  const safe=q.replace(/[,()]/g,' ').trim();
  if(!safe) return [];
  const {data,error}=await sb.from('skandi_foods').select('*')
    .or(`user_id.eq.${state.user.id},user_id.is.null`)
    .or(`name.ilike.%${safe}%,brand.ilike.%${safe}%`)
    .order('times_used',{ascending:false})
    .limit(40);
  if(error) return [];
  return data||[];
}

function foodRowsHtml(list){
  if(!list.length) return empty(t('food.noMatches'));
  return list.map(f=>`<button class="meal-card" onclick="openFoodPortion('${f.id}',${state.foodPicker.mealId?`'${state.foodPicker.mealId}'`:'null'})">
    <span class="meal-thumb">${icon('plus',20)}</span>
    <span class="lbl"><h3>${esc(f.name)}</h3><p>${esc(f.brand||'')}${f.brand?' · ':''}${Math.round(f.kcal_100g)} kcal/100 g</p></span>
    <span class="meal-kcal">${f.serving_grams?Math.round(f.serving_grams)+' g':''}</span>
  </button>`).join('');
}

function foodListHtml(q){
  const needle=(q||'').trim().toLowerCase();
  const list=state.foods
    .filter(f=>!needle||`${f.name} ${f.brand||''}`.toLowerCase().includes(needle))
    .slice(0,40);
  return foodRowsHtml(list);
}

// ---- ¿Me conviene? — veredicto informativo, ANTES de decidir si registrarlo ----
//
// Escanear un código de barras no significa "ya decidí comerlo" — muchas veces es al revés,
// escanear PARA decidir. Antes el escaneo llevaba derecho al selector de gramos, que ya asume
// que sí lo vas a registrar. SkandiNutrition.evaluateFood() es puro cálculo contra tus metas y
// lo que llevas hoy — nada de IA, nada de costo — así que este paso no gasta cuota ni crea
// ninguna comida: cerrar aquí ("Solo estaba viendo") no deja nada a medias en la base de datos.
function openFoodInspect(foodId,mealId){
  const food=state.foods.find(f=>f.id===foodId);
  if(!food) return;
  const targets=state.nutritionTargets;
  const grams=food.serving_grams||100;
  const scaled=SkandiNutrition.scaleFood(food,grams);
  let verdictHtml=`<p class="muted" style="margin-top:8px">${esc(t('food.noTarget'))}</p>`;
  if(targets){
    const totals=SkandiNutrition.dayTotals(mealsOfDay(foodDay()));
    const remaining=SkandiNutrition.remaining(targets,totals);
    const {verdict,reasons}=SkandiNutrition.evaluateFood(food,grams,remaining,targets);
    const tone=verdict==='bad'?'border-color:rgba(212,72,84,.35);background:#fff7f7'
      :verdict==='caution'?'border-color:rgba(240,162,46,.35);background:#fffaf2'
      :'border-color:rgba(29,154,108,.3);background:#f3fbf7';
    verdictHtml=`<section class="card" style="${tone};margin-top:10px">
      <strong>${esc(t('food.verdict.'+verdict))}</strong>
      <ul style="margin:8px 0 0;padding-left:18px">${reasons.map(r=>`<li style="margin-top:4px">${esc(t('food.reason.'+r.kind,r))}</li>`).join('')}</ul>
    </section>`;
  }
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(food.name)}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${Math.round(scaled.kcal)} kcal · P ${scaled.protein_g}g · C ${scaled.carbs_g}g · G ${scaled.fat_g}g <span style="opacity:.7">(${grams} g)</span></p>
    ${verdictHtml}
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="openFoodPortion('${foodId}',${mealId?`'${mealId}'`:'null'})">${esc(t('food.inspectAdd'))}</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">${esc(t('food.inspectClose'))}</button>`;
}

function openFoodPortion(foodId,mealId){
  const food=state.foods.find(f=>f.id===foodId);
  if(!food) return;
  const preset=food.serving_grams||100;
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('food.portionOf',{name:food.name}))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${Math.round(food.kcal_100g)} kcal/100 g${food.serving_grams?` · ${esc(t('food.serving',{g:Math.round(food.serving_grams)}))}`:''}</p>
    <label class="eyebrow">${esc(t('food.grams'))}</label>
    <input id="portionGrams" class="field" type="number" min="1" max="5000" inputmode="numeric" value="${preset}" oninput="previewPortion('${foodId}')">
    <p id="portionPreview" class="muted" style="margin-top:8px"></p>
    ${mealId?'':`<label class="eyebrow">${esc(t('food.mealType'))}</label>
    <select id="portionMealType" class="field left">${MEAL_TYPES.map(v=>`<option value="${v}" ${v===guessMealType()?'selected':''}>${esc(mealTypeLabel(v))}</option>`).join('')}</select>
    <label class="eyebrow">${esc(t('food.when'))}</label>
    <input id="portionWhen" class="field" type="datetime-local" value="${toLocalDatetimeValue(new Date())}" max="${toLocalDatetimeValue(new Date())}">`}
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="addFoodPortion('${foodId}',${mealId?`'${mealId}'`:'null'})">${esc(t('food.addToMeal'))}</button>`;
  previewPortion(foodId);
}

function previewPortion(foodId){
  const food=state.foods.find(f=>f.id===foodId);
  const scaled=SkandiNutrition.scaleFood(food,Number($('portionGrams').value));
  $('portionPreview').textContent=`${Math.round(scaled.kcal)} kcal · P ${scaled.protein_g}g · C ${scaled.carbs_g}g · G ${scaled.fat_g}g`;
}

async function addFoodPortion(foodId,mealId){
  const grams=Number($('portionGrams').value);
  if(!grams||grams<=0) return alert(t('food.errGrams'));
  let target=mealId;
  if(!target){
    const eatenAt=parseWhenInput('portionWhen');
    if(eatenAt.getTime()>Date.now()+60000) return alert(t('food.errFuture'));
    const food=state.foods.find(f=>f.id===foodId);
    const {data:meal,error}=await sb.from('skandi_meals').insert({
      user_id:state.user.id,
      meal_type:$('portionMealType').value,
      note:food?food.name:null,
      input_kind:'manual',
      analysis_status:'manual',
      eaten_at:eatenAt.toISOString()
    }).select().single();
    if(error) return alert(error.message);
    target=meal.id;
  }
  const {error}=await sb.rpc('skandi_add_food_to_meal',{p_meal_id:target,p_food_id:foodId,p_grams:grams});
  if(error) return alert(error.message);
  closeModal();
  await loadNutrition();
  state.foodDayOffset=0;
  setView('food');
  openMealDetail(target);
}

// ---- Alta: código de barras (cero tokens, datos del empaque) ----

// Chrome/Android trae BarcodeDetector nativo; Safari/WKWebView (el iPhone de la tripulación)
// nunca lo ha implementado. ZXing decodifica el video cuadro a cuadro en JS puro y es el único
// camino real de cámara ahí. Se carga solo cuando hace falta — 441 KB que nadie paga si nunca
// escanea — y se cachea para no volver a pedirlo la próxima vez.
let zxingLoadPromise=null;
function loadZXing(){
  if(window.ZXingBrowser) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>{zxingLoadPromise=null;reject(new Error('scanner script failed'));};
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}

// mealId: si se abrió desde una comida ya iniciada ("+ Código de barras" en su detalle), lo
// escaneado se agrega ahí en vez de crear una comida nueva — es lo que deja armar un platillo
// escaneando varias cosas seguidas.

      <p class="muted" style="margin-top:8px" id="bcScanHint">${esc(t('food.scanning'))}</p>`
      :`<p class="muted">${esc(t('food.noScanner'))}</p>`}
    <input id="bcPhotoInput" type="file" accept="image/*" style="display:none" onchange="onBarcodePhotoPicked(this)">
    <button type="button" class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('bcPhotoInput').click()">${icon('image',18)} ${esc(t('food.scanFromPhoto'))}</button>
    <label class="eyebrow" style="margin-top:12px">${esc(t('food.barcodePh'))}</label>
    <input id="bcNumber" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="7501000673209">
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="lookupBarcode()">${esc(t('food.scan'))}</button>`;
  if(canScan) startBarcodeScan();
}

let bcStream=null,bcTimer=null,bcMealId=null,bcZxingControls=null;

async function startBarcodeScan(){
  if(typeof window.BarcodeDetector!=='undefined'){
    try{
      const detector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      bcStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video=$('bcVideo');
      if(!video){stopBarcodeScan();return;}
      video.srcObject=bcStream;
      await video.play();
      bcTimer=setInterval(async()=>{
        if(!$('bcVideo')) return stopBarcodeScan();
        try{
          const codes=await detector.detect(video);
          if(codes.length&&codes[0].rawValue){
            $('bcNumber').value=codes[0].rawValue;
            stopBarcodeScan();
            lookupBarcode();
          }
        }catch(e){/* un frame ilegible no es un error que valga interrumpir */}
      },600);
    }catch(e){
      // Sin permiso de cámara el camino manual sigue funcionando: no hay nada que avisar.
      stopBarcodeScan();
    }
    return;
  }
  // Sin BarcodeDetector (Safari): ZXing por getUserMedia. decodeFromVideoDevice ya maneja el
  // stream y el <video> por su cuenta, a diferencia del camino nativo de arriba.
  try{
    await loadZXing();
    const video=$('bcVideo');
    if(!video||!window.ZXingBrowser) return;
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    reader.possibleFormats=[
      ZXingBrowser.BarcodeFormat.EAN_13,ZXingBrowser.BarcodeFormat.EAN_8,
      ZXingBrowser.BarcodeFormat.UPC_A,ZXingBrowser.BarcodeFormat.UPC_E,
      ZXingBrowser.BarcodeFormat.CODE_128
    ];
    bcZxingControls=await reader.decodeFromVideoDevice(undefined,video,(result)=>{
      if(!result||!$('bcVideo')) return;
      $('bcNumber').value=result.getText();
      stopBarcodeScan();
      lookupBarcode();
    });
  }catch(e){
    // Sin permiso de cámara, o el CDN no respondió: el número a mano sigue funcionando.
    if($('bcScanHint')) $('bcScanHint').textContent=t('food.noScanner');
    stopBarcodeScan();
  }
}

function stopBarcodeScan(){
  if(bcTimer){clearInterval(bcTimer);bcTimer=null;}
  if(bcStream){bcStream.getTracks().forEach(tr=>tr.stop());bcStream=null;}
  if(bcZxingControls){ try{bcZxingControls.stop();}catch(e){} bcZxingControls=null; }
}

// Escanear de una foto ya tomada (galería o cámara del sistema), para el código chico o con
// poca luz que la cámara en vivo no agarra bien, o cuando no hay cámara disponible. Mismos dos
// motores que startBarcodeScan, sobre una imagen quieta en vez de un stream de video.
async function onBarcodePhotoPicked(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file) return;
  stopBarcodeScan();
  if($('bcScanHint')) $('bcScanHint').textContent=t('food.scanningPhoto');
  const code=await decodeBarcodeFromFile(file).catch(()=>null);
  if(!code){
    if($('bcScanHint')) $('bcScanHint').textContent=t('food.noBarcodeInPhoto');
    return;
  }
  $('bcNumber').value=code;
  lookupBarcode();
}

async function decodeBarcodeFromFile(file){
  if(typeof window.BarcodeDetector!=='undefined'){
    const bitmap=await createImageBitmap(file);
    const detector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    const codes=await detector.detect(bitmap);
    return codes.length?codes[0].rawValue:null;
  }
  await loadZXing();
  if(!window.ZXingBrowser) return null;
  const reader=new ZXingBrowser.BrowserMultiFormatReader();
  reader.possibleFormats=[
    ZXingBrowser.BarcodeFormat.EAN_13,ZXingBrowser.BarcodeFormat.EAN_8,
    ZXingBrowser.BarcodeFormat.UPC_A,ZXingBrowser.BarcodeFormat.UPC_E,
    ZXingBrowser.BarcodeFormat.CODE_128
  ];
  const url=URL.createObjectURL(file);
  try{
    const result=await reader.decodeFromImageUrl(url);
    return result?result.getText():null;
  }finally{
    URL.revokeObjectURL(url);
  }
}

function closeBarcode(){
  stopBarcodeScan();
  bcMealId=null;
  closeModal();
}

async function lookupBarcode(){
  const code=($('bcNumber').value||'').replace(/\D/g,'');
  if(code.length<8) return alert(t('food.errNoInput'));
  const mealId=bcMealId;
  stopBarcodeScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const call=()=>fetch('/api/skandi',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'barcode',barcode:code})
    });
    let res;
    try{ res=await call(); }
    catch(e){ if(!isTransientFetchError(e)) throw e; await new Promise(r=>setTimeout(r,900)); res=await call(); }
    const body=await res.json().catch(()=>({}));
    if(!res.ok||!body.food) return alert(body.message||t('food.noMatches'));
    await loadNutrition();
    // Escaneaste algo sin saber si te conviene comerlo — eso pasa primero por el veredicto
    // (openFoodInspect), no derecho al selector de gramos. Nada se registra todavía en este
    // punto, así que cerrar aquí sin agregarlo no deja nada a medias.
    if(body.food.id) openFoodInspect(body.food.id,mealId);
    else alert(t('food.noMatches'));
  }catch(e){
    alert(e.message||String(e));
  }
}

// Corregir los gramos reescala el renglón conservando su densidad: el modelo acertó qué era,
// se equivocó en cuánto. Y la corrección se guarda como alimento del catálogo, que es lo que
// hace que la próxima vez este platillo ya no necesite IA.
async function updateItemGrams(itemId,value){
  const item=state.mealItems.find(i=>i.id===itemId);
  if(!item) return;
  const grams=Number(value);
  if(!grams||grams<=0) return alert(t('food.errGrams'));
  const next=SkandiNutrition.rescaleItem(item,grams);
  const base={
    grams:next.grams,kcal:next.kcal,protein_g:next.protein_g,carbs_g:next.carbs_g,fat_g:next.fat_g,fiber_g:next.fiber_g,sugar_g:next.sugar_g,
    source:'manual'
  };
  const {error}=await writeToleratingMissingColumn(
    withCol=>sb.from('skandi_meal_items')
      .update(withCol?{...base,added_sugar_g:next.added_sugar_g}:base)
      .eq('id',itemId),
    'added_sugar_g'
  );
  if(error) return alert(error.message);
  await rememberFood(next);
  await loadNutrition();
  render();
  openMealDetail(item.meal_id);
}

async function rememberFood(item){
  if(item.is_cooking_fat||item.food_id) return;
  const food=SkandiNutrition.itemToFood(item);
  if(!food||!food.name) return;
  const base={...omit(food,'added_sugar_100g'),user_id:state.user.id,source:'manual',brand:null};
  // onConflict con el índice único (usuario, nombre, marca) de la migración 073: corregir dos
  // veces el mismo alimento lo actualiza en vez de llenar el catálogo de duplicados.
  await writeToleratingMissingColumn(
    withCol=>sb.from('skandi_foods').upsert(
      withCol?{...base,added_sugar_100g:food.added_sugar_100g}:base,
      {onConflict:'user_id,name,brand',ignoreDuplicates:false}
    ),
    'added_sugar_100g'
  );
}

// Un renglón que la IA analizó bien a la primera vale como alimento del catálogo tanto como uno
// que corregiste a mano — rememberFood ya hace ese trabajo (upsert por nombre, descarta grasa
// de cocción y lo ya ligado a un food_id), solo hacía falta llamarlo también aquí, no nada más
// desde updateItemGrams. Así la próxima vez que se coma lo mismo, buscarlo en el catálogo es
// gratis e instantáneo en vez de gastar otra llamada a Claude.
async function rememberMealItems(mealId){
  const items=state.mealItems.filter(i=>i.meal_id===mealId&&i.source==='ai');
  for(const item of items) await rememberFood(item);
}

async function saveTargets(){
  const kcal=Number($('tgKcal').value);
  if(!kcal||kcal<800||kcal>8000) return alert(t('food.errGrams'));
  // Un número escrito a mano por debajo de lo que la app misma propondría en el déficit más
  // agresivo: no es "¿tu meta es un déficit?", es "¿nadie ni el cálculo automático llegaría aquí?".
  const weightForCheck=latestWeightKg();
  if(weightForCheck && SkandiNutrition.isLowEnergy(kcal,weightForCheck) && !confirm(t('food.lowEnergyConfirm'))) return;
  // Vacío significa "no me lo vigiles", que no es lo mismo que un techo de cero.
  const sugarCap=$('tgS').value===''?null:Math.round(Number($('tgS').value));
  const dietNotes=($('tgDietNotes')?.value||'').trim().slice(0,4000)||null;
  const base={
    user_id:state.user.id,
    mode:$('tgMode').value,
    kcal_target:Math.round(kcal),
    protein_g_target:Math.round(Number($('tgP').value)||0),
    carbs_g_target:Math.round(Number($('tgC').value)||0),
    fat_g_target:Math.round(Number($('tgF').value)||0),
    sugar_g_target:sugarCap,
    activity_factor:Number($('tgActivity').value),
    updated_at:new Date().toISOString()
  };
  // El mismo campo de la UI escribe added_sugar_g_target (089) y diet_notes (097) por si sus
  // migraciones no se han corrido todavía: se sueltan una por una, la que la base rechace, en
  // vez de fallar por completo por una columna que ni siquiera se está intentando llenar.
  let optional={added_sugar_g_target:sugarCap,diet_notes:dietNotes};
  let error;
  for(let tries=0;tries<=Object.keys(optional).length;tries++){
    ({error}=await sb.from('skandi_nutrition_targets')
      .upsert({...base,...optional},{onConflict:'user_id'}));
    if(!error) break;
    const missing=Object.keys(optional).find(c=>error.message&&error.message.includes(c));
    if(!missing) break;
    const{[missing]:_dropped,...rest}=optional;
    optional=rest;
  }
  if(error) return alert(error.message);
  closeModal();
  await loadNutrition();
  render();
}

sb.auth.onAuthStateChange((_event,session)=>{ if(session&&!state.user){ state.user=session.user; loadAll().then(showApp); } });
// Stamp the stored/detected language onto the static markup before the first paint, so the auth
// screen and tab bar never flash English at a Spanish user.
rebuildActivityLabels();
applyStaticI18n();
init();

// Service worker: es el mismo /sw.js que registra app.html (alcance '/', una sola
// registración por origen — dos service workers en la raíz se desalojarían entre sí).
// Su handler de navegación ya distingue /skandi de /app.html para el fallback offline.
if('serviceWorker' in navigator){
  let swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshing) return;
    swRefreshing=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('/sw.js?v='+SKANDI_VERSION);
      reg.update();
    }catch(e){ console.warn(e); }
  });
}
</script>
</body>
