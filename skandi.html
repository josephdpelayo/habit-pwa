  else state.skillGoals.push({user_id:state.user.id,progression_group:group,weekly_tut_sec:sec});
  openSkillDetail(group);
}

// skandi_progression_state only ever holds the CURRENT rank, so without this there is no way to
// answer "how long did the tuck take me" — the single most motivating number in a skill line.
async function logProgressionEvent(group,fromExerciseId,toExerciseId){
  const from=state.exercises.find(e=>e.id===fromExerciseId);
  const to=state.exercises.find(e=>e.id===toExerciseId);
  const direction=from&&to&&(to.progression_rank??0)<(from.progression_rank??0)?'down':'up';
  const row={user_id:state.user.id,progression_group:group,from_exercise_id:fromExerciseId||null,
    to_exercise_id:toExerciseId,direction,created_at:new Date().toISOString()};
  const {data,error}=await sb.from('skandi_progression_events').insert(row).select().single();
  if(error) return; // best-effort: the rank change itself already happened
  state.progressionEvents.unshift(data);
}

function skillEvents(group){
  return state.progressionEvents.filter(e=>e.progression_group===group)
    .slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}

// How long each rank took, computed from consecutive events — "9 weeks in the tuck" is the
// answer people actually want out of a progression history.
function skillEventRows(group){
  const events=skillEvents(group);
  return events.map((e,i)=>{
    const next=events[i-1]; // events are newest-first, so the NEXT step is the previous index
    const endedAt=next?new Date(next.created_at):new Date();
    const days=Math.max(0,Math.round((endedAt-new Date(e.created_at))/864e5));
    return {...e,
      to:state.exercises.find(x=>x.id===e.to_exercise_id),
      days, ongoing:!next};
  });
}

// Per-side bests for unilateral work. Averaging the two sides hides the weak one, and on a
// one-leg lever or a weight shift the weak side is the whole point.
function bestBySide(exerciseId){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex?.unilateral) return null;
  const out={left:null,right:null};
  state.sets.filter(x=>x.user_id===state.user.id&&x.done&&x.exercise_id===exerciseId&&x.side).forEach(x=>{
    const mark=skillSetMark(ex,x);
    if(out[x.side]==null||mark>out[x.side]) out[x.side]=mark;
  });
  return (out.left!=null||out.right!=null)?out:null;
}

// A routine can deliberately include more than one rung of the same progression ladder in one
// day (e.g. Wall Handstand as a fixed technique slot before Freestanding Handstand as the main
// set that actually progresses — see migration 060's Wednesday routine). Only the highest-rank
// authored slot per progression_group tracks the user's saved progression state; lower authored
// rungs stay exactly what they are regardless of how far the user has progressed.
//
// And that tracking only ever moves UP: a routine can also author the highest slot directly at a
// harder variant than what's saved (a coach-built day, or a manual data load like 086's deload
// week) — resolving down to a stale saved rank would silently undo that authored choice, which
// is exactly the bug where a routine that says "Half Lay" trains "Straddle" instead. The saved
// state only wins when IT is the one ahead, same direction advanceProgressionIfAhead already
// moves things during a live workout.
//
// A collision guard on top of that (authored ids + ids already assigned this pass) covers any
// resolved variant that happens to match another slot's exercise, including when it's not itself
// one of this routine's authored exercises. Both matter: resolving every same-group slot (or
// resolving past a target another slot already owns) would collapse two distinct exercises into
// the same exercise_id and violate the (session_id, exercise_id, set_idx) uniqueness on
// skandi_sets at insert time.
function resolveTemplateProgressionItems(templateItems){
  const highestRankByGroup=new Map();
  templateItems.forEach(i=>{
    const g=i.exercise?.progression_group;
    if(!g) return;
    const rank=i.exercise.progression_rank??0;
    if(!highestRankByGroup.has(g)||rank>highestRankByGroup.get(g)) highestRankByGroup.set(g,rank);
  });
  const authoredIds=new Set(templateItems.map(i=>i.exercise_id));
  const usedIds=new Set();
  return templateItems.slice().sort((a,b)=>a.sort_order-b.sort_order)
    .map(item=>{
      const g=item.exercise?.progression_group;
      const isHighestRankSlot=!g||item.exercise.progression_rank===highestRankByGroup.get(g);
      const saved=isHighestRankSlot?currentProgressionExercise(item.exercise):item.exercise;
      const resolved=(saved.progression_rank??0)>=(item.exercise.progression_rank??0)?saved:item.exercise;
      const collides=resolved.id!==item.exercise_id&&(authoredIds.has(resolved.id)||usedIds.has(resolved.id));
      const finalExercise=collides?item.exercise:resolved;
      usedIds.add(finalExercise.id);
      return finalExercise.id===item.exercise_id?item:{...item,exercise:finalExercise,exercise_id:finalExercise.id};
    });
}

let startingWorkout=false;
// Shown before a fresh workout is actually created, so the member sees what the routine
// involves and taps a deliberate "Start training" rather than jumping straight into a live
// session (and an accidental orphan skandi_sessions row) from a stray tap on a list row.
async function openWorkoutOverview(templateId){
  if(state.active){
    if(state.active.template_id===templateId){ openActiveWorkout(); return; }
    return alertSheet(t('workout.busy'));
  }
  const tpl=state.templates.find(x=>x.id===templateId);
  if(!tpl) return;
  const templateItems=state.items.filter(i=>i.template_id===templateId);
  // The variant actually trained is the saved rank of the line, not whatever the routine slot
  // was authored with — the overview used to name the authored one and then start a different
  // exercise, which is also why the fatigue check has to run on the resolved list.
  const resolved=resolveTemplateProgressionItems(templateItems);
  const fatigued=skillFatigueWarnings(resolved.map(i=>i.exercise));
  $('modal').classList.add('show');
  // El aviso de fatiga va DEBAJO de la lista y la lista debajo del título: con el aviso
  // arriba, empujaba "Empezar a entrenar" fuera de la pantalla (816 px en un alto de 812).
  // Y se agrupa por músculo: dos variantes de la misma línea de skill cargan el mismo
  // músculo y repetir la frase entera cambiando el nombre no informa dos veces.
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(tpl.name)}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${templateItems.length} ${esc(tp(templateItems.length,'common.exercises'))}${dayOfTemplate(tpl.id)!=null?' · '+DOW[dayOfTemplate(tpl.id)]:''}</p>
    <div class="stack" style="margin-top:14px">
      ${resolved.map(i=>`<div class="row"><span>${esc(i.exercise?.name||t('common.exercise'))}</span><span class="muted">${i.target_sets}×${esc(i.target_reps||'')}</span></div>`).join('')}
    </div>
    ${fatigueCardHtml(fatigued)}
    <div class="sheet-cta"><button class="btn primary" style="width:100%" onclick="startWorkout('${tpl.id}')">${icon('play',16)} ${esc(t('workout.startTraining'))}</button></div>`;
}

// Un renglón por músculo cansado, no uno por ejercicio.
function fatigueCardHtml(fatigued){
  if(!fatigued.length) return '';
  const byMuscle=new Map();
  fatigued.forEach(f=>{
    const g=byMuscle.get(f.muscle);
    if(g){ g.names.push(f.exercise.name); g.score=Math.min(g.score,f.score); }
    else byMuscle.set(f.muscle,{names:[f.exercise.name],score:f.score});
  });
  const lines=[...byMuscle.entries()].map(([muscle,g])=>{
    const params={muscle:esc(muscleLabel(muscle)),score:g.score};
    return `<p style="margin-top:8px">${g.names.length===1
      ? t('fatigue.warn',{...params,name:esc(g.names[0])})
      : t('fatigue.warnMany',{...params,names:esc(listJoin(g.names))})}</p>`;
  }).join('');
  return `<section class="card" style="margin-top:14px;border-color:rgba(212,72,84,.30);background:#fff7f7">
    <div class="eyebrow" style="color:var(--pink)">${esc(t('fatigue.title'))}</div>
    ${lines}
    <p class="muted" style="margin-top:8px">${esc(t('fatigue.hint'))}</p>
  </section>`;
}

// "A, B y C" — la coma en todos menos el último, que lleva la conjunción del idioma.
function listJoin(names){
  if(names.length<2) return names[0]||'';
  return names.slice(0,-1).join(', ')+' '+t('common.and')+' '+names[names.length-1];
}

// supabase-js resolves (rather than throws) on a fetch failure, surfacing it as
// error.message — "Load failed" on Safari/iOS, "Failed to fetch" on Chrome — for something
// as ordinary as a brief signal drop when starting a workout. One retry after a short pause
// clears most of those instead of dead-ending the member on a raw browser error string.
function isTransientFetchError(err){
  const msg=String(err&&err.message||'').toLowerCase();
  return msg.includes('load failed')||msg.includes('failed to fetch')||msg.includes('networkerror');
}
async function withNetworkRetry(fn){
  const first=await fn();
  if(first.error&&isTransientFetchError(first.error)){
    await new Promise(r=>setTimeout(r,900));
    return await fn();
  }
  return first;
}

// ---- Outbox: escrituras de sets que sobreviven un corte de señal --------------------------
// skandi-outbox.js (puro, sin DOM ni Supabase) solo sabe encolar UPDATEs sobre una fila que ya
// existe por id — ver su cabecera para por qué eso es lo único seguro de reintentar a ciegas.
// Encaja exacto con cada edición de una serie durante el entrenamiento (toggleSet, updateSet,
// setSetSide): la fila nace al empezar el workout, así que parcharla después siempre es
// idempotente. Empezar/cancelar la sesión y agregar/quitar una serie (INSERT/DELETE) se quedan
// en su camino de siempre.
const OUTBOX_STORAGE_KEY='skandi_outbox_v1';
function persistOutbox(){
  try{ localStorage.setItem(OUTBOX_STORAGE_KEY,SkandiOutbox.serialize(state.outbox)); }catch(e){}
}

// Aplica el patch EN LOCAL antes de tocar la red — la marca reacciona al tap, no al viaje
// redondo — y solo se revierte si Supabase contesta con un error que no es de red (constraint,
// RLS): eso sí hay que avisarlo, porque reintentarlo para siempre solo esconde un fallo real.
// Un fallo de red, en cambio, se encola y la UI se queda tal cual quedó el tap: ya está bien.
async function queuedUpdate(table,id,patch,localRow,onChange){
  const prev={...localRow};
  Object.assign(localRow,patch);
  if(onChange) onChange();
  if(navigator.onLine===false){
    state.outbox=SkandiOutbox.enqueue(state.outbox,{table,id,patch});
    persistOutbox();
    return true;
  }
  const {error}=await sb.from(table).update(patch).eq('id',id);
  if(!error) return true;
  if(SkandiOutbox.isRetryable(error,!navigator.onLine)){
    state.outbox=SkandiOutbox.enqueue(state.outbox,{table,id,patch});
    persistOutbox();
    scheduleOutboxFlush();
    return true;
  }
  Object.assign(localRow,prev);
  if(onChange) onChange();
  await alertSheet(error.message);
  return false;
}

let outboxFlushTimer=null;
let outboxFlushing=false;
async function flushOutbox(){
  if(outboxFlushing||!state.outbox.length) return;
  outboxFlushing=true;
  try{
    while(state.outbox.length){
      if(navigator.onLine===false) break;
      const entry=SkandiOutbox.nextUp(state.outbox);
      const {error}=await sb.from(entry.table).update(entry.patch).eq('id',entry.id);
      if(!error){ state.outbox=SkandiOutbox.drop(state.outbox,entry.table,entry.id); persistOutbox(); continue; }
      if(SkandiOutbox.isRetryable(error,!navigator.onLine)) break; // sigue sin señal de verdad: se reintenta en el próximo flush
      state.outbox=SkandiOutbox.bumpTries(state.outbox,entry.table,entry.id);
      const bumped=state.outbox.find(e=>SkandiOutbox.keyOf(e.table,e.id)===SkandiOutbox.keyOf(entry.table,entry.id));
      if(SkandiOutbox.isPoisoned(bumped)){
        state.outbox=SkandiOutbox.drop(state.outbox,entry.table,entry.id);
        await alertSheet(t('workout.outboxDropped',{msg:error.message}));
      }
      persistOutbox();
      break; // un error de datos en la más vieja no debe bloquear a las demás para siempre, pero tampoco insistir en bucle sin pausa
    }
  } finally {
    outboxFlushing=false;
    if(state.active) renderActiveWorkout();
  }
}
function scheduleOutboxFlush(){
  clearTimeout(outboxFlushTimer);
  outboxFlushTimer=setTimeout(flushOutbox,1000);
}
window.addEventListener('online',()=>flushOutbox());
// No todo corte de señal dispara un 'online' confiable (algunas redes satelitales/celulares
// del barco quedan en un estado intermedio que el navegador nunca reporta) — un poll lento
// mientras de verdad hay algo encolado es el respaldo.
setInterval(()=>{ if(state.outbox.length) flushOutbox(); },15000);

async function startWorkout(templateId){
  if(startingWorkout) return; // guards a double-tap from creating two sessions before either
                               // await resolves and state.active gets set
  if(state.active){
    if(state.active.template_id===templateId){ openActiveWorkout(); return; }
    return alertSheet(t('workout.busy'));
  }
  const tpl=state.templates.find(x=>x.id===templateId);
  const templateItems=state.items.filter(i=>i.template_id===templateId);
  const its=resolveTemplateProgressionItems(templateItems);
  if(!tpl||!its.length) return;
  startingWorkout=true;
  try{
    const {data:session,error}=await withNetworkRetry(()=>sb.from('skandi_sessions').insert({user_id:state.user.id,template_id:tpl.id,title:tpl.name}).select().single());
    if(error) return alertSheet(isTransientFetchError(error)?t('workout.netHiccup'):error.message);
    const rows=its.flatMap(item=>{
      const previous=previousCompletedSetsForExercise(item.exercise_id);
      return Array.from({length:item.target_sets},(_,idx)=>{
        const prev=previous[idx]||previous[previous.length-1]||{};
        return {
          session_id:session.id,user_id:state.user.id,exercise_id:item.exercise_id,set_idx:idx+1,target_reps:item.target_reps,
          target_rest_sec:item.target_rest_sec,target_rir:item.target_rir??null,sort_order:item.sort_order,
          // rir starts from what was actually logged last time, same as weight/reps/seconds —
          // the routine's target_rir only kicks in the very first time this exercise (or its
          // progression line) has ever been trained, when there's no prior rir to carry.
          weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??item.target_rir??null,
          // Unilateral work is logged one side per set, so the sides are laid out alternating
          // up front — left/right is something you correct, not something you type every set.
          side:item.exercise?.unilateral?(idx%2===0?'left':'right'):null
        };
      });
    });
    const {data:insertedSets,error:setsError}=await withNetworkRetry(()=>sb.from('skandi_sets').insert(rows).select());
    if(setsError){
      await sb.from('skandi_sessions').delete().eq('id',session.id);
      return alertSheet(isTransientFetchError(setsError)?t('workout.netHiccup'):setsError.message);
    }
    state.active=session;
    state.sets=dedupeById([...state.sets,...(insertedSets||[])]);
    // Derived from state.sets (computeActiveItems is a pure local computation, no network
    // round-trip) rather than waiting on a fresh loadAll(). A flaky connection here used to
    // leave state.active set with an empty exercise list forever, since hydrateActiveWorkout
    // only (re)computes activeItems when state.active isn't already set.
    state.activeItems=computeActiveItems(session.id);
    state.elapsed=0;
    state.rest=0;
    state.restTotal=0;
    state.pausedMs=0;
    state.pausedAt=null;
    resumeWorkoutTimer();
    openActiveWorkout();
    loadAll().catch(()=>{}); // best-effort background refresh of the rest of state; the workout itself no longer depends on it
  } finally {
    startingWorkout=false;
  }
}

// "Voy a entrenar y decido sobre la marcha" — sin plantilla, sin ejercicios de arranque. No
// hace falta tocar renderActiveWorkout(): ya pinta state.activeItems vacío sin quejarse, ya
// tiene el botón "Agregar ejercicio" siempre visible, y addExerciseToSession() ya funciona sin
// mirar template_id. Lo único que faltaba era una forma de crear la sesión sin pasar por el
// tpl/its que startWorkout() exige.
async function startFreeWorkout(){
  if(startingWorkout) return;
  if(state.active){
    if(!state.active.template_id){ openActiveWorkout(); return; }
    return alertSheet(t('workout.busy'));
  }
  startingWorkout=true;
  try{
    const {data:session,error}=await withNetworkRetry(()=>sb.from('skandi_sessions').insert({user_id:state.user.id,template_id:null,title:t('workout.freeTitle')}).select().single());
    if(error) return alertSheet(isTransientFetchError(error)?t('workout.netHiccup'):error.message);
    state.active=session;
    state.activeItems=computeActiveItems(session.id);
    state.elapsed=0;
    state.rest=0;
    state.restTotal=0;
    state.pausedMs=0;
    state.pausedAt=null;
    resumeWorkoutTimer();
    openActiveWorkout();
    loadAll().catch(()=>{});
  } finally {
    startingWorkout=false;
  }
}

// An active workout's exercise list is derived from the session's own sets (each set
// carries its own target_reps/target_rest_sec/sort_order), not from skandi_template_items.
// That's what lets performSwap() below replace one exercise with another mid-workout
// without touching the shared template, and have it survive a page reload.
function computeActiveItems(sessionId){
  const bySlot=new Map();
  state.sets.filter(s=>s.session_id===sessionId).forEach(s=>{
    // A set keeps its original sort_order when it's moved to a different exercise mid-workout
    // (progression step, manual swap — see moveActiveSetsToExercise, which only ever touches
    // not-yet-done sets). Grouping by sort_order instead of exercise_id keeps that as ONE card
    // — otherwise the already-completed sets get stranded on an orphaned card under the old
    // exercise_id while the remaining sets render as a second, unrelated-looking exercise.
    // Esta clave es la IDENTIDAD de la tarjeta, y por eso viaja hacia afuera como `slot`.
    // Un mismo ejercicio puede ocupar dos huecos —agregar a media sesión algo que ya estaba en
    // la rutina es normal— y entonces exercise_id deja de distinguirlos: borrar el segundo
    // borraba el primero, y agregarle una serie se la ponía al otro.
    const key=s.sort_order!=null?`so:${s.sort_order}`:`ex:${s.exercise_id}`;
    if(!bySlot.has(key)) bySlot.set(key,[]);
    bySlot.get(key).push(s);
  });
  return [...bySlot.entries()].map(([slot,group])=>{
    // Whichever exercise still has undone sets is the one actually being trained right now.
    // Completed sets from before a swap/step stay attributed to whatever they were actually
    // performed on — history isn't rewritten, only the card display is merged.
    const current=group.find(s=>!s.done)||group[0];
    const exercise_id=current.exercise_id;
    const withOrder=group.filter(s=>s.sort_order!=null);
    // Sessions predating migration 051, or whose template was later deleted (FK sets
    // template_id null), can have every set's sort_order null. Collapsing all of those to a
    // shared "0" scrambled the exercise order to whatever state.sets happened to be sorted by.
    // Push them after every exercise that DOES have a real sort_order instead, ordered among
    // themselves by when they were first logged.
    const sortOrder=withOrder.length
      ?Math.min(...withOrder.map(s=>s.sort_order))
      :1000+Math.min(...group.map(s=>new Date(s.created_at).getTime()));
    // Completed sets (from whichever exercise they were logged against) surface first, then
    // whatever's left to do — each half kept in its own set_idx order. A set's displayed row
    // number comes from its position here, not its raw set_idx, since a moved set's set_idx
    // restarts from 1 under its new exercise_id and would otherwise collide with a leftover
    // set_idx 1 still sitting on the old exercise_id.
    const sets=group.slice().sort((a,b)=>a.done===b.done?a.set_idx-b.set_idx:(a.done?-1:1));
    return {
      slot,
      exercise_id,
      exercise:state.exercises.find(e=>e.id===exercise_id),
      target_sets:group.length,
      target_reps:current.target_reps||'8-12',
      target_rest_sec:current.target_rest_sec??90,
      target_rir:current.target_rir??null,
      sort_order:sortOrder,
      sets
    };
  }).filter(i=>i.exercise).sort((a,b)=>a.sort_order-b.sort_order);
}

let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// Boxing-bell "ding-ding" for when the rest countdown hits zero. Synthesized with Web
// Audio instead of a bundled file — this is a single-file no-build-step app, and a
// synthesized bell still works offline once the PWA shell is cached.
function strikeBell(ctx,startTime){
  const master=ctx.createGain();
  master.gain.value=0.5;
  master.connect(ctx.destination);
  // Inharmonic partials (not integer multiples of the fundamental) read as "metal bell"
  // rather than a pure tone.
  [660,990,1657,2211].forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    osc.type='sine';
    osc.frequency.value=freq;
    const gain=ctx.createGain();
    const peak=i===0?0.9:0.9/(i+1.6);
    gain.gain.setValueAtTime(0,startTime);
    gain.gain.linearRampToValueAtTime(peak,startTime+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0005,startTime+1.4-i*0.12);
    osc.connect(gain).connect(master);
    osc.start(startTime);
    osc.stop(startTime+1.5);
  });
  const bufferSize=Math.floor(ctx.sampleRate*0.05);
  const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const noise=ctx.createBufferSource();
  noise.buffer=buffer;
  const noiseFilter=ctx.createBiquadFilter();
  noiseFilter.type='highpass';
  noiseFilter.frequency.value=1500;
  const noiseGain=ctx.createGain();
  noiseGain.gain.value=0.4;
  noise.connect(noiseFilter).connect(noiseGain).connect(master);
  noise.start(startTime);
}
function playRestBell(){
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    strikeBell(ctx,now);
    strikeBell(ctx,now+0.22);
  }catch(e){ /* Web Audio unsupported/blocked — the visual "Rest 0:00" is still there */ }
}

// iOS Safari's autoplay unlock is stricter than ctx.state === 'running': resume() on a
// context that was first created outside a real gesture can flip the state flag to
// 'running' while the hardware output stays silent. The reliable unlock is to actually
// start an audio node — even an inaudible one — synchronously inside the gesture handler.
function unlockAudioCtx(){
  try{
    const ctx=getAudioCtx();
    const buffer=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buffer;
    src.connect(ctx.destination);
    src.start(0);
  }catch(e){}
}

function resumeWorkoutTimer(){
  clearInterval(state.timer);
  if(state.pausedAt){ state.pausedMs+=Date.now()-state.pausedAt; state.pausedAt=null; }
  // started_at (a real timestamp) minus accumulated pause time, not a per-tick counter: a
  // throttled setInterval — screen locked during a long rest, tab backgrounded — used to
  // silently undercount elapsed++ ticks, so the total shown at the end of the workout could
  // be far lower than the real time spent. Recomputing from wall-clock time on every tick
  // self-corrects even after the interval was stalled for minutes.
  const startedAtMs=state.active?new Date(state.active.started_at).getTime():Date.now()-state.elapsed*1000;
  state.timer=setInterval(()=>{
    state.elapsed=Math.max(0,Math.floor((Date.now()-startedAtMs-state.pausedMs)/1000));
    if(state.rest>0){
      state.rest--;
      if(state.rest===0) playRestBell();
    }
    updateWorkoutClocks();
  },1000);
}

function pauseWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=null;
  if(!state.pausedAt) state.pausedAt=Date.now();
}

function restProgressPct(){
  if(!state.restTotal) return 0;
  return Math.max(0,Math.min(100,(state.rest/state.restTotal)*100));
}

function updateWorkoutClocks(){
  const stopwatch=$('activeStopwatch');
  const stopwatchHint=$('activeStopwatchHint');
  const rest=$('activeRest');
  const progress=$('restProgress');
  const floatStopwatch=$('floatStopwatch');
  const floatRestBadge=$('floatRestBadge');
  if(stopwatch) stopwatch.textContent=fmtWorkoutTime(state.elapsed);
  if(stopwatchHint) stopwatchHint.textContent=workoutTimeHint(state.elapsed);
  if(rest) rest.textContent=fmtSec(state.rest);
  if(progress) progress.style.width=`${restProgressPct()}%`;
  if(floatStopwatch) floatStopwatch.textContent=fmtWorkoutTime(state.elapsed);
  if(floatRestBadge){
    floatRestBadge.textContent=fmtSec(state.rest);
    floatRestBadge.classList.toggle('resting',state.rest>0);
  }
}

// Collapsed pill vs. expanded controls for the floating workout timer (see .float-timer CSS) —
// kept open/closed across re-renders via state so adjusting rest doesn't snap it shut.
function toggleFloatTimer(){
  state.floatTimerOpen=!state.floatTimerOpen;
  renderActiveWorkout();
}

function toggleWorkoutTimer(){
  if(state.timer) pauseWorkoutTimer(); else resumeWorkoutTimer();
  renderActiveWorkout();
}

function setRest(seconds){
  state.rest=seconds;
  state.restTotal=seconds;
  renderActiveWorkout();
}

function adjustRest(delta){
  const next=Math.max(0,state.rest+delta);
  state.rest=next;
  state.restTotal=next>0?Math.max(next,state.restTotal+delta):0;
  if(state.restTotal<state.rest) state.restTotal=state.rest;
  renderActiveWorkout();
}

async function confirmFinishWorkout(){
  if(!state.active) return;
  if(!state.activeItems.length) return alertSheet(t('workout.emptyFinish'));
  if(!await confirmSheet(t('workout.confirmFinish'),{confirmLabel:t('workout.finish')})) return;
  openReport();
}

function openActiveWorkout(){
  $('modal').classList.add('show');
  renderActiveWorkout();
}

  // page appears to violently "jump" back to the top. Snapshot/restore scrollTop around the
  // replace so the member's place in the list survives every one of those re-renders.
  const scrollTop=card.scrollTop;
  card.innerHTML=`
    <div class="float-timer ${state.floatTimerOpen?'open':''}">

        <span class="float-timer-chevron">${icon('chevronRight',14)}</span>
      </button>
      ${state.floatTimerOpen?`
      <div class="float-timer-panel">
        <div class="row-head">
          <div>
            <span class="timer-label">${esc(t('workout.elapsed'))}</span>
            <strong class="elapsed-big" id="activeStopwatch">${fmtWorkoutTime(state.elapsed)}</strong>
            <em class="elapsed-hint" id="activeStopwatchHint">${esc(workoutTimeHint(state.elapsed))}</em>
          </div>
          <button class="timer-toggle" onclick="toggleWorkoutTimer()" aria-label="${esc(running?t('workout.pauseTimer'):t('workout.resumeTimer'))}" title="${esc(running?t('workout.pauseTimer'):t('workout.resumeTimer'))}">${running?icon('pause',18):icon('play',18)}</button>
        </div>
        <div class="rest-row">
          <button class="timer-step" onclick="adjustRest(-30)" aria-label="${esc(t('workout.minus30'))}">-30s</button>
          <div class="timer-rest">
            <span>${esc(t('workout.rest'))}</span>
            <strong id="activeRest">${fmtSec(state.rest)}</strong>
          </div>
          <button class="timer-step" onclick="adjustRest(30)" aria-label="${esc(t('workout.plus30'))}">+30s</button>
        </div>
        <div class="rest-progress" aria-label="${esc(t('workout.restProgress'))}"><i id="restProgress" style="width:${restProgressPct()}%"></i></div>
        <div class="unit-toggle" aria-label="${esc(t('workout.defaultUnit'))}">
          <button class="${state.weightUnit==='kg'?'active':''}" onclick="setWeightUnit('kg')">KG</button>
          <button class="${state.weightUnit==='lb'?'active':''}" onclick="setWeightUnit('lb')">LB</button>
        </div>
      </div>`:''}
    </div>
    <div class="workout-bar">
      <div class="workout-bar-title">
        <div><small>${esc(blockLabel)}</small><h1>${esc(state.active.title)}</h1></div>
        <button class="x" onclick="closeModal()" aria-label="${esc(t('workout.minimize'))}" title="${esc(t('workout.minimize'))}">${icon('minimize',22)}</button>
      </div>
    </div>
    <div class="workout-content">
      <div class="workout-section-head">
        <h2>${esc(t('workout.exercises'))}</h2>
        <div class="workout-progress-row">
          <span class="progress-pill"><strong>${done}</strong><small>${esc(t('workout.slashSets',{n:allSets.length}))}</small></span>
          ${state.outbox.length?`<span class="progress-pill" style="background:rgba(212,72,84,.14);color:var(--pink,#d44854)" title="${esc(t('workout.syncPending',{n:state.outbox.length}))}">${esc(t('workout.syncPending',{n:state.outbox.length}))}</span>`:''}
        </div>
      </div>
      ${state.activeItems.map(item=>activeExercise(item,item.sets)).join('')}
      <button class="btn small ghost" style="width:100%;margin-top:4px" onclick="toggleAddExercise()">${icon('plus',16)} ${esc(t('workout.addExercise'))}</button>
      <div id="addExPanel">${addExercisePanelHtml()}</div>
      <div class="workout-footer">
        <button class="btn danger-action" onclick="cancelWorkout()">${icon('close',15)} ${esc(t('common.cancel'))}</button>
        <button class="btn primary" onclick="confirmFinishWorkout()">${icon('check',17)} ${esc(t('workout.finish'))}</button>
      </div>
    </div>
    `;
  card.scrollTop=scrollTop;
}

// Progression exercises (front lever, back lever, planche, handstand) get a quick
// easier/harder stepper instead of having to open the full swap search every session. The rank
// counter doubles as the toggle for the form criteria below it (progressionCriteriaHtml) —
// collapsed by default, because that text is only needed once you've forgotten it, not every
// set, and stacking it open on every card of every exercise was most of the card's height.
// Stepping persists the new variant via saveProgressionState so next week's workout starts on
// it automatically (see resolveTemplateProgressionItems).
function progressionStepperHtml(e,exerciseId){
  if(!e?.progression_group) return '';
  const siblings=progressionSiblings(e.progression_group);
  const idx=siblings.findIndex(x=>x.id===e.id);
  if(idx<0) return '';
  const prev=siblings[idx-1],next=siblings[idx+1];
  const prevBtn=prev?`<button class="btn small ghost" onclick="event.stopPropagation();stepProgression('${exerciseId}','${prev.id}')" aria-label="${esc(t('prog.easier'))}" title="${esc(t('prog.easierName',{name:prev.name}))}">◀</button>`
    :`<button class="btn small ghost" disabled aria-label="${esc(t('prog.easiest'))}">◀</button>`;
  const nextBtn=next?`<button class="btn small ghost" onclick="event.stopPropagation();stepProgression('${exerciseId}','${next.id}')" aria-label="${esc(t('prog.harder'))}" title="${esc(t('prog.harderName',{name:next.name}))}">▶</button>`
    :`<button class="btn small ghost" disabled aria-label="${esc(t('prog.hardest'))}">▶</button>`;
  const step=esc(t('prog.step',{i:idx+1,n:siblings.length}));
  const hasInfo=!!(e.progression_criteria||e.progression_target);
  const open=state.progInfoOpen.has(exerciseId);
  const label=hasInfo
    ?`<button type="button" class="prog-info-toggle" onclick="event.stopPropagation();toggleProgInfo('${exerciseId}')">${step}<span>${open?'▴':'▾'}</span></button>`
    :`<small class="muted">${step}</small>`;
  return `<div class="row" style="margin-top:6px" onclick="event.stopPropagation()">${prevBtn}${label}${nextBtn}</div>`;
}

function toggleProgInfo(exerciseId){
  if(state.progInfoOpen.has(exerciseId)) state.progInfoOpen.delete(exerciseId);
  else state.progInfoOpen.add(exerciseId);
  renderActiveWorkout();
}

// The rank's own form standard and the exact bar for levelling up — collapsed by default (see
// progressionStepperHtml's toggle), shown only once a member taps to check it, since the whole
// point is not to make every set-row scroll past a wall of text to reach the actual sets.
function progressionCriteriaHtml(e,exerciseId){
  if(!e?.progression_criteria&&!e?.progression_target) return '';
  if(!state.progInfoOpen.has(exerciseId)) return '';
  const unit=n=>e.log_mode==='seconds'?t('prog.secUnit',{n}):t('prog.repUnit',{n});
  const lines=[];
  if(e.progression_criteria) lines.push(esc(t('prog.criteria',{v:e.progression_criteria})));
  if(e.progression_target) lines.push(esc(t('prog.target',{sets:e.progression_target_sets||1,v:unit(e.progression_target)})));
  return `<div class="prog-criteria" onclick="event.stopPropagation()">${lines.join('<br>')}</div>`;
}

// The deload brief (skandi-brief.js) only ever says this once, on Home, for the day as a
// whole — but "how much load" is a per-exercise question, and by the time a member is looking
// at the set row is exactly when they need the answer. Weight already gets a silent 30%
// preload (deloadAdjustedWeight); bodyweight holds and reps have no equivalent number to
// preload, so this is the visible instruction that covers all three. Kept to one short line —
// the full reasoning already lives in the Home brief, this is just the reminder.
function deloadNoteHtml(e){
  if(!e||!trainingBlockWeekInfo()?.deload) return '';
  const key=e.progression_group?'ex.deloadSkill':'ex.deloadStrength';
  return `<p class="deload-note" onclick="event.stopPropagation()">${esc(t(key))}</p>`;
}

// Surfaced once progressionReadiness() confirms two consecutive clean sessions at target —
// tapping it is exactly the same step the ▶ button above already performs.
function progressionReadinessHtml(e,exerciseId){
  if(!progressionReadiness(e)) return '';
  const siblings=progressionSiblings(e.progression_group);
  const next=siblings[siblings.findIndex(x=>x.id===e.id)+1];
  if(!next) return '';
  return `<button type="button" class="progression-ready" onclick="event.stopPropagation();stepProgression('${exerciseId}','${next.id}')">${esc(t('prog.readyFor',{name:next.name}))}</button>`;
}

// progressionReadiness() only ever looks at COMPLETED sessions, so a member who just nailed
// every set of the standard mid-workout sees nothing until they start their NEXT session —
// the level-up banner above would only light up then. This reads today's live, in-progress
// sets instead: how many already meet the rank's full standard (mark + quality), and whether
// today completing it would actually be enough (only if the last trained session already
// qualified — otherwise today is just the first of the two required). Hidden once
// progressionReadinessHtml already covers the case, and hidden entirely on the line's last
// rank, which has nothing left to level up into.
function progressionLiveProgressHtml(e,sets){
  if(!e?.progression_group||!e.progression_target) return '';
  const siblings=progressionSiblings(e.progression_group);
  if(siblings.findIndex(x=>x.id===e.id)===siblings.length-1) return '';
  if(progressionReadiness(e)) return '';
  const doneSets=sets.filter(s=>s.done);
  if(!doneSets.length) return '';
  const seconds=e.log_mode==='seconds';
  const mark=s=>seconds?(Number(s.seconds)||0):(Number(s.reps)||0);
  const needed=e.progression_target_sets||1;
  const qualifying=doneSets.filter(s=>{
    if(mark(s)<e.progression_target) return false;
    if(!e.track_quality) return true;
    const q=setQuality(s);
    return q!=null&&q>=QUALITY_CLEAN;
  }).length;
  const unit=n=>seconds?t('prog.secUnit',{n}):t('prog.repUnit',{n});
  if(qualifying>0){
    const wouldLevelUp=qualifying>=needed&&progressionMostRecentQualified(e);
    return `<p class="prog-live-progress">${esc(t('prog.liveQualifying',{q:qualifying,n:needed}))}${wouldLevelUp?' '+esc(t('prog.liveWouldLevelUp')):''}</p>`;
  }
  const best=Math.max(...doneSets.map(mark));
  if(best>0&&best<e.progression_target) return `<p class="prog-live-progress">${esc(t('prog.liveBest',{v:unit(best),target:unit(e.progression_target)}))}</p>`;
  return '';
}

// A set row has six columns at 375px and no room for a seventh, so the two things that only
// SOME sets need — which side it was, and the form clip — live behind the row number instead of
// each claiming a column nobody else uses. Same inline-panel pattern as the swap search.
function toggleSetOptions(id){
  state.setOptionsId=state.setOptionsId===id?null:id;
  renderActiveWorkout();
}

function setOptionsHtml(s,ex){
  if(state.setOptionsId!==s.id) return '';
  const sideBtn=(v,label)=>`<button class="btn small ${s.side===v?'primary':'ghost'}" onclick="event.stopPropagation();setSetSide('${s.id}','${v}')">${esc(label)}</button>`;
  const clipUrl=s.clip_path?setClipUrl(s.clip_path):'';
  return `<div class="set-options" onclick="event.stopPropagation()">
    ${ex.unilateral?`<div class="row"><small class="muted">${esc(t('ex.side'))}</small><div class="row" style="gap:6px">
      ${sideBtn('left',t('ex.sideLeft'))}${sideBtn('right',t('ex.sideRight'))}
      <button class="btn small ghost" onclick="event.stopPropagation();setSetSide('${s.id}','')">${esc(t('ex.sideNone'))}</button>
    </div></div>`:''}
    <div class="row" style="margin-top:${ex.unilateral?'10px':'0'}">
      <small class="muted">${esc(t('ex.clip'))}</small>
      <div class="row" style="gap:6px">
        ${s.clip_path
          ?`<button class="btn small ghost danger" onclick="event.stopPropagation();removeSetClip('${s.id}')">${esc(t('ex.clipRemove'))}</button>`
          :`<label class="btn small ghost" style="cursor:pointer">${esc(t('ex.clipAdd'))}<input type="file" accept="video/*" style="display:none" onchange="uploadSetClip('${s.id}',this.files[0])"></label>`}
      </div>
    </div>
    ${s.clip_path?`<video src="${esc(clipUrl)}" data-clip="${esc(s.clip_path)}" controls playsinline preload="metadata"></video>`:''}
  </div>`;
}

async function setSetSide(id,side){
  const value=side||null;
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  await queuedUpdate('skandi_sets',id,{side:value,updated_at:new Date().toISOString()},s,renderActiveWorkout);
}

// The bucket is private and keyed by owner folder (migration 079), so the path has to start
// with the uid or the storage policy rejects the upload.
async function uploadSetClip(id,file){
  if(!file) return;
  if(file.size>26214400) return alertSheet(t('ex.clipTooBig'));
  const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
  const path=`${state.user.id}/${id}-${Date.now()}.${ext}`;
  const {error:upErr}=await sb.storage.from('skandi-set-clips').upload(path,file,{contentType:file.type||'video/mp4'});
  if(upErr) return alertSheet(t('ex.clipError',{msg:upErr.message}));
  const {error}=await sb.from('skandi_sets').update({clip_path:path,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alertSheet(error.message);
  const s=state.sets.find(x=>x.id===id);
  if(s) s.clip_path=path;
  renderActiveWorkout();
}

async function removeSetClip(id){
  const s=state.sets.find(x=>x.id===id);
  if(!s?.clip_path) return;
  if(!await confirmSheet(t('ex.clipConfirmRemove'),{confirmLabel:t('ex.clipRemove'),danger:true})) return;
  const path=s.clip_path;
  const {error}=await sb.from('skandi_sets').update({clip_path:null,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alertSheet(error.message);
  s.clip_path=null;
  sb.storage.from('skandi-set-clips').remove([path]);
  delete setClipUrl.cache[path];
  renderActiveWorkout();
}

// Same signed-URL-with-memory-cache dance as mealPhotoUrl: the bucket is private, so there is
// no public URL to render straight into the tag.
function setClipUrl(path){
  if(!path) return '';
  if(setClipUrl.cache[path]) return setClipUrl.cache[path];
  setClipUrl.cache[path]='';
  sb.storage.from('skandi-set-clips').createSignedUrl(path,3600).then(({data})=>{
    if(!data?.signedUrl) return;
    setClipUrl.cache[path]=data.signedUrl;
    document.querySelectorAll(`video[data-clip="${path}"]`).forEach(v=>{v.src=data.signedUrl;});
  });
  return '';
}
setClipUrl.cache={};

// ---- Tempo metronome -----------------------------------------------------------------------

// A criterion like "4-5 s down" or "1 s pause at horizontal" is unenforceable by feel — everyone
// rushes the eccentric when it burns. Clicks on the beat, bell at the end. Scheduled straight on
// the audio clock rather than with setInterval, which drifts and stalls when the screen sleeps.
function tempoClick(ctx,at){
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='square';
  osc.frequency.value=1180;
  gain.gain.setValueAtTime(0,at);
  gain.gain.linearRampToValueAtTime(0.22,at+0.004);
  gain.gain.exponentialRampToValueAtTime(0.0005,at+0.06);
  osc.connect(gain).connect(ctx.destination);
  osc.start(at);
  osc.stop(at+0.09);
}

function startTempo(seconds,every){
  unlockAudioCtx();
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    for(let at=every;at<seconds;at+=every) tempoClick(ctx,now+at);
    strikeBell(ctx,now+seconds);
  }catch(e){ /* Web Audio blocked — the number on the button is still the instruction */ }
}

// Holds beat every 5s up to the rank's target; rep work beats every second through the
// eccentric. Nothing is shown for exercises with neither, rather than inventing a tempo.
function tempoButtonHtml(e){
  const isHold=e.log_mode==='seconds';
  const seconds=isHold?(e.progression_target||null):(e.tempo_seconds||null);
  if(!seconds) return '';
  const every=isHold?5:1;
  const label=isHold?t('tempo.hold',{n:seconds}):t('tempo.rep',{n:seconds});
  return `<button type="button" class="btn small ghost" style="margin-top:6px" onclick="event.stopPropagation();startTempo(${seconds},${every})">${icon('play',13)} ${esc(label)}${e.tempo_note&&!isHold?` · ${esc(e.tempo_note)}`:''}</button>`;
}

function activeExercise(item,sets){
  const e=item.exercise;
  const undone=sets.filter(s=>!s.done).length;
  const seconds=e.log_mode==='seconds';
  const showWeight=e.log_weight!==false; // pure plyometric/balance drills (migration 061) skip the weight field entirely
  const unit=exerciseWeightUnit(item.exercise_id);
  // Every set row gets one extra column beyond weight/reps-or-seconds: an execution rating
  // 1-10 for skill work (every hold plus every exercise on a progression line — a nordic curl
  // or a front lever raise is judged on position, and it is the rating that gates levelling
  // up), or RIR for ordinary load work, where the plan's progression rule is RIR 1-2.
  const rowClass=showWeight?'set-row':'set-row no-weight';
  return `<article class="exercise">
    <div class="ex-head" onclick="openExercise('${e.id}',true)">${mediaThumb(e)}<div><h3>${esc(e.name)} <span class="ex-info-hint">${icon('chevronRight',13)}</span></h3><p>${[esc(exerciseSubtitle(e)),`${item.target_sets} x ${esc(item.target_reps)}`,esc(t('ex.restSec',{n:item.target_rest_sec}))].filter(Boolean).join(' · ')}</p>${deloadNoteHtml(e)}${progressionStepperHtml(e,item.exercise_id)}${progressionCriteriaHtml(e,item.exercise_id)}${progressionLiveProgressHtml(e,sets)}${tempoButtonHtml(e)}${progressionReadinessHtml(e,item.exercise_id)}</div>
      <div class="ex-actions">
        <span class="muted">${sets.filter(s=>s.done).length}/${sets.length}${(()=>{const q=e.track_quality?avgQuality(sets.filter(x=>x.done)):null; return q!=null?' · '+esc(t('ex.qualityAvg',{v:q})):'';})()}</span>
        <div class="ex-actions-row">
          ${undone?`<button class="icon-btn tiny" onclick="event.stopPropagation();toggleSwap('${item.exercise_id}')" aria-label="${esc(t('ex.swap'))}" title="${esc(t('ex.swap'))}">${icon('swap',14)}</button>`:''}
          <button class="icon-btn tiny danger" onclick="event.stopPropagation();removeExerciseFromSession('${item.slot}')" aria-label="${esc(t('ex.removeFromSession'))}" title="${esc(t('ex.removeShort'))}">${icon('trash',14)}</button>
        </div>
      </div>
    </div>
    <div id="swapPanel-${item.exercise_id}">${swapPanelHtml(item.exercise_id)}</div>
    <div class="stack">
      <div class="${rowClass}">
        <span></span>
        ${showWeight?`<button type="button" class="pill dark" style="cursor:pointer;justify-self:start" onclick="event.stopPropagation();setExerciseWeightUnit('${item.exercise_id}','${unit==='kg'?'lb':'kg'}')" aria-label="${esc(unit==='kg'?t('ex.switchToLb'):t('ex.switchToKg'))}" title="${esc(unit==='kg'?t('ex.switchToLb'):t('ex.switchToKg'))}">${unit.toUpperCase()}</button>`:''}
        <small class="muted">${esc(seconds?t('ex.colSec'):t('ex.colReps'))}</small><small class="muted" style="font-size:10px">${esc(e.track_quality?t('ex.colQuality'):t('ex.colRir'))}</small><span></span><span></span>
      </div>
      ${sets.map((s,i)=>{
        // A row's own exercise can differ from the card's current one (item.exercise) right
        // after a mid-exercise swap/progression-step — completed sets stay attributed to
        // whatever they were actually logged against (see computeActiveItems), so each row
        // reads its own log_mode/log_weight/unit instead of inheriting the header's. Row
        // number is this set's position in the card, not its raw set_idx: a moved set's
        // set_idx restarts at 1 under its new exercise_id and would otherwise collide with a
        // leftover set_idx 1 still sitting on the old exercise_id.
        const rowEx=s.exercise_id===item.exercise_id?e:(state.exercises.find(x=>x.id===s.exercise_id)||e);
        const rowSeconds=rowEx.log_mode==='seconds';

        ${rowShowWeight?`<input class="field" inputmode="decimal" value="${fmtWeightInput(s.weight_kg,rowUnit)}" placeholder="${rowUnit}" onchange="updateSet('${s.id}','weight_kg',this.value)">`:''}

          :`<input class="field" inputmode="numeric" value="${s.reps??''}" placeholder="${esc(s.target_reps||t('common.reps'))}" onchange="updateSet('${s.id}','reps',this.value)">`}

// Swapping always moves this exercise's not-yet-done sets in the current session
// (skandi_sets.exercise_id); the routine itself (skandi_template_items) is only touched if the
// member confirms it should be — see maybePersistSwapToTemplate, called from performSwap.
function toggleSwap(exerciseId){
  state.swapTarget=state.swapTarget===exerciseId?null:exerciseId;
  state.swapQuery='';
  renderActiveWorkout();
}

function swapPanelHtml(exerciseId){
  if(state.swapTarget!==exerciseId) return '';
  return `<div class="stack" style="margin:8px 0;padding:10px;border:1px solid var(--border,#e5e5e5);border-radius:10px" onclick="event.stopPropagation()">
    <input id="swapQuery-${exerciseId}" class="field left" placeholder="${esc(t('ex.replaceWith'))}" value="${esc(state.swapQuery)}" oninput="renderSwapList('${exerciseId}')" autofocus>
    <div id="swapList-${exerciseId}" class="stack">${swapListHtml(exerciseId)}</div>
  </div>`;
}

function swapListHtml(exerciseId){
  const q=state.swapQuery.trim().toLowerCase();
  let list=state.exercises.filter(e=>e.id!==exerciseId&&(!q||`${e.name} ${e.english_name||''}`.toLowerCase().includes(q)));
  // With no search typed yet, surface same-family progressions first (e.g. swapping out of
  // Front Lever Tuck leads with the other front lever variants) instead of a flat A-Z list.
  const group=!q&&state.exercises.find(e=>e.id===exerciseId)?.progression_group;
  if(group){
    list=list.slice().sort((a,b)=>{
      const aIn=a.progression_group===group,bIn=b.progression_group===group;
      if(aIn&&bIn) return a.progression_rank-b.progression_rank;
      if(aIn!==bIn) return aIn?-1:1;
      return a.name.localeCompare(b.name);
    });
  }
  list=list.slice(0,20);
  if(!list.length) return `<p class="muted">${esc(t('common.noMatches'))}</p>`;
  return list.map(e=>`<button type="button" class="btn small ghost" style="width:100%;text-align:left" onclick="performSwap('${exerciseId}','${e.id}')">${esc(e.name)}${exerciseSubtitle(e)?` <small class="muted">${esc(exerciseSubtitle(e))}</small>`:''}</button>`).join('');
}

function renderSwapList(exerciseId){
  state.swapQuery=$(`swapQuery-${exerciseId}`)?.value||'';
  const list=$(`swapList-${exerciseId}`);
  if(list) list.innerHTML=swapListHtml(exerciseId);
}

// Shared by the full swap search and the quick progression stepper (◀ ▶): moves this
// session's not-yet-done sets from one exercise to another, preloading from that exercise's
// own history. If the new exercise belongs to a progression line, this also remembers it as
// the user's current variant for that line (saveProgressionState) so future sessions default
// to it — that's what lets leveling up from Front Lever Tuck to Advanced Tuck stick without
// ever touching the shared routine.
//
// Deliberately NOT async, and split in two: every patch is independent of how the others turn
// out (all of them read from the same `previous` history and a set_idx decided up front), so
// there was never a reason to send them one at a time — a for..await here used to mean moving
// 3-4 sets after a swap or a progression step was 3-4 sequential round trips with nothing on
// screen until the last one landed. queuedUpdate() is async, but it applies its patch to the
// local row and calls onChange synchronously, before its own first `await` — so calling it N
// times in a row inside .map(), without awaiting each one, applies all N patches (and lets the
// caller recompute activeItems) in the same tick, before any of the N network calls have even
// resolved. The network half — parallel, outbox-backed like every other set edit — keeps
// running after this function has already returned; `done` is how a caller that cares (only
// performSwap, to decide whether to ask about persisting to the template) waits on it.
function moveActiveSetsToExercise(oldExerciseId,newExerciseId){
  if(!state.active||oldExerciseId===newExerciseId) return {moved:false,done:Promise.resolve(false)};
  const sessionId=state.active.id;
  const moving=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===oldExerciseId&&!s.done);
  if(!moving.length) return {moved:false,done:Promise.resolve(false)};
  // set_idx is unique per (session_id, exercise_id): if newExerciseId already has sets in this
  // session (e.g. two separate swaps landing on the same replacement), reassigning straight
  // across would collide. Continue numbering after whatever's already there instead.
  const existingForNew=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===newExerciseId);
  const nextIdx=(existingForNew.length?Math.max(...existingForNew.map(s=>s.set_idx)):0)+1;
  const previous=previousCompletedSetsForExercise(newExerciseId);
  const patches=moving.map((s,i)=>{
    const prev=previous[i]||previous[previous.length-1]||{};
    return {s,patch:{exercise_id:newExerciseId,set_idx:nextIdx+i,target_rir:prev.target_rir??null,weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??prev.target_rir??null,updated_at:new Date().toISOString()}};
  });
  const writes=patches.map(({s,patch})=>queuedUpdate('skandi_sets',s.id,patch,s,null));
  // By this line every write above has already applied its patch locally (see comment above) —
  // activeItems can be recomputed right now, with zero network wait.
  state.activeItems=computeActiveItems(sessionId);
  const newExercise=state.exercises.find(e=>e.id===newExerciseId);
  const done=Promise.all(writes).then(async results=>{
    const ok=!results.some(x=>!x);
    if(ok&&newExercise?.progression_group) await saveProgressionState(newExercise.progression_group,newExerciseId);
    return ok;
  });
  return {moved:true,done};
}

async function performSwap(oldExerciseId,newExerciseId){
  if(!state.active||oldExerciseId===newExerciseId){ toggleSwap(oldExerciseId); return; }
  const item=state.activeItems.find(i=>i.exercise_id===oldExerciseId);
  const {moved,done}=moveActiveSetsToExercise(oldExerciseId,newExerciseId);
  if(moved){ state.swapTarget=null; state.swapQuery=''; }
  // The card already shows the new exercise — the local mutation above was synchronous — so
  // paint now rather than after the round trip; that's the whole point of parallelizing this.
  renderActiveWorkout();
  if(moved&&await done) await maybePersistSwapToTemplate(item,newExerciseId);
}

// A plain swap only ever lasts this session (moveActiveSetsToExercise). A progression-line
// replacement already survives on its own — currentProgressionExercise() re-resolves the slot
// from skandi_progression_state every time the routine loads, skandi_template_items untouched —
// so asking here too would be a redundant second prompt for something that's already permanent.
// For everything else (swapping to an unrelated exercise the member has decided is just better),
// there was no path to make it stick, which is exactly the gap: offer to write the replacement
// into the template slot itself, matched by sort_order (the same "slot identity" computeActiveItems
// already keys on), so every future session built from this routine starts with the swap already
// in place. Silently no-ops for an ad-hoc session (no template_id) or a slot that isn't a real
// template item (added mid-session, or a legacy session with no sort_order) — nothing to persist to.
async function maybePersistSwapToTemplate(item,newExerciseId){
  const templateId=state.active?.template_id;
  if(!templateId||!item||item.sort_order==null) return;
  const newExercise=state.exercises.find(e=>e.id===newExerciseId);
  if(newExercise?.progression_group) return;
  const templateItem=state.items.find(i=>i.template_id===templateId&&i.sort_order===item.sort_order);
  if(!templateItem||templateItem.exercise_id===newExerciseId) return;
  const tpl=state.templates.find(x=>x.id===templateId);
  if(!await confirmSheet(t('ex.confirmSwapTemplate',{exercise:newExercise?.name||'',routine:tpl?.name||''}),{confirmLabel:t('common.yes'),cancelLabel:t('common.no')})) return;
  const {error}=await sb.from('skandi_template_items').update({exercise_id:newExerciseId}).eq('id',templateItem.id);
  if(error){ await alertSheet(error.message); return; }
  templateItem.exercise_id=newExerciseId;
}

function stepProgression(oldExerciseId,newExerciseId){
  if(!newExerciseId) return;
  moveActiveSetsToExercise(oldExerciseId,newExerciseId);
  renderActiveWorkout();
}

// Adding an exercise here can also be offered forward, same confirm-to-persist shape as a swap
// (maybePersistAddToTemplate, called from addExerciseToSession below). Removing a slot has no
// such path — dropping something from one session isn't a signal to drop it from the routine too.
function toggleAddExercise(){
  state.addExOpen=!state.addExOpen;
  state.addExQuery='';
  renderActiveWorkout();
}

function addExercisePanelHtml(){
  if(!state.addExOpen) return '';
  return `<div class="stack" style="margin:8px 0;padding:10px;border:1px solid var(--border,#e5e5e5);border-radius:10px">
    <input id="addExQuery" class="field left" placeholder="${esc(t('common.searchExercise'))}" value="${esc(state.addExQuery)}" oninput="renderAddExerciseList()" autofocus>
    <div id="addExList" class="stack">${addExerciseListHtml()}</div>
  </div>`;
}

function addExerciseListHtml(){
  const q=state.addExQuery.trim().toLowerCase();
  const already=new Set(state.activeItems.map(i=>i.exercise_id));
  const list=state.exercises.filter(e=>!already.has(e.id)&&(!q||`${e.name} ${e.english_name||''}`.toLowerCase().includes(q))).slice(0,20);
  if(!list.length) return `<p class="muted">${esc(t('common.noMatches'))}</p>`;
  return list.map(e=>`<button type="button" class="btn small ghost" style="width:100%;text-align:left" onclick="addExerciseToSession('${e.id}')">${esc(e.name)}${exerciseSubtitle(e)?` <small class="muted">${esc(exerciseSubtitle(e))}</small>`:''}</button>`).join('');
}

function renderAddExerciseList(){
  state.addExQuery=$('addExQuery')?.value||'';
  const list=$('addExList');
  if(list) list.innerHTML=addExerciseListHtml();
}

async function addExerciseToSession(exerciseId){
  if(!state.active) return;
  const sessionId=state.active.id;
  const sortOrder=state.activeItems.length?Math.max(...state.activeItems.map(i=>i.sort_order))+1:1;
  const previous=previousCompletedSetsForExercise(exerciseId);
  const targetSets=previous.length||3;
  const rows=Array.from({length:targetSets},(_,idx)=>{
    const prev=previous[idx]||previous[previous.length-1]||{};
    return {
      session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:idx+1,
      target_reps:prev.target_reps||'8-12',target_rest_sec:prev.target_rest_sec??90,target_rir:prev.target_rir??null,sort_order:sortOrder,
      weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??prev.target_rir??null
    };
  });
  const {data,error}=await sb.from('skandi_sets').insert(rows).select();
  if(error) return alertSheet(error.message);
  state.sets.push(...(data||[]));
  state.activeItems=computeActiveItems(sessionId);
  state.addExOpen=false;
  state.addExQuery='';
  await maybePersistAddToTemplate(exerciseId,targetSets,rows[0]);
  renderActiveWorkout();
}

// Mirrors maybePersistSwapToTemplate for the other way a session can diverge from its routine:
// adding an exercise mid-session instead of swapping one out. Unlike a swap, there's no existing
// auto-persist path to skip even for a progression-line exercise — currentProgressionExercise()
// only re-resolves a slot the routine already has, it never adds a new one — so this always
// offers, appending past whatever sort_order the routine's own items already use (not the
// session's, which can run ahead after other adds/swaps) with the same targets
// addExerciseToSession just derived from history.
async function maybePersistAddToTemplate(exerciseId,targetSets,firstRow){
  const templateId=state.active?.template_id;
  if(!templateId) return;
  const exercise=state.exercises.find(e=>e.id===exerciseId);
  const tpl=state.templates.find(x=>x.id===templateId);
  if(!await confirmSheet(t('ex.confirmAddTemplate',{exercise:exercise?.name||'',routine:tpl?.name||''}),{confirmLabel:t('common.yes'),cancelLabel:t('common.no')})) return;
  const templateItems=state.items.filter(i=>i.template_id===templateId);
  const sortOrder=templateItems.length?Math.max(...templateItems.map(i=>i.sort_order))+1:0;
  const row={template_id:templateId,exercise_id:exerciseId,sort_order:sortOrder,target_sets:targetSets,
    target_reps:firstRow.target_reps,target_rest_sec:firstRow.target_rest_sec,target_rir:firstRow.target_rir};
  const {data,error}=await sb.from('skandi_template_items').insert(row).select().single();
  if(error){ await alertSheet(error.message); return; }
  state.items.push({...data,exercise});
}

async function removeExerciseFromSession(slot){
  if(!state.active) return;
  const sessionId=state.active.id;
  // Por hueco y no por ejercicio: con el mismo ejercicio en dos posiciones, buscar por
  // exercise_id devolvía siempre la primera tarjeta y borraba la equivocada.
  const item=state.activeItems.find(i=>i.slot===slot)||state.activeItems.find(i=>i.exercise_id===slot);
  if(!item) return;
  if(!await confirmSheet(t('ex.confirmRemove',{name:item.exercise?.name||t('ex.thisExercise')}),{confirmLabel:t('ex.removeShort'),danger:true})) return;
  // Delete by id, not by exercise_id: after a mid-exercise swap/progression-step this card can
  // hold sets logged against more than one exercise_id (see computeActiveItems) — filtering by
  // the current exercise_id alone would leave the older exercise's completed sets behind.
  const ids=item.sets.map(s=>s.id);
  const {error}=await sb.from('skandi_sets').delete().in('id',ids);
  if(error) return alertSheet(error.message);
  state.sets=state.sets.filter(s=>!ids.includes(s.id));
  state.activeItems=computeActiveItems(sessionId);
  renderActiveWorkout();
}

async function updateSet(id,key,value){
  const patch={updated_at:new Date().toISOString()};
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  const parsed=value===''?null:(key==='weight_kg'?displayToKg(value,exerciseWeightUnit(s.exercise_id)):Number(value));
  if(parsed!==null&&!Number.isFinite(parsed)) return alertSheet(t('ex.errNumber'));
  // Matches the DB check constraints on skandi_sets (migrations 040/053/064) — catch it here
  // instead of round-tripping to a raw Postgres error.
  if(key==='weight_kg'&&parsed!==null&&(parsed<0||parsed>500)) return alertSheet(t('ex.errWeight'));
  if(key==='seconds'&&parsed!==null&&(parsed<0||parsed>7200)) return alertSheet(t('ex.errSeconds'));
  if(key==='rir'&&parsed!==null&&(parsed<0||parsed>10)) return alertSheet(t('ex.errRir'));
  if(key==='form_quality'&&parsed!==null&&(parsed<1||parsed>10)) return alertSheet(t('ex.errQuality'));
  patch[key]=parsed===null?null:(key==='weight_kg'?Math.round(parsed*100)/100:Math.round(parsed));
  // The rating recolours its own control, so unlike the plain number fields this one needs a
  // repaint; the plain fields already show what was typed in their own input, no re-render
  // needed. Routed through the outbox (see above) so a dropped signal right as you log a set
  // doesn't undo what you just typed.
  const ok=await queuedUpdate('skandi_sets',id,patch,s,key==='form_quality'?renderActiveWorkout:null);
  if(!ok) return;
  // Deliberately never copied down for form_quality — quality is an observation of one set,
  // not a value you plan ahead. This secondary fill-down write stays on the plain path (not
  // outbox-queued): it's a convenience for the sets not yet reached, not the tap being logged.
  if(s.set_idx===1&&patch[key]!=null&&key!=='form_quality'){
    const targets=state.sets.filter(x=>x.session_id===s.session_id&&x.exercise_id===s.exercise_id&&x.id!==s.id&&!x.done&&(x[key]==null||x[key]===''));
    if(targets.length){
      const ids=targets.map(x=>x.id);
      const {error:fillError}=await sb.from('skandi_sets').update({[key]:patch[key],updated_at:new Date().toISOString()}).in('id',ids);
      if(!fillError) targets.forEach(x=>{ x[key]=patch[key]; });
      renderActiveWorkout();
    }
  }
}

// El "pop" del check vive en JS, no en la plantilla: renderActiveWorkout reconstruye el botón
// entero en cada re-render, y si la clase 'pop' estuviera horneada ahí (p.ej. atada a .done) se
// repetiría en TODOS los sets ya marcados cada vez que cualquier otra cosa cambie en la tarjeta
// (editar el peso de otra serie, abrir un swap...). Agregarla a mano en el nodo recién creado,
// justo después del render que sigue al tap, la deja disparando solo en el set que en verdad se
// acaba de tocar. El reflow forzado (offsetWidth) es lo que permite reiniciar la animación si el
// mismo set se vuelve a tocar antes de que la anterior termine.
function pulseCheck(setId){
  const btn=document.querySelector(`.check[data-set-id="${setId}"]`);
  if(!btn) return;
  btn.classList.remove('pop');
  void btn.offsetWidth;
  btn.classList.add('pop');
  if(navigator.vibrate) navigator.vibrate(12);
}

async function toggleSet(id,rest){
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  // Checking off a set is what actually starts the rest countdown whose end the bell needs to
  // mark — and it's a real synchronous tap, unlike the resumeWorkoutTimer() call in
  // startWorkout() (several `await`s removed from the original tap by the time it runs) or in
  // hydrateActiveWorkout() (no tap at all, page just loaded on an already-running workout).
  // On iOS Safari a plain resume() isn't enough if the context's first resume attempt ever
  // happened outside a gesture (both call sites above do exactly that) — the state flag can
  // read 'running' while the speaker stays silent for the whole session. unlockAudioCtx()
  // starts a real (inaudible) node here, synchronously and before any `await`, on the one
  // call site that's guaranteed to be a genuine tap.
  unlockAudioCtx();
  const done=!s.done;
  // Set before the write so the optimistic render (queuedUpdate's onChange, fired before any
  // network wait) already shows the checkmark and the rest countdown together — a dropped
  // connection queues the write and leaves both exactly as the tap left them.
  state.rest=done?rest:0;
  state.restTotal=done?rest:0;
  const ok=await queuedUpdate('skandi_sets',id,{done,updated_at:new Date().toISOString()},s,()=>{ renderActiveWorkout(); pulseCheck(id); });
  if(!ok){ state.rest=0; state.restTotal=0; renderActiveWorkout(); return; }
  if(done) await advanceProgressionIfAhead(s.exercise_id);
  renderActiveWorkout();
}

async function addSet(slot){
  if(!state.active) return;
  const sessionId=state.active.id;
  // Las series de ESTE hueco, no las de todas las apariciones del ejercicio: si el mismo
  // ejercicio está dos veces, tomar las de ambas daba un set_idx equivocado y, peor, copiaba
  // el sort_order de la otra tarjeta, así que la serie nueva aparecía en la de arriba.
  const item=state.activeItems.find(i=>i.slot===slot)||state.activeItems.find(i=>i.exercise_id===slot);
  if(!item) return;
  const exerciseId=item.exercise_id;
  const existing=item.sets;
  const nextIdx=(existing.length?Math.max(...existing.map(s=>s.set_idx)):0)+1;
  const seed=existing.find(s=>s.set_idx===1)||existing[0]||{};
  // Look target_reps/rest/sort up server-side-derived state rather than taking it as a caller
  // argument — target_reps is free text a user can set when building a routine, and passing it
  // through an inline onclick('...') string argument is an XSS vector (HTML-escaping a value
  // that lands inside a JS string literal in an attribute does not neutralize it).
  const {data,error}=await sb.from('skandi_sets').insert({
    session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:nextIdx,
    target_reps:seed.target_reps||item?.target_reps||'8-12',
    target_rest_sec:seed.target_rest_sec??item?.target_rest_sec??null,
    target_rir:seed.target_rir??item?.target_rir??null,
    sort_order:seed.sort_order??item?.sort_order??null,
    weight_kg:seed.weight_kg??null,reps:seed.reps??null,seconds:seed.seconds??null,rir:seed.rir??item?.target_rir??null,
    side:item?.exercise?.unilateral?(existing.slice(-1)[0]?.side==='left'?'right':'left'):null
  }).select().single();
  if(error) return alertSheet(error.message);
  state.sets.push(data);
  renderActiveWorkout();
}

async function removeSet(id){
  const {error}=await sb.from('skandi_sets').delete().eq('id',id);
  if(error) return alertSheet(error.message);
  state.sets=state.sets.filter(s=>s.id!==id);
  renderActiveWorkout();
}

async function cancelWorkout(){
  if(!state.active) return;
  if(!await confirmSheet(t('workout.confirmCancel'),{confirmLabel:t('workout.cancelConfirmAction'),cancelLabel:t('workout.keepTraining'),danger:true})) return;
  const sessionId=state.active.id;
  const cancelledSession=state.active;
  const cancelledElapsed=state.elapsed;
  pauseWorkoutTimer();
  ignoreSessionLocally(sessionId);
  state.active=null;
  state.activeItems=[];
  state.sessions=state.sessions.filter(s=>s.id!==sessionId);
  state.sets=state.sets.filter(s=>s.session_id!==sessionId);
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  closeModal();
  render();
  const {data,error}=await sb.from('skandi_sessions').delete().eq('id',sessionId).eq('user_id',state.user.id).select('id');
  if(error||!data?.length){
    await sb.from('skandi_sessions').update({
      completed_at:new Date().toISOString(),
      duration_sec:cancelledSession.duration_sec||cancelledElapsed||0,
      visibility:'private',
      report_note:'Cancelled locally'
    }).eq('id',sessionId).eq('user_id',state.user.id);
  }
  await loadAll();
  render();
}

// ¿La sesión terminó distinta de la rutina que la originó? Se compara a nivel de EJERCICIOS,
// no de series: hacer 2 series en vez de 3 es cómo salió el día, no un cambio de plan, y
// preguntarlo cada vez enseñaría a ignorar la pregunta.
function sessionTemplateDiff(){
  const session=state.active;
  if(!session?.template_id) return null;
  const tpl=state.templates.find(x=>x.id===session.template_id);
  if(!tpl||tpl.user_id!==state.user.id) return null;   // la rutina de alguien más no se toca
  const planned=state.items.filter(i=>i.template_id===tpl.id).map(i=>i.exercise_id);
  const done=state.activeItems.map(i=>i.exercise_id);
  const count=list=>list.reduce((m,id)=>m.set(id,(m.get(id)||0)+1),new Map());
  const pc=count(planned), dc=count(done);
  const nameOf=id=>state.exercises.find(e=>e.id===id)?.name||t('common.exercise');
  const added=[],removed=[];
  new Set([...pc.keys(),...dc.keys()]).forEach(id=>{
    const delta=(dc.get(id)||0)-(pc.get(id)||0);
    for(let i=0;i<Math.abs(delta);i++) (delta>0?added:removed).push(nameOf(id));
  });
  if(!added.length&&!removed.length) return null;
  return {tpl,added,removed};
}

// Las series objetivo salen de cuántas quedaron en cada hueco, y reps/descanso/RIR de la
// primera serie de ese hueco, que es la que llevaba el objetivo original. Compartida por
// saveSessionIntoTemplate (reescribir una rutina existente) y finishWorkout (crear una rutina
// nueva desde un entrenamiento libre) — el mapeo de "lo que se entrenó" a "filas de
// skandi_template_items" es el mismo en los dos casos, solo cambia el destino.
function templateItemsFromActiveItems(){
  return state.activeItems.map((item,idx)=>{
    const seed=item.sets.find(x=>x.set_idx===1)||item.sets[0]||{};
    return {
      exercise_id:item.exercise_id,
      sort_order:idx,
      target_sets:Math.max(1,Math.min(12,item.sets.length)),
      target_reps:seed.target_reps||item.target_reps||'8-12',
      target_rest_sec:seed.target_rest_sec??item.target_rest_sec??90,
      target_rir:seed.target_rir??item.target_rir??null
    };
  });
}

// Guardar los cambios reescribe la rutina con lo que de verdad se entrenó.
async function saveSessionIntoTemplate(templateId){
  const items=templateItemsFromActiveItems();
  if(!items.length) return;
  // El RPC de la migración 052: borrar e insertar en una sola transacción, para que un fallo
  // a la mitad no deje la rutina sin ejercicios.
  const {error}=await sb.rpc('save_template_items',{p_template_id:templateId,p_items:items});
  if(error) await alertSheet(error.message);
}

// Un entrenamiento libre (sin template_id) no tiene con qué comparar sessionTemplateDiff(), así
// que en vez de "guardar cambios" ofrece crear una rutina nueva desde cero con lo que se
// entrenó — mismo mapeo (templateItemsFromActiveItems), mismo RPC, solo que primero inserta la
// fila de skandi_templates en vez de reescribir una que ya existía.
async function saveActiveWorkoutAsNewTemplate(name){
  const items=templateItemsFromActiveItems();
  if(!items.length) return;
  const {data:tpl,error:tplError}=await sb.from('skandi_templates')
    .insert({user_id:state.user.id,name,notes:null,is_public:true,weekday:null}).select().single();
  if(tplError){ await alertSheet(tplError.message); return; }
  const {error}=await sb.rpc('save_template_items',{p_template_id:tpl.id,p_items:items});
  if(error) await alertSheet(error.message);
}

async function finishWorkout(){
  const sleepRaw=$('sleepHours').value.trim();
  const sleepHours=sleepRaw===''?null:Number(sleepRaw);
  if(sleepHours!==null&&(!Number.isFinite(sleepHours)||sleepHours<0||sleepHours>24)) return alertSheet(t('report.errSleep'));
  const minutes=Number($('repDuration').value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>600) return alertSheet(t('sedit.errDuration'));
  const newRoutineName=$('saveAsRoutine')?.checked?($('newRoutineName')?.value||'').trim():'';
  if($('saveAsRoutine')?.checked&&!newRoutineName) return alertSheet(t('report.errRoutineName'));
  const durationSec=Math.round(minutes*60);
  // A workout nobody remembered to finish gets closed out hours later, so "now" is the wrong
  // completion time: once the duration is corrected, the session ended when it ended
  // (started_at + duration). Capped at now so a padded duration can't land in the future.
  const completedAt=new Date(Math.min(Date.now(),new Date(state.active.started_at).getTime()+durationSec*1000));
  const patch={
    completed_at:completedAt.toISOString(),
    duration_sec:durationSec,
    report_difficulty:$('difficulty').value,
    report_energy:Number($('energy').value),
    report_sleep_hours:sleepHours===null?null:Math.round(sleepHours*10)/10,
    report_felt_worse:$('feltWorse').checked,
    report_soreness:$('sore').checked,
    report_soreness_area:$('soreArea').value.trim()||null,
    report_note:$('note').value.trim()||null,
    visibility:$('shareCrew').checked?'crew':'private'
  };
  const {error}=await sb.from('skandi_sessions').update(patch).eq('id',state.active.id);
  if(error) return alertSheet(error.message);
  // La casilla nace apagada: conservar la rutina como estaba es lo reversible, y sobrescribirla
  // sin querer significa perder el plan original sin manera de recuperarlo.
  const keepTemplateId=$('keepChanges')?.checked?$('diffTemplateId')?.value:'';
  if(keepTemplateId) await saveSessionIntoTemplate(keepTemplateId);
  if(newRoutineName) await saveActiveWorkoutAsNewTemplate(newRoutineName);
  // El calendario se concilia solo: la sesión que acaba de cerrarse busca su fila planeada
  // del día y la marca hecha. Si no había ninguna, la sesión aparece como extra en vez de
  // perderse — entrenar algo no planeado no es un error que haya que capturar.
  await reconcilePlanned({day:dayKey(completedAt),discipline:'strength',sessionId:state.active.id});
  pauseWorkoutTimer();
  state.active=null;
  state.activeItems=[];
  closeModal();
  await loadAll();
  setView('crew');
}

// For a progression exercise (front lever, back lever, planche, handstand), pulls the user's
// own completed sessions and shows, per session, which variant of the line they trained and
// their best mark that day (hold seconds or reps, plus load if any) — the trend a fixed
// routine slot can't show on its own since the exercise trained keeps changing underneath it.
// Tiny inline trend line (the "evolución últimos N registros" pattern) for a progression
// line's best mark per session, oldest to newest left-to-right.
function sparklineSvg(values){
  if(values.length<2) return '';
  const w=240,h=36,pad=4;
  const min=Math.min(...values),max=Math.max(...values);
  const span=max-min||1;
  const pts=values.map((v,i)=>{
    const x=pad+(i/(values.length-1))*(w-pad*2);
    const y=h-pad-((v-min)/span)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const [lastX,lastY]=pts[pts.length-1].split(',');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;margin-top:6px">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="3" fill="var(--blue)"/>
  </svg>`;
}

function progressionHistoryHtml(exercise){
  if(!exercise?.progression_group) return '';
  const ids=new Set(progressionSiblings(exercise.progression_group).map(e=>e.id));
  const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  const rows=[];
  for(const session of sessions){
    const byExercise=new Map();
    state.sets.filter(s=>s.session_id===session.id&&ids.has(s.exercise_id)&&(s.seconds!=null||s.reps!=null))
      .forEach(s=>{ if(!byExercise.has(s.exercise_id)) byExercise.set(s.exercise_id,[]); byExercise.get(s.exercise_id).push(s); });
    for(const [exId,exSets] of byExercise){
      const ex=state.exercises.find(x=>x.id===exId);
      if(!ex) continue;
      const best=ex.log_mode==='seconds'
        ?Math.max(...exSets.map(s=>s.seconds||0))
        :Math.max(...exSets.map(s=>s.reps||0));
      const weight=exSets.find(s=>s.weight_kg)?.weight_kg;
      rows.push({date:session.completed_at,name:ex.name,best,mode:ex.log_mode,weight});
    }
    if(rows.length>=12) break;
  }
  if(!rows.length) return '';
  const shown=rows.slice(0,12);
  // rows is newest-first (for the list below); the trend line reads left-to-right oldest-first.
  const trend=sparklineSvg(shown.slice().reverse().map(r=>r.best));
  return `<section class="card"><div class="eyebrow">${esc(t('prog.history'))}</div>
    ${trend?`<div>${trend}<p class="muted" style="margin-top:2px">${esc(t('prog.trend',{n:shown.length}))}</p></div>`:''}
    ${shown.map(r=>`
    <div class="row" style="margin-top:8px">
      <div><strong>${esc(r.name)}</strong><p class="muted">${new Date(r.date).toLocaleDateString(LANG)}</p></div>
      <span>${r.mode==='seconds'?fmtSec(r.best):esc(r.best+' '+t('common.reps'))}${r.weight?` · +${fmtWeightInput(r.weight)}${state.weightUnit}`:''}</span>
    </div>`).join('')}</section>`;
}
