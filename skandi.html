function togglePlannedRoutine(){
  const disc=$('planDiscipline').value;
  $('planRoutineWrap').style.display=disc==='strength'?'block':'none';
  $('planStructureWrap').style.display=(disc!=='strength'&&disc!=='rest')?'block':'none';
}

async function savePlanned(id){
  const day=$('planDay').value;
  const discipline=$('planDiscipline').value;
  let duration=$('planDuration').value?Number($('planDuration').value):null;
  let distance=$('planDistance').value?Number($('planDistance').value):null;
  if(duration!==null&&(!Number.isFinite(duration)||duration<1||duration>600)) return alert(t('logAct.errDuration'));
  // Un entrenamiento estructurado manda sobre los campos planos de duración/distancia: son el
  // total que el propio structure ya describe, y guardar los dos por separado es donde se
  // desincroniza uno de otro la próxima vez que se edite solo el otro.
  let structure=null;
  const structureText=$('planStructureWrap')?.style.display!=='none'?$('planStructure').value.trim():'';
  if(structureText){
    const parsed=SkandiPlan.parse(structureText);
    if(parsed.errors.length) return alert(parsed.errors.map(e=>`L${e.line}: ${e.message}`).join('\n'));
    if(parsed.steps.length){
      structure=parsed.steps;
      const totals=SkandiPlan.expand(structure,{discipline,zones:planZones()});
      duration=totals.duration_min||duration;
      distance=totals.distance_km||distance;
    }
  }
  const payload={
    day,discipline,
    template_id:discipline==='strength'?($('planTemplate').value||null):null,
    title:$('planTitle').value.trim()||null,
    structure,
    target_duration_min:duration,
    target_distance_km:distance,
    target_zone:$('planZone').value?Number($('planZone').value):null,
    notes:$('planNotes').value.trim()||null,
    is_edited:true
  };
  const isNew=!id;
  const {data,error}=id
    ? await sb.from('skandi_planned_sessions').update(payload).eq('id',id).select().single()
    : await sb.from('skandi_planned_sessions').insert({...payload,user_id:state.user.id,source:'manual',sort_order:discipline==='strength'?0:1}).select().single();
  if(!(await afterPlannedWrite(error))) return;
  if(isNew&&data){
    const others=plannedRows().filter(p=>p.day===day&&p.status==='planned'&&p.id!==data.id);
    if(others.length) return openReplaceOldSessionsConfirm(day,others);
  }
  openPlannedDay(day);
}

// Guardar una sesión nueva el mismo día que ya tenía otra activa suele ser un reemplazo (cambio
// de programa, semana de descarga), no un plan de dos sesiones. Preguntar aquí evita que la
// vieja se quede marcada "Saltado" (tachada para siempre) en vez de "Quitar" -- el mismo
// problema que la migración 088 resolvió a nivel de datos, pero que la UI nunca preguntaba.
function openReplaceOldSessionsConfirm(day,others){
  const names=others.map(plannedTitle).join(', ');
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('cal.replaceTitle'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${esc(t('cal.replaceBody',{names}))}</p>
    <div class="stack" style="margin-top:14px">
      <button class="btn primary" style="width:100%" onclick="replaceOldSessions('${day}')">${esc(t('cal.replaceYes'))}</button>
      <button class="btn" style="width:100%" onclick="openPlannedDay('${day}')">${esc(t('cal.replaceNo'))}</button>
    </div>`;
}

// No recibe los ids por el onclick (se escaparían mal con comillas anidadas): recalcula sobre
// `plannedRows()` y descarta la más reciente de las 'planned' de ese día -- es la que se acaba
// de crear, entre abrir este confirm y tocar el botón nada más pudo cambiar ese estado.
async function replaceOldSessions(day){
  const rows=plannedRows().filter(p=>p.day===day&&p.status==='planned')
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const ids=rows.slice(1).map(p=>p.id);
  if(!ids.length) return openPlannedDay(day);
  const {error}=await sb.from('skandi_planned_sessions').update({status:'replaced',is_edited:true}).in('id',ids);
  if(await afterPlannedWrite(error)) openPlannedDay(day);
}

// ---- Rutinas (las plantillas, con nombre honesto) -----------------------------------------

// Antes eran dos cuadrículas de 7 filas apiladas (fuerza, luego resistencia) — 14 filas para
// ver una semana que en realidad es una sola. Un día puede tener las dos cosas (fuerza en la
// mañana, cardio en la tarde), así que ahora es una sola fila por día con ambas adentro, mismo
// glifo de disciplina que ya usa Calendario (DISC_GLYPH) para que se lea igual en las dos
// pestañas.
function combinedWeekCard(mine,myPlans){
  // El contador cuenta los DÍAS OCUPADOS, no el catálogo entero: una tarjeta que se llama "Tu
  // semana" diciendo "19 rutinas" arriba de una cuadrícula de 7 días contradice a la tarjeta
  // del programa ("6 rutinas · 6 días") que está dos centímetros más arriba.
  const plan=weekPlan();
  const scheduled=plan.filter(d=>d.template_id).length;
  const planned=plan.filter(d=>d.activity_template_id).length;
  // Puede haber hasta dos programas gobernando (fuerza + resistencia, 110) -- se anuncian los
  // nombres distintos, no solo "el" programa activo.
  const governing=[activeProgramForKind('template'),activeProgramForKind('activity')]
    .filter((p,i,arr)=>p&&p.start_date&&arr.findIndex(x=>x?.id===p.id)===i);
  const governingNames=governing.map(p=>p.name).join(' + ');
  return `<section class="card">
    <div class="row"><h2>${esc(t('train.yourWeek'))}</h2><span class="muted">${[`${scheduled} ${tp(scheduled,'common.routines')}`,planned?t('train.enduranceCount',{n:planned}):null].filter(Boolean).map(esc).join(' · ')}</span></div>
    ${governingNames?`<p class="form-note" style="margin:0 0 10px">${esc(t('train.weekFromProgram',{name:governingNames}))}</p>`:''}
    <div class="week">
      ${DOW.map((d,i)=>{
        const tpl=templateOfDay(i);
        const plan=activityOfDay(i);
        const strengthLine=tpl
          ?`<span class="week-item" onclick="event.stopPropagation();openWorkoutOverview('${tpl.id}')"><i class="glyph">${DISC_GLYPH.strength}</i>${esc(tpl.name)}</span>`
          :`<button type="button" class="week-item add" onclick="event.stopPropagation();openDayPicker(${i})">+ ${esc(t('train.addRoutineDay'))}</button>`;
        const planDisc=plan?(ACT_TO_DISC[plan.activity_type]||'other'):null;
        const planSummary=plan?[activityTypeLabel(plan.activity_type),plan.target_distance_km?`${plan.target_distance_km}km`:null].filter(Boolean).join(' · '):'';
        const enduranceLine=plan
          ?`<span class="week-item" onclick="event.stopPropagation();openActivityTemplateBuilder(${i},'${plan.id}')"><i class="glyph">${DISC_GLYPH[planDisc]||'◇'}</i>${esc(planSummary)}</span>`
          :tpl?''
          :`<button type="button" class="week-item add" onclick="event.stopPropagation();openActivityTemplateBuilder(${i})">+ ${esc(t('train.addPlan'))}</button>`;
        return `<div class="day ${i===todayDow()?'today':''}" style="grid-template-columns:64px 1fr auto;cursor:default">
          <span>${d}</span>
          <span class="week-lines">${strengthLine}${enduranceLine}</span>
          <button class="icon-btn tiny" onclick="${tpl?`openDayManage('${tpl.id}',${i})`:`openDayPicker(${i})`}" aria-label="${esc(t('train.manageDay',{day:d}))}">${icon('ellipsis',16)}</button>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

// Tres bloques que son las tres capas, de arriba abajo: el programa (el plan), tu semana (lo
// que toca) y las rutinas (las piezas). Las rutinas van separadas entre las que ocupan un día y
// las que solo están guardadas — una lista plana de 19 tarjetas no deja ver cuáles entrenas.
function routinesTab(){
  const mine=state.templates.filter(x=>x.user_id===state.user.id);
  const community=state.templates.filter(x=>x.user_id!==state.user.id);
  const myPlans=state.activityTemplates.filter(x=>x.user_id===state.user.id);
  const scheduled=mine.filter(x=>dayOfTemplate(x.id)!=null).sort((a,b)=>dayOfTemplate(a.id)-dayOfTemplate(b.id));
  const loose=mine.filter(x=>dayOfTemplate(x.id)==null);
  return `
    ${programCardHtml()}
    ${combinedWeekCard(mine,myPlans)}
    <div class="row"><h2>${esc(t('train.myRoutines'))}</h2><button class="btn small" onclick="openTemplateBuilder()">${esc(t('train.newRoutine'))}</button></div>
    ${mine.length?`
      <div class="eyebrow" style="margin:2px 0 8px">${esc(t('train.inYourWeek',{n:scheduled.length}))}</div>
      ${scheduled.map(x=>workoutCard(x)).join('')||empty(t('train.noneInWeek'))}

function crewMembers(){
  const members=new Map();
  const upsert=(userId,profile)=>{
    if(!members.has(userId)) members.set(userId,{user_id:userId,name:profile?.name||t('common.crewMember'),avatar:profile?.avatar_url||null,workouts:0,minutes:0,lastAt:null});
    const member=members.get(userId);
    if(profile?.name) member.name=profile.name;
    if(profile?.avatar_url) member.avatar=profile.avatar_url;
    return member;
  };
  upsert(state.user.id,state.profile);
  // My own private sessions count for me (it's my data either way); for everyone else only
  // what they chose to share is visible at all.
  state.sessions.filter(s=>s.completed_at&&(s.visibility==='crew'||s.user_id===state.user.id)).forEach(s=>{
    const member=upsert(s.user_id,s.profile);
    member.workouts++;
    member.minutes+=Math.round((s.duration_sec||0)/60);
    if(!member.lastAt||new Date(s.completed_at)>new Date(member.lastAt)) member.lastAt=s.completed_at;
  });
  return [...members.values()].sort((a,b)=>(b.lastAt?new Date(b.lastAt).getTime():0)-(a.lastAt?new Date(a.lastAt).getTime():0));

// ---- Progress > Exercises: one chart per exercise you actually train ----------------------

// How this exercise is scored, matching leaderboard()'s rule: hold time for timed holds, load
// for anything tracking weight, reps for pure bodyweight work.
function exerciseTrackingMode(ex){
  return ex.log_mode==='seconds'?'seconds':(ex.log_weight!==false?'weight':'reps');
}

function formatMark(mode,value){
  if(mode==='seconds') return fmtSec(value);
  if(mode==='weight') return `${fmtWeightInput(value)} ${state.weightUnit}`;
  return `${value} ${t('common.reps')}`;
}

// Best mark + total volume per completed session for one exercise, oldest first so the chart
// reads left to right. Only done sets count -- an unchecked set is a plan, not a result.
// quality (avgQuality of the session's sets) rides along for track_quality exercises: the mark
// alone can't tell a clean 8s hold from a sloppy one, and on a skill line that's the difference
// between real progress and the same fault getting logged for longer each week.
function exerciseProgressSeries(exerciseId){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex) return [];
  const mode=exerciseTrackingMode(ex);
  const out=[];
  for(const session of myCompletedSessions()){
    const sets=state.sets.filter(x=>x.session_id===session.id&&x.exercise_id===exerciseId&&x.done);
    if(!sets.length) continue;
    const best=mode==='seconds'?Math.max(...sets.map(x=>Number(x.seconds)||0))
      :mode==='weight'?Math.max(...sets.map(x=>Number(x.weight_kg)||0))
      :Math.max(...sets.map(x=>Number(x.reps)||0));
    out.push({
      sessionId:session.id,title:session.title,date:session.completed_at,mode,best,
      volume:sets.reduce((a,x)=>a+(Number(x.weight_kg)||0)*(Number(x.reps)||0),0),
      sets:sets.length,
      quality:ex.track_quality?avgQuality(sets):null
    });
  }
  return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function trainedExercises(){
  const byExercise=new Map();
  state.sets.filter(x=>x.user_id===state.user.id&&x.done).forEach(x=>{
    const session=state.sessions.find(s=>s.id===x.session_id);
    if(!session?.completed_at) return;
    const current=byExercise.get(x.exercise_id);
    if(!current||new Date(session.completed_at)>new Date(current.lastAt)) byExercise.set(x.exercise_id,{exercise_id:x.exercise_id,lastAt:session.completed_at});
  });
  return [...byExercise.values()]
    .map(row=>({...row,exercise:state.exercises.find(e=>e.id===row.exercise_id)}))
    .filter(row=>row.exercise)
    .sort((a,b)=>new Date(b.lastAt)-new Date(a.lastAt));
}

// Full-width line chart: the readable sibling of sparklineSvg. Value labels live in HTML under
// the chart (see chartLegendHtml) rather than as SVG text, so they stay crisp at any width.
function progressChartSvg(values){
  if(values.length<2) return '';
  const w=320,h=150,padX=8,padT=14,padB=12;
  const min=Math.min(...values),max=Math.max(...values);
  const span=(max-min)||Math.abs(max)||1;
  const x=i=>padX+(i/(values.length-1))*(w-padX*2);
  const y=v=>padT+(1-(v-min)/span)*(h-padT-padB);
  const line=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">
    <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245f9f" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#245f9f" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${padX}" y1="${h-padB}" x2="${w-padX}" y2="${h-padB}" stroke="#d7e1ea" stroke-width="1"/>
    <polygon points="${padX},${h-padB} ${line} ${w-padX},${h-padB}" fill="url(#chartFill)"/>
    <polyline points="${line}" fill="none" stroke="#245f9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===values.length-1?4:2.4}" fill="${i===values.length-1?'#012456':'#245f9f'}"/>`).join('')}
  </svg>`;
}

function openExerciseProgress(exerciseId,fromWorkout=false){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex) return;
  const backToWorkout=fromWorkout&&!!state.active;
  const closeAction=backToWorkout?'openActiveWorkout()':'closeModal()';
  const series=exerciseProgressSeries(exerciseId);
  const mode=exerciseTrackingMode(ex);
  // Volume (load x reps) only means something where load is tracked; for holds and bodyweight
  // reps the toggle is hidden rather than charting a column of zeros.
  const canVolume=mode==='weight'&&series.some(p=>p.volume>0);
  const metric=canVolume&&state.progressMetric==='volume'?'volume':'best';
  const values=series.map(p=>metric==='volume'?p.volume:p.best);
  const label=v=>metric==='volume'?`${fmtWeightInput(v)} ${state.weightUnit}`:formatMark(mode,v);
  // The mark alone can't tell a clean hold from one that broke form halfway through — a quality
  // trend rides alongside it for anything that tracks quality, so "longer" and "cleaner" don't
  // get confused for the same kind of progress.
  const qualityPoints=series.filter(p=>p.quality!=null);
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(ex.name)}</h1><button class="x" onclick="${closeAction}" aria-label="${esc(backToWorkout?t('exd.backToWorkout'):t('common.close'))}" title="${esc(backToWorkout?t('exd.backToWorkout'):t('common.close'))}">${icon(backToWorkout?'minimize':'close',20)}</button></div>
    ${canVolume?`<div class="seg sub" style="margin-top:12px">
      <button class="${metric==='best'?'active':''}" onclick="state.progressMetric='best';openExerciseProgress('${exerciseId}')">${esc(t('chart.best'))}</button>
      <button class="${metric==='volume'?'active':''}" onclick="state.progressMetric='volume';openExerciseProgress('${exerciseId}')">${esc(t('chart.volume'))}</button>
    </div>`:''}
    <section class="card">
      ${values.length>1?`${progressChartSvg(values)}
      <div class="chart-legend">
        <span>${esc(new Date(series[0].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
        <span>${esc(label(Math.min(...values)))} → ${esc(label(Math.max(...values)))}</span>
        <span>${esc(new Date(series[series.length-1].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
      </div>`:empty(t('chart.noData'))}
    </section>
    ${qualityPoints.length>1?`<section class="card">
      <div class="eyebrow">${esc(t('chart.quality'))}</div>
      ${sparklineSvg(qualityPoints.map(p=>p.quality))}
      <div class="chart-legend" style="margin-top:2px">
        <span>${esc(new Date(qualityPoints[0].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
        <span>${esc(t('ex.qualityAvg',{v:qualityPoints[0].quality}))} → ${esc(t('ex.qualityAvg',{v:qualityPoints[qualityPoints.length-1].quality}))}</span>
        <span>${esc(new Date(qualityPoints[qualityPoints.length-1].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
      </div>
    </section>`:''}
    <section class="card">
      <div class="eyebrow">${esc(t('chart.perSession'))}</div>
      ${series.slice().reverse().map(p=>`<div class="row click-card" style="margin-top:10px" onclick="openSessionDetail('${p.sessionId}')">
        <div style="min-width:0"><strong>${esc(formatMark(p.mode,p.best))}</strong><p class="muted">${esc(new Date(p.date).toLocaleDateString(LANG,{weekday:'short',day:'numeric',month:'short'}))} · ${p.sets} ${esc(tp(p.sets,'common.setsLogged'))}${p.quality!=null?' · '+esc(t('ex.qualityAvg',{v:p.quality})):''}</p></div>
        ${p.volume>0?`<span class="pill dark">${esc(t('chart.volumeUnit',{v:fmtWeightInput(p.volume),unit:state.weightUnit}))}</span>`:''}
      </div>`).join('')||empty(t('chart.noData'))}
    </section>
    <button class="btn" style="width:100%" onclick="openExercise('${exerciseId}',${fromWorkout})">${icon('chevronRight',16)} ${esc(t('chart.openExercise'))}</button>`;
}

function setHistoryFilter(key,value){
  state.historyFilter={...state.historyFilter,[key]:value};
  render();
}

// Local month, not UTC: a workout finished at 8pm on the last day of the month is UTC-next-day
// in Mazatlan (UTC-7), and toISOString() would file it under the wrong month in the filter.
const monthKey=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const monthLabel=key=>{
  const d=new Date(`${key}-01T12:00:00`);
  const label=d.toLocaleDateString(LANG,{month:'long',year:'numeric'});
  return label.charAt(0).toUpperCase()+label.slice(1);
};

function progressHistoryTab(){
  const sessions=myCompletedSessions();
  const filter=state.historyFilter||{month:'all',title:'all'};
  const months=[...new Set(sessions.map(s=>monthKey(s.completed_at)))];
  const titles=[...new Set(sessions.map(s=>s.title))].sort((a,b)=>a.localeCompare(b));
  const filtered=sessions.filter(s=>
    (filter.month==='all'||monthKey(s.completed_at)===filter.month)&&
    (filter.title==='all'||s.title===filter.title));
  const minutes=Math.round(filtered.reduce((a,s)=>a+(s.duration_sec||0),0)/60);
  return `
    <div class="filters">
      <select class="field left" onchange="setHistoryFilter('month',this.value)">
        <option value="all">${esc(t('progress.allMonths'))}</option>
        ${months.map(m=>`<option value="${m}" ${filter.month===m?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
      </select>
      <select class="field left" onchange="setHistoryFilter('title',this.value)">
        <option value="all">${esc(t('progress.allRoutines'))}</option>
        ${titles.map(x=>`<option value="${esc(x)}" ${filter.title===x?'selected':''}>${esc(x)}</option>`).join('')}
      </select>
    </div>
    <p class="muted">${esc(t('progress.resultsN',{n:filtered.length,min:minutes}))}</p>
    ${filtered.map(historyRowHtml).join('')||empty(sessions.length?t('progress.noResults'):t('progress.historyEmpty'))}`;
}

function muscleGroupOf(e){
  const muscles=Object.entries(e.muscles||{}).sort((a,b)=>b[1]-a[1]);
  if(!muscles.length) return 'Other';
  return MUSCLE_GROUP_MAP[muscles[0][0]]||'Other';
}

function groupExercisesByMuscle(list){
  const groups=new Map();
  list.forEach(e=>{
    const g=muscleGroupOf(e);
    if(!groups.has(g)) groups.set(g,[]);
    groups.get(g).push(e);
  });
  return MUSCLE_GROUP_ORDER
    .filter(g=>groups.has(g))
    .map(g=>[g,groups.get(g).sort((a,b)=>a.name.localeCompare(b.name))]);
}

function isVideoUrl(url){
  return /\.(mp4|mov|webm|m4v)(\?|#|$)/i.test(url||'');
}

function mediaThumb(e,cls='thumb'){
  const fallback=thumbInitial(e);
  if(e.media_url){
    const esc_fb=fallback.replace(/"/g,'&quot;');
    if(isVideoUrl(e.media_url)) return `<div class="${cls}"><video src="${esc(e.media_url)}" muted playsinline preload="metadata" onerror="this.parentElement.innerHTML='${esc_fb}'"></video></div>`;
    return `<div class="${cls}"><img src="${esc(e.media_url)}" alt="${esc(e.name)}" loading="lazy" onerror="this.parentElement.innerHTML='${esc_fb}'"></div>`;
  }
  return `<div class="${cls}">${fallback}</div>`;
}

function openSessionDetail(sessionId,plannedId){
  const s=state.sessions.find(x=>x.id===sessionId);
  if(!s) return plannedId?openPlannedItemMenu(plannedId):closeModal();
  const p=plannedId?plannedRows().find(x=>x.id===plannedId):null;
  const sets=state.sets.filter(x=>x.session_id===sessionId).sort((a,b)=>a.set_idx-b.set_idx);
  const byExercise=new Map();
  sets.forEach(x=>{
    // x.exercise (the join used to load sets) only carries name/slug — look the full row up
    // in state.exercises for log_mode, same as leaderboard(), so seconds-based holds render
    // their clean/broken tag here instead of a meaningless "weight × reps".
    if(!byExercise.has(x.exercise_id)) byExercise.set(x.exercise_id,{name:x.exercise?.name||t('common.exercise'),seconds:state.exercises.find(e=>e.id===x.exercise_id)?.log_mode==='seconds',sets:[]});
    byExercise.get(x.exercise_id).sets.push(x);
  });
  const mine=s.user_id===state.user.id;
  const when=new Date(s.completed_at||s.started_at);
  // La "carga de esta semana" es la misma lectura que Progreso/Inicio (mismo `readout()`,
  // mismo día de referencia: hoy) — no la carga que había el día de esta sesión. Es la respuesta
  // a "¿cómo sigo?", no una foto histórica, y solo tiene sentido para el dueño de la sesión.
  let loadText=null;
  if(mine){
    const refs={maxHeartRate:state.skandiSettings?.max_heart_rate||null,hrZones:state.skandiSettings?.hr_zone_bounds||null};
    const series=SkandiLoad.dailySeries({sessions:state.sessions,sets:state.sets,activities:state.externalActivities,userId:state.user.id,refs,days:SkandiLoad.CHRONIC_DAYS*2});
    const load=SkandiLoad.readout({series,isDeloadWeek:!!trainingBlockWeekInfo()?.deload});
    loadText=t(load.key,{pct:Math.abs(load.dropPct??0),up:load.ratio?Math.round((load.ratio-1)*100):0,ratio:load.ratio?load.ratio.toFixed(2):'—',weeks:load.weeksLogged});
  }
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row">
      <div><p class="muted">${when.toLocaleDateString(LANG,{weekday:'long',month:'short',day:'numeric'})}${mine?'':' · '+esc(t('common.byName',{name:s.profile?.name||t('common.crewMember')}))}</p><h1>${esc(s.title)}</h1></div>
      <div class="row" style="gap:8px;flex:0 0 auto">
        ${p?`<button class="icon-btn tiny" onclick="openPlannedItemMenu('${p.id}')" aria-label="${esc(t('activity.options'))}">${icon('ellipsis',16)}</button>`:''}
        <button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button>
      </div>
    </div>
    ${p?.notes?`<p class="form-note">${esc(t('session.focus'))}: ${esc(p.notes)}</p>`:''}
    <section class="grid">
      <div class="stat"><strong>${Math.round((s.duration_sec||0)/60)}</strong><small>${esc(t('session.minutes'))}${s.duration_source==='garmin'?' · '+esc(t('garmin.durationSource')):''}</small></div>
      <div class="stat"><strong>${sets.filter(x=>x.done).length}</strong><small>${esc(tp(sets.filter(x=>x.done).length,'common.setsLogged'))}</small></div>
    </section>

// A finished workout is still editable: the timer only knows when you tapped finish, so a

let savingSessionEdit=false;
async function saveSessionEdit(sessionId){
  if(savingSessionEdit) return;
  const s=state.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const title=$('seTitle').value.trim();
  if(!title) return alert(t('sedit.errName'));
  const minutes=Number($('seDuration').value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>600) return alert(t('sedit.errDuration'));
  const [year,month,day]=($('seDate').value||'').split('-').map(Number);
  if(!year||!month||!day) return alert(t('sedit.errDate'));
  const durationSec=Math.round(minutes*60);
  // Keep the clock time the workout was finished at and move only the calendar date, then let
  // started_at follow the corrected duration -- the pair has to stay consistent, since the
  // active-workout recovery and every "minutes trained" total read from it.
  const completedAt=new Date(s.completed_at||s.started_at);
  completedAt.setFullYear(year,month-1,day);
  savingSessionEdit=true;
  const btn=document.querySelector('#modalCard button.primary');
  if(btn){btn.disabled=true;btn.textContent=t('common.saving');}
  try{
    const {error}=await sb.from('skandi_sessions').update({
      title,
      completed_at:completedAt.toISOString(),
      started_at:new Date(completedAt.getTime()-durationSec*1000).toISOString(),
      duration_sec:durationSec,
      duration_source:'manual',
      report_difficulty:$('seDifficulty').value,
      report_energy:Number($('seEnergy').value),
      report_soreness:$('seSore').checked,
      report_soreness_area:$('seSoreArea').value.trim()||null,
      report_note:$('seNote').value.trim()||null,
      visibility:$('seShare').checked?'crew':'private'
    }).eq('id',sessionId).eq('user_id',state.user.id);
    if(error) return alert(error.message);
    closeModal();
    await loadAll();
    render();
  } finally {
    savingSessionEdit=false;
    if(btn){btn.disabled=false;btn.textContent=t('sedit.save');}
  }
}

async function deleteSession(sessionId){
  if(!confirm(t('session.confirmDelete'))) return;
  const {error}=await sb.from('skandi_sessions').delete().eq('id',sessionId).eq('user_id',state.user.id);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

// Execution quality, 1-10 (migration 078). The old tri-state hold_clean (065) is still the
// only rating the sets logged before it exists have, so it is read as a fallback rather than
// rewritten in the DB: a hold tagged clean becomes an 8 (the bar for "counts toward levelling
// up"), a broken one a 4. Anything never rated stays null — that is not the same as bad.
const QUALITY_CLEAN=8;   // at or above this a set counts toward the next progression rank
const QUALITY_BROKEN=6;  // below this a set can't set a personal best, however long it ran
function setQuality(s){
  if(s?.form_quality!=null) return s.form_quality;
  if(s?.hold_clean===true) return 8;
  if(s?.hold_clean===false) return 4;
  return null;
}
function qualityClass(q){ return q==null?'':(q>=QUALITY_CLEAN?'q-good':(q>=QUALITY_BROKEN?'q-mid':'q-bad')); }
function avgQuality(sets){
  const vals=sets.map(setQuality).filter(v=>v!=null);
  return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
}

function leaderboard(){
  const profiles=new Map(state.sessions.map(s=>[s.user_id,s.profile?.name||t('common.crewMember')]));
  const best=new Map();
  state.sets.filter(s=>s.done).forEach(s=>{
    // s.exercise (the join used to load sets) only carries name/slug — look the full row up in
    // state.exercises for log_mode/log_weight instead.
    const ex=state.exercises.find(e=>e.id===s.exercise_id);
    if(!ex) return;
    // Rank by hold time for timed holds, by load for anything still tracking weight, and by
    // reps for pure-bodyweight rep work — the old weight-only filter meant front lever, back
    // lever, planche, handstand and every other bodyweight/hold exercise could never post a PR
    // and silently never appeared on the leaderboard at all.
    const mode=ex.log_mode==='seconds'?'seconds':(ex.log_weight!==false?'weight':'reps');
    // A set rated below QUALITY_BROKEN doesn't get to set the PR, however long it ran —
    // "mejor hold limpio" per the training plan, now extended to every skill exercise that
    // tracks quality (a nordic curl that collapsed is no more of a record than a broken hold).
    // Unrated sets still count, so this doesn't silently erase every PR logged before rating
    // existed.
    const quality=setQuality(s);
    if(ex.track_quality&&quality!=null&&quality<QUALITY_BROKEN) return;
    const mark=mode==='seconds'?Number(s.seconds):(mode==='weight'?Number(s.weight_kg):Number(s.reps));
    if(!(mark>0)) return;
    const key=`${s.user_id}:${s.exercise_id}`;
    const current=best.get(key);
    if(!current||mark>current.mark) best.set(key,{
      user_id:s.user_id,name:profiles.get(s.user_id)||t('common.crewMember'),exercise:ex.name,mode,mark,reps:Number(s.reps)||0
    });
  });
  return [...best.values()].sort((a,b)=>b.mark-a.mark);
}
// Shared by Crew's "Recent PRs" and Progress's "Your bests" — the value/subtitle shown depends
// on how this exercise is tracked (weight, timed hold, or bodyweight reps). showName is off for
// "Your bests" since every row there is already the current user's.
function leaderRowHtml(x,showName=true){
  const value=x.mode==='seconds'?fmtSec(x.mark):x.mode==='weight'?t('leader.kg',{v:x.mark}):t('leader.reps',{v:x.mark});
  const detail=x.mode==='seconds'?t('leader.hold'):x.mode==='weight'?t('leader.reps',{v:x.reps||0}):t('leader.bestSet');
  const subtitle=showName?`${esc(x.name)} · ${detail}`:detail;
  return `<div class="leader"><div><strong>${esc(x.exercise)}</strong><p>${subtitle}</p></div><strong class="accent">${value}</strong></div>`;
}

// ---- Progression + injury automation (rule-based, no LLM: reads existing session/set data) ----

// Flags any progression line (front lever, planche, ...) where the user's CURRENT variant
// hasn't improved its best mark across the last 3 sessions it was trained — i.e. the same or
// a worse number 3 sessions running. That's a sign to deload, hold longer per rep, or just
// stay patient, and it's exactly the trend the per-exercise sparkline shows but nobody checks
// on their own every session.
function progressionStallWarnings(){
  const groups=[...new Set(state.exercises.filter(e=>e.progression_group).map(e=>e.progression_group))];
  const warnings=[];
  for(const group of groups){
    const currentId=state.progressionState.find(p=>p.progression_group===group)?.exercise_id;
    const exercise=currentId&&state.exercises.find(e=>e.id===currentId);
    if(!exercise) continue;
    const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
      .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
    const marks=[];
    const dates=[];
    for(const session of sessions){
      const sets=state.sets.filter(s=>s.session_id===session.id&&s.exercise_id===exercise.id&&(s.seconds!=null||s.reps!=null));
      if(!sets.length) continue;
      marks.push(exercise.log_mode==='seconds'?Math.max(...sets.map(s=>s.seconds||0)):Math.max(...sets.map(s=>s.reps||0)));
      dates.push(session.completed_at);
      if(marks.length>=3) break;
    }
    if(marks.length<3) continue;
    // marks/dates son newest-first: [latest, ..., oldest]. Sin ganancia neta en la ventana =
    // estancado. `dates` se guarda para poder cruzar la ventana con la comida de esos días
    // (stallDeficitContext) — el estancamiento en sí no necesita las fechas, la correlación sí.
    if(marks[0]<=marks[marks.length-1]){
      // Si la sesión más reciente de la ventana cayó en semana de descarga, no progresar ahí es
      // el punto, no una señal de estancamiento real — el aviso cambia de tono en vez de
      // desaparecer, porque si el estancamiento sigue en la semana normal siguiente sí importa.
      // Segunda condición (HOY): startAdHocDeload() marca la semana DESPUÉS de que el
      // estancamiento ya se veía — sus 3 sesiones son todas anteriores al bloque, así que nunca
      // van a caer "dentro" de él. Sin este OR, el botón confirma, inserta la fila, y el aviso se
      // queda exactamente igual: la promesa de "deja de contar como estancamiento" no se cumplía.
      const deloadLatest=!!trainingBlockWeekInfo(null,dates[0])?.deload||!!trainingBlockWeekInfo()?.deload;
      warnings.push({group,exercise,marks:marks.slice().reverse(),dates:dates.slice().reverse(),deloadLatest});
    }
  }
  return warnings;
}

// La correlación que docs/PROYECTO_SKANDI_V2.md (Fase 2/5) pedía y no existía: cruzar la
// ventana de un estancamiento contra lo que se comió esos mismos días. Un día por fecha del
// calendario, meta de ese día (con override si lo hay) contra lo realmente comido —
// SkandiNutrition.deficitContext() exige cobertura mínima antes de llamarlo "significativo", así
// que dos comidas registradas en nueve días no van a producir una nota.
function stallDeficitContext(stall){
  if(!state.nutritionTargets||!stall.dates||stall.dates.length<2) return null;
  const from=new Date(stall.dates[0]);from.setHours(0,0,0,0);
  const to=new Date(stall.dates[stall.dates.length-1]);to.setHours(0,0,0,0);
  const days=[];
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    const key=dayKey(d);
    days.push({actual:SkandiNutrition.dayTotals(mealsOfDay(key)).kcal||0,target:targetsForDay(key)?.kcal_target||null});
  }
  const ctx=SkandiNutrition.deficitContext(days);
  return ctx&&ctx.significant?ctx:null;
}

// Free-text soreness_area means this is normalized-string matching, not true zone taxonomy —
// still catches the common case (someone typing "elbow" or "shoulder" the same way each time)
// without needing a full body-zone picker in the report form.
function repeatedSorenessWarnings(){
  const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.report_soreness&&s.report_soreness_area)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime())
    .slice(0,8);
  const byArea=new Map();
  sessions.forEach(s=>{
    const key=s.report_soreness_area.trim().toLowerCase();
    if(!byArea.has(key)) byArea.set(key,[]);
    byArea.get(key).push(s);
  });
  return [...byArea.entries()].filter(([,list])=>list.length>=2)
    .map(([area,list])=>({area,count:list.length,latest:list[0].completed_at}))
    .sort((a,b)=>b.count-a.count);
}

function weeklyRecap(){
  const startOfWeek=new Date();
  startOfWeek.setHours(0,0,0,0);
  startOfWeek.setDate(startOfWeek.getDate()-todayDow());
  const lastWeekStart=new Date(startOfWeek);
  lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const own=s=>s.user_id===state.user.id&&s.completed_at;
  const thisWeek=state.sessions.filter(s=>own(s)&&new Date(s.completed_at).getTime()>=startOfWeek.getTime());
  const lastWeek=state.sessions.filter(s=>own(s)&&new Date(s.completed_at).getTime()>=lastWeekStart.getTime()&&new Date(s.completed_at).getTime()<startOfWeek.getTime());
  const avgEnergy=list=>{
    const vals=list.map(s=>s.report_energy).filter(v=>v!=null);
    return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
  };
  return {
    count:thisWeek.length,
    lastCount:lastWeek.length,
    minutes:Math.round(thisWeek.reduce((a,s)=>a+(s.duration_sec||0),0)/60),
    soreCount:thisWeek.filter(s=>s.report_soreness).length,
    avgEnergy:avgEnergy(thisWeek),
    lastAvgEnergy:avgEnergy(lastWeek),
    progressions:state.progressionState.map(p=>state.exercises.find(e=>e.id===p.exercise_id)).filter(Boolean)
  };
}

// Compact "needs attention" banner for Home — full detail (marks, history) lives in Progress.
// La carga solo llega a Inicio cuando hay algo que hacer con ella. Un cociente en rango no
// necesita anunciarse: enseñar un número que no pide ninguna acción es lo que convierte un
// aviso en decoración, y a la tercera semana nadie lo lee.
function loadWarning(){
  if(!state.sessions.length) return null;
  const refs={maxHeartRate:state.skandiSettings?.max_heart_rate||null,hrZones:state.skandiSettings?.hr_zone_bounds||null};
  const series=SkandiLoad.dailySeries({
    sessions:state.sessions, sets:state.sets, activities:state.externalActivities,
    userId:state.user.id, refs, days:SkandiLoad.CHRONIC_DAYS*2
  });
  const r=SkandiLoad.readout({series,isDeloadWeek:!!trainingBlockWeekInfo()?.deload});
  if(r.level!=='high'&&r.level!=='deloadWeak') return null;
  return t(r.key,{pct:Math.abs(r.dropPct??0),up:r.ratio?Math.round((r.ratio-1)*100):0,ratio:r.ratio?r.ratio.toFixed(2):'—',weeks:r.weeksLogged});
}

// Línea compartida entre el banner de Inicio y el tab de Progreso: el "por qué" del
// estancamiento, cuando la ventana de comida tiene con qué contestarlo.
function stallDeficitLine(w){
  const ctx=stallDeficitContext(w);
  return ctx?t('progress.stallDeficit',{days:ctx.daysTotal,deficit:ctx.avgDeficit}):'';
}

function attentionBannerHtml(){
  const stalls=progressionStallWarnings();
  const sore=repeatedSorenessWarnings();
  const load=loadWarning();
  if(!stalls.length&&!sore.length&&!load) return '';
  // One "es mi semana de descarga" button for the whole card, not one per stalled exercise —
  // it is a fact about the week, not about any single lift. Only offered while at least one
  // stall's own message hasn't already switched to the deload-aware copy.
  const showMarkDeload=stalls.some(w=>!w.deloadLatest);
  return `<section class="card click-card" style="border-color:rgba(212,72,84,.30);background:#fff7f7" onclick="setView('progress')">
    <div class="eyebrow" style="color:var(--pink)">${esc(t('progress.needsAttention'))}</div>
    ${load?`<p style="margin-top:8px">${esc(load)}</p>`:''}
    ${sore.map(w=>`<p style="margin-top:8px">${t('progress.soreWarn',{area:esc(w.area),n:w.count})}</p>`).join('')}
    ${stalls.map(w=>{
      const deficit=stallDeficitLine(w);
      const warnKey=w.deloadLatest?'progress.stallWarnDeload':'progress.stallWarn';
      return `<p style="margin-top:8px">${t(warnKey,{name:esc(w.exercise.name),marks:esc(w.marks.map(m=>w.exercise.log_mode==='seconds'?fmtSec(m):m+' '+t('common.reps')).join(' → '))})}${deficit?' '+esc(deficit):''}</p>`;
    }).join('')}
    ${showMarkDeload?`<button class="btn small ghost" style="margin-top:8px" onclick="event.stopPropagation();startAdHocDeload()">${esc(t('progress.markDeload'))}</button>`:''}
  </section>`;
}

function weeklyRecapCard(){
  const r=weeklyRecap();
  const energyTrend=r.avgEnergy==null||r.lastAvgEnergy==null?null:r.avgEnergy-r.lastAvgEnergy;
  return `<section class="card">
    <div class="eyebrow">${esc(t('recap.thisWeek'))}</div>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><strong>${r.count}</strong><small>${esc(tp(r.count,'common.workouts'))}${r.lastCount?' '+esc(t('recap.lastWeek',{n:r.lastCount})):''}</small></div>
      <div class="stat"><strong>${r.minutes}</strong><small>${esc(t('progress.minutesTrained'))}</small></div>
    </div>
    ${r.avgEnergy!=null?`<p style="margin-top:10px">${esc(t('recap.avgEnergy',{v:r.avgEnergy}))}${esc(energyTrend!=null?(energyTrend>0?t('recap.energyUp',{v:r.lastAvgEnergy}):energyTrend<0?t('recap.energyDown',{v:r.lastAvgEnergy}):''):'')}.</p>`:''}
    ${r.soreCount?`<p style="margin-top:6px;color:var(--pink)">${esc(t('recap.soreness',{n:r.soreCount,unit:tp(r.soreCount,'common.sessions')}))}</p>`:''}
    ${r.progressions.length?`<div class="skill-chips">${r.progressions.map(skillChipHtml).join('')}</div>`:''}
  </section>`;
}

// Una línea de skill en una píldora: nombre, nivel y cuánto lleva dentro del rango actual.
// El nivel no se guarda en ninguna columna — es rango + fracción del objetivo, derivado — así
// que la barra es exactamente esa parte fraccionaria, sin inventar una escala aparte.
function skillChipHtml(e){
  const series=e.progression_group?skillLevelSeries(e.progression_group):[];
  const level=series.length?series[series.length-1].level:null;
  const pct=level==null?0:Math.round((level-Math.floor(level))*100);
  return `<button type="button" class="skill-chip" onclick="openExercise('${e.id}')">
    <b>${esc(e.name)}</b>
    ${level==null?'':`<em>${level.toFixed(1)}</em>`}
    <i style="width:${pct}%"></i>
  </button>`;
}

// ---- Cross-training analysis: strength/skill vs running/bike/swim, per week ----
// The training plan's whole "de donde vienes / a donde vas" structure assumes endurance and
// strength work interact — this surfaces that interaction from data instead of leaving it to
// memory. Monday-start weeks, matching todayDow()'s convention elsewhere.

function weekStart(date){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  const dow=d.getDay()===0?6:d.getDay()-1;
  d.setDate(d.getDate()-dow);
  return d;
}

function crossTrainingWeeks(numWeeks=6){
  const mySessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at);
  const myActivities=state.externalActivities||[];
  const weeks=new Map();
  const ensure=key=>{
    if(!weeks.has(key)) weeks.set(key,{week:key,strengthSessions:0,setsDone:0,rirSamples:[],qualitySamples:[],enduranceMin:0,enduranceSessions:0,feltWorse:0});
    return weeks.get(key);
  };
  mySessions.forEach(s=>{
    const w=ensure(weekStart(s.completed_at).toISOString().slice(0,10));
    w.strengthSessions++;
    if(s.report_felt_worse) w.feltWorse++;
    state.sets.filter(x=>x.session_id===s.id&&x.done).forEach(x=>{
      w.setsDone++;
      if(x.rir!=null) w.rirSamples.push(x.rir);
      const q=setQuality(x);
      if(q!=null) w.qualitySamples.push(q);
    });
  });
  myActivities.forEach(a=>{
    const w=ensure(weekStart(a.performed_at).toISOString().slice(0,10));
    w.enduranceMin+=a.duration_min;
    w.enduranceSessions++;
  });
  return [...weeks.values()].sort((a,b)=>b.week.localeCompare(a.week)).slice(0,numWeeks).map(w=>({
    ...w,
    avgRir:w.rirSamples.length?Math.round((w.rirSamples.reduce((a,b)=>a+b,0)/w.rirSamples.length)*10)/10:null,
    avgQuality:w.qualitySamples.length?Math.round((w.qualitySamples.reduce((a,b)=>a+b,0)/w.qualitySamples.length)*10)/10:null
  }));
}

// How often a "felt worse than usual" report follows a hard (RPE >= 7) endurance session in
// the prior 36h — a rough, transparent version of the interference the plan's day-ordering
// (Z2 the day after piernas, calidad separated 6-8h from Front Lever) is designed to avoid.
function feltWorseAfterEndurance(){
  const flagged=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.report_felt_worse);
  if(!flagged.length) return null;
  const activities=state.externalActivities||[];
  const linked=flagged.filter(s=>{
    const t=new Date(s.completed_at).getTime();
    return activities.some(a=>{
      const hoursBefore=(t-new Date(a.performed_at).getTime())/3600000;
      return hoursBefore>0&&hoursBefore<=36&&a.intensity>=7;
    });
  }).length;
  return {total:flagged.length,linked};
}

function crossTrainingCardHtml(){
  const weeks=crossTrainingWeeks(6);
  if(!weeks.some(w=>w.strengthSessions||w.enduranceSessions)) return '';
  const worse=feltWorseAfterEndurance();
  return `<section class="card">
    <h2>${esc(t('cross.title'))}</h2>
    <div style="margin-top:10px;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">
        <thead><tr style="text-align:left;color:var(--muted)">
          <th style="padding:6px 8px 6px 0">${esc(t('cross.week'))}</th><th style="padding:6px 8px">${esc(t('cross.strength'))}</th><th style="padding:6px 8px">${esc(t('cross.avgRir'))}</th><th style="padding:6px 8px">${esc(t('cross.avgQuality'))}</th><th style="padding:6px 0">${esc(t('cross.endurance'))}</th>
        </tr></thead>
        <tbody>
          ${weeks.map(w=>`<tr style="border-top:1px solid var(--line)">
            <td style="padding:6px 8px 6px 0">${new Date(w.week+'T00:00:00').toLocaleDateString(LANG,{month:'short',day:'numeric'})}</td>
            <td style="padding:6px 8px">${w.strengthSessions} · ${w.setsDone} ${esc(t('common.sets'))}</td>

}

// ---- Recovery engine wiring (math itself lives in skandi-recovery.js) ----

function getMyRecovery(){
  return SkandiRecovery.computeMuscleRecovery({
    sets:state.sets, sessions:state.sessions, exercises:state.exercises,
    activities:state.externalActivities, userId:state.user.id, now:Date.now(),
    // Sin FCmáx capturada el motor cae a bandas absolutas de bpm, que es lo que hacía antes.
    maxHeartRate:state.skandiSettings?.max_heart_rate||null,
    // Y con las zonas del reloj capturadas, manda la frontera real y no el porcentaje.
    hrZones:state.skandiSettings?.hr_zone_bounds||null
  });
}

// A static is a strength skill, not conditioning: held on a fatigued prime mover it just posts a
// short, ugly set that then gets logged as a bad quality score, when the real cause was the
// session two days ago. The recovery engine already knows this — it just never said so before
// the workout, which is the only moment the information is worth anything.
const SKILL_FATIGUE_FLOOR=60;
function skillFatigueWarnings(exercises){
  const byMuscle=new Map(getMyRecovery().map(r=>[r.name,r]));
  const seen=new Set();
  const out=[];
  for(const ex of exercises){
    if(!ex?.progression_group||seen.has(ex.id)) continue;
    seen.add(ex.id);
    const [muscle]=Object.entries(ex.muscles||{}).sort((a,b)=>b[1]-a[1])[0]||[];
    const row=muscle&&byMuscle.get(muscle);
    if(row&&row.score<SKILL_FATIGUE_FLOOR) out.push({exercise:ex,muscle,score:row.score});
  }
  return out;
}

function formatHours(h){
  if(h<=0) return t('recovery.now');
  if(h<1) return t('recovery.lessHour');
  if(h<24) return `${Math.ceil(h)}h`;
  const d=Math.floor(h/24),r=Math.round(h%24);
  return r?`${d}d ${r}h`:`${d}d`;
}

// ---- Medidas con cinta (migración 090) ----
//
// "A bordo no hay manera de pesarme de forma precisa" — sin báscula confiable en un barco, la
// cinta es el método real de seguimiento. state.bodyMeasurements cae a [] si la migración 090
// no se ha corrido (mismo patrón que programs/progressionEvents en loadAll), así que esta
// pestaña simplemente se ve vacía en vez de romper el resto de la app.

const MEASURE_FIELDS=[
  ['measNeck','neck_cm','body.neck'],['measChest','chest_cm','body.chest'],
  ['measWaist','waist_cm','body.waist'],['measHip','hip_cm','body.hip'],
  ['measArm','arm_cm','body.arm'],['measThigh','thigh_cm','body.thigh'],
  ['measCalf','calf_cm','body.calf']
];

function measurementsTab(){
  const rows=(state.bodyMeasurements||[]).slice().sort((a,b)=>b.measured_at.localeCompare(a.measured_at));
  const latest=rows[0]||null;
  const prev=rows[1]||null;
  const latestLines=latest?MEASURE_FIELDS.map(([,key,labelKey])=>{
    const val=latest[key];
    if(val==null) return '';
    const prevVal=prev?prev[key]:null;
    const delta=prevVal!=null?Math.round((val-prevVal)*10)/10:null;
    return `<div class="row" style="margin-top:8px"><span class="muted">${esc(t(labelKey))}</span><span><strong>${val} cm</strong>${delta!=null&&delta!==0?` <small class="muted">(${delta>0?'+':''}${delta})</small>`:''}</span></div>`;
  }).filter(Boolean).join(''):'';
  return `
    <section class="card">
      <div class="row"><h2>${esc(t('body.measurements'))}</h2><button class="btn small primary" onclick="openMeasurementForm()">${icon('plus',16)} ${esc(t('body.logMeasurement'))}</button></div>
      ${latest?`${latestLines}<p class="muted" style="margin-top:10px;font-size:12px">${esc(t('body.measuredOn',{date:new Date(latest.measured_at+'T12:00:00').toLocaleDateString(LANG,{day:'numeric',month:'long'})}))}</p>`
        :`<p class="muted" style="margin-top:8px">${esc(t('body.noMeasurements'))}</p>`}
    </section>
    ${rows.length>1?`<section class="card">
      <div class="eyebrow">${esc(t('body.history'))}</div>
      ${rows.slice(1).map(measurementRowHtml).join('')}
    </section>`:''}`;
}

function measurementRowHtml(m){
  const parts=MEASURE_FIELDS.map(([,key,labelKey])=>m[key]!=null?`${t(labelKey)} ${m[key]}`:null).filter(Boolean).join(' · ');
  return `<div class="row" style="margin-top:8px;cursor:pointer" onclick="openMeasurementForm('${m.measured_at}')">
    <div><strong>${new Date(m.measured_at+'T12:00:00').toLocaleDateString(LANG,{day:'numeric',month:'short'})}</strong><p style="font-size:12px">${esc(parts)}</p></div>

function openMeasurementForm(dateKey){
  const day=dateKey||dayKey(new Date());
  const existing=(state.bodyMeasurements||[]).find(m=>m.measured_at===day);
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('body.logMeasurement'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <label class="eyebrow">${esc(t('common.date'))}</label>
    <input id="measDate" class="field left" type="date" max="${dayKey(new Date())}" value="${day}">
    <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px">
      ${MEASURE_FIELDS.map(([id2,key,labelKey])=>
        `<div><label class="eyebrow">${esc(t(labelKey))}</label><input id="${id2}" class="field" type="number" min="0" max="200" step="0.5" inputmode="decimal" value="${existing?.[key]??''}" placeholder="cm"></div>`
      ).join('')}
    </div>
    <textarea id="measNote" class="field" placeholder="${esc(t('common.notesOptional'))}">${esc(existing?.note||'')}</textarea>
    ${existing?`<p class="muted" style="margin-top:6px">${esc(t('body.alreadyLogged'))}</p>`:''}
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="saveMeasurement()">${esc(t('common.save'))}</button>
    ${existing?`<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteMeasurement('${existing.id}')">${icon('trash',16)} ${esc(t('common.delete'))}</button>`:''}`;
}

async function saveMeasurement(){
  const day=$('measDate').value;
  if(!day) return alert(t('body.errDate'));
  const num=v=>v===''?null:Number(v);
  const payload={user_id:state.user.id,measured_at:day};
  MEASURE_FIELDS.forEach(([id2,key])=>{ payload[key]=num($(id2).value); });
  payload.note=$('measNote').value.trim()||null;
  if(MEASURE_FIELDS.every(([,key])=>payload[key]==null)) return alert(t('body.errEmpty'));
  const {error}=await sb.from('skandi_body_measurements').upsert(payload,{onConflict:'user_id,measured_at'});
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

async function deleteMeasurement(id){
  if(!confirm(t('body.confirmDelete'))) return;
  const {error}=await sb.from('skandi_body_measurements').delete().eq('id',id);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

function progressPhotoUrl(path){
  if(!path) return '';
  if(progressPhotoUrl.cache[path]) return progressPhotoUrl.cache[path];
  progressPhotoUrl.cache[path]='';
  sb.storage.from('skandi-progress-photos').createSignedUrl(path,3600).then(({data})=>{
    if(data?.signedUrl){
      progressPhotoUrl.cache[path]=data.signedUrl;
      if(state.view==='body') render();
      document.querySelectorAll(`img[data-photo="${path}"]`).forEach(img=>{img.src=data.signedUrl;});
    }
  });
  return '';
}

async function onProgressPhotoPicked(input){
  const file=input.files&&input.files[0];
  if(!file) return;
  try{
    const blob=await compressImage(file);
    state.pendingPhoto.blob=blob;
    const url=URL.createObjectURL(blob);
    $('progressPhotoPreview').innerHTML=`<img src="${url}" alt="" style="width:100%;border-radius:12px;margin-top:10px;max-height:260px;object-fit:cover">`;
    $('progressPhotoBtnLabel').textContent=`${Math.round(blob.size/1024)} KB ✓`;
  }catch(e){
    alert(e.message||String(e));
  }
}

async function submitProgressPhoto(){
  const pending=state.pendingPhoto;
  if(!pending||!pending.blob) return alert(t('body.errNoPhoto'));
  const day=$('photoDate').value;
  if(!day) return alert(t('body.errDate'));
  const btn=$('photoGo');
  btn.disabled=true;btn.textContent=t('food.uploading');
  try{
    const path=`${state.user.id}/${crypto.randomUUID()}.jpg`;
    const {error:upErr}=await sb.storage.from('skandi-progress-photos').upload(path,pending.blob,{contentType:'image/jpeg'});
    if(upErr) throw upErr;
    const {error}=await sb.from('skandi_progress_photos').insert({
      user_id:state.user.id,taken_at:day,pose:pickedPose(),photo_path:path,note:$('photoNote').value.trim()||null
    });
    if(error) throw error;
    closeModal();
    state.pendingPhoto=null;
    await loadAll();
    render();
  }catch(e){
    btn.disabled=false;btn.textContent=t('common.save');
    alert(e.message||String(e));
  }
}

function muscleDetailBreakdown(name){
  const since=Date.now()-SkandiRecovery.RECOVERY_LOOKBACK_DAYS*864e5;
  const exById=new Map(state.exercises.map(e=>[e.id,e]));
  const byExercise=new Map();
  state.sets.filter(s=>{
    const session=state.sessions.find(x=>x.id===s.session_id);
    const when=new Date(session?.completed_at||s.created_at).getTime();
    return s.done && when>=since && s.user_id===state.user.id;
  }).forEach(s=>{
    const ex=exById.get(s.exercise_id);
    const pct=ex?.muscles?.[name];
    if(!ex||!pct) return;
    const cur=byExercise.get(ex.id)||{name:ex.name,pct,sets:0};
    cur.sets++;
    byExercise.set(ex.id,cur);
  });
  const activityRows=(state.externalActivities||[]).filter(a=>{
    const t=new Date(a.performed_at).getTime();
    const map=SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other;
    // Matches the recovery engine's own t > now exclusion (skandi-recovery.js) so a stray
    // future-dated row (pre-existing bad data, clock skew) can't show here while contributing
    // nothing to the freshness score displayed above it.
    return t>=since && t<=Date.now() && !!map[name];
  }).map(a=>({label:activityTypeLabel(a.activity_type),pct:(SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other)[name],when:a.performed_at}));
  return {exerciseRows:[...byExercise.values()].sort((a,b)=>b.sets-a.sets),activityRows};
}

function openMuscleDetail(name){
  const row=getMyRecovery().find(r=>r.name===name)||{name,score:100,hoursUntilFresh:0,rested:true};
  const {exerciseRows,activityRows}=muscleDetailBreakdown(name);
  const library=state.exercises.filter(e=>e.muscles&&e.muscles[name])
    .sort((a,b)=>(b.muscles[name]||0)-(a.muscles[name]||0)).slice(0,6);
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(muscleLabel(name))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <section class="card" style="text-align:center">
      <div style="width:96px;height:96px;border-radius:50%;margin:0 auto;background:${freshColor(row.score)};display:grid;place-items:center;font-weight:1000;font-size:22px;color:var(--dof-deep)">${row.score}%</div>
      <p style="margin-top:10px">${esc(row.rested?t('body.readyNow'):t('body.readyIn',{time:formatHours(row.hoursUntilFresh)}))}</p>
    </section>
    <section class="card">
      <div class="eyebrow">${esc(t('muscle.trainedBy',{name:muscleLabel(name)}))}</div>
      ${exerciseRows.length?exerciseRows.map(b=>`<div class="row" style="margin-top:10px"><div><strong>${esc(b.name)}</strong><p>${b.sets} ${esc(tp(b.sets,'common.setsLogged'))}</p></div><span class="pill dark">${esc(t('muscle.pctOfExercise',{p:b.pct}))}</span></div>`).join(''):empty(t('muscle.noSets'))}

      ${activityRows.length?activityRows.map(a=>`<div class="row" style="margin-top:10px"><div><strong>${esc(a.label)}</strong><p>${new Date(a.when).toLocaleDateString(LANG)}</p></div><span class="pill dark">${esc(t('muscle.pctSplit',{p:a.pct}))}</span></div>`).join(''):empty(t('muscle.noActivities'))}

async function saveExternalActivity(){
  const duration=Number($('actDuration').value);
  const intensity=Number($('actIntensity').value);
  if(!duration||duration<1) return alert(t('logAct.errDuration'));
  if(!intensity||intensity<1||intensity>10) return alert(t('logAct.errIntensity'));
  if(!$('actWhen').value) return alert(t('logAct.errWhen'));
  const performedAt=new Date($('actWhen').value);
  // The datetime input's max="now" is only a soft browser hint (unreliable on mobile) — a
  // future-dated activity would otherwise show up in "Recent activities" while contributing
  // nothing to the freshness score above it (the recovery engine already excludes t > now),
  // a visibly contradictory state. Reject it outright instead.
  if(performedAt.getTime()>Date.now()+60000) return alert(t('logAct.errFuture'));
  const heartRateStr=$('actHeartRate').value;
  const heartRate=heartRateStr?Number(heartRateStr):null;
  if(heartRate!==null&&(heartRate<30||heartRate>230)) return alert(t('logAct.errHr'));
  const type=$('actType').value;
  // Los campos extra solo existen en el DOM cuando el tipo los mostró (renderActExtra): $(id)
  // devuelve null para los que no aplican a este tipo, así que se leen con optional chaining y
  // se guardan null cuando no hay nodo o el campo se dejó vacío.
  const payload={
    user_id:state.user.id,
    activity_type:type,
    duration_min:duration,
    distance_km:$('actDistance').value?Number($('actDistance').value):null,
    avg_heart_rate:heartRate,
    template_id:$('actTemplateId').value||null,
    intensity,
    intensity_source:actIntensityTouched?'manual':'default',
    performed_at:performedAt.toISOString(),
    note:$('actNote').value.trim()||null,
    rounds:$('actRounds')?.value?Number($('actRounds').value):null,
    work_sec:$('actWorkSec')?.value?Number($('actWorkSec').value):null,
    rest_sec:$('actRestSec')?.value?Number($('actRestSec').value):null,
    pool_length_m:$('actPoolLength')?.value?Number($('actPoolLength').value):null,
    stroke:$('actStroke')?.value||null,
    elevation_m:$('actElevation')?.value?Number($('actElevation').value):null
  };
  const {data:inserted,error}=await sb.from('skandi_external_activities').insert(payload).select('id').single();
  if(error) return alert(error.message);
  await reconcilePlanned({
    day:dayKey(performedAt),
    discipline:ACT_TO_DISC[payload.activity_type]||'other',
    activityId:inserted?.id||null,
    plannedId:$('actPlannedId')?.value||null
  });
  closeModal();
  await loadAll();
  render();
}

function externalActivityRow(a){
  // Pace is derived from distance/duration rather than stored separately — the two can't
  // disagree, and it's the only extra number worth showing on a run that a target didn't set.
  const pace=a.distance_km?Math.round((a.duration_min*60)/a.distance_km):null;
  const parts=[
    `${a.duration_min} ${t('common.min')}`,t('logAct.rowIntensity',{v:a.intensity}),
    a.distance_km?`${a.distance_km} km`:null,
    pace?`${fmtPace(pace)}/km`:null,
    a.rounds?`${a.rounds}×${a.work_sec?`${a.work_sec}s/${a.rest_sec||0}s`:t('logAct.rounds').toLowerCase()}`:null,
    a.pool_length_m?`${a.pool_length_m}m`:null,
    a.stroke?t('logAct.stroke'+a.stroke[0].toUpperCase()+a.stroke.slice(1)):null,
    a.elevation_m?`+${a.elevation_m}m`:null,
    a.avg_heart_rate?`${a.avg_heart_rate} bpm`:null,
    new Date(a.performed_at).toLocaleDateString(LANG)
  ].filter(Boolean).join(' · ');
  // Dos marcas, y solo dos: de dónde vino, y si el esfuerzo es un número que nadie midió.
  // La segunda importa porque un 5 puesto por defecto se ve idéntico a un 5 que sí se sintió,
  // y el motor de fatiga los trata igual.
  const badges=[
    a.external_source==='strava'?`<span class="pill tiny">${esc(t('strava.badge'))}</span>`:'',
    a.external_source==='intervals'?`<span class="pill tiny">${esc(t('intervals.badge'))}</span>`:'',
    (a.intensity_source==='default'&&!a.avg_heart_rate)?`<span class="pill tiny warn">${esc(t('strava.checkEffort'))}</span>`:''
  ].join('');
  return `<div class="row" style="margin-top:10px">
    <div><strong>${esc(activityTypeLabel(a.activity_type))}</strong> ${badges}<p>${esc(parts)}</p></div>
    <button class="icon-btn tiny danger" onclick="deleteExternalActivity('${a.id}')" aria-label="${esc(t('common.delete'))}">${icon('trash',16)}</button>
  </div>`;
}

async function deleteExternalActivity(id){
  if(!confirm(t('logAct.confirmDelete'))) return;
  const {error}=await sb.from('skandi_external_activities').delete().eq('id',id);
  if(error) return alert(error.message);
  await loadAll();
  render();
}

  return `<section class="card click-card" onclick="openLogBodyweight()">

    <p style="margin-top:6px">${esc(days==null?t('bw.nudgeBodyNever'):t('bw.nudgeBody',{n:days}))}</p>
  </section>`;
}

// Progressions (front lever, back lever, planche, handstand): skandi_exercises rows chained
// by progression_group/progression_rank, and skandi_progression_state remembers which rank a
// user is currently training in each group so a fixed routine slot ("Front Lever Hold")
// always resolves to whatever variant they're actually working right now.
function progressionSiblings(group){
  return state.exercises.filter(e=>e.progression_group===group).sort((a,b)=>a.progression_rank-b.progression_rank);
}

// Resolves a template/session exercise into the user's current working variant for its
// progression group. Exercises with no progression_group (or with no saved state yet)
// resolve to themselves.
function currentProgressionExercise(exercise){
  if(!exercise?.progression_group) return exercise;
  const saved=state.progressionState.find(p=>p.progression_group===exercise.progression_group);
  if(!saved) return exercise;
  return state.exercises.find(e=>e.id===saved.exercise_id)||exercise;
}

async function saveProgressionState(group,exerciseId){
  const existing=state.progressionState.find(p=>p.progression_group===group);
  const previousId=existing?.exercise_id||null;
  const {error}=await sb.from('skandi_progression_state').upsert(
    {user_id:state.user.id,progression_group:group,exercise_id:exerciseId,updated_at:new Date().toISOString()},
    {onConflict:'user_id,progression_group'}
  );
  if(error) return; // best-effort — the session-local swap already happened either way
  if(existing) existing.exercise_id=exerciseId;
  else state.progressionState.push({user_id:state.user.id,progression_group:group,exercise_id:exerciseId});
  // Every rank change is history worth keeping, in both directions — stepping back down after a
  // stall is as much a part of the story as levelling up (migration 079).
  if(previousId!==exerciseId) await logProgressionEvent(group,previousId,exerciseId);
}

// A coach-authored day (or any session built outside the ◀▶ stepper — see migration 086's
// deload week, which assigns a specific higher variant directly) can have the member complete
// sets on a rank the saved state never heard about, because only stepProgression/performSwap
// write to skandi_progression_state. Left alone, the routine's "current" slot keeps resolving to
// the stale, lower rank forever (currentProgressionExercise) even after the member has proven
// the harder one — which is what "it shows straddle when I can already do half-lay" actually is.
// A completed set at a higher rank than the saved one is proof enough to catch the state up.
// Advance-only: stepping DOWN stays a deliberate choice (demoteProgression), never inferred here.
async function advanceProgressionIfAhead(exerciseId){
  const e=state.exercises.find(x=>x.id===exerciseId);
  if(!e?.progression_group) return;
  const saved=state.progressionState.find(p=>p.progression_group===e.progression_group);
  const savedRank=saved?state.exercises.find(x=>x.id===saved.exercise_id)?.progression_rank:null;
  if(savedRank!=null&&(e.progression_rank??0)<=savedRank) return;
  await saveProgressionState(e.progression_group,exerciseId);
}

// Stepping down a rank from outside a live workout (the stall warning's own button): there are
// no session sets to move, only the saved rank to change.
async function demoteProgression(group){
  const siblings=progressionSiblings(group);
  const currentId=state.progressionState.find(p=>p.progression_group===group)?.exercise_id;
  const idx=siblings.findIndex(x=>x.id===currentId);
  const prev=idx>0?siblings[idx-1]:null;
  if(!prev) return;
  if(!confirm(t('progress.confirmDemote',{name:prev.name}))) return;
  await saveProgressionState(group,prev.id);
  render();
}

function previousCompletedSetsForExercise(exerciseId){
  // A progression exercise (front lever, planche, ...) matches sets logged against ANY
  // sibling in the same skill line, not just this exact variant — so hold-time history
  // carries forward across a level-up instead of resetting to blank every time the user
  // advances to a harder variant.
  const exercise=state.exercises.find(e=>e.id===exerciseId);
  const matchIds=exercise?.progression_group
    ?new Set(progressionSiblings(exercise.progression_group).map(e=>e.id))
    :new Set([exerciseId]);
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  for(const session of completed){
    const rows=state.sets.filter(s=>s.session_id===session.id&&matchIds.has(s.exercise_id));
    if(!rows.length) continue;
    const doneRows=rows.filter(s=>s.done).sort((a,b)=>a.set_idx-b.set_idx);
    if(doneRows.length) return doneRows;
    // Nobody tapped the check mark that session (easy to forget mid-workout), but the
    // numbers were still logged — that's still worth preloading over leaving it blank.
    const loggedRows=rows.filter(s=>s.weight_kg!=null||s.reps!=null||s.seconds!=null).sort((a,b)=>a.set_idx-b.set_idx);
    if(loggedRows.length) return loggedRows;
  }
  return [];
}

// How many sets of this session met the rank's whole standard: the mark (seconds or reps) at
// or above progression_target AND the execution at 8+/10. On a quality-tracked exercise an
// unrated set does NOT count — leaving the rating blank is the same as not having proved the
// rep, which is the incentive the 1-10 scale exists for (migration 078).
function qualifyingSetCount(exercise,sessionId){
  const seconds=exercise.log_mode==='seconds';
  return state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===exercise.id&&s.done).filter(s=>{
    if((seconds?(s.seconds||0):(s.reps||0))<exercise.progression_target) return false;
    if(!exercise.track_quality) return true;
    const q=setQuality(s);
    return q!=null&&q>=QUALITY_CLEAN;
  }).length;
}

function trainedInSession(exerciseId,sessionId){
  return state.sets.some(s=>s.session_id===sessionId&&s.exercise_id===exerciseId&&s.done);
}

// Progression readiness: has the user hit this exact variant's full standard —
// progression_target_sets sets at target, all of them 8+/10 — in each of the last two
// sessions where they trained it? Unlike previousCompletedSetsForExercise, siblings aren't
// pooled here — readiness is about mastering the CURRENT rank, not the skill line's history
// overall. Sessions where this variant wasn't trained are skipped rather than breaking the
// streak; a session where it WAS trained but missed the standard does break it, so this needs
// two CONSECUTIVE qualifying sessions, not just two ever. Requiring N sets instead of the
// single best one (migration 078) is deliberate: one lucky hold used to be enough to be told
// you were ready for a rank you could not repeat.
function progressionReadiness(exercise){
  if(!exercise?.progression_group||!exercise.progression_target) return false;
  const siblings=progressionSiblings(exercise.progression_group);
  if(siblings.findIndex(x=>x.id===exercise.id)===siblings.length-1) return false; // already the hardest rank
  const needed=exercise.progression_target_sets||1;
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  let qualifying=0;
  for(const session of completed){
    if(!trainedInSession(exercise.id,session.id)) continue;
    if(qualifyingSetCount(exercise,session.id)<needed) return false;
    if(++qualifying>=2) return true;
  }
  return false;
}

// Whether the LAST completed session this exercise was trained in already met the full
// standard — i.e. whether today, if it also qualifies, would be the second consecutive
// qualifying session that progressionReadiness() requires. Used only to tell a member mid-set
// "finish like this and you level up" instead of leaving them to find out at the start of their
// next workout.
function progressionMostRecentQualified(exercise){
  const needed=exercise.progression_target_sets||1;
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  for(const session of completed){
    if(!trainedInSession(exercise.id,session.id)) continue;
    return qualifyingSetCount(exercise,session.id)>=needed;
  }
  return false;
}

// ---- Skill lines: one continuous curve per progression group -------------------------------

// A skill rep is worth about three seconds under tension (pull in, one second at the position,
// lower under control). It is a convention, not a measurement, but it lets one weekly time-
// under-tension number cover a line that mixes holds and raises instead of two numbers nobody
// compares.
const REP_TUT_SEC=3;

function skillGroups(){
  return [...new Set(state.exercises.filter(e=>e.progression_group).map(e=>e.progression_group))].sort();
}
const skillGroupLabel=g=>g.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');

// The whole point of a skill line is that it is ONE thing you get better at for years, but the
// raw mark resets at every rank: 20s of tuck becomes 6s of advanced tuck and the chart reads as
// a collapse. Level = rank + how far into that rank you are, so levelling up lands at exactly
// the number you left the previous rank on and the curve stays continuous across the whole
// ladder. Derived from progression_rank and progression_target, both of which are already the
// standard the app judges you against — no invented difficulty coefficients.
function skillLevel(exercise,mark){
  if(!exercise?.progression_group||!exercise.progression_rank) return null;
  const siblings=progressionSiblings(exercise.progression_group);
  const idx=siblings.findIndex(x=>x.id===exercise.id);
  // The last rank has no target of its own — it is measured against the previous rank's, which
  // is the mark you had to hit to arrive there.
  const target=exercise.progression_target||siblings[idx-1]?.progression_target;
  if(!target) return exercise.progression_rank;
  return Math.round((exercise.progression_rank+Math.min(1,(mark||0)/target))*100)/100;
}

function skillSetMark(ex,st){ return ex.log_mode==='seconds'?(Number(st.seconds)||0):(Number(st.reps)||0); }

// Best level reached per completed session, oldest first. A set rated clearly broken is skipped
// (same bar as a personal best) — the curve is what you can hold, not what you attempted.
function skillLevelSeries(group){
  const ids=new Set(progressionSiblings(group).map(e=>e.id));
  const out=[];
  for(const session of myCompletedSessions()){
    let best=null;
    for(const st of state.sets.filter(x=>x.session_id===session.id&&ids.has(x.exercise_id)&&x.done)){
      const ex=state.exercises.find(e=>e.id===st.exercise_id);
      if(!ex) continue;
      const q=setQuality(st);
      if(ex.track_quality&&q!=null&&q<QUALITY_BROKEN) continue;
      const mark=skillSetMark(ex,st);
      const level=skillLevel(ex,mark);
      if(level!=null&&(best==null||level>best.level)) best={level,exercise:ex,mark};
    }
    if(best) out.push({sessionId:session.id,date:session.completed_at,...best});
  }
  return out.reverse(); // myCompletedSessions is newest-first, the chart reads left to right
}

// Weekly time under tension for a whole line. In statics the training volume IS seconds — sets
// and reps say nothing about whether a week was 40 seconds of front lever or 200.
function skillTutByWeek(group,numWeeks=6){
  const ids=new Set(progressionSiblings(group).map(e=>e.id));
  const weeks=new Map();
  const thisWeek=weekStart(new Date()).toISOString().slice(0,10);
  weeks.set(thisWeek,0);
  for(const session of myCompletedSessions()){
    const key=weekStart(session.completed_at).toISOString().slice(0,10);
    let sec=0;
    for(const st of state.sets.filter(x=>x.session_id===session.id&&ids.has(x.exercise_id)&&x.done)){
      const ex=state.exercises.find(e=>e.id===st.exercise_id);
      if(ex) sec+=ex.log_mode==='seconds'?(Number(st.seconds)||0):(Number(st.reps)||0)*REP_TUT_SEC;
    }
    if(sec) weeks.set(key,(weeks.get(key)||0)+sec);
  }
  return [...weeks.entries()].sort((a,b)=>b[0].localeCompare(a[0])).slice(0,numWeeks)
    .map(([week,sec])=>({week,sec}));
}

const skillGoalSec=group=>state.skillGoals.find(g=>g.progression_group===group)?.weekly_tut_sec??null;

async function saveSkillGoal(group,minutes){
  const sec=Math.round(Number(minutes)*60);
  if(!Number.isFinite(sec)||sec<0||sec>7200) return alert(t('skill.errGoal'));
  const {error}=await sb.from('skandi_skill_goals').upsert(
    {user_id:state.user.id,progression_group:group,weekly_tut_sec:sec,updated_at:new Date().toISOString()},
    {onConflict:'user_id,progression_group'}
  );
  if(error) return alert(error.message);
  const existing=state.skillGoals.find(g=>g.progression_group===group);
