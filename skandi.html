// ---- Programs: the layer above routines (workout -> routine -> program) ------------------
// Desde la migración 102, el programa activo es la fuente de la verdad del plan. `weekday` se
// conserva como día sugerido y como respaldo completo para quien no tenga programa activo.

const myTemplates=()=>state.templates.filter(x=>x.user_id===state.user.id);
const activeProgram=()=>state.programs.find(p=>p.is_active)||null;
// Desde la migración 110, fuerza y resistencia pueden venir de DOS programas distintos --
// kind es 'template' (fuerza) o 'activity' (resistencia). Un programa mixto responde a las dos
// preguntas con el mismo id, tal como exige el trigger de exclusividad de la 110 (nunca puede
// haber un mixto activo junto a otro programa).
// Sin track (undefined/null) se trata como 'mixed': es el default real de la columna en la 110,
// y un programa recién insertado en el cliente puede no traerlo todavía si el round-trip a
// Supabase no volvió a cargar el registro.
const activeProgramForKind=kind=>{
  const track=kind==='activity'?'endurance':'strength';
  return state.programs.find(p=>p.is_active&&(p.track==null||p.track===track||p.track==='mixed'))||null;
};
const programDaysOf=id=>state.programDays.filter(d=>d.program_id===id)
  .sort((a,b)=>(a.weekday-b.weekday)||((a.week_index||0)-(b.week_index||0))||((a.sort_order||0)-(b.sort_order||0)));
const programWeeksOf=id=>state.programWeeks.filter(w=>w.program_id===id).sort((a,b)=>a.week_index-b.week_index);

// Resuelve cualquier programa guardado, no solo el activo. Una fila vacía de la semana N es
// intencional: significa descanso y bloquea el respaldo de la semana base.
function programPlan(programId,weekIndex=0){
  const rows=programDaysOf(programId);
  return Array.from({length:7},(_,weekday)=>{
    const override=weekIndex>0?rows.filter(d=>d.weekday===weekday&&d.week_index===weekIndex):[];
    const chosen=override.length?override:rows.filter(d=>d.weekday===weekday&&!(d.week_index||0));
    const out={weekday,template_id:null,activity_template_id:null};
    chosen.forEach(d=>{
      if(d.template_id) out.template_id=d.template_id;
      if(d.activity_template_id) out.activity_template_id=d.activity_template_id;
    });
    return out;
  });
}

const PHASES=['build','peak','taper','race','recovery'];
const defaultProgramPhase=(program,weekIndex)=>program?.deload_week!==false&&weekIndex===programCycleLength(program)?'recovery':'build';
function programWeekMeta(program,weekIndex){
  const saved=programWeeksOf(program.id).find(w=>w.week_index===weekIndex);
  return {phase:saved?.phase||defaultProgramPhase(program,weekIndex),note:saved?.note||null};
}
const phaseLabel=phase=>t(`pgm.phase.${PHASES.includes(phase)?phase:'build'}`);

// ── La semana efectiva (migración 102) ──────────────────────────────────────────────────────
// Desde la 102 el dueño del día es el PROGRAMA, no la rutina. weekPlan() es el único lugar del
// cliente que contesta "¿qué toca cada día?", y es el espejo exacto de skandi_week_slots() en
// la base: mismo criterio de resolución, misma respuesta. Si los dos no coincidieran, la
// cuadrícula de Rutinas y el calendario dirían cosas distintas sobre el mismo martes.
//
// Sin programa activo con fecha —o antes de correr la 102, cuando esas columnas ni existen—
// contesta desde skandi_templates.weekday, que es exactamente el comportamiento anterior. Ese
// es el interruptor: start_date es lo que convierte un programa en el plan.
// Sin kind: ¿hay AL MENOS una pista con programa gobernando? Con kind ('template'/'activity'):
// ¿esa pista específica tiene uno?
const programOwnsWeek=kind=>kind
  ?!!(activeProgramForKind(kind)?.start_date)
  :!!(activeProgramForKind('template')?.start_date||activeProgramForKind('activity')?.start_date);
const programCycleLength=p=>Math.max(1,(p?.weeks||4)+(p&&p.deload_week===false?0:1));

// En qué semana del ciclo cae ese lunes. null = el programa todavía no arranca; un número
// mayor al largo del ciclo = ya terminó (no se repite solo, ver migración 066 y la 102).
function programWeekIndex(program,monday){
  if(!program||!program.start_date) return null;
  const start=mondayOf(keyToDate(program.start_date));
  const diff=Math.round((mondayOf(monday||new Date())-start)/604800000);
  return diff<0?null:diff+1;
}

// Fuerza y resistencia se resuelven cada una contra SU programa -- pueden venir de dos objetos
// distintos, de uno solo (mixto) o de ninguno. Espejo exacto de cómo skandi_ensure_week combina
// v_prog_s y v_prog_e (migración 110): si algún día deja de coincidir, Rutinas y Calendario van
// a decir cosas distintas del mismo martes.
function weekPlan(weekIndex){
  const out=Array.from({length:7},()=>({template_id:null,activity_template_id:null}));
  const fill=(program,kind)=>{
    const col=kind==='template'?'template_id':'activity_template_id';
    if(!program||!program.start_date){
      const rows=kind==='template'?myTemplates():state.activityTemplates.filter(x=>x.user_id===state.user.id);
      rows.forEach(x=>{ if(x.weekday!=null) out[x.weekday][col]=x.id; });
      return;
    }
    // Antes del arranque todavía manda el día sugerido (cubierto arriba, start_date null); al
    // terminar el ciclo no se repite solo. Mismas dos guardas de skandi_ensure_week, pero por
    // pista: que la fuerza termine no debe vaciar la resistencia si la suya sigue corriendo.
    const idx=weekIndex??programWeekIndex(program);
    if(idx==null||idx>programCycleLength(program)) return;
    programPlan(program.id,idx).forEach((d,i)=>{ out[i][col]=d[col]; });
  };
  fill(activeProgramForKind('template'),'template');
  fill(activeProgramForKind('activity'),'activity');
  return out;
}

const templateOfDay=i=>{const id=weekPlan()[i]?.template_id;return id?state.templates.find(x=>x.id===id):null;};
const activityOfDay=i=>{const id=weekPlan()[i]?.activity_template_id;return id?state.activityTemplates.find(x=>x.id===id):null;};
const dayOfTemplate=id=>{const i=weekPlan().findIndex(d=>d.template_id===id);return i<0?null:i;};
const dayOfActivity=id=>{const i=weekPlan().findIndex(d=>d.activity_template_id===id);return i<0?null:i;};

function currentWeekSnapshot(){
  return weekPlan().map((d,i)=>({weekday:i,template_id:d.template_id,activity_template_id:d.activity_template_id}))
    .filter(r=>r.template_id||r.activity_template_id);
}

// "Dirty" = the member rearranged their week after loading a program, so the saved program no
// longer describes what they actually train. Surfaced as an explicit "update program" button
// rather than auto-saving: moving one routine for one week shouldn't silently rewrite the plan.
function weekMatchesProgram(program){
  if(!program) return true;
  const kind=program.track==='endurance'?'activity':'template';
  if(programOwnsWeek(kind)&&activeProgramForKind(kind)?.id===program.id) return true;
  const key=r=>`${r.weekday}:${r.template_id||'-'}:${r.activity_template_id||'-'}`;
  const week=currentWeekSnapshot().map(key).sort();
  const saved=programDaysOf(program.id).filter(d=>(d.week_index||0)===0&&(d.template_id||d.activity_template_id)).map(key).sort();
  return week.length===saved.length&&week.every((v,i)=>v===saved[i]);
}

function programSummary(program){
  const days=programDaysOf(program.id).filter(d=>(d.week_index||0)===0);
  return t('pgm.summary',{
    routines:days.filter(d=>d.template_id).length,
    plans:days.filter(d=>d.activity_template_id).length,
    days:days.filter(d=>d.template_id||d.activity_template_id).length
  });
}

const programDurationLine=program=>t(program?.deload_week===false?'pgm.durationNoDeload':'pgm.durationDeload',{
  weeks:program?.weeks||4
});

// One row per weekday, used by both the program preview (saved days) and the "save this week"
// form (live days) -- same shape either way, so the member sees exactly what they're saving.
// Con programId las filas son editables (la hoja del programa); sin él son de solo lectura (la
// vista previa de "copiar mi semana", donde todavía no hay programa al que escribirle).
function programDayRowsHtml(days,programId,weekIndex=0){
  return DOW.map((label,i)=>{
    const day=days.find(x=>x.weekday===i);
    const tpl=day?.template_id?state.templates.find(x=>x.id===day.template_id):null;
    const act=day?.activity_template_id?state.activityTemplates.find(x=>x.id===day.activity_template_id):null;
    const parts=[day?.template_id?(tpl?.name||t('pgm.missingRoutine')):null,act?activityTypeLabel(act.activity_type):null].filter(Boolean);
    const rest=!parts.length;
    const body=`<span>${label}</span><span>${esc(rest?t('pgm.rest'):parts.join(' + '))}</span>`;
    return programId
      ?`<button type="button" class="pgm-day editable ${rest?'rest':''}" onclick="openProgramDayEditor('${programId}',${i},${weekIndex})">${body}${icon('chevronRight',16)}</button>`
      :`<div class="pgm-day ${rest?'rest':''}">${body}</div>`;
  }).join('');
}

function programCycleLine(program){
  if(!program?.is_active||!program.start_date) return null;
  const source={start_date:program.start_date,build_weeks:program.weeks||4,program_id:program.id};
  const info=cycleWeekInfo(source,program.start_date,program.weeks||4,program.deload_week!==false);
  if(!info||info.notStarted) return null;
  if(info.ended) return t('pgm.cycleEnded');
  if(info.deload) return t('pgm.cycleDeload',{week:info.week,total:info.totalWeeks});
  const left=info.totalWeeks-info.week;
  return t('pgm.cycleWeek',{week:info.week,total:info.totalWeeks})+
    (program.deload_week!==false&&left>0?' · '+tp(left,'pgm.untilDeload'):'');
}

function programCardHtml(){
  if(!state.programs.length){
    return `<section class="card">
      <div class="eyebrow">${esc(t('pgm.eyebrow'))}</div>
      <h2 style="margin-top:6px">${esc(t('pgm.none'))}</h2>
      <p class="muted" style="margin-top:6px">${esc(t('pgm.noneBody'))}</p>
      <button class="btn primary" style="width:100%;margin-top:12px" onclick="openProgramForm()">${icon('plus',16)} ${esc(t('pgm.newTitle'))}</button>
    </section>`;
  }
  const strength=activeProgramForKind('template');
  const endurance=activeProgramForKind('activity');
  const mixed=strength&&endurance&&strength.id===endurance.id;
  // Toda la fila abre el programa (click-card, igual que la del bloque de entrenamiento): el
  // nombre era texto muerto y la única puerta era «Cambiar», que es la acción menos frecuente.
  // Mixto: una sola fila, como siempre. Fuerza y resistencia por separado (110): dos filas, cada
  // una con su propio ciclo -- activar una no toca la otra.
  const slot=(label,program)=>{
    const dirty=program&&!weekMatchesProgram(program);
    const cycle=program?programCycleLine(program):null;
    return `<div class="row click-card" style="margin-top:${label?10:0}" onclick="${program?`openProgramSheet('${program.id}')`:'openProgramPicker()'}">
      <div style="min-width:0">
        ${label?`<div class="eyebrow">${esc(label)}</div>`:''}
        <h2 style="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(program?program.name:t('pgm.noneActive'))}</h2>
        <p class="muted">${esc(cycle||(program?programSummary(program):t('pgm.pickOne',{n:state.programs.length})))}</p>
        ${dirty?`<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">
          <p class="muted" style="flex:1 1 150px;min-width:0">${esc(t('pgm.dirty'))}</p>
          <button class="btn small" onclick="event.stopPropagation();updateProgramFromWeek('${program.id}')">${esc(t('pgm.saveChanges'))}</button>
        </div>`:''}
      </div>
      <button class="btn small" onclick="event.stopPropagation();openProgramPicker()">${icon('swap',16)} ${esc(t('pgm.change'))}</button>
    </div>`;
  };
  return `<section class="card">
    <div class="eyebrow">${esc(t('pgm.eyebrow'))}</div>
    ${mixed?slot(null,strength):slot(t('pgm.trackStrength'),strength)+slot(t('pgm.trackEndurance'),endurance)}
  </section>`;
}

        </div>

// La hoja del programa. Es la capa de arriba, así que aquí se ve todo lo que lo define: el
// nombre, en qué semana del ciclo va, y los siete días -- cada uno editable en su lugar. Antes
// los días eran <span> de solo lectura y la única forma de cambiar el martes del programa era
// mover la rutina en la semana real y volver a guardar el programa encima de ella: editar el
// mundo para editar el plan.
const programWeekView={};
const programHasWeekDetails=id=>programDaysOf(id).some(d=>(d.week_index||0)>0)||programWeeksOf(id).length>0;

function selectProgramWeek(id,weekIndex){
  programWeekView[id]=weekIndex;
  openProgramSheet(id);
}

function customizeProgramWeeks(id){
  const p=state.programs.find(x=>x.id===id);
  if(!p) return;
  const current=p.is_active?programWeekIndex(p):null;
  programWeekView[id]=Math.min(programCycleLength(p),Math.max(1,current||1));
  openProgramSheet(id);
}

function programCycleAdherence(program){
  const rows=plannedRows().filter(p=>p.program_id===program.id&&p.program_week_index>0&&p.day<=todayKey()&&p.discipline!=='rest'&&p.status!=='replaced');
  const total=rows.length;
  const done=rows.filter(p=>p.status==='done'||p.status==='partial').length;
  return {total,done,pct:total?Math.min(100,Math.round(done/total*100)):0};
}

function openProgramSheet(id){
  const p=state.programs.find(x=>x.id===id);
  if(!p) return;
  const cycle=programCycleLine(p);
  const detailed=programHasWeekDetails(id)||programWeekView[id]>0;
  const max=programCycleLength(p);
  const selected=detailed?Math.min(max,Math.max(0,programWeekView[id]??1)):0;
  programWeekView[id]=selected;
  const adherence=programCycleAdherence(p);
  const weekButtons=detailed?`<div class="pgm-weeks" style="margin-top:10px">
    <button class="${selected===0?'active':''}" onclick="selectProgramWeek('${id}',0)">${esc(t('pgm.baseWeek'))}</button>
    ${Array.from({length:max},(_,i)=>i+1).map(n=>`<button class="${selected===n?'active':''}" onclick="selectProgramWeek('${id}',${n})">${p.deload_week!==false&&n===max?esc(t('pgm.deloadShort')):`S${n}`}</button>`).join('')}
  </div>`:'';
  const meta=selected>0?programWeekMeta(p,selected):null;
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1 style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${esc(programSummary(p))} · ${esc(programDurationLine(p))}${p.is_active?' · '+esc(t('pgm.active')):''}</p>
    ${cycle?`<p class="muted">${esc(cycle)}</p>`:''}
    ${p.start_date?`<p class="form-note" style="margin-top:8px">${esc(adherence.total?t('pgm.cycleAdherence',adherence):t('pgm.cycleAdherenceEmpty'))}</p>`:''}
    ${p.notes?`<p class="form-note" style="margin-top:8px">${esc(p.notes)}</p>`:''}
    <div class="eyebrow" style="margin-top:16px">${esc(t('pgm.daysTitle'))}</div>
    <p class="form-note">${esc(p.is_active?t('pgm.daysHintActive'):t('pgm.daysHint'))}</p>
    ${weekButtons}
    ${!detailed?`<button class="btn" style="width:100%;margin-top:10px" onclick="customizeProgramWeeks('${id}')">${esc(t('pgm.customizeWeeks'))}</button><p class="form-note">${esc(t('pgm.customizeWeeksHint'))}</p>`:''}
    ${meta?`<label class="eyebrow" style="margin-top:12px">${esc(t('pgm.phase'))}</label>
      <select class="field left" onchange="setProgramWeekPhase('${id}',${selected},this.value)">
        ${PHASES.map(phase=>`<option value="${phase}" ${meta.phase===phase?'selected':''}>${esc(phaseLabel(phase))}</option>`).join('')}
      </select>`:''}
    <div class="stack" style="margin-top:10px;gap:8px">${programDayRowsHtml(programPlan(id,selected),id,selected)}</div>
    ${selected>0?`<button class="btn" style="width:100%;margin-top:10px" onclick="resetProgramWeek('${id}',${selected})">${icon('swap',16)} ${esc(t('pgm.resetWeek'))}</button>`:''}
    <div class="stack" style="margin-top:16px">
      ${p.is_active&&p.start_date?'':`<button class="btn primary" style="width:100%" onclick="openProgramLoadConfirm('${p.id}')">${icon('calendar',16)} ${esc(t(p.is_active?'pgm.startCycle':'pgm.activate'))}</button>`}
      <button class="btn" style="width:100%" onclick="openProgramForm('${p.id}')">${icon('edit',16)} ${esc(t('pgm.rename'))}</button>
      <button class="btn" style="width:100%" onclick="duplicateProgram('${p.id}')">${icon('plus',16)} ${esc(t('pgm.duplicate'))}</button>
      ${p.is_active?`<button class="btn" style="width:100%" onclick="updateProgramFromWeek('${p.id}')">${icon('swap',16)} ${esc(t('pgm.saveChanges'))}</button>`:''}
      <button class="btn danger" style="width:100%" onclick="deleteProgram('${p.id}')">${icon('trash',16)} ${esc(t('pgm.delete'))}</button>

// Editar un día escribe skandi_program_days. El espejo a skandi_templates.weekday solo corre
// mientras weekday siga siendo el dueño del día -- es decir, en un programa activo SIN
// start_date (guardado antes de la 102, o nunca cargado). En cuanto el programa tiene fecha,
// él es el plan y escribir el weekday además solo crearía una segunda verdad que mantener.
let savingProgramDay=false;
async function setProgramDay(programId,weekday,kind,valueId,weekIndex=0){
  if(savingProgramDay) return;
  const p=state.programs.find(x=>x.id===programId);
  if(!p) return;
  savingProgramDay=true;
  try{
    const error=await writeProgramDay(programId,weekIndex,weekday,kind,valueId);
    if(error) return alert(error.message);
    if(weekIndex===0&&p.is_active&&!programOwnsWeek(kind)){
      const mirrorError=await writeWeekdayColumn(kind,weekday,valueId);
      if(mirrorError) return alert(mirrorError.message);
    }
    await loadAll();
    openProgramDayEditor(programId,weekday,weekIndex);
    render();
  } finally {
    savingProgramDay=false;
  }
}

// Escribe una ranura del programa. week_index 0 = "todas las semanas", que es lo que escriben
// todos los caminos de asignación: mover una rutina significa "de aquí en adelante". Cambiar
// una sola semana es cosa del calendario, no del programa.
async function writeProgramDay(programId,weekIndex,weekday,kind,valueId){
  const col=kind==='template'?'template_id':'activity_template_id';
  let existing=programDaysOf(programId).find(x=>x.weekday===weekday&&(x.week_index||0)===weekIndex);
  // La primera edición de S2 debe partir del día efectivo completo. Si solo insertáramos la
  // ranura tocada, la presencia del override bloquearía la base y borraría la otra disciplina.
  if(!existing&&weekIndex>0){
    const inherited=programPlan(programId,weekIndex)[weekday];
    const error=await insertProgramDays([{program_id:programId,week_index:weekIndex,weekday,
      template_id:inherited.template_id,activity_template_id:inherited.activity_template_id}]);
    if(error) return error;
    existing=programDaysOf(programId).find(x=>x.weekday===weekday&&(x.week_index||0)===weekIndex)||
      {program_id:programId,week_index:weekIndex,weekday,template_id:inherited.template_id,activity_template_id:inherited.activity_template_id};
  }
  const other=existing?(kind==='template'?existing.activity_template_id:existing.template_id):null;
  if(existing){
    // La fila se borra solo cuando el día queda completamente vacío: si el otro lado sigue
    // ocupado (fuerza sin resistencia, o al revés), borrarla se llevaría también eso.
    if(!valueId&&!other&&weekIndex===0) return (await sb.from('skandi_program_days').delete().eq('id',existing.id)).error;
    const query=sb.from('skandi_program_days').update({[col]:valueId});
    return (await (existing.id?query.eq('id',existing.id):query.eq('program_id',programId).eq('week_index',weekIndex).eq('weekday',weekday))).error;
  }
  if(!valueId) return null;
  return await insertProgramDays([{program_id:programId,week_index:weekIndex,weekday,[col]:valueId}]);
}

// week_index no existe hasta correr la 102, y un insert a una columna que no existe falla el
// renglón entero, no solo ese campo -- mismo patrón que los azúcares añadidos (089). Sin
// week_index el resultado es idéntico: la columna nace con default 0.
async function insertProgramDays(rows){
  let {error}=await sb.from('skandi_program_days').insert(rows);
  if(error&&/week_index/.test(error.message||'')){
    ({error}=await sb.from('skandi_program_days').insert(rows.map(({week_index,...rest})=>rest)));
  }
  return error;
}

async function setProgramWeekPhase(programId,weekIndex,phase){
  if(!PHASES.includes(phase)||weekIndex<1) return;
  const {error}=await sb.from('skandi_program_weeks').upsert({program_id:programId,week_index:weekIndex,phase},{onConflict:'program_id,week_index'});
  if(error) return alert(error.message);
  await loadAll();
  openProgramSheet(programId);
  render();
}

async function resetProgramWeek(programId,weekIndex){
  if(!confirm(t('pgm.resetWeekConfirm'))) return;
  const [{error:daysError},{error:metaError}]=await Promise.all([
    sb.from('skandi_program_days').delete().eq('program_id',programId).eq('week_index',weekIndex),
    sb.from('skandi_program_weeks').delete().eq('program_id',programId).eq('week_index',weekIndex)
  ]);
  if(daysError||metaError) return alert((daysError||metaError).message);
  await loadAll();
  openProgramSheet(programId);
  render();
}

// El camino de antes de la 102: el día es una columna de la rutina. Un día solo puede tener una,
// así que asignar libera a la que lo ocupaba -- no hay índice único en (user_id, weekday), la
// regla la sostiene el cliente. skandi_activity_templates no tiene updated_at (migración 063),
// así que el patch no es el mismo para las dos tablas.
async function writeWeekdayColumn(kind,weekday,valueId){
  const table=kind==='template'?'skandi_templates':'skandi_activity_templates';
  const stamp=new Date().toISOString();
  const patch=w=>kind==='template'?{weekday:w,updated_at:stamp}:{weekday:w};
  const rows=kind==='template'?myTemplates():state.activityTemplates.filter(x=>x.user_id===state.user.id);
  for(const r of rows.filter(x=>x.weekday===weekday&&x.id!==valueId)){
    const {error}=await sb.from(table).update(patch(null)).eq('id',r.id);
    if(error) return error;
  }
  if(valueId){
    const {error}=await sb.from(table).update(patch(weekday)).eq('id',valueId);
    if(error) return error;
  }
  return null;
}

// Crear una rutina desde un día del programa la deja asignada a esa ranura al guardarla, en vez
// de devolver al miembro a buscarla en la lista. La intención se cancela al cerrar el modal
// (closeModal) para que no caiga en una ranura vieja la próxima vez que se cree una rutina.
// Todo camino centrado en la rutina («ponla el martes», «muévela», «quítala») pasa por aquí, y
// aquí es donde vive la inversión: con programa activo escribe la ranura del programa, sin él
// escribe el weekday de la rutina. Ningún llamador sabe cuál de los dos mundos está corriendo.
async function assignToDay(kind,weekday,id){
  const owns=programOwnsWeek(kind);
  const write=(day,value)=>owns?writeProgramDay(activeProgramForKind(kind).id,0,day,kind,value)
                               :writeWeekdayColumn(kind,day,value);
  const current=id?(kind==='template'?dayOfTemplate(id):dayOfActivity(id)):null;
  if(weekday==null) return current==null?null:await write(current,null);
  // Mover, no duplicar. Con weekday el movimiento era gratis (una sola columna); con el programa
  // hay que vaciar el día viejo a mano. Repetir la misma rutina dos días de la semana sí se
  // puede, pero desde la hoja del programa, que edita cada día por separado.
  if(owns&&current!=null&&current!==weekday){
    const error=await write(current,null);
    if(error) return error;
  }
  return await write(weekday,id);
}
let pendingProgramSlot=null;
function createRoutineForProgramDay(programId,weekday,weekIndex=0){
  closeModal();
  pendingProgramSlot={programId,weekday,weekIndex};
  openTemplateBuilder(weekday);
}

async function duplicateProgram(id){
  const p=state.programs.find(x=>x.id===id);
  if(!p) return;
  const {data,error}=await sb.from('skandi_programs').insert({
    user_id:state.user.id,name:t('pgm.copyName',{name:p.name}),notes:p.notes,is_active:false,
    weeks:p.weeks||4,deload_week:p.deload_week!==false
  }).select().single();
  if(error) return alert(error.message);
  const days=programDaysOf(id).map(d=>({program_id:data.id,week_index:d.week_index||0,
    sort_order:d.sort_order||0,weekday:d.weekday,template_id:d.template_id,activity_template_id:d.activity_template_id}));
  if(days.length){
    const daysError=await insertProgramDays(days);
    if(daysError){
      await sb.from('skandi_programs').delete().eq('id',data.id);
      return alert(daysError.message);
    }
  }
  const weeks=programWeeksOf(id).map(w=>({program_id:data.id,week_index:w.week_index,phase:w.phase,note:w.note}));
  if(weeks.length){
    const {error:weeksError}=await sb.from('skandi_program_weeks').insert(weeks);
    if(weeksError){
      await sb.from('skandi_programs').delete().eq('id',data.id);
      return alert(weeksError.message);
    }
  }
  await loadAll();
  openProgramSheet(data.id);
  render();
}

// Un programa ya no solo puede nacer de una semana que ya armaste a mano: «en blanco» abre la
// hoja del programa recién guardada para llenar los siete días ahí, que es el camino que faltaba
// (y el que la gente busca al decir "crear un programa"). «Mi semana actual» conserva el camino
// viejo, que sigue siendo el más rápido cuando la semana ya está armada.
let programStartMode='blank';

let savingProgram=false;
async function saveProgram(id){
  if(savingProgram) return;
  const name=$('pgmName').value.trim();
  if(!name) return alert(t('pgm.errName'));
  const notes=$('pgmNotes').value.trim()||null;
  const weeks=Number($('pgmWeeks').value)||4;
  const deload_week=$('pgmDeload').checked;
  const track=id?null:($('pgmTrack')?.value||'mixed');
  const fromWeek=!id&&programStartMode==='week';
  const snapshot=fromWeek?currentWeekSnapshot():null;
  if(fromWeek&&!snapshot.length) return alert(t('pgm.errEmptyWeek'));
  // Con pista fija, la foto de la semana solo se queda con SU disciplina -- lo demás quedaría
  // huérfano en skandi_program_days, invisible para skandi_ensure_week (esa rama solo lee lo
  // que gobierna esta pista).
  const trackedSnapshot=snapshot&&track!=='mixed'
    ?snapshot.map(r=>track==='strength'?{...r,activity_template_id:null}:{...r,template_id:null})
        .filter(r=>r.template_id||r.activity_template_id)
    :snapshot;
  savingProgram=true;
  try{
    if(id){
      const {error}=await sb.from('skandi_programs').update({name,notes,weeks,deload_week,updated_at:new Date().toISOString()}).eq('id',id);
      if(error) return alert(error.message);
      closeModal();
      await loadAll();
      render();
      return;
    }
    // Un programa copiado de la semana describe lo que ya se entrena, así que nace cargado --
    // desactivando lo que ya gobierne SU pista (un mixto desactiva cualquier otro programa
    // activo, el trigger de exclusividad de la 110 lo exige igual). Uno en blanco es un
    // borrador -- activarlo sin días vaciaría la semana entera.
    const previous=fromWeek
      ?(track==='mixed'?activeProgram():activeProgramForKind(track==='endurance'?'activity':'template'))
      :null;
    if(fromWeek&&previous){
      const {error:deactivateError}=await sb.from('skandi_programs').update({is_active:false}).eq('id',previous.id);
      if(deactivateError) return alert(deactivateError.message);
    }
    const {data,error}=await sb.from('skandi_programs').insert({
      user_id:state.user.id,name,notes,weeks,deload_week,track,is_active:fromWeek,
      start_date:fromWeek?todayKey():null
    }).select().single();
    if(error){
      if(previous?.id) await sb.from('skandi_programs').update({is_active:true}).eq('id',previous.id);
      return alert(error.message);
    }
    if(trackedSnapshot&&trackedSnapshot.length){
      const daysError=await insertProgramDays(trackedSnapshot.map(r=>({program_id:data.id,week_index:0,...r})));
      if(daysError){
        await sb.from('skandi_programs').delete().eq('id',data.id);
        if(previous?.id) await sb.from('skandi_programs').update({is_active:true}).eq('id',previous.id);
        return alert(daysError.message);
      }
    }
    await loadAll();
    // Se abre la hoja en vez de cerrar: un programa en blanco todavía no es nada hasta que se
    // le ponen los días, y mandar al miembro de vuelta a la lista a buscarlo es perder el hilo.
    openProgramSheet(data.id);
    render();
  } finally {
    savingProgram=false;
  }
}

async function updateProgramFromWeek(id){
  if(savingProgram) return;
  const snapshot=currentWeekSnapshot();
  if(!snapshot.length) return alert(t('pgm.errEmptyWeek'));
  savingProgram=true;
  try{
    const {error:delError}=await sb.from('skandi_program_days').delete().eq('program_id',id).eq('week_index',0);
    if(delError) return alert(delError.message);
    const error=await insertProgramDays(snapshot.map(r=>({program_id:id,week_index:0,...r})));
    if(error) return alert(error.message);
    await sb.from('skandi_programs').update({updated_at:new Date().toISOString()}).eq('id',id);
    closeModal();
    await loadAll();
    render();
  } finally {
    savingProgram=false;
  }
}

// Cargar un programa lo convierte en el dueño del plan y arranca su ciclo desde hoy. Ya no
// reescribe `weekday`: esa columna queda como sugerencia y respaldo sin programa.
function openProgramLoadConfirm(id){
  const program=state.programs.find(p=>p.id===id);
  if(!program) return;
  const defaultWeeks=program.weeks||4;
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('pgm.loadTitle'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${esc(t('pgm.loadBody',{name:program.name}))}</p>
    <label class="eyebrow">${esc(t('pgm.weeksLabel'))}</label>
    <select id="pgmLoadWeeks" class="field left">
      ${Array.from({length:16},(_,i)=>i+1).map(n=>`<option value="${n}" ${defaultWeeks===n?'selected':''}>${n}</option>`).join('')}
    </select>
    <label class="card row" style="margin:0 0 10px"><div><strong>${esc(t('pgm.deloadToggle'))}</strong></div><input id="pgmLoadDeload" type="checkbox" ${program.deload_week===false?'':'checked'}></label>
    <p class="form-note">${esc(t('pgm.loadDeloadNote'))}</p>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="applyProgram('${id}',Number($('pgmLoadWeeks').value),$('pgmLoadDeload').checked)">${esc(t('pgm.loadConfirm'))}</button>`;
}

let applyingProgram=false;
async function applyProgram(id,weeks,deloadWeek){
  if(applyingProgram) return;
  const program=state.programs.find(p=>p.id===id);
  if(!program) return;
  applyingProgram=true;
  try{
    const stamp=new Date().toISOString();
    // Solo se desactiva el que ya manda en la MISMA pista -- activar fuerza no debe apagar
    // resistencia, ni viceversa. Un programa mixto sí reemplaza cualquier otro activo (fuerza,
    // resistencia o mixto): si quedara uno de otra pista, el trigger de exclusividad de la 110
    // rechazaría la activación sola.
    const previous=program.track==='mixed'
      ?state.programs.find(p=>p.is_active&&p.id!==id)||null
      :state.programs.find(p=>p.is_active&&p.id!==id&&(p.track===program.track||p.track==='mixed'))||null;
    if(previous){
      const {error:deactivateError}=await sb.from('skandi_programs').update({is_active:false}).eq('id',previous.id);
      if(deactivateError) return alert(deactivateError.message);
    }
    const {error:activateError}=await sb.from('skandi_programs').update({
      is_active:true,weeks:Math.max(1,Math.min(16,Number(weeks)||4)),
      deload_week:deloadWeek!==false,start_date:todayKey(),updated_at:stamp
    }).eq('id',id);
    if(activateError){
      if(previous?.id) await sb.from('skandi_programs').update({is_active:true}).eq('id',previous.id);
      await loadAll();
      render();
      return alert(activateError.message);
    }
    closeModal();
    await loadAll();
    setView('train');
  } finally {
    applyingProgram=false;
  }
}

async function deleteProgram(id){
  if(!confirm(t('pgm.confirmDelete'))) return;
  const {error}=await sb.from('skandi_programs').delete().eq('id',id).eq('user_id',state.user.id);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
// Calendario fechado (migración 080)
//
// Tres capas, y cada una contesta una pregunta distinta:
//   plantilla (lo que se repite) → calendario (lo que toca ESE día) → sesión (lo que hiciste).
//
// La regla que resuelve el conflicto fuerza-vs-resistencia es `is_edited`: la plantilla se
// propaga sola a los días futuros que nadie tocó, y en cuanto editas un día concreto ese día
// queda congelado. Por eso la fuerza se planea una vez y la resistencia semana a semana, con
// el mismo mecanismo y sin dos sistemas de agenda paralelos.
//
// Todo lo que estampa vive en el RPC skandi_ensure_week; aquí nunca se genera un plan a mano.
// ═══════════════════════════════════════════════════════════════════════════

const DISCIPLINES=['strength','run','bike','swim','row','walk','hiit','hyrox','mobility','rest','other'];
// Un glifo por disciplina en vez de iconos a color: en una celda de ~48 px un icono de 24
// no deja lugar para el texto, y el color se reserva para el estado (hecho / saltado).
const DISC_GLYPH={strength:'●',run:'▲',bike:'◆',swim:'≈',row:'■',walk:'·',hiit:'✦',hyrox:'✦',mobility:'○',rest:'—',other:'◇'};
const ACT_TO_DISC={running:'run',cycling:'bike',swimming:'swim',rowing:'row',walking:'walk',hiit:'hiit',hyrox:'hyrox',other:'other'};
const DISC_TO_ACT={run:'running',bike:'cycling',swim:'swimming',row:'rowing',walk:'walking',hiit:'hiit',hyrox:'hyrox',mobility:'other',other:'other'};
const disciplineLabel=d=>tOr('disc.'+d,d);
const disciplineShort=d=>tOr('disc.short.'+d,d);
// Umbrales del atleta en el formato que espera SkandiPlan.paceFor. Sin umbral cargado devuelve
// null y quien llama se cae a "Z4" a secas — el mismo comportamiento que había antes de esto.
function planZones(){
  const st=state.skandiSettings||{};
  return {runThresholdSecKm:st.run_threshold_sec_km||null,swimCssSec100m:st.swim_css_sec_100m||null,bikeFtpW:st.bike_ftp_w||null};
}
// Ritmo/potencia real cuando hay umbral cargado ("4:35/km"), o null para que quien llama se
// caiga a su propio formato de "Z4" (corto en el calendario, "Zona 4" en la hoja del día).
const zonePace=(zone,discipline)=>zone?SkandiPlan.paceFor(zone,discipline,planZones()):null;

const mondayOf=date=>{const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;};
const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d;};
// `day` es una columna date sin zona: la clave se arma en hora local (dayKey), nunca con
// toISOString(), que en Mazatlán (UTC-7) corre el día para todo lo de antes de las 7 pm.
const todayKey=()=>dayKey(new Date());
const keyToDate=key=>new Date(key+'T00:00:00');

function plannedRows(){ return state.planned.filter(p=>p.user_id===state.user.id); }

// 'replaced' se queda fuera de la vista a propósito: es la lápida que impide que la plantilla
// vuelva a estampar esa sesión, no un día que fallaste. Mostrarla encimaba dos planes en la
// misma celda cada vez que se reemplazaba un programa.
function plannedOfDay(key){
  return plannedRows().filter(p=>p.day===key&&p.status!=='replaced')
    .sort((a,b)=>(a.sort_order-b.sort_order)||(new Date(a.created_at)-new Date(b.created_at)));
}

// Lo que entrenaste sin que estuviera planeado. No es un error que haya que capturar en un
// formulario: aparece en el día con borde punteado y ya. Sin esto, un plan estricto convierte
// cualquier improvisación en un hueco.
function extrasOfDay(key){
  const linkedS=new Set(plannedRows().map(p=>p.session_id).filter(Boolean));
  const linkedA=new Set(plannedRows().map(p=>p.activity_id).filter(Boolean));
  const out=[];
  state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&dayKey(s.completed_at)===key&&!linkedS.has(s.id))
    .forEach(s=>out.push({kind:'session',id:s.id,discipline:'strength',title:s.title,
      sub:[s.duration_sec?`${Math.round(s.duration_sec/60)} ${t('common.min')}`:null].filter(Boolean).join(' · ')}));
  state.externalActivities.filter(a=>dayKey(a.performed_at)===key&&!linkedA.has(a.id))
    .forEach(a=>out.push({kind:'activity',id:a.id,discipline:ACT_TO_DISC[a.activity_type]||'other',
      title:activityTypeLabel(a.activity_type),
      sub:[`${a.duration_min} ${t('common.min')}`,a.distance_km?`${a.distance_km} km`:null].filter(Boolean).join(' · ')}));
  return out;
}

function plannedTitle(p){
  if(p.title) return p.title;
  const tpl=p.template_id?state.templates.find(x=>x.id===p.template_id):null;
  return tpl?tpl.name:disciplineLabel(p.discipline);
}

function plannedSub(p){
  const parts=[];
  if(p.discipline==='strength'&&p.template_id){
    const n=state.items.filter(i=>i.template_id===p.template_id).length;
    if(n) parts.push(`${n} ${tp(n,'common.exercises')}`);
  }
  // Un entrenamiento estructurado (structure jsonb) manda sobre los campos planos: el mismo
  // dato no se muestra dos veces en dos formatos, y "6×400 Z4 · 45 min" ya trae su propio total.
  if(Array.isArray(p.structure)&&p.structure.length){
    const lbl=SkandiPlan.label(p.structure);
    if(lbl) parts.push(lbl);
  }else{
    if(p.target_distance_km) parts.push(`${p.target_distance_km} km`);
    if(p.target_duration_min) parts.push(`${p.target_duration_min} ${t('common.min')}`);
    if(p.target_zone) parts.push(zonePace(p.target_zone,p.discipline)||`Z${p.target_zone}`);
  }
  if(p.notes) parts.push(p.notes);
  return parts.join(' · ');
}

// La misma línea, pero para un renglón: sin la nota, que es lo único que no tiene largo
// acotado. El detalle completo vive en la hoja del día.
function plannedSubShort(p){
  const full=plannedSub(p);
  if(!p.notes) return full;
  const tail=' · '+p.notes;
  return full.endsWith(tail)?full.slice(0,-tail.length):full;
}

// Lo que cabe en una celda de calendario: distancia si la hay, si no duración, si no el
// nombre corto de la disciplina.
//
// Se intentó poner el nombre primero —la queja legítima es que una semana de fuerza muestra
// 55' / 40' / 40' y no distingue "Front Lever B" de "Full Body"— y en pantalla es peor: la
// celda mide 46 px y todas las rutinas de un mismo programa comparten prefijo, así que los
// siete días quedaban en "D…". En una rejilla de mes lo que se lee es densidad y estado, no
// nombres; el nombre vive un tap adentro, en la hoja del día, y en la pestaña Hoy.
function plannedShort(p){
  // El descanso ya se distingue por la celda punteada y sin relleno. Escribir "Descanso" en
  // 46 px solo producía "— D…", que es ruido con forma de dato.
  if(p.discipline==='rest') return '';
  if(p.target_distance_km) return `${Math.round(p.target_distance_km*10)/10} km`;
  if(p.target_duration_min) return `${p.target_duration_min}'`;
  if(p.discipline==='strength') return plannedTitle(p);
  return disciplineShort(p.discipline);
}

// ---- Estampado ----------------------------------------------------------------------------

// Un ciclo terminado no se repite por calendario. El programa tiene prioridad; sin uno activo
// se conserva el freno histórico del bloque suelto. Con dos pistas (110), "más allá" es más
// allá de TODAS las que gobiernan algo -- si la fuerza ya terminó pero la resistencia sigue
// corriendo (o al revés), la semana todavía necesita estamparse para la que sigue viva.
function beyondActiveBlock(monday){
  const programs=[activeProgramForKind('template'),activeProgramForKind('activity')].filter(p=>p&&p.start_date);
  if(programs.length){
    return programs.every(p=>{
      const start=mondayOf(keyToDate(p.start_date));
      return monday>=addDays(start,programCycleLength(p)*7);
    });
  }
  const block=currentTrainingBlock();
  if(!block) return false;
  const start=mondayOf(new Date(block.start_date+'T00:00:00'));
  const end=addDays(start,(block.build_weeks+1)*7);
  return monday>=end;
}

// Una semana se estampa cuando se abre, nunca por adelantado: materializar un año entero
// significaría que cambiar una rutina tiene que reescribir 52 semanas de filas.
async function ensureWeek(monday){
  const key=dayKey(monday);
  if(state.ensuredWeeks.has(key)) return 0;
  state.ensuredWeeks.add(key);
  if(beyondActiveBlock(monday)) return 0;
  const {data,error}=await sb.rpc('skandi_ensure_week',{p_week_start:key});
  if(error){ state.plannedReady=false; return 0; }
  return Number(data)||0;
}

async function reloadPlanned(){
  const from=dayKey(addDays(mondayOf(new Date()),-126));
  const to=dayKey(addDays(mondayOf(new Date()),182));
  const {data,error}=await sb.from('skandi_planned_sessions').select('*')
    .eq('user_id',state.user.id).gte('day',from).lte('day',to).order('day');
  if(error){ state.plannedReady=false; return; }
  state.plannedReady=true;
  state.planned=data||[];
}

// Firma de "qué rutina vive en qué día". Si cambió desde la última carga, los estampados que
// ya se hicieron pueden haber quedado obsoletos y hay que dejar que el RPC los re-sincronice.
// Es lo que hace que mover la rutina del martes al jueves se propague sin un botón de "aplicar".
// Con dos pistas (110) la firma es la de cada programa que gobierne algo, por su propia
// columna -- una firma por pista en vez de una sola, así que cambiar solo la resistencia no
// pisa la firma de la fuerza (ni viceversa).
function weekTemplateSignature(){
  const sig=(p,col)=>{
    if(!p) return '';
    const cycle=p.start_date?`p${p.id}:${p.start_date}:${p.weeks}:${p.deload_week===false?0:1}`:`p${p.id}:draft`;
    const slots=programDaysOf(p.id).map(d=>`${d.week_index||0}:${d.weekday}:${d.sort_order||0}:${d[col]||'-'}`);
    return [cycle,...slots].join('|');
  };
  const strength=activeProgramForKind('template');
  const endurance=activeProgramForKind('activity');
  if(strength||endurance) return [sig(strength,'template_id'),sig(endurance,'activity_template_id')].join('||');
  return ['w',...weekPlan().map((d,i)=>`${i}:${d.template_id||'-'}:${d.activity_template_id||'-'}`)].join('|');
}

async function ensureCalendarWeeks(weeks=1,offset=0){
  if(!state.plannedReady) return;
  const start=mondayOf(addDays(new Date(),offset*7));
  const counts=await Promise.all(Array.from({length:weeks},(_,i)=>ensureWeek(addDays(start,i*7))));
  if(counts.reduce((a,b)=>a+b,0)>0){ await reloadPlanned(); render(); }
}

// ---- Conciliación planeado ↔ hecho --------------------------------------------------------

// Sin esto el calendario es una agenda decorativa: no hay adherencia, y la adherencia es la
// única razón por la que un plan sirve de algo. Corre sola al terminar una sesión o registrar
// una actividad — nunca se le pide al usuario que ligue nada a mano.
async function reconcilePlanned({day,discipline,sessionId=null,activityId=null,plannedId=null}){
  if(!state.plannedReady) return;
  const row=plannedId
    ? plannedRows().find(p=>p.id===plannedId)
    : plannedRows().find(p=>p.day===day&&p.discipline===discipline&&p.status==='planned'&&!p.session_id&&!p.activity_id);
  if(!row) return;
  await sb.from('skandi_planned_sessions').update({
    status:'done',completed_at:new Date().toISOString(),
    session_id:sessionId,activity_id:activityId
  }).eq('id',row.id);
}

// ---- Vista Entrenar -----------------------------------------------------------------------

function setTrainTab(tab){
  state.trainTab=tab;
  render();
  if(tab==='calendar') ensureCalendarWeeks(state.calWeeks,state.calOffset);
}

function trainView(){
  const tab=state.trainTab||'today';
  const tabs=[['today','train.tabToday'],['calendar','train.tabCalendar'],['routines','train.tabRoutines']];
  const body=tab==='calendar'?calendarTab():tab==='routines'?routinesTab():trainTodayTab();
  return `
    ${activeWorkoutBanner()}
    <div class="row"><h1 class="compact">${esc(t('train.title'))}</h1>${tab==='routines'?`<button class="btn primary" onclick="openCreateChooser()">${esc(t('create.btn'))}</button>`:''}</div>
    <div class="seg sub" style="margin:12px 0 16px">
      ${tabs.map(([key,label])=>`<button class="${tab===key?'active':''}" onclick="setTrainTab('${key}')">${esc(t(label))}</button>`).join('')}
    </div>
    ${body}`;
}

// El reloj mide de noche lo que decide si el entrenamiento del día va a salir bien. La
// tarjeta enseña cuatro números y, cuando hay algo que decir, UNA frase — no un tablero:
// el sueño y el pulso en reposo solo significan algo contra tu propio promedio, no en
// absoluto, así que se comparan contra los 7 días previos antes de opinar.
// formatHours() no sirve aquí: está hecho para cuentas regresivas de recuperación, redondea
// hacia arriba y tira los minutos, así que 6h35m de sueño saldrían como "7h".
function formatSleep(secs){
  const total=Math.max(0,Math.round(Number(secs)||0)/60);
  const h=Math.floor(total/60), m=Math.round(total%60);
  return h?`${h}h${m?String(m).padStart(2,'0')+'m':''}`:`${m}m`;
}

function wellnessCardHtml(){
  const rows=(state.wellness||[]).slice().sort((a,b)=>b.day.localeCompare(a.day));
  const latest=rows[0];
  if(!latest) return '';
  const key=todayKey();
  const yesterday=dayKey(addDays(new Date(),-1));
  const whenLabel=latest.day===key?t('wellness.today')
    :latest.day===yesterday?t('wellness.yesterday')
    :keyToDate(latest.day).toLocaleDateString(LANG,{day:'numeric',month:'short'});

  const prev=rows.slice(1,8);
  const mean=(list,field)=>{
    const vals=list.map(r=>Number(r[field])).filter(Number.isFinite);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  };
  const notes=[];
  const sleepAvg=mean(prev,'sleep_secs');
  if(latest.sleep_secs&&sleepAvg){
    const diff=latest.sleep_secs-sleepAvg;
    // Menos de 45 min de diferencia es ruido de medición, no una señal.
    if(Math.abs(diff)>=45*60){
      const gap=formatSleep(Math.abs(diff));
      notes.push(t(diff<0?'wellness.sleepBelow':'wellness.sleepAbove',{gap}));
    }
  }
  const hrAvg=mean(prev,'resting_hr');
  if(latest.resting_hr&&hrAvg&&latest.resting_hr-hrAvg>=3){
    notes.push(t('wellness.hrHigh',{n:Math.round(latest.resting_hr-hrAvg)}));
  }

  const stat=(value,label)=>(value==null||value===0)?'':`<div class="stat"><strong>${esc(String(value))}</strong><small>${esc(label)}</small></div>`;
  return `<section class="card">
    <div class="row"><h2>${esc(t('wellness.title'))}</h2><span class="muted">${esc(whenLabel)}</span></div>
    <div class="wellness-grid">
      ${stat(latest.sleep_secs?formatSleep(latest.sleep_secs):null,t('wellness.sleep'))}
      ${stat(latest.resting_hr,t('wellness.restingHr'))}
      ${stat(latest.hrv,t('wellness.hrv'))}
      ${stat(latest.steps?latest.steps.toLocaleString(LANG):null,t('wellness.steps'))}
    </div>
    ${notes.length?`<p class="form-note" style="margin:10px 0 0">${esc(notes.join(' '))}</p>`:''}
  </section>`;
}

function trainTodayTab(){
  if(!state.plannedReady) return legacyTodayTab();
  const key=todayKey();
  const rows=plannedOfDay(key);
  const extras=extrasOfDay(key);
  const dateLabel=keyToDate(key).toLocaleDateString(LANG,{weekday:'long',day:'numeric',month:'long'});
  return `
    <section class="card">
      <div class="row"><h2>${esc(capFirst(dateLabel))}</h2></div>
      ${rows.length||extras.length
        ?`<div class="stack" style="margin-top:12px">${rows.map(plannedRowHtml).join('')}${extras.map(extraRowHtml).join('')}</div>`
        :empty(t('cal.emptyDay'))}
      <button class="btn" style="width:100%;margin-top:12px" onclick="openPlannedForm('${key}')">${icon('plus',16)} ${esc(t('cal.addSession'))}</button>
    </section>
    <button class="btn small ghost" style="width:100%" onclick="startFreeWorkout()">${icon('play',16)} ${esc(t('workout.startFree'))}</button>
    ${wellnessCardHtml()}
    ${trainingBlockCardHtml()}`;
}

// Antes de correr la migración 080 el calendario no existe, pero la app sí: se cae a las
// tarjetas de siempre en vez de mostrar una pantalla vacía.
function legacyTodayTab(){
  const todayTpl=templateOfDay(todayDow());
  return `
    <p class="form-note">${esc(t('cal.needsMigration'))}</p>
    ${enduranceTodayCard()}
    ${todayTpl?workoutCard(todayTpl):empty(t('home.noRoutine'))}
    ${trainingBlockCardHtml()}`;
}

function plannedRowHtml(p){
  const sub=plannedSubShort(p);
  return `<div class="plan-row ${p.status}" onclick="openPlannedItem('${p.id}')">
    <span class="disc">${DISC_GLYPH[p.discipline]||'◇'}</span>
    <div class="plan-body">
      <strong>${esc(plannedTitle(p))}</strong>
      ${sub?`<p>${esc(sub)}</p>`:''}
    </div>
    <span class="plan-status ${p.status}">${esc(t('cal.status.'+p.status))}</span>
  </div>`;
}

function extraRowHtml(x){
  return `<div class="plan-row extra" onclick="${x.kind==='session'?`openSessionDetail('${x.id}')`:`openActivityDetail('${x.id}')`}">
    <span class="disc">${DISC_GLYPH[x.discipline]||'◇'}</span>
    <div class="plan-body">
      <strong>${esc(x.title)}</strong>
      ${x.sub?`<p>${esc(x.sub)}</p>`:''}
    </div>
    <span class="plan-status extra">${esc(t('cal.status.extra'))}</span>
  </div>`;
}

// ---- La cuadrícula ------------------------------------------------------------------------
//
// TrainingPeaks pone un mes completo porque es una app de escritorio. A 375 px eso son celdas
// de 50 px donde no cabe el nombre del entrenamiento: aquí la semana es un renglón y se ven
// cuatro, con la adherencia de cada una en el encabezado.

function calShift(delta){
  state.calOffset+=delta*state.calWeeks;
  render();
  ensureCalendarWeeks(state.calWeeks,state.calOffset);
}

function calToday(){
  state.calOffset=0;
  render();
  ensureCalendarWeeks(state.calWeeks,state.calOffset);
}

function calMore(){
  state.calWeeks+=4;
  render();
  ensureCalendarWeeks(state.calWeeks,state.calOffset);
}

function calendarTab(){
  if(!state.plannedReady) return `<p class="form-note">${esc(t('cal.needsMigration'))}</p>`;
  const start=mondayOf(addDays(new Date(),state.calOffset*7));
  const weeks=Array.from({length:state.calWeeks},(_,i)=>addDays(start,i*7));
  const monthLabel=start.toLocaleDateString(LANG,{month:'long',year:'numeric'});
  return `
    <div class="row" style="margin-bottom:12px">
      <span class="eyebrow">${esc(monthLabel)}</span>
      <span class="cal-nav">
        <button class="icon-btn tiny" onclick="calShift(-1)" aria-label="${esc(t('cal.prev'))}">‹</button>
        <button class="btn small" onclick="calToday()">${esc(t('cal.today'))}</button>
        <button class="icon-btn tiny" onclick="calShift(1)" aria-label="${esc(t('cal.next'))}">›</button>
      </span>
    </div>
    ${calendarWeeksHtml(weeks)}
    <button class="btn" style="width:100%" onclick="calMore()">${esc(t('cal.moreWeeks'))}</button>`;
}

// Una semana sin nada planeado ocupaba una tarjeta entera con siete celdas punteadas vacías.
// Cuatro seguidas —lo normal en cuanto miras un mes hacia adelante— empujaban fuera de
// pantalla lo único accionable. Las vacías consecutivas se juntan en un renglón que se abre
// al tocarlo; la semana actual nunca se colapsa, aunque esté vacía, porque es la que se
// consulta.
function calendarWeeksHtml(weeks){
  const currentKey=dayKey(mondayOf(new Date()));
  const out=[];
  let run=[];
  const flush=()=>{
    if(!run.length) return;
    // Una sola semana vacía no gana nada por colapsarse: el renglón ocuparía casi lo mismo
    // y escondería el día al que igual se puede tocar para planear algo.
    if(run.length===1) out.push(weekRowHtml(run[0]));
    else{
      const from=dayKey(run[0]), to=dayKey(run[run.length-1]);
      out.push(`<button type="button" class="cal-empty" onclick="calExpandRange('${from}')">
        <span>${esc(tp(run.length,'cal.emptyWeeks'))}</span>
        <small>${esc(new Date(from+'T12:00:00').toLocaleDateString(LANG,{day:'numeric',month:'short'}))} – ${esc(new Date(to+'T12:00:00').toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</small>
        <i>${esc(t('cal.emptyWeeksShow'))}</i>
      </button>`);
    }
    run=[];
  };
  weeks.forEach(monday=>{
    const key=dayKey(monday);
    const empty=key!==currentKey&&!state.calExpanded.has(key)&&weekIsEmpty(monday);
    if(empty) run.push(monday);
    else { flush(); out.push(weekRowHtml(monday)); }
  });
  flush();
  return out.join('');
}

// Vacía = ni plan ni nada entrenado. Un extra (algo que hiciste sin planearlo) cuenta: esa
// semana sí tiene contenido que mirar.
function weekIsEmpty(monday){
  for(let i=0;i<7;i++){
    const k=dayKey(addDays(monday,i));
    if(plannedOfDay(k).length||extrasOfDay(k).length) return false;
  }
  return true;
}

function calExpandRange(fromKey){
  const start=keyToDate(fromKey);
  for(let i=0;i<state.calWeeks;i++){
    const monday=addDays(start,i*7);
    if(!weekIsEmpty(monday)) break;
    state.calExpanded.add(dayKey(monday));
  }
  render();
}

// La adherencia de una semana, en un solo lugar. Inicio la calculaba por su cuenta a partir de
// las plantillas con weekday, así que en una semana personalizada las dos pantallas daban
// números distintos sobre lo mismo.
//
// Cuenta SOLO filas planeadas: sumarle los entrenamientos extra daría "3 / 3" en una semana
// donde se hizo una de tres cosas planeadas y dos improvisadas, y leería como semana completa
// justo cuando el plan se abandonó. Y el descanso queda fuera — no es algo que se complete, y
// en el denominador impedía que una semana con dos descansos llegara nunca al 100%.
function weekAdherence(monday){
  const days=Array.from({length:7},(_,i)=>dayKey(addDays(monday,i)));
  const sessions=days.flatMap(k=>plannedOfDay(k)).filter(p=>p.discipline!=='rest');
  const total=sessions.length;
  const done=sessions.filter(p=>p.status==='done'||p.status==='partial').length;
  return {days,total,done,pct:total?Math.min(100,Math.round(done/total*100)):0};
}

// De dónde salió esta semana, en una palabra: el nombre del programa activo si nadie tocó
// ningún día, "Personalizada" en cuanto se editó/quitó/agregó algo a mano, o nada si no hay
// ni programa ni ajustes (la rotación estándar de rutinas sin programa detrás). Mismo cálculo
// que ya usaba openWeekMenu para su nota, ahora también visible sin abrir el menú -- para que
// un día, una semana y el programa de varias semanas se lean juntos, no en tres pantallas.
function weekOriginLabel(mondayKey){
  const days=weekDayKeys(mondayKey);
  const rows=plannedRows().filter(p=>days.includes(p.day));
  if(!rows.length) return '';
  const untouched=rows.every(p=>['template','program'].includes(p.source)&&!p.is_edited);
  if(!untouched) return t('cal.weekCustom');
  // Puede venir de hasta dos programas (fuerza + resistencia, 110) -- se listan los nombres
  // distintos que de verdad aparecen esta semana, no solo "el" programa activo.
  const ids=[...new Set(rows.map(p=>p.program_id).filter(Boolean))];
  const names=ids.map(id=>state.programs.find(p=>p.id===id)?.name).filter(Boolean);
  if(names.length) return names.join(' + ');
  return rows.some(p=>p.source==='program')?(activeProgram()?.name||''):'';
}

function calendarWeekPhase(monday){
  const programs=[activeProgramForKind('template'),activeProgramForKind('activity')]
    .filter((p,i,arr)=>p&&arr.findIndex(x=>x?.id===p.id)===i);
  const phases=programs.map(program=>{
    const weekIndex=programWeekIndex(program,monday);
    if(weekIndex==null||weekIndex>programCycleLength(program)) return null;
    return phaseLabel(programWeekMeta(program,weekIndex).phase);
  }).filter(Boolean);
  return [...new Set(phases)].join(' · ');
}

function weekRowHtml(monday){
  const {days,total,done,pct}=weekAdherence(monday);
  const isCurrent=dayKey(monday)===dayKey(mondayOf(new Date()));
  const label=`${monday.toLocaleDateString(LANG,{day:'numeric',month:'short'})} – ${addDays(monday,6).toLocaleDateString(LANG,{day:'numeric',month:'short'})}`;
  const origin=weekOriginLabel(dayKey(monday));
  const phase=calendarWeekPhase(monday);
  return `<section class="cal-week ${isCurrent?'current':''}">
    <div class="cal-week-head">
      <span class="cal-week-name">${esc(isCurrent?t('cal.thisWeek'):label)}${origin?` · <b>${esc(origin)}</b>`:''}${phase?` · ${esc(phase)}`:''}</span>
      <span class="cal-week-actions">
        ${total?`<span class="cal-score ${done>=total?'full':''}">${done}<i>/${total}</i></span>`:''}
        <button class="icon-btn tiny" onclick="openWeekMenu('${dayKey(monday)}')" aria-label="${esc(t('cal.weekMenu'))}">${icon('ellipsis',14)}</button>
      </span>
    </div>
    ${total?`<div class="cal-bar"><i style="width:${pct}%"></i></div>`:''}
    <div class="cal-grid">${days.map((k,i)=>dayCellHtml(k,i)).join('')}</div>
  </section>`;
}

// Una celda de ~46 px no da para el nombre completo de una rutina, y truncarlo a seis
// caracteres produce "Handst", que no dice más que el punto de color. La celda enseña el
// punto (disciplina y estado) y un nombre corto de un solo renglón; el nombre completo, la
// distancia y la zona viven un tap adentro, en la hoja del día. Tope de 3 marcas por día: un
// cuarto lugar entero para "hay más" es mejor que una cuarta fila apretándose contra las
// otras tres.
const CAL_MAX_MARKS=3;
function dayCellHtml(key,i){
  const rows=plannedOfDay(key);
  const extras=extrasOfDay(key);
  const isToday=key===todayKey();
  const isPast=key<todayKey();
  const items=[
    ...rows.map(p=>({cls:p.status,glyph:DISC_GLYPH[p.discipline]||'◇',label:plannedShort(p)})),
    ...extras.map(x=>({cls:'extra',glyph:DISC_GLYPH[x.discipline]||'◇',label:disciplineShort(x.discipline)}))
  ];
  const hidden=Math.max(0,items.length-CAL_MAX_MARKS);
  const marks=[
    ...items.slice(0,CAL_MAX_MARKS).map(m=>`<span class="cal-mark ${m.cls}"><i class="cal-dot">${m.glyph}</i><b>${esc(m.label)}</b></span>`),
    hidden?`<span class="cal-mark more">+${hidden}</span>`:''
  ].join('');
  return `<button class="cal-day ${isToday?'today':''} ${!items.length?'rest':''} ${isPast?'past':''}" onclick="openPlannedDay('${key}')">
    <span class="cal-dow">${esc(DOW_MINI[i])}</span>
    <span class="cal-num">${keyToDate(key).getDate()}</span>
    <span class="cal-marks">${marks}</span>
  </button>`;
}

// ---- La semana como unidad -----------------------------------------------------------------
//
// Editar día por día alcanza para un ajuste, no para "la semana que viene es de descarga y no
// sigo el programa". Ese caso es de semana entera y necesita sus propias acciones, porque la
// alternativa —borrar los días de la plantilla— cambiaría TODAS las semanas futuras, que es
// justo lo contrario de lo que se quiere: la plantilla se conserva intacta para volver a ella.

function weekDayKeys(mondayKey){
  const monday=keyToDate(mondayKey);
  return Array.from({length:7},(_,i)=>dayKey(addDays(monday,i)));
}

function openWeekMenu(mondayKey){

  const label=`${keyToDate(mondayKey).toLocaleDateString(LANG,{day:'numeric',month:'short'})} – ${keyToDate(days[6]).toLocaleDateString(LANG,{day:'numeric',month:'short'})}`;

    <div class="row"><h1>${esc(t('cal.weekMenu'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>

// Cargar un programa para una sola semana no toca skandi_programs.is_active ni el bloque de
// descarga (ver applyProgram) -- es un reemplazo puntual de 7 días, no "cargar" el programa
// como plan estándar. Por eso tiene su propio picker en vez de reusar openProgramPicker.
function openWeekProgramPicker(mondayKey){

  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('cal.loadProgramWeek'))}</h1><button class="x" onclick="openWeekMenu('${mondayKey}')" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>

        <button class="btn small primary" onclick="applyProgramToWeek('${p.id}','${mondayKey}')">${esc(t('pgm.use'))}</button>
      </div>`).join('')||empty(t('pgm.empty'))}
    </div>`;

let applyingProgramWeek=false;
async function applyProgramToWeek(programId,mondayKey){
  if(applyingProgramWeek) return;
  const program=state.programs.find(p=>p.id===programId);
  if(!program) return;
  if(!confirm(t('cal.loadProgramWeekConfirm',{name:program.name}))) return;
  applyingProgramWeek=true;
  try{
    const days=weekDayKeys(mondayKey);

    // 1) Igual que detachWeek: congela lo estampado por plantilla que nadie tocó, para que la
    // rotación estándar de esta semana no se vuelva a estampar encima de lo que se cargue aquí.
    const templateIds=plannedRows().filter(p=>days.includes(p.day)&&p.source==='template'&&!p.is_edited).map(p=>p.id);
    if(templateIds.length){
      const {error}=await sb.from('skandi_planned_sessions').update({is_edited:true}).in('id',templateIds);
      if(error) return alert(error.message);
    }

    // 2) Igual que clearWeek: lo que no vaya a quedar en el set nuevo y no esté ya hecho se
    // marca 'replaced' -- mismo mecanismo que la Parte A, aplicado a la semana completa en vez
    // de una sola sesión, así ningún día se queda tachado por accidente.
    const current=plannedRows().filter(p=>days.includes(p.day)&&p.status!=='done'&&!p.session_id&&!p.activity_id);
    if(current.length){
      const {error}=await sb.from('skandi_planned_sessions').update({status:'replaced',is_edited:true}).in('id',current.map(p=>p.id));
      if(error) return alert(error.message);
    }

    // 3) Una fila por cada día que el programa sí llena -- mismo patrón manual que ya usó a
    // mano la migración 086 para esta semana. source:'program' (permitido desde la 080, sin
    // usar hasta ahora) en vez de 'manual': dice de dónde salió sin inventar una columna nueva.
    const inserts=[];
    for(const d of programPlan(programId,0).filter(d=>d.template_id||d.activity_template_id)){
      const day=days[d.weekday];
      if(!day) continue;
      if(d.template_id){
        const tpl=state.templates.find(x=>x.id===d.template_id);
        inserts.push({user_id:state.user.id,day,sort_order:0,discipline:'strength',source:'program',is_edited:true,
          program_id:programId,program_week_index:0,template_id:d.template_id,title:tpl?.name||null});
      }
      if(d.activity_template_id){
        const act=state.activityTemplates.find(x=>x.id===d.activity_template_id);
        inserts.push({user_id:state.user.id,day,sort_order:d.template_id?1:0,
          discipline:act?(ACT_TO_DISC[act.activity_type]||'other'):'other',
          source:'program',is_edited:true,program_id:programId,program_week_index:0,activity_template_id:d.activity_template_id,
          target_distance_km:act?.target_distance_km||null,target_duration_min:act?.target_duration_min||null,
          target_zone:act?.target_zone||null,title:act?activityTypeLabel(act.activity_type):null});
      }
    }
    if(inserts.length){
      const {error}=await sb.from('skandi_planned_sessions').insert(inserts);
      if(error) return alert(error.message);
    }
    if(!(await afterPlannedWrite(null))) return;
    closeModal();
  } finally {
    applyingProgramWeek=false;
  }
}

// Congela la semana frente al estampado sin tocarla: los días siguen ahí, pero la plantilla
// ya no manda sobre ellos y puedes reescribirlos uno por uno.
async function detachWeek(mondayKey){
  const days=weekDayKeys(mondayKey);
  const ids=plannedRows().filter(p=>days.includes(p.day)&&p.source==='template'&&!p.is_edited).map(p=>p.id);
  if(!ids.length){ closeModal(); return; }
  const {error}=await sb.from('skandi_planned_sessions').update({is_edited:true}).in('id',ids);
  if(await afterPlannedWrite(error)) closeModal();
}

// Deja la semana en blanco para construirla desde cero. Lo estampado se marca 'skipped' en vez
// de borrarse: esa lápida es lo que impide que el RPC lo vuelva a poner al abrir la semana.
async function clearWeek(mondayKey){
  if(!confirm(t('cal.clearWeekConfirm'))) return;
  const days=weekDayKeys(mondayKey);
  const rows=plannedRows().filter(p=>days.includes(p.day)&&p.status!=='done'&&!p.session_id&&!p.activity_id);
  const stamped=rows.filter(p=>p.source==='template').map(p=>p.id);
  const own=rows.filter(p=>p.source!=='template').map(p=>p.id);
  let error=null;
  if(stamped.length) ({error}=await sb.from('skandi_planned_sessions').update({status:'replaced',is_edited:true}).in('id',stamped));
  if(!error&&own.length) ({error}=await sb.from('skandi_planned_sessions').delete().in('id',own));
  if(await afterPlannedWrite(error)) closeModal();
}

// Vuelve a la plantilla: se borra lo estampado que no se hizo y se estampa de nuevo. Lo que ya
// entrenaste nunca se toca — el historial no es del programa, es tuyo.
async function resetWeek(mondayKey){
  if(!confirm(t('cal.resetWeekConfirm'))) return;
  const days=weekDayKeys(mondayKey);
  const ids=plannedRows().filter(p=>days.includes(p.day)&&p.status!=='done'&&!p.session_id&&!p.activity_id).map(p=>p.id);
  let error=null;
  if(ids.length) ({error}=await sb.from('skandi_planned_sessions').delete().in('id',ids));
  if(error) return alert(error.message);
  state.ensuredWeeks.delete(mondayKey);
  await ensureWeek(keyToDate(mondayKey));
  await reloadPlanned();
  render();
  closeModal();
}

function activityDetailHtml(a,p){

    a.max_heart_rate?{v:a.max_heart_rate,l:t('garmin.maxHr')+' · bpm'}:null,
    (a.elevation_gain_m||a.elevation_m)?{v:Math.round(a.elevation_gain_m||a.elevation_m),l:t('activity.elevation')+' · m'}:null,
    a.calories?{v:a.calories,l:t('garmin.calories')+' · kcal'}:null,
    a.rounds?{v:a.rounds,l:t('logAct.rounds').toLowerCase()}:null,
    a.work_sec?{v:`${a.work_sec}/${a.rest_sec||0}`,l:'s'}:null,
    a.pool_length_m?{v:a.pool_length_m,l:'m'}:null,
    a.stroke?{v:t('logAct.stroke'+a.stroke[0].toUpperCase()+a.stroke.slice(1)),l:''}:null,
  ].filter(Boolean);
  const planLine=p?[p.target_distance_km?`${p.target_distance_km} km`:null,p.target_duration_min?`${p.target_duration_min} ${t('common.min')}`:null,p.target_zone?(zonePace(p.target_zone,p.discipline)||`Z${p.target_zone}`):null].filter(Boolean).join(' · '):'';
  return `
    <div class="row">
      <div><p class="muted">${esc(new Date(a.performed_at).toLocaleDateString(LANG,{weekday:'long',day:'numeric',month:'long'}))}</p><h1>${esc(activityTypeLabel(a.activity_type))} ${badges}</h1></div>
      <div class="row" style="gap:8px;flex:0 0 auto">
        ${p?`<button class="icon-btn tiny" onclick="openPlannedItemMenu('${p.id}')" aria-label="${esc(t('activity.options'))}">${icon('ellipsis',16)}</button>`:''}
        <button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button>
      </div>
    </div>
    <section class="grid">
      ${stats.map(s=>`<div class="stat"><strong>${esc(s.v)}</strong><small>${esc(s.l)}</small></div>`).join('')}
    </section>
    <section class="card"><span class="pill dark">${esc(t('logAct.rowIntensity',{v:a.intensity}))}</span></section>
    ${planLine?`<p class="form-note" style="margin-top:10px">${esc(t('activity.plan',{plan:planLine}))}</p>`:''}
    ${a.note?`<section class="card" style="margin-top:10px"><div class="eyebrow">${esc(t('session.notes'))}</div><p style="margin-top:6px">${esc(a.note)}</p></section>`:''}
    <div id="splitsBox">${splitsSectionHtml(a,p)}</div>
    <div id="activityFeedback"></div>
    <button id="activityAnalyzeBtn" class="btn primary" style="width:100%;margin-top:14px" onclick="loadActivityFeedback('${a.id}'${p?`,'${p.id}'`:''})">${icon('trending',16)} ${esc(t('activity.analyze'))}</button>
    ${p?`<button class="btn" style="width:100%;margin-top:10px" onclick="openPlannedDay('${p.day}')">${esc(t('cal.back'))}</button>`:''}`;
}

// Solo Strava trae splits_metric, y solo cuando alguien pidió el detalle (webhook o esta misma
// acción) — el backfill masivo nunca los trae (migración 105). Con distancia y sin splits
// todavía, se ofrece el botón; sin distancia (HIIT, fuerza importada) no hay parcial que pedir.
function splitsSectionHtml(a,p){
  if(a.external_source!=='strava') return '';
  if(Array.isArray(a.splits)&&a.splits.length){
    const rows=a.splits.map((s,i)=>{
      const paceSec=s.km>0?Math.round(s.sec/s.km):null;
      return `<div class="row" style="margin-top:4px">
        <span>${i+1}${s.km!==1?` (${s.km}km)`:''}</span>
        <span>${paceSec?fmtPace(paceSec)+'/km':'—'}</span>
        <span class="muted">${s.hr?`${s.hr} bpm`:''}${s.elev_m?` · ${s.elev_m>0?'+':''}${s.elev_m}m`:''}</span>
      </div>`;
    }).join('');
    return `<section class="card" style="margin-top:10px">
      <div class="eyebrow">${esc(t('activity.splits'))}</div>
      <div class="stack" style="margin-top:8px">${rows}</div>
    </section>`;
  }
  if(a.distance_km){
    return `<button class="btn" style="width:100%;margin-top:10px" onclick="loadActivitySplits('${a.id}'${p?`,'${p.id}'`:''})">${esc(t('activity.loadSplits'))}</button>`;
  }
  return '';
}

async function loadActivitySplits(activityId,plannedId){
  const box=$('splitsBox');
  if(box) box.innerHTML=`<p class="muted" style="margin-top:10px">${esc(t('activity.loadingSplits'))}</p>`;
  try{
    const data=await skandiApi('strava-splits',{activity_id:activityId});
    const a=state.externalActivities.find(x=>x.id===activityId);
    if(a) a.splits=data.splits||null;
    if(!data.splits&&box) box.innerHTML=`<p class="muted" style="margin-top:10px">${esc(t('activity.noSplits'))}</p>`;
    else if(box){
      const p=plannedId?plannedRows().find(x=>x.id===plannedId):null;
      box.innerHTML=splitsSectionHtml(a,p);
    }
  }catch(e){
    if(box) box.innerHTML=`<p class="muted" style="margin-top:10px">${esc(e.message||String(e))}</p>`;
  }
}

// Mismo patrón que loadMealSuggestion: texto nada más (sin foto), mismo JSON-schema, misma
// cuota compartida de IA. La retroalimentación no se guarda en ningún lado — es para leerla
// ahí mismo, igual que la sugerencia de comida.
async function loadActivityFeedback(activityId,plannedId){
  const a=state.externalActivities.find(x=>x.id===activityId);
  if(!a) return;
  const p=plannedId?plannedRows().find(x=>x.id===plannedId):null;
  const box=$('activityFeedback');
  const btn=$('activityAnalyzeBtn');
  if(btn){btn.disabled=true;btn.textContent=t('activity.analyzing');}
  if(box) box.innerHTML=`<p class="muted" style="margin-top:14px">${esc(t('activity.analyzing'))}</p>`;
  try{
    const recent=(state.externalActivities||[])
      .filter(x=>x.id!==activityId&&x.activity_type===a.activity_type)
      .slice(0,5)
      .map(x=>({activity_type:x.activity_type,duration_min:x.duration_min,distance_km:x.distance_km,avg_heart_rate:x.avg_heart_rate,performed_at:x.performed_at}));
    const data=await skandiApi('activity-feedback',{
      activity:{
        activity_type:a.activity_type,duration_min:a.duration_min,distance_km:a.distance_km,
        avg_heart_rate:a.avg_heart_rate,max_heart_rate:a.max_heart_rate,elevation_gain_m:a.elevation_gain_m,
        calories:a.calories,intensity:a.intensity,intensity_source:a.intensity_source,performed_at:a.performed_at
      },
      target:p?{distance_km:p.target_distance_km,duration_min:p.target_duration_min,zone:p.target_zone}:null,
      recent,
      max_heart_rate:state.skandiSettings?.max_heart_rate||null
    });
    state.aiCallsToday=data.quota?.used??state.aiCallsToday;
    if(box) box.innerHTML=`
      <section class="card" style="margin-top:14px">
        <div class="eyebrow">${esc(t('activity.assessment'))}</div>
        <p style="margin-top:6px">${esc(data.assessment)}</p>
        <div class="eyebrow" style="margin-top:14px">${esc(t('activity.nextStep'))}</div>
        <p style="margin-top:6px">${esc(data.next_step)}</p>
      </section>
      <p class="muted" style="font-size:11px;margin-top:8px">${esc(t('food.aiLeft',{n:aiLeft()}))}</p>`;
  }catch(e){
    if(box) box.innerHTML=`<p class="muted" style="margin-top:14px;color:var(--pink)">${esc(e.message||String(e))}</p>`;
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML=`${icon('trending',16)} ${esc(t('activity.analyze'))}`;}
  }
}

// ---- Mutaciones ---------------------------------------------------------------------------
//
// Todas marcan is_edited: tocar un día lo congela frente al estampado. Sin eso, la próxima
// vez que se abra la semana la plantilla borraría el ajuste.

async function afterPlannedWrite(error){
  if(error){ alert(error.message); return false; }
  await reloadPlanned();
  render();
  refreshDaySheet();
  return true;
}

async function setPlannedStatus(id,status){
  const patch={status,is_edited:true};
  if(status==='done') patch.completed_at=new Date().toISOString();
  if(status==='planned'){ patch.completed_at=null; patch.session_id=null; patch.activity_id=null; }
  const {error}=await sb.from('skandi_planned_sessions').update(patch).eq('id',id);
  if(await afterPlannedWrite(error)) openPlannedDay(plannedRows().find(x=>x.id===id)?.day||state.dayOpen);
}

// Quitar un día estampado NO borra la fila: la deja como 'skipped'. Es a la vez la lápida que
// evita que el RPC la vuelva a estampar la próxima vez que se abra la semana, y el dato
// honesto de que esa sesión existía y no se hizo. Una fila manual sí se borra: nadie la va a
// re-crear.
async function removePlanned(id){
  const p=plannedRows().find(x=>x.id===id);
  if(!p) return;
  if(!confirm(t('cal.removeConfirm'))) return;
  const {error}=p.source==='template'
    ? await sb.from('skandi_planned_sessions').update({status:'replaced',is_edited:true}).eq('id',id)
    : await sb.from('skandi_planned_sessions').delete().eq('id',id);
  if(await afterPlannedWrite(error)) openPlannedDay(p.day);
}

function openPlannedMove(id,mode){
  const p=plannedRows().find(x=>x.id===id);
  if(!p) return;
  $('modalCard').innerHTML=`
