<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#012456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skandi Fit">
<meta name="application-name" content="Skandi Fit">
<link rel="manifest" href="/skandi-manifest.json?v=20260822-03">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/skandi-180.png?v=20260822-03">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/skandi-192.png?v=20260822-03">
<title>Skandi Fit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/skandi-recovery.js?v=20260822-03"></script>
<script src="/body-figure.js?v=20260822-03"></script>
<script src="/skandi-nutrition.js?v=20260822-03"></script>
<style>
:root{
  --bg:#eef4f8;
  --panel:#ffffff;
  --panel2:#f5f8fb;
  --panel3:#e7eef5;
  --line:#d7e1ea;
  --text:#071f42;
  --muted:#607086;
  --dof-navy:#012456;
  --dof-deep:#000f32;
  --dof-blue:#334c6d;
  --dof-steel:#788ba1;
  --dof-ice:#f4fafe;
  --lime:#00a8c8;
  --green:#1d9a6c;
  --amber:#f0a22e;
  --pink:#d44854;
  --blue:#245f9f;
  --wash:rgba(1,36,86,.08);
  --shadow:0 18px 44px rgba(1,36,86,.12);
  --glow:0 18px 38px rgba(0,168,200,.18);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{position:relative;min-height:100dvh;padding-bottom:76px}
body:before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:radial-gradient(circle at 18% -8%,rgba(1,36,86,.18),transparent 34%),linear-gradient(180deg,#f8fbfe 0%,#eef4f8 48%,#e7eff5 100%);opacity:1}
button,input,textarea,select{font:inherit}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--dof-navy);cursor:pointer;flex:0 0 auto}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 104px;overflow:hidden}
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 42px;align-items:center;gap:12px;margin:-18px -14px 22px;padding:14px 14px 12px;background:rgba(244,250,254,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(1,36,86,.08)}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.ship-mark{width:70px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);box-shadow:0 8px 22px rgba(1,36,86,.10)}
.ship-mark img{width:72px;height:34px;object-fit:contain}
.brand-text{display:grid;line-height:1.05}
.brand-text small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:1000}
.brand-text span,.brand-text small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dof-badge{height:36px;max-width:78px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line);box-shadow:0 10px 22px rgba(1,36,86,.10)}
.auth-brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.auth-ship{width:100%;height:138px;border-radius:14px;background:linear-gradient(180deg,#fff,#e9f1f7);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -18px 32px rgba(1,36,86,.08)}
.auth-ship img{width:96%;height:112px;object-fit:contain}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px}
.auth-tab{background:transparent;color:var(--muted);border-radius:8px;padding:11px;font-weight:1000}
.auth-tab.active{background:var(--dof-navy);color:#fff;box-shadow:0 10px 20px rgba(1,36,86,.18)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--dof-navy);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden;box-shadow:0 10px 22px rgba(1,36,86,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:grid;gap:14px;margin-bottom:16px;padding-top:4px}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--dof-steel);font-weight:900;font-size:12px}
h1{font-size:clamp(32px,7.8vw,52px);line-height:.98;margin:0;letter-spacing:0;overflow-wrap:anywhere}
h2{font-size:24px;margin:0 0 10px;line-height:1.05}
h3{font-size:19px;margin:0;line-height:1.1}
p{color:var(--muted);line-height:1.45;margin:0}
.focus{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--dof-navy),#183d68 64%,#55708b);color:#fff;border-radius:14px;padding:18px;box-shadow:0 22px 52px rgba(1,36,86,.22)}
.focus.action{width:100%;border:0;text-align:left;display:block;cursor:pointer}
.focus.action:hover{transform:translateY(-1px);box-shadow:0 26px 58px rgba(1,36,86,.26)}
.focus:after{content:"";position:absolute;right:-18px;bottom:-24px;width:210px;height:110px;background:url('/assets/skandi/skandi-nomad-cutout.png') center/contain no-repeat;opacity:.20}
.focus>*{position:relative;z-index:1}
.focus p{color:#d9e5ee}
.focus .eyebrow{color:#aebdca!important}
.focus-cta{display:flex;align-items:center;gap:8px;margin-top:14px;color:#fff;font-weight:1000}
.focus-cta i{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:#fff;color:var(--dof-navy);font-style:normal}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),rgba(255,255,255,.24) 0);position:relative;font-weight:1000;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--dof-navy)}
.ring span{position:relative;z-index:1;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat,.card,.workout,.exercise,.feed,.modal-card{background:rgba(255,255,255,.86);border:1px solid rgba(1,36,86,.10);border-radius:8px;box-shadow:var(--shadow)}
.click-card{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.click-card:hover{transform:translateY(-1px);border-color:rgba(1,36,86,.20);box-shadow:0 22px 48px rgba(1,36,86,.16)}
.stat{padding:18px;min-height:100px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--dof-navy),var(--blue),#a9bac9);opacity:.82}
.stat strong{display:block;font-size:36px;line-height:1;color:var(--text)}
.stat small{display:block;color:var(--muted);font-weight:800;margin-top:12px}
.card{padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.accent{color:var(--blue)}
.btn{background:#fff;color:var(--dof-navy);border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease;box-shadow:0 8px 18px rgba(1,36,86,.06)}
.btn:hover{transform:translateY(-1px);background:var(--panel3)}
.btn.primary{background:var(--dof-navy);color:#fff;box-shadow:0 16px 30px rgba(1,36,86,.22);border-color:var(--dof-navy)}
.btn.ghost{background:var(--panel2)}
.btn.danger{color:var(--pink)}
.btn.small{padding:9px 12px;border-radius:10px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-top:1px solid rgba(1,36,86,.10);z-index:20;box-shadow:0 -16px 34px rgba(1,36,86,.10)}
.tabs-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{background:transparent;color:#727482;display:grid;gap:2px;place-items:center;font-weight:900;font-size:11px;padding:6px 1px;border-radius:8px;min-height:50px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:430px){.tab{font-size:9.5px;padding:6px 0}.tab svg{width:20px;height:20px}}
/* ── Comida ─────────────────────────────────────────────────────────────── */
.kcal-ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--lime) var(--p),rgba(1,36,86,.10) 0);position:relative}
.kcal-ring.over{background:conic-gradient(var(--pink) 100%,var(--pink) 0)}
.kcal-ring i{position:absolute;inset:9px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-style:normal;line-height:1.05}
.kcal-ring b{display:block;font-size:25px;font-weight:1000}
.kcal-ring small{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:1000}
.macro-grid{display:grid;gap:11px;flex:1;min-width:0}
.macro-row .row{margin-bottom:5px;font-size:13px}
.macro-row .bar i{background:var(--dof-navy)}
.macro-row.p .bar i{background:var(--blue)}
.macro-row.c .bar i{background:var(--amber)}
.macro-row.f .bar i{background:var(--lime)}
.macro-row.s .bar i{background:var(--dof-steel)}
.macro-row.s.over .bar i{background:var(--pink)}
.macro-row.s.over{color:var(--pink)}
.meal-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-top:9px;cursor:pointer;text-align:left;width:100%}
.meal-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel3);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.meal-thumb img{width:100%;height:100%;object-fit:cover}
.meal-card h3{font-size:15px;margin:0}
.meal-card p{color:var(--muted);font-size:12px;margin:2px 0 0}
.meal-kcal{font-weight:1000;font-size:16px;white-space:nowrap}
.pick-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.pick{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:900;font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px}
.pick b{font-weight:1000}
.pick small{color:var(--muted);font-weight:900}
.add-fab{position:fixed;right:max(14px,calc(50% - 396px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--dof-navy);color:#fff;display:grid;place-items:center;box-shadow:0 16px 32px rgba(1,36,86,.34);z-index:19}
.item-row{display:grid;grid-template-columns:26px 1fr 74px;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item-row:first-of-type{border-top:0}
.item-row .lbl{min-width:0}
.item-row .lbl strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .lbl small{color:var(--muted);font-size:11.5px}
.item-row input.g{width:74px;padding:8px;text-align:right;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:900}
.item-row.off{opacity:.45}
.item-row.fat{background:rgba(240,162,46,.07);border-radius:9px;padding:9px 7px;border-top:0;margin-top:6px}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.conf.hi{background:var(--green)}.conf.mid{background:var(--amber)}.conf.lo{background:var(--pink)}
.input-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.input-choice button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px 11px;display:grid;gap:5px;place-items:center;font-weight:1000;color:var(--text);text-align:center;font-size:13px}
.input-choice button small{color:var(--muted);font-weight:900;font-size:10.5px;letter-spacing:.03em}
.input-choice button:disabled{opacity:.5}
.venue-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none}
.tab.active{color:var(--dof-navy);background:rgba(1,36,86,.08)}
.week{display:grid;gap:9px}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;background:var(--panel2);border-radius:8px;padding:13px 14px;color:var(--muted);font-weight:900;border:1px solid rgba(1,36,86,.08)}
.day.today{background:var(--dof-navy);color:#fff;box-shadow:0 14px 28px rgba(1,36,86,.16)}
.day.today .icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.day span:nth-child(2){color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise{padding:14px;display:grid;gap:10px;margin:10px 0}
.ex-head{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}
.ex-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ex-actions-row{display:flex;gap:6px}
.ex-info-hint{display:inline-flex;vertical-align:middle;color:var(--dof-steel);opacity:.55}
.thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(180deg,#eef4f8,#dfe9f1);object-fit:cover;display:grid;place-items:center;color:var(--dof-steel);overflow:hidden;border:1px solid rgba(1,36,86,.08)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.play{color:var(--blue);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;background:rgba(36,95,159,.10);color:var(--dof-navy);border-radius:999px;font-weight:1000}
.pill.dark{background:var(--panel2);color:var(--muted)}
.muscles{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;background:#e2eaf2;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dof-navy),var(--blue));width:0}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 34px 46px 30px;gap:6px;align-items:center}
.set-row.no-weight{grid-template-columns:26px 1fr 34px 46px 30px}
.clean-toggle{height:100%;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:1000;font-size:13px}
.clean-toggle.clean{background:#e4f7ee;color:#1f9d5c;border-color:#bfe9d3}
.clean-toggle.broken{background:#fdeceb;color:var(--pink);border-color:#f6c9c5}
.progression-ready{display:block;width:100%;text-align:left;margin-top:6px;padding:7px 10px;background:#e4f7ee;color:#1f9d5c;border:1px solid #bfe9d3;border-radius:8px;font-weight:700;font-size:12px}
.field{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px;text-align:center;box-shadow:inset 0 1px 0 rgba(1,36,86,.03)}
.field-narrow{padding:13px 3px}
.field.left{text-align:left}
textarea.field{min-height:112px;text-align:left;resize:vertical}
.check{height:48px;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center}
.check.done{background:var(--dof-navy);color:#fff}
.set-remove{width:30px;height:48px;background:transparent;border:none;color:#c7ccd3;display:grid;place-items:center}
.add-set-link{justify-self:start;background:transparent;border:none;box-shadow:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 2px;margin-top:2px}
.workout-bar{position:sticky;top:-20px;z-index:5;margin:-20px -20px 0;padding:14px 18px 12px;background:linear-gradient(180deg,rgba(247,251,254,.98),rgba(247,251,254,.78));backdrop-filter:blur(18px);border-bottom:0;border-radius:8px 8px 0 0;overflow:visible}
.workout-bar-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.workout-bar-title h1{font-size:22px;line-height:1}
.workout-bar-title small{display:block;color:var(--muted);font-weight:800;font-size:12px;margin-bottom:3px}
/* Floating timer: a small tap-to-expand pill instead of a full-width hero console, so the
   clock doesn't compete with the exercise list for attention while training. Fixed-positioned
   (escapes .modal-card's overflow:auto clipping since no ancestor sets a transform/filter). */
.float-timer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 28px)}
.float-timer-chip{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#051a3a,#062f68);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 14px;box-shadow:0 14px 30px rgba(1,36,86,.30);color:#fff}
.float-timer-dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf;flex:0 0 auto}
.float-timer-dot.paused{background:rgba(255,255,255,.4)}
.float-timer-chip strong{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.float-timer-restbadge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.6);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .16s ease,color .16s ease,border-color .16s ease}
.float-timer-restbadge.resting{background:rgba(255,180,81,.20);border-color:rgba(255,180,81,.40);color:#ffb451}
.float-timer-chevron{color:rgba(255,255,255,.6);display:flex;transition:transform .16s ease}
.float-timer.open .float-timer-chevron{transform:rotate(90deg)}
.float-timer-panel{width:min(220px,calc(100vw - 28px));background:linear-gradient(135deg,#051a3a,#062f68);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px;box-shadow:0 18px 38px rgba(1,36,86,.30);color:#fff}
.float-timer-panel .row-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.timer-label{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.66);font-size:9px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}
.timer-label:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.float-timer-panel .elapsed-big{display:block;margin-top:4px;color:#fff;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.float-timer-panel .elapsed-hint{display:block;margin-top:3px;color:rgba(255,255,255,.58);font-style:normal;font-size:10px;font-weight:800}
.timer-toggle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.20);flex:0 0 auto}
.float-timer-panel .rest-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:14px}
.timer-step{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);color:#fff;font-size:11px;font-weight:1000;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.timer-rest{text-align:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.timer-rest span{display:block;color:#d8922f;font-size:8px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
.timer-rest strong{display:block;color:#fff;font-size:17px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.rest-progress{margin-top:10px;height:5px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.rest-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb451,#2dd4bf);border-radius:999px;transition:width .25s linear}
.float-timer-panel .unit-toggle{margin-top:12px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.float-timer-panel .unit-toggle button{color:rgba(255,255,255,.76)}
.float-timer-panel .unit-toggle button.active{background:#fff;color:var(--dof-navy)}
.workout-content{margin:16px -20px -20px;padding:22px 20px 20px;background:linear-gradient(180deg,#f3f8fc,#f7fbfe 88px,#f7fbfe);border-top:1px solid rgba(1,36,86,.08)}
.workout-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.workout-section-head h2{font-size:20px;margin:0}
.workout-progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.progress-pill{display:inline-flex;align-items:baseline;gap:4px;background:#e7f0f7;color:var(--dof-navy);border-radius:999px;padding:8px 12px;font-weight:1000}
.progress-pill strong{font-size:18px}
.progress-pill small{color:var(--muted);font-weight:900}
.unit-toggle{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.unit-toggle button{background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}
.unit-toggle button.active{background:var(--dof-navy);color:#fff}
.workout-footer{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:10px;margin:14px 0 0;padding:4px 0 0}
.workout-footer .btn{min-height:52px;box-shadow:none}
.workout-footer .danger-action{color:var(--pink);border-color:rgba(212,72,84,.32);background:#fff}
/* Sticks "Save routine" to the bottom of the modal-card's own scroll area (mirrors the
   sticky-top .workout-bar trick) so it stays reachable without scrolling past ~100 exercises. */
.tpl-save-bar{position:sticky;bottom:-20px;z-index:5;margin:14px -20px -20px;padding:12px 20px calc(12px + 20px);background:linear-gradient(0deg,rgba(247,251,254,.98),rgba(247,251,254,.85) 70%,rgba(247,251,254,0));backdrop-filter:blur(18px)}
.modal-card .exercise{box-shadow:0 10px 26px rgba(1,36,86,.08);background:rgba(255,255,255,.92)}
.modal-card .exercise h3{font-size:18px}
.modal-card .field{box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;flex:0 0 auto;box-shadow:0 6px 14px rgba(1,36,86,.06)}
.icon-btn.tiny{width:30px;height:30px;font-size:13px}
.icon-btn.danger{color:var(--pink)}
.rest-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}
.chip.active{background:var(--dof-navy);color:#fff;border-color:var(--dof-navy)}
.routine-card{cursor:pointer}
.routine-card .routine-summary{align-items:center}
.routine-card .routine-title{min-width:0}
.routine-card .routine-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routine-count{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.routine-toggle{width:34px;height:34px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;transition:transform .16s ease,background .16s ease,color .16s ease}
.routine-card.open .routine-toggle{transform:rotate(90deg);background:var(--dof-navy);color:#fff;border-color:var(--dof-navy)}
.routine-details{display:grid;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.feed{padding:16px;margin:12px 0}
.feed-title{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.leader{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.body-fig-wrap{position:relative;margin-top:14px;text-align:center}
.body-fig-wrap svg{width:auto;height:auto;max-width:100%;max-height:56vh;display:inline-block}
.mini-body-card{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;overflow:hidden}
.mini-body-fig{height:170px;display:grid;place-items:center;background:linear-gradient(180deg,#f7fbfe,#edf4f9);border:1px solid var(--line);border-radius:8px}
.mini-body-fig svg{height:152px;max-width:100%}
.mini-body-card h2{margin-bottom:5px}
.mini-body-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.muscle-builder{display:grid;gap:8px;margin:10px 0 14px}
.muscle-builder-row{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.muscle-builder-row strong{font-size:14px}
.muscle-builder-row input[type="range"]{width:100%;accent-color:var(--dof-navy)}
.muscle-builder-row .field{padding:8px}
.form-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.body-flip-btn{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 10px 22px rgba(1,36,86,.14)}
.muscle-region{cursor:pointer;transition:opacity .15s}
.muscle-region:hover,.muscle-region:active{opacity:.82}
.muscle-legend{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.muscle-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.muscle-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.auth{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(460px,100%);background:rgba(255,255,255,.90);border:1px solid rgba(1,36,86,.10);border-radius:8px;padding:24px;box-shadow:0 28px 70px rgba(1,36,86,.18)}
.auth-logo{font-size:54px;font-weight:1000;color:var(--dof-navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center;overflow:hidden}
.modal.show{display:flex}
.modal-card{width:min(820px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:88dvh;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;border-radius:8px 8px 0 0;padding:20px;margin:0 auto}
.x{width:44px;height:44px;border-radius:12px;background:var(--panel2);color:var(--text);display:grid;place-items:center;flex:0 0 auto}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}
.signup-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-lang{background:transparent;color:var(--muted);font-weight:900;font-size:13px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{background:transparent;color:var(--muted);border-radius:9px;padding:11px 8px;font-weight:1000;font-size:14px}
.seg button.active{background:var(--dof-navy);color:#fff;box-shadow:0 8px 18px rgba(1,36,86,.18)}
.seg.sub button{font-size:13px;padding:10px 4px}
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:12px}
.member{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.member:hover{background:var(--panel3)}
.member-avatar{width:36px;height:36px;border-radius:50%;background:var(--dof-navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto;overflow:hidden}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-name{min-width:0;display:grid;gap:2px}
.member-name strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-name small{color:var(--muted);font-weight:800;font-size:11px}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart-legend{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:var(--muted);font-size:11px;font-weight:800}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.pgm-day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-weight:800;font-size:13px}
.pgm-day>span:first-child{color:var(--muted);font-size:11px;letter-spacing:.08em}
.pgm-day.rest>span:nth-child(2){color:var(--muted);font-weight:700}
.hidden{display:none!important}
.empty{padding:28px 18px;border:1px dashed #bfd0df;border-radius:8px;text-align:center;color:var(--muted);background:rgba(255,255,255,.58)}
@media (min-width:760px){
  .modal{align-items:center;padding:24px}
  .modal-card{border-radius:8px}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr}
  .ex-head{grid-template-columns:58px 1fr auto}
  .thumb{width:58px;height:58px}
  .set-row{grid-template-columns:24px 1fr 1fr 30px 42px 26px}
  .set-row.no-weight{grid-template-columns:24px 1fr 30px 42px 26px}
  .app{padding-left:13px;padding-right:13px}
  .brand{font-size:22px}
  .brand-text small{font-size:10px}
  .focus .row{align-items:flex-start}
  .focus h2{font-size:25px}
  .tab{font-size:9.5px;min-height:46px;padding:5px 0}
  .tab svg{width:20px;height:20px}
  body{padding-bottom:68px}
  .row{align-items:flex-start}
  .row>.btn,.row>.pill{flex:0 0 auto}
  .signup-names{grid-template-columns:1fr}
  .workout-bar{margin:-16px -16px 0;padding:12px 12px 10px}
  .workout-bar-title h1{font-size:21px}
  .float-timer{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px}
  .float-timer-chip{padding:8px 10px}
  .float-timer-panel{padding:12px}
  .modal-card{width:calc(100vw - 16px);max-width:calc(100vw - 16px);padding:16px}
  .tpl-save-bar{margin:14px -16px -16px;padding:10px 16px calc(10px + 16px)}
  .workout-content{margin:14px -16px -16px;padding:16px}
  .workout-section-head{margin-bottom:10px}
  .workout-footer{grid-template-columns:1fr 1fr;margin:12px 0 0;padding:0}
  .modal-card .exercise{padding:12px;margin:8px 0}
  .modal-card .field{padding:10px 8px}
  .modal-card .set-row{gap:5px}
  .mini-body-card{grid-template-columns:92px 1fr;gap:12px}
  .mini-body-fig{height:142px}
  .mini-body-fig svg{height:128px}
  .muscle-builder-row{grid-template-columns:78px 1fr 56px;gap:7px;padding:9px}
}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="auth-box stack">
    <div class="auth-brand">
      <img class="dof-badge" src="/assets/skandi/dof-logo.png" alt="DOF">
      <div class="eyebrow">Skandi Nomad</div>
    </div>
    <div class="auth-ship"><img src="/assets/skandi/skandi-nomad-cutout.png" alt="Skandi Nomad"></div>
    <div>
      <div class="eyebrow">Skandi Fit</div>
      <h1 data-i18n="auth.title">Train with the crew</h1>
    </div>
    <p data-i18n="auth.blurb">A lightweight DOF crew training app for the Skandi Nomad. Sign in or create an account to build routines, log lifts, and follow the boat's progress.</p>
    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" onclick="setAuthMode('login')" data-i18n="auth.signin">Sign in</button>
      <button id="signupTab" class="auth-tab" onclick="setAuthMode('signup')" data-i18n="auth.createAccount">Create account</button>
    </div>
    <div id="signupNames" class="signup-names hidden">
      <input id="firstName" class="field left" type="text" placeholder="First name" data-i18n-ph="auth.firstName">
      <input id="lastName" class="field left" type="text" placeholder="Last name" data-i18n-ph="auth.lastName">
    </div>
    <input id="email" class="field left" type="email" placeholder="you@email.com">
    <input id="password" class="field left" type="password" placeholder="Password" data-i18n-ph="auth.password">
    <button id="authBtn" class="btn primary" onclick="submitAuth()" data-i18n="auth.signin">Sign in</button>
    <button type="button" class="auth-lang" onclick="toggleLang()" data-i18n="auth.langSwitch">Español</button>
    <p id="authMsg"></p>
  </div>
</div>

<main id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      <div class="ship-mark"><img src="/assets/skandi/skandi-nomad-cutout.png" alt="Skandi Nomad"></div>
      <div class="brand-text"><span>Skandi Fit</span><small>Skandi Nomad · DOF</small></div>
    </div>
    <button class="avatar" onclick="openSettings()" title="Settings" data-i18n-title="settings.title" data-i18n-aria="settings.title" aria-label="Settings" id="avatar">SF</button>
  </header>
  <section id="screen"></section>
</main>

<nav class="tabs hidden" id="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-view="home" onclick="setView('home')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-i18n="tab.home">Home</span></button>
    <button class="tab" data-view="train" onclick="setView('train')"><svg viewBox="0 0 24 24"><path d="M4 14h2m12 0h2M7 10v8m10-8v8M9 12h6"/></svg><span data-i18n="tab.train">Train</span></button>
    <button class="tab" data-view="food" onclick="setView('food')"><svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 0 0 6 0V3"/><path d="M8 11v10"/><path d="M17 3c-1.5 2-2 3.5-2 6 0 1.7.7 2.6 2 3v9"/></svg><span data-i18n="tab.food">Food</span></button>
    <button class="tab" data-view="crew" onclick="setView('crew')"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n="tab.crew">Crew</span></button>
    <button class="tab" data-view="progress" onclick="setView('progress')"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 3-3 3 2 5-7"/></svg><span data-i18n="tab.progress">Progress</span></button>
    <button class="tab" data-view="body" onclick="setView('body')"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/></svg><span data-i18n="tab.body">Body</span></button>
    <button class="tab" data-view="library" onclick="setView('library')"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg><span data-i18n="tab.library">Library</span></button>
  </div>
</nav>

let LANG=(()=>{
  const saved=localStorage.getItem(LANG_STORAGE_KEY);
  if(saved&&I18N[saved]) return saved;
  return (navigator.language||navigator.userLanguage||'en').toLowerCase().startsWith('es')?'es':'en';
})();
function t(key,vars){
  let s=I18N[LANG]?.[key];
  if(s==null) s=I18N.en[key];
  if(s==null) return key;
  return vars?s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m):s;
}

  const email=$('email').value.trim();

  const firstName=($('firstName')?.value||'').trim();

  const btn=$('authBtn');
  if(btn) btn.disabled=true;
  $('authMsg').textContent=state.authMode==='login'?t('auth.signingIn'):t('auth.creatingAccount');
  try{
    if(state.authMode==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) return $('authMsg').textContent=error.message;
      state.user=data.user;
      await loadAll();
      return showApp();
    }
    // app:'skandi' lets handle_new_user() (migration 055) tag this profile as a Skandi-only
    // signup so it doesn't show up in HABIT's admin members list/search.
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:fullName,app:'skandi'},emailRedirectTo:location.href}});
    if(error) return $('authMsg').textContent=error.message;
    if(data.session){
      state.user=data.user;
      await loadAll();
      return showApp();
    }
    $('authMsg').textContent=t('auth.created');
  } finally {
    submittingAuth=false;
    if(btn) btn.disabled=false;
  }
}

function dedupeById(rows){

}

async function loadAll(){
  // La nutrición vive en sus propias tablas y no la necesita nada de abajo: se dispara en
  // paralelo y se espera al final, para no sumarle un viaje redondo al arranque.
  const nutritionLoad=loadNutrition();
  // Sessions/sets are split into "own" (unbounded — this is the data an active workout and a
  // user's own stats/history depend on, and silently truncating it is a real bug: it can make
  // exercises vanish mid-workout or PRs disappear once the crew collectively logs enough rows)
  // vs. "crew" (other members' shared activity, capped since it only feeds the social feed).
  let [{data:profile},{data:exercises},{data:templates},{data:items},
       {data:ownSessions},{data:crewSessions},{data:ownSets},{data:crewSets},
       {data:externalActivities},{data:activityTemplates},{data:progressionState},{data:trainingBlocks},{data:bodyweightLogs},
       {data:programs},{data:programDays}]=await Promise.all([
    sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle(),
    sb.from('skandi_exercises').select('*').order('name'),
    sb.from('skandi_templates').select('*, profile:profiles(name,avatar_url)').order('weekday',{nullsFirst:false}).order('created_at',{ascending:false}),
    sb.from('skandi_template_items').select('*, exercise:skandi_exercises(*)').order('sort_order'),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').eq('user_id',state.user.id).order('started_at',{ascending:false}),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').eq('visibility','crew').order('started_at',{ascending:false}).limit(60),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').neq('user_id',state.user.id).order('created_at',{ascending:false}).limit(600),
    sb.from('skandi_external_activities').select('*').eq('user_id',state.user.id).order('performed_at',{ascending:false}).limit(200),
    sb.from('skandi_activity_templates').select('*').eq('user_id',state.user.id).order('weekday',{nullsFirst:false}),
    sb.from('skandi_progression_state').select('*').eq('user_id',state.user.id),
    sb.from('skandi_training_blocks').select('*').eq('user_id',state.user.id).order('start_date',{ascending:false}),
    sb.from('skandi_bodyweight_logs').select('*').eq('user_id',state.user.id).order('logged_at',{ascending:false}),
    sb.from('skandi_programs').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    // No user_id filter: skandi_program_days has no user_id column of its own, its RLS policy
    // resolves ownership through the parent program (migration 069).
    sb.from('skandi_program_days').select('*')
  ]);
  if(!profile){
    // Some signups end up with an auth user but no profiles row (trigger race condition).
    // Every Skandi write is FK'd to profiles(id), so self-heal it here before anything breaks.
    const {error:ensureError}=await sb.rpc('ensure_own_profile',{p_name:state.user?.user_metadata?.name||state.user?.email?.split('@')[0]||''});
    if(ensureError){
      alert(t('auth.profileError',{msg:ensureError.message}));
    } else {
      ({data:profile}=await sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle());
    }
  }
  state.profile=profile||{name:state.user.email};
  const ignored=ignoredSessionIds();
  state.exercises=exercises||[];
  state.templates=templates||[];
  state.items=items||[];
  const sessions=dedupeById([...(ownSessions||[]),...(crewSessions||[])]);
  const sets=dedupeById([...(ownSets||[]),...(crewSets||[])]);
  if(state.active){
    // A background loadAll() (e.g. the one fired right after startWorkout) can resolve after
    // the member has already checked off sets locally — its server snapshot is racing those
    // in-flight updates, so overwriting wholesale can silently revert sets just marked done,
    // surfacing on the next render as unchecked. Each edit during a live workout is already
    // persisted individually (toggleSet/updateSet/addSet/removeSet), so keep the active
    // session's own data from local state and only merge in everything outside it.
    const localActiveSets=state.sets.filter(s=>s.session_id===state.active.id);
    state.sessions=dedupeById([state.active,...sessions.filter(s=>s.id!==state.active.id)]).filter(s=>!(ignored.has(s.id)&&!s.completed_at));
    state.sets=dedupeById([...localActiveSets,...sets.filter(s=>s.session_id!==state.active.id)]).filter(s=>!ignored.has(s.session_id));
  }else{
    state.sessions=sessions.filter(s=>!(ignored.has(s.id)&&!s.completed_at));
    state.sets=sets.filter(s=>!ignored.has(s.session_id));
  }
  state.externalActivities=externalActivities||[];
  state.activityTemplates=activityTemplates||[];
  state.progressionState=progressionState||[];
  state.trainingBlocks=trainingBlocks||[];
  state.bodyweightLogs=bodyweightLogs||[];
  // Both default to [] rather than throwing when migration 069 hasn't been run yet — the rest
  // of the app (and the week itself) works fine without programs.
  state.programs=programs||[];
  state.programDays=programDays||[];
  await nutritionLoad;
  hydrateActiveWorkout();
}

function hydrateActiveWorkout(){
  if(!state.user||state.active) return;
  const maxAgeMs=ACTIVE_WORKOUT_MAX_HOURS*3600e3;
  state.sessions.filter(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()>maxAgeMs)
    .forEach(s=>ignoreSessionLocally(s.id));
  const ignored=ignoredSessionIds();
  state.sessions=state.sessions.filter(s=>!(ignored.has(s.id)&&!s.completed_at));
  state.sets=state.sets.filter(s=>!ignored.has(s.session_id));
  const active=state.sessions.find(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()<=maxAgeMs);
  if(!active) return;
  state.active=active;
  state.activeItems=computeActiveItems(active.id);
  state.elapsed=Math.max(0,Math.floor((Date.now()-new Date(active.started_at).getTime())/1000));
  state.rest=0;
  state.restTotal=0;
  state.pausedMs=0;
  state.pausedAt=null;
  resumeWorkoutTimer();
}

// ---- Training blocks (N build weeks + 1 deload week, per Plan_Hibrido_Final_v3) ----
// A block is never auto-continued by calendar: it just sits at whatever week the date lands
// on, and once it runs past its last week the UI asks the member to review and explicitly
// start the next one (build_weeks can change block to block, e.g. 4+1 vs 5+1).

function currentTrainingBlock(){
  if(!state.trainingBlocks.length) return null;
  return state.trainingBlocks.reduce((a,b)=>new Date(b.start_date)>new Date(a.start_date)?b:a);
}

function trainingBlockWeekInfo(block){
  block=block||currentTrainingBlock();
  if(!block) return null;
  const start=new Date(block.start_date+'T00:00:00');
  const totalWeeks=block.build_weeks+1;
  const days=Math.floor((Date.now()-start.getTime())/86400000);
  if(days<0) return {block,week:0,totalWeeks,deload:false,ended:false,notStarted:true};
  const week=Math.floor(days/7)+1;
  return {block,week:Math.min(week,totalWeeks+1),totalWeeks,deload:week===totalWeeks,ended:week>totalWeeks,notStarted:false};
}

// Deload-week load suggestion: ~30% lighter than last time, rounded to a plate-friendly
// 0.5kg step. Only ever touches the PRELOADED value shown when a set is created — every
// field stays a normal editable input, so this is a starting point, not an enforced cap.
function deloadAdjustedWeight(weightKg){
  if(weightKg==null) return weightKg;
  const info=trainingBlockWeekInfo();
  if(!info?.deload) return weightKg;
  return Math.round(weightKg*0.7*2)/2;
}

// ---- Programs: the layer above routines (workout -> routine -> program) ------------------
// skandi_templates.weekday / skandi_activity_templates.weekday stay the single source of truth
// for "my week". A program is only a saved snapshot of that week -- which routine and which
// endurance plan sit on each day -- and loading one re-stamps those weekday columns. That way
// every existing week/day code path keeps working untouched, and switching between a 5-day
// strength plan and, say, a running block never has to touch a session or a set.

const myTemplates=()=>state.templates.filter(x=>x.user_id===state.user.id);
const activeProgram=()=>state.programs.find(p=>p.is_active)||null;
const programDaysOf=id=>state.programDays.filter(d=>d.program_id===id).sort((a,b)=>a.weekday-b.weekday);

function currentWeekSnapshot(){
  const rows=[];
  for(let i=0;i<7;i++){
    const tpl=myTemplates().find(x=>x.weekday===i);
    const act=state.activityTemplates.find(x=>x.weekday===i);
    if(tpl||act) rows.push({weekday:i,template_id:tpl?.id||null,activity_template_id:act?.id||null});
  }
  return rows;
}

// "Dirty" = the member rearranged their week after loading a program, so the saved program no
// longer describes what they actually train. Surfaced as an explicit "update program" button
// rather than auto-saving: moving one routine for one week shouldn't silently rewrite the plan.
function weekMatchesProgram(program){
  if(!program) return true;
  const key=r=>`${r.weekday}:${r.template_id||'-'}:${r.activity_template_id||'-'}`;
  const week=currentWeekSnapshot().map(key).sort();
  const saved=programDaysOf(program.id).filter(d=>d.template_id||d.activity_template_id).map(key).sort();
  return week.length===saved.length&&week.every((v,i)=>v===saved[i]);
}

function programSummary(program){
  const days=programDaysOf(program.id);
  return t('pgm.summary',{
    routines:days.filter(d=>d.template_id).length,
    plans:days.filter(d=>d.activity_template_id).length,
    days:days.filter(d=>d.template_id||d.activity_template_id).length
  });
}

  }).join('');

let savingProgram=false;
async function saveProgram(id){
  if(savingProgram) return;
  const name=$('pgmName').value.trim();
  if(!name) return alert(t('pgm.errName'));
  const notes=$('pgmNotes').value.trim()||null;
  const snapshot=id?null:currentWeekSnapshot();
  if(snapshot&&!snapshot.length) return alert(t('pgm.errEmptyWeek'));
  savingProgram=true;
  try{
    if(id){
      const {error}=await sb.from('skandi_programs').update({name,notes,updated_at:new Date().toISOString()}).eq('id',id);
      if(error) return alert(error.message);
    } else {
      // A brand-new program describes the week that is live right now, so it becomes the active
      // one. Deactivate first: the partial unique index allows only one active row per member.
      await sb.from('skandi_programs').update({is_active:false}).eq('user_id',state.user.id).eq('is_active',true);
      const {data,error}=await sb.from('skandi_programs').insert({user_id:state.user.id,name,notes,is_active:true}).select().single();
      if(error) return alert(error.message);
      const {error:daysError}=await sb.from('skandi_program_days').insert(snapshot.map(r=>({program_id:data.id,...r})));
      if(daysError) return alert(daysError.message);
    }
    closeModal();
    await loadAll();
    render();
  } finally {
    savingProgram=false;
  }
}

async function updateProgramFromWeek(id){
  if(savingProgram) return;
  const snapshot=currentWeekSnapshot();
  if(!snapshot.length) return alert(t('pgm.errEmptyWeek'));
  savingProgram=true;
  try{
    const {error:delError}=await sb.from('skandi_program_days').delete().eq('program_id',id);
    if(delError) return alert(delError.message);
    const {error}=await sb.from('skandi_program_days').insert(snapshot.map(r=>({program_id:id,...r})));
    if(error) return alert(error.message);
    await sb.from('skandi_programs').update({updated_at:new Date().toISOString()}).eq('id',id);
    closeModal();
    await loadAll();
    render();
  } finally {
    savingProgram=false;
  }
}

let applyingProgram=false;
async function applyProgram(id){
  if(applyingProgram) return;
  const program=state.programs.find(p=>p.id===id);
  if(!program) return;
  if(!confirm(t('pgm.confirmApply',{name:program.name}))) return;
  applyingProgram=true;
  try{
    const days=programDaysOf(id);
    const tplDay=new Map(days.filter(d=>d.template_id).map(d=>[d.template_id,d.weekday]));
    const actDay=new Map(days.filter(d=>d.activity_template_id).map(d=>[d.activity_template_id,d.weekday]));
    const stamp=new Date().toISOString();
    // Every routine of mine gets rewritten, not just the ones this program names: a day the
    // program leaves empty has to actually empty out, otherwise the previous program's routine
    // would linger on it and the week would be a mix of two plans.
    for(const tpl of myTemplates()){
      const target=tplDay.has(tpl.id)?tplDay.get(tpl.id):null;
      if(tpl.weekday===target) continue;
      const {error}=await sb.from('skandi_templates').update({weekday:target,updated_at:stamp}).eq('id',tpl.id);
      if(error) return alert(error.message);
    }
    for(const plan of state.activityTemplates){
      const target=actDay.has(plan.id)?actDay.get(plan.id):null;
      if(plan.weekday===target) continue;
      const {error}=await sb.from('skandi_activity_templates').update({weekday:target}).eq('id',plan.id);
      if(error) return alert(error.message);
    }
    await sb.from('skandi_programs').update({is_active:false}).eq('user_id',state.user.id).eq('is_active',true);
    const {error:activateError}=await sb.from('skandi_programs').update({is_active:true,updated_at:stamp}).eq('id',id);
    if(activateError) return alert(activateError.message);
    closeModal();
    await loadAll();
    setView('train');
  } finally {
    applyingProgram=false;
  }
}

function crewMembers(){
  const members=new Map();
  const upsert=(userId,profile)=>{
    if(!members.has(userId)) members.set(userId,{user_id:userId,name:profile?.name||t('common.crewMember'),avatar:profile?.avatar_url||null,workouts:0,minutes:0,lastAt:null});
    const member=members.get(userId);
    if(profile?.name) member.name=profile.name;
    if(profile?.avatar_url) member.avatar=profile.avatar_url;
    return member;
  };
  upsert(state.user.id,state.profile);
  // My own private sessions count for me (it's my data either way); for everyone else only
  // what they chose to share is visible at all.
  state.sessions.filter(s=>s.completed_at&&(s.visibility==='crew'||s.user_id===state.user.id)).forEach(s=>{
    const member=upsert(s.user_id,s.profile);
    member.workouts++;
    member.minutes+=Math.round((s.duration_sec||0)/60);
    if(!member.lastAt||new Date(s.completed_at)>new Date(member.lastAt)) member.lastAt=s.completed_at;
  });
  return [...members.values()].sort((a,b)=>(b.lastAt?new Date(b.lastAt).getTime():0)-(a.lastAt?new Date(a.lastAt).getTime():0));
}

// ---- Progress > Exercises: one chart per exercise you actually train ----------------------

// How this exercise is scored, matching leaderboard()'s rule: hold time for timed holds, load
// for anything tracking weight, reps for pure bodyweight work.
function exerciseTrackingMode(ex){
  return ex.log_mode==='seconds'?'seconds':(ex.log_weight!==false?'weight':'reps');
}

function formatMark(mode,value){
  if(mode==='seconds') return fmtSec(value);
  if(mode==='weight') return `${fmtWeightInput(value)} ${state.weightUnit}`;
  return `${value} ${t('common.reps')}`;
}

// Best mark + total volume per completed session for one exercise, oldest first so the chart
// reads left to right. Only done sets count -- an unchecked set is a plan, not a result.
function exerciseProgressSeries(exerciseId){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex) return [];
  const mode=exerciseTrackingMode(ex);
  const out=[];
  for(const session of myCompletedSessions()){
    const sets=state.sets.filter(x=>x.session_id===session.id&&x.exercise_id===exerciseId&&x.done);
    if(!sets.length) continue;
    const best=mode==='seconds'?Math.max(...sets.map(x=>Number(x.seconds)||0))
      :mode==='weight'?Math.max(...sets.map(x=>Number(x.weight_kg)||0))
      :Math.max(...sets.map(x=>Number(x.reps)||0));
    out.push({
      sessionId:session.id,title:session.title,date:session.completed_at,mode,best,
      volume:sets.reduce((a,x)=>a+(Number(x.weight_kg)||0)*(Number(x.reps)||0),0),
      sets:sets.length
    });
  }
  return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function trainedExercises(){
  const byExercise=new Map();
  state.sets.filter(x=>x.user_id===state.user.id&&x.done).forEach(x=>{
    const session=state.sessions.find(s=>s.id===x.session_id);
    if(!session?.completed_at) return;
    const current=byExercise.get(x.exercise_id);
    if(!current||new Date(session.completed_at)>new Date(current.lastAt)) byExercise.set(x.exercise_id,{exercise_id:x.exercise_id,lastAt:session.completed_at});
  });
  return [...byExercise.values()]
    .map(row=>({...row,exercise:state.exercises.find(e=>e.id===row.exercise_id)}))
    .filter(row=>row.exercise)
    .sort((a,b)=>new Date(b.lastAt)-new Date(a.lastAt));
}

function progressExercisesTab(){
  return `
    <div class="search"><input id="pgQ" class="field left" placeholder="${esc(t('progress.searchExercise'))}" value="${esc(state.progressQuery||'')}" oninput="state.progressQuery=this.value;renderProgressExerciseList()"></div>
    <div id="pgExList">${progressExerciseListHtml()}</div>`;
}

// Replaces only the list (like renderLibraryList) -- a full render() on every keystroke would

function renderProgressExerciseList(){

function progressExerciseListHtml(){

function progressExerciseRowHtml(row){
  const series=exerciseProgressSeries(row.exercise.id);
  if(!series.length) return '';
  const mode=series[0].mode;

  return `<article class="card click-card" onclick="openExerciseProgress('${row.exercise.id}')">

      </div>

    </div>
    ${sparklineSvg(series.slice(-10).map(p=>p.best))}
  </article>`;
}

// Full-width line chart: the readable sibling of sparklineSvg. Value labels live in HTML under
// the chart (see chartLegendHtml) rather than as SVG text, so they stay crisp at any width.
function progressChartSvg(values){
  if(values.length<2) return '';
  const w=320,h=150,padX=8,padT=14,padB=12;
  const min=Math.min(...values),max=Math.max(...values);
  const span=(max-min)||Math.abs(max)||1;
  const x=i=>padX+(i/(values.length-1))*(w-padX*2);
  const y=v=>padT+(1-(v-min)/span)*(h-padT-padB);
  const line=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">
    <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245f9f" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#245f9f" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${padX}" y1="${h-padB}" x2="${w-padX}" y2="${h-padB}" stroke="#d7e1ea" stroke-width="1"/>
    <polygon points="${padX},${h-padB} ${line} ${w-padX},${h-padB}" fill="url(#chartFill)"/>
    <polyline points="${line}" fill="none" stroke="#245f9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===values.length-1?4:2.4}" fill="${i===values.length-1?'#012456':'#245f9f'}"/>`).join('')}
  </svg>`;
}

function openExerciseProgress(exerciseId){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex) return;
  const series=exerciseProgressSeries(exerciseId);
  const mode=exerciseTrackingMode(ex);
  // Volume (load x reps) only means something where load is tracked; for holds and bodyweight
  // reps the toggle is hidden rather than charting a column of zeros.
  const canVolume=mode==='weight'&&series.some(p=>p.volume>0);
  const metric=canVolume&&state.progressMetric==='volume'?'volume':'best';
  const values=series.map(p=>metric==='volume'?p.volume:p.best);
  const label=v=>metric==='volume'?`${fmtWeightInput(v)} ${state.weightUnit}`:formatMark(mode,v);
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(ex.name)}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    ${canVolume?`<div class="seg sub" style="margin-top:12px">
      <button class="${metric==='best'?'active':''}" onclick="state.progressMetric='best';openExerciseProgress('${exerciseId}')">${esc(t('chart.best'))}</button>
      <button class="${metric==='volume'?'active':''}" onclick="state.progressMetric='volume';openExerciseProgress('${exerciseId}')">${esc(t('chart.volume'))}</button>
    </div>`:''}
    <section class="card">
      ${values.length>1?`${progressChartSvg(values)}
      <div class="chart-legend">
        <span>${esc(new Date(series[0].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
        <span>${esc(label(Math.min(...values)))} → ${esc(label(Math.max(...values)))}</span>
        <span>${esc(new Date(series[series.length-1].date).toLocaleDateString(LANG,{day:'numeric',month:'short'}))}</span>
      </div>`:empty(t('chart.noData'))}
    </section>
    <section class="card">
      <div class="eyebrow">${esc(t('chart.perSession'))}</div>
      ${series.slice().reverse().map(p=>`<div class="row click-card" style="margin-top:10px" onclick="openSessionDetail('${p.sessionId}')">
        <div style="min-width:0"><strong>${esc(formatMark(p.mode,p.best))}</strong><p class="muted">${esc(new Date(p.date).toLocaleDateString(LANG,{weekday:'short',day:'numeric',month:'short'}))} · ${p.sets} ${esc(tp(p.sets,'common.setsLogged'))}</p></div>
        ${p.volume>0?`<span class="pill dark">${esc(t('chart.volumeUnit',{v:fmtWeightInput(p.volume),unit:state.weightUnit}))}</span>`:''}
      </div>`).join('')||empty(t('chart.noData'))}
    </section>
    <button class="btn" style="width:100%" onclick="openExercise('${exerciseId}')">${icon('chevronRight',16)} ${esc(t('chart.openExercise'))}</button>`;
}

// ---- Progress > History: filter it, and fix a workout whose log came out wrong -------------

function setHistoryFilter(key,value){
  state.historyFilter={...state.historyFilter,[key]:value};
  render();
}

// Local month, not UTC: a workout finished at 8pm on the last day of the month is UTC-next-day
// in Mazatlan (UTC-7), and toISOString() would file it under the wrong month in the filter.
const monthKey=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const monthLabel=key=>{
  const d=new Date(`${key}-01T12:00:00`);
  const label=d.toLocaleDateString(LANG,{month:'long',year:'numeric'});
  return label.charAt(0).toUpperCase()+label.slice(1);
};

function progressHistoryTab(){
  const sessions=myCompletedSessions();
  const filter=state.historyFilter||{month:'all',title:'all'};
  const months=[...new Set(sessions.map(s=>monthKey(s.completed_at)))];
  const titles=[...new Set(sessions.map(s=>s.title))].sort((a,b)=>a.localeCompare(b));
  const filtered=sessions.filter(s=>
    (filter.month==='all'||monthKey(s.completed_at)===filter.month)&&
    (filter.title==='all'||s.title===filter.title));
  const minutes=Math.round(filtered.reduce((a,s)=>a+(s.duration_sec||0),0)/60);
  return `
    <div class="filters">
      <select class="field left" onchange="setHistoryFilter('month',this.value)">
        <option value="all">${esc(t('progress.allMonths'))}</option>
        ${months.map(m=>`<option value="${m}" ${filter.month===m?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
      </select>
      <select class="field left" onchange="setHistoryFilter('title',this.value)">
        <option value="all">${esc(t('progress.allRoutines'))}</option>
        ${titles.map(x=>`<option value="${esc(x)}" ${filter.title===x?'selected':''}>${esc(x)}</option>`).join('')}
      </select>
    </div>
    <p class="muted">${esc(t('progress.resultsN',{n:filtered.length,min:minutes}))}</p>
    ${filtered.map(historyRowHtml).join('')||empty(sessions.length?t('progress.noResults'):t('progress.historyEmpty'))}`;
}

// A session left running overnight lands here as a 12-hour workout that quietly wrecks every
// minutes total, so the row calls it out and points straight at the edit form.
const SUSPICIOUS_DURATION_SEC=4*3600;

function historyRowHtml(s){
  const doneSets=state.sets.filter(x=>x.session_id===s.id&&x.done).length;
  const odd=(s.duration_sec||0)>SUSPICIOUS_DURATION_SEC;
  return `<article class="feed">
    <div class="row">
      <div style="min-width:0;cursor:pointer" onclick="openSessionDetail('${s.id}')">
        <p class="muted">${esc(new Date(s.completed_at).toLocaleDateString(LANG,{weekday:'short',day:'numeric',month:'short'}))}</p>
        <h3>${esc(s.title)}</h3>
        <p class="muted">${esc(t('feed.seriesMin',{sets:doneSets,min:Math.round((s.duration_sec||0)/60)}))}</p>
      </div>
      <button class="icon-btn tiny" onclick="openSessionEdit('${s.id}')" aria-label="${esc(t('session.edit'))}">${icon('edit',15)}</button>
    </div>
    ${odd?`<p style="color:var(--pink);margin-top:8px">${esc(t('progress.longSession'))}</p>`:''}
  </article>`;
}

  const list=state.exercises.filter(e=>`${e.name} ${e.english_name} ${e.category}`.toLowerCase().includes(q));
  $('libraryList').innerHTML=exerciseList(list);
}

function exerciseList(list){
  return list.map(e=>exerciseCard(e,false)).join('')||empty(t('library.empty'));
}

function muscleGroupOf(e){
  const muscles=Object.entries(e.muscles||{}).sort((a,b)=>b[1]-a[1]);
  if(!muscles.length) return 'Other';
  return MUSCLE_GROUP_MAP[muscles[0][0]]||'Other';
}

function groupExercisesByMuscle(list){
  const groups=new Map();
  list.forEach(e=>{
    const g=muscleGroupOf(e);
    if(!groups.has(g)) groups.set(g,[]);
    groups.get(g).push(e);
  });
  return MUSCLE_GROUP_ORDER
    .filter(g=>groups.has(g))
    .map(g=>[g,groups.get(g).sort((a,b)=>a.name.localeCompare(b.name))]);
}

function exerciseCard(e,tracking){
  const muscles=Object.entries(e.muscles||{}).sort((a,b)=>b[1]-a[1]);
  return `<article class="exercise">
    <div class="ex-head" onclick="openExercise('${e.id}')">
      ${mediaThumb(e)}
      <div><h3>${esc(e.name)}</h3><p>${esc(exerciseSubtitle(e)||categoryLabel(e.category)||'')}</p></div>
      <div class="play">${icon('play',18)}</div>
    </div>
    <div class="muscles">${muscles.map(([m,p])=>`<span class="pill dark">${esc(muscleLabel(m))} ${p}%</span>`).join('')}</div>

function isVideoUrl(url){
  return /\.(mp4|mov|webm|m4v)(\?|#|$)/i.test(url||'');
}

function mediaThumb(e){
  if(e.media_url){
    if(isVideoUrl(e.media_url)) return `<div class="thumb"><video src="${esc(e.media_url)}" muted playsinline preload="metadata" onerror="this.parentElement.innerHTML=THUMB_FALLBACK"></video></div>`;
    return `<div class="thumb"><img src="${esc(e.media_url)}" alt="${esc(e.name)}" loading="lazy" onerror="this.parentElement.innerHTML=THUMB_FALLBACK"></div>`;
  }
  return `<div class="thumb">${THUMB_FALLBACK}</div>`;
}

  const byExercise=new Map();
  sets.forEach(x=>{
    // x.exercise (the join used to load sets) only carries name/slug — look the full row up
    // in state.exercises for log_mode, same as leaderboard(), so seconds-based holds render
    // their clean/broken tag here instead of a meaningless "weight × reps".
    if(!byExercise.has(x.exercise_id)) byExercise.set(x.exercise_id,{name:x.exercise?.name||t('common.exercise'),seconds:state.exercises.find(e=>e.id===x.exercise_id)?.log_mode==='seconds',sets:[]});

      <div class="stat"><strong>${Math.round((s.duration_sec||0)/60)}</strong><small>${esc(t('session.minutes'))}</small></div>
      <div class="stat"><strong>${sets.filter(x=>x.done).length}</strong><small>${esc(tp(sets.filter(x=>x.done).length,'common.setsLogged'))}</small></div>
    </section>
    ${s.report_difficulty||s.report_energy?`<section class="card"><div class="row"><span class="pill dark">${esc(difficultyLabel(s.report_difficulty))}</span><span class="pill dark">${esc(t('session.energy',{v:s.report_energy||'-'}))}</span>${s.report_sleep_hours!=null?`<span class="pill dark">${esc(t('session.sleep',{h:s.report_sleep_hours}))}</span>`:''}${s.report_felt_worse?`<span class="pill dark" style="color:var(--pink)">${esc(t('session.feltWorse'))}</span>`:''}</div></section>`:''}
    ${s.report_soreness?`<section class="card" style="border-color:rgba(212,72,84,.30);background:#fff7f7"><strong style="color:var(--pink)">${esc(t('session.soreness'))}</strong><p style="margin-top:6px">${esc(s.report_soreness_area||t('session.notSpecified'))}</p></section>`:''}

      <div class="eyebrow">${esc(t('session.exercises'))}</div>
      ${[...byExercise.values()].map(ex=>`
        <div style="margin-top:12px">
          <strong>${esc(ex.name)}</strong>
          <div class="stack" style="margin-top:6px">
            ${ex.sets.map(x=>`<div class="row"><small class="muted">${esc(t('session.set',{n:x.set_idx}))}</small><small>${x.done?esc(ex.seconds?`${fmtSec(x.seconds)}${x.hold_clean===true?' · '+t('session.clean'):x.hold_clean===false?' · '+t('session.broken'):''}`:`${x.weight_kg??'-'} kg × ${x.reps??'-'}${x.rir!=null?` · RIR ${x.rir}`:''}`):esc(t('session.notLogged'))}</small></div>`).join('')}

let savingSessionEdit=false;
async function saveSessionEdit(sessionId){
  if(savingSessionEdit) return;
  const s=state.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const title=$('seTitle').value.trim();
  if(!title) return alert(t('sedit.errName'));
  const minutes=Number($('seDuration').value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>600) return alert(t('sedit.errDuration'));
  const [year,month,day]=($('seDate').value||'').split('-').map(Number);
  if(!year||!month||!day) return alert(t('sedit.errDate'));
  const durationSec=Math.round(minutes*60);
  // Keep the clock time the workout was finished at and move only the calendar date, then let
  // started_at follow the corrected duration -- the pair has to stay consistent, since the
  // active-workout recovery and every "minutes trained" total read from it.
  const completedAt=new Date(s.completed_at||s.started_at);
  completedAt.setFullYear(year,month-1,day);
  savingSessionEdit=true;
  const btn=document.querySelector('#modalCard button.primary');
  if(btn){btn.disabled=true;btn.textContent=t('common.saving');}
  try{
    const {error}=await sb.from('skandi_sessions').update({
      title,
      completed_at:completedAt.toISOString(),
      started_at:new Date(completedAt.getTime()-durationSec*1000).toISOString(),
      duration_sec:durationSec,
      report_difficulty:$('seDifficulty').value,
      report_energy:Number($('seEnergy').value),
      report_soreness:$('seSore').checked,
      report_soreness_area:$('seSoreArea').value.trim()||null,
      report_note:$('seNote').value.trim()||null,
      visibility:$('seShare').checked?'crew':'private'
    }).eq('id',sessionId).eq('user_id',state.user.id);
    if(error) return alert(error.message);
    closeModal();
    await loadAll();
    render();
  } finally {
    savingSessionEdit=false;
    if(btn){btn.disabled=false;btn.textContent=t('sedit.save');}
  }
}

async function deleteSession(sessionId){
  if(!confirm(t('session.confirmDelete'))) return;
  const {error}=await sb.from('skandi_sessions').delete().eq('id',sessionId).eq('user_id',state.user.id);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

function leaderboard(){
  const profiles=new Map(state.sessions.map(s=>[s.user_id,s.profile?.name||t('common.crewMember')]));
  const best=new Map();
  state.sets.filter(s=>s.done).forEach(s=>{
    // s.exercise (the join used to load sets) only carries name/slug — look the full row up in
    // state.exercises for log_mode/log_weight instead.
    const ex=state.exercises.find(e=>e.id===s.exercise_id);
    if(!ex) return;
    // Rank by hold time for timed holds, by load for anything still tracking weight, and by
    // reps for pure-bodyweight rep work — the old weight-only filter meant front lever, back
    // lever, planche, handstand and every other bodyweight/hold exercise could never post a PR
    // and silently never appeared on the leaderboard at all.
    const mode=ex.log_mode==='seconds'?'seconds':(ex.log_weight!==false?'weight':'reps');
    // A hold explicitly tagged broken doesn't get to set the PR, even if it ran long —
    // "mejor hold limpio" per the training plan. Untagged (hold_clean null) holds still count,
    // so this doesn't silently erase every PR set before the clean/broken toggle existed.
    if(mode==='seconds'&&s.hold_clean===false) return;
    const mark=mode==='seconds'?Number(s.seconds):(mode==='weight'?Number(s.weight_kg):Number(s.reps));
    if(!(mark>0)) return;
    const key=`${s.user_id}:${s.exercise_id}`;
    const current=best.get(key);
    if(!current||mark>current.mark) best.set(key,{
      user_id:s.user_id,name:profiles.get(s.user_id)||t('common.crewMember'),exercise:ex.name,mode,mark,reps:Number(s.reps)||0
    });
  });
  return [...best.values()].sort((a,b)=>b.mark-a.mark);
}
// Shared by Crew's "Recent PRs" and Progress's "Your bests" — the value/subtitle shown depends
// on how this exercise is tracked (weight, timed hold, or bodyweight reps). showName is off for
// "Your bests" since every row there is already the current user's.
function leaderRowHtml(x,showName=true){
  const value=x.mode==='seconds'?fmtSec(x.mark):x.mode==='weight'?t('leader.kg',{v:x.mark}):t('leader.reps',{v:x.mark});
  const detail=x.mode==='seconds'?t('leader.hold'):x.mode==='weight'?t('leader.reps',{v:x.reps||0}):t('leader.bestSet');
  const subtitle=showName?`${esc(x.name)} · ${detail}`:detail;
  return `<div class="leader"><div><strong>${esc(x.exercise)}</strong><p>${subtitle}</p></div><strong class="accent">${value}</strong></div>`;
}

// ---- Progression + injury automation (rule-based, no LLM: reads existing session/set data) ----

// Flags any progression line (front lever, planche, ...) where the user's CURRENT variant
// hasn't improved its best mark across the last 3 sessions it was trained — i.e. the same or
// a worse number 3 sessions running. That's a sign to deload, hold longer per rep, or just
// stay patient, and it's exactly the trend the per-exercise sparkline shows but nobody checks
// on their own every session.
function progressionStallWarnings(){
  const groups=[...new Set(state.exercises.filter(e=>e.progression_group).map(e=>e.progression_group))];
  const warnings=[];
  for(const group of groups){
    const currentId=state.progressionState.find(p=>p.progression_group===group)?.exercise_id;
    const exercise=currentId&&state.exercises.find(e=>e.id===currentId);
    if(!exercise) continue;
    const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
      .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
    const marks=[];
    for(const session of sessions){
      const sets=state.sets.filter(s=>s.session_id===session.id&&s.exercise_id===exercise.id&&(s.seconds!=null||s.reps!=null));
      if(!sets.length) continue;
      marks.push(exercise.log_mode==='seconds'?Math.max(...sets.map(s=>s.seconds||0)):Math.max(...sets.map(s=>s.reps||0)));
      if(marks.length>=3) break;
    }
    if(marks.length<3) continue;
    // marks is newest-first: [latest, ..., oldest]. No net gain across the window = stalled.
    if(marks[0]<=marks[marks.length-1]) warnings.push({group,exercise,marks:marks.slice().reverse()});
  }
  return warnings;
}

// Free-text soreness_area means this is normalized-string matching, not true zone taxonomy —
// still catches the common case (someone typing "elbow" or "shoulder" the same way each time)
// without needing a full body-zone picker in the report form.
function repeatedSorenessWarnings(){
  const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.report_soreness&&s.report_soreness_area)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime())
    .slice(0,8);
  const byArea=new Map();
  sessions.forEach(s=>{
    const key=s.report_soreness_area.trim().toLowerCase();
    if(!byArea.has(key)) byArea.set(key,[]);
    byArea.get(key).push(s);
  });
  return [...byArea.entries()].filter(([,list])=>list.length>=2)
    .map(([area,list])=>({area,count:list.length,latest:list[0].completed_at}))
    .sort((a,b)=>b.count-a.count);
}

function weeklyRecap(){
  const startOfWeek=new Date();
  startOfWeek.setHours(0,0,0,0);
  startOfWeek.setDate(startOfWeek.getDate()-todayDow());
  const lastWeekStart=new Date(startOfWeek);
  lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const own=s=>s.user_id===state.user.id&&s.completed_at;
  const thisWeek=state.sessions.filter(s=>own(s)&&new Date(s.completed_at).getTime()>=startOfWeek.getTime());
  const lastWeek=state.sessions.filter(s=>own(s)&&new Date(s.completed_at).getTime()>=lastWeekStart.getTime()&&new Date(s.completed_at).getTime()<startOfWeek.getTime());
  const avgEnergy=list=>{
    const vals=list.map(s=>s.report_energy).filter(v=>v!=null);
    return vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10:null;
  };
  return {
    count:thisWeek.length,
    lastCount:lastWeek.length,
    minutes:Math.round(thisWeek.reduce((a,s)=>a+(s.duration_sec||0),0)/60),
    soreCount:thisWeek.filter(s=>s.report_soreness).length,
    avgEnergy:avgEnergy(thisWeek),
    lastAvgEnergy:avgEnergy(lastWeek),
    progressions:state.progressionState.map(p=>state.exercises.find(e=>e.id===p.exercise_id)).filter(Boolean)
  };
}

// Compact "needs attention" banner for Home — full detail (marks, history) lives in Progress.
function attentionBannerHtml(){
  const stalls=progressionStallWarnings();
  const sore=repeatedSorenessWarnings();
  if(!stalls.length&&!sore.length) return '';
  return `<section class="card click-card" style="border-color:rgba(212,72,84,.30);background:#fff7f7" onclick="setView('progress')">
    <div class="eyebrow" style="color:var(--pink)">${esc(t('progress.needsAttention'))}</div>
    ${sore.map(w=>`<p style="margin-top:8px">${t('progress.soreWarn',{area:esc(w.area),n:w.count})}</p>`).join('')}
    ${stalls.map(w=>`<p style="margin-top:8px">${t('progress.stallWarn',{name:esc(w.exercise.name),marks:esc(w.marks.map(m=>w.exercise.log_mode==='seconds'?fmtSec(m):m+' '+t('common.reps')).join(' → '))})}</p>`).join('')}
  </section>`;
}

    <div class="grid" style="margin-top:10px">

// ---- Cross-training analysis: strength/skill vs running/bike/swim, per week ----
// The training plan's whole "de donde vienes / a donde vas" structure assumes endurance and
// strength work interact — this surfaces that interaction from data instead of leaving it to
// memory. Monday-start weeks, matching todayDow()'s convention elsewhere.

function weekStart(date){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  const dow=d.getDay()===0?6:d.getDay()-1;
  d.setDate(d.getDate()-dow);
  return d;
}

function crossTrainingWeeks(numWeeks=6){
  const mySessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at);
  const myActivities=state.externalActivities||[];
  const weeks=new Map();
  const ensure=key=>{
    if(!weeks.has(key)) weeks.set(key,{week:key,strengthSessions:0,setsDone:0,rirSamples:[],cleanDone:0,cleanTotal:0,enduranceMin:0,enduranceSessions:0,feltWorse:0});
    return weeks.get(key);
  };
  mySessions.forEach(s=>{
    const w=ensure(weekStart(s.completed_at).toISOString().slice(0,10));
    w.strengthSessions++;
    if(s.report_felt_worse) w.feltWorse++;
    state.sets.filter(x=>x.session_id===s.id&&x.done).forEach(x=>{
      w.setsDone++;
      if(x.rir!=null) w.rirSamples.push(x.rir);
      if(x.hold_clean!=null){ w.cleanTotal++; if(x.hold_clean) w.cleanDone++; }
    });
  });
  myActivities.forEach(a=>{
    const w=ensure(weekStart(a.performed_at).toISOString().slice(0,10));
    w.enduranceMin+=a.duration_min;
    w.enduranceSessions++;
  });
  return [...weeks.values()].sort((a,b)=>b.week.localeCompare(a.week)).slice(0,numWeeks).map(w=>({
    ...w,
    avgRir:w.rirSamples.length?Math.round((w.rirSamples.reduce((a,b)=>a+b,0)/w.rirSamples.length)*10)/10:null,
    cleanPct:w.cleanTotal?Math.round((w.cleanDone/w.cleanTotal)*100):null
  }));
}

// How often a "felt worse than usual" report follows a hard (RPE >= 7) endurance session in
// the prior 36h — a rough, transparent version of the interference the plan's day-ordering
// (Z2 the day after piernas, calidad separated 6-8h from Front Lever) is designed to avoid.
function feltWorseAfterEndurance(){
  const flagged=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&s.report_felt_worse);
  if(!flagged.length) return null;
  const activities=state.externalActivities||[];
  const linked=flagged.filter(s=>{
    const t=new Date(s.completed_at).getTime();
    return activities.some(a=>{
      const hoursBefore=(t-new Date(a.performed_at).getTime())/3600000;
      return hoursBefore>0&&hoursBefore<=36&&a.intensity>=7;
    });
  }).length;
  return {total:flagged.length,linked};
}

function crossTrainingCardHtml(){
  const weeks=crossTrainingWeeks(6);
  if(!weeks.some(w=>w.strengthSessions||w.enduranceSessions)) return '';
  const worse=feltWorseAfterEndurance();
  return `<section class="card">
    <h2>${esc(t('cross.title'))}</h2>
    <div style="margin-top:10px;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">

        </tr></thead>
        <tbody>

            <td style="padding:6px 8px">${w.strengthSessions} · ${w.setsDone} ${esc(t('common.sets'))}</td>

function getMyRecovery(){
  return SkandiRecovery.computeMuscleRecovery({
    sets:state.sets, sessions:state.sessions, exercises:state.exercises,
    activities:state.externalActivities, userId:state.user.id, now:Date.now()

function formatHours(h){
  if(h<=0) return t('recovery.now');
  if(h<1) return t('recovery.lessHour');
  if(h<24) return `${Math.ceil(h)}h`;
  const d=Math.floor(h/24),r=Math.round(h%24);
  return r?`${d}d ${r}h`:`${d}d`;
}

function muscleDetailBreakdown(name){
  const since=Date.now()-SkandiRecovery.RECOVERY_LOOKBACK_DAYS*864e5;
  const exById=new Map(state.exercises.map(e=>[e.id,e]));
  const byExercise=new Map();
  state.sets.filter(s=>{
    const session=state.sessions.find(x=>x.id===s.session_id);
    const when=new Date(session?.completed_at||s.created_at).getTime();
    return s.done && when>=since && s.user_id===state.user.id;
  }).forEach(s=>{
    const ex=exById.get(s.exercise_id);
    const pct=ex?.muscles?.[name];
    if(!ex||!pct) return;
    const cur=byExercise.get(ex.id)||{name:ex.name,pct,sets:0};
    cur.sets++;
    byExercise.set(ex.id,cur);
  });
  const activityRows=(state.externalActivities||[]).filter(a=>{
    const t=new Date(a.performed_at).getTime();
    const map=SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other;
    // Matches the recovery engine's own t > now exclusion (skandi-recovery.js) so a stray
    // future-dated row (pre-existing bad data, clock skew) can't show here while contributing
    // nothing to the freshness score displayed above it.
    return t>=since && t<=Date.now() && !!map[name];
  }).map(a=>({label:activityTypeLabel(a.activity_type),pct:(SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other)[name],when:a.performed_at}));
  return {exerciseRows:[...byExercise.values()].sort((a,b)=>b.sets-a.sets),activityRows};
}
