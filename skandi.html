<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Skandi Fit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#07080b;
  --panel:#12131a;
  --panel2:#1d1e27;
  --line:#2a2c38;
  --text:#f4f5f7;
  --muted:#9698a6;
  --lime:#b8ff2c;
  --green:#2fd37d;
  --amber:#ffbd39;
  --pink:#ff6478;
  --blue:#62a4ff;
  --shadow:0 18px 44px rgba(184,255,44,.13);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{min-height:100dvh;padding-bottom:88px}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:820px;margin:0 auto;padding:18px 14px 104px;overflow:hidden}
.top{display:grid;grid-template-columns:1fr 42px;align-items:center;gap:12px;padding:8px 0 18px}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.ship-mark{width:66px;height:40px;border-radius:13px;background:transparent;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.ship-mark img{width:72px;height:34px;object-fit:contain}
.brand-text{display:grid;line-height:1.05}
.brand-text small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:1000}
.brand-text span,.brand-text small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dof-badge{height:34px;max-width:74px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.auth-brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.auth-ship{width:100%;height:128px;border-radius:24px;background:#0b0c12;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.auth-ship img{width:96%;height:112px;object-fit:contain}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0b0c12;border:1px solid var(--line);border-radius:18px;padding:5px}
.auth-tab{background:transparent;color:var(--muted);border-radius:14px;padding:11px;font-weight:1000}
.auth-tab.active{background:var(--panel2);color:var(--text)}
.avatar{width:42px;height:42px;border-radius:50%;background:#222532;display:grid;place-items:center;font-weight:900;color:#07080b;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:grid;gap:14px;margin-bottom:16px}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:900;font-size:13px}
h1{font-size:clamp(32px,7.8vw,52px);line-height:.98;margin:0;letter-spacing:0;overflow-wrap:anywhere}
h2{font-size:24px;margin:0 0 10px;line-height:1.05}
h3{font-size:19px;margin:0;line-height:1.1}
p{color:var(--muted);line-height:1.45;margin:0}
.focus{background:var(--lime);color:#07080b;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.focus p{color:#223006}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#07080b var(--p),rgba(7,8,11,.22) 0);position:relative;font-weight:1000;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--lime)}
.ring span{position:relative;z-index:1;color:#07080b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat,.card,.workout,.exercise,.feed,.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:24px}
.stat{padding:18px;min-height:100px}
.stat strong{display:block;font-size:36px;line-height:1;color:var(--text)}
.stat small{display:block;color:var(--muted);font-weight:800;margin-top:12px}
.card{padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.accent{color:var(--lime)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:13px 18px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.primary{background:var(--lime);color:#07080b;box-shadow:var(--shadow)}
.btn.ghost{background:#0b0c11}
.btn.danger{color:var(--pink)}
.btn.small{padding:9px 12px;border-radius:14px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,14,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}
.tabs-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{background:transparent;color:#727482;display:grid;gap:4px;place-items:center;font-weight:900;font-size:12px;padding:8px 2px}
.tab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none}
.tab.active{color:var(--lime)}
.week{display:grid;gap:9px}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;background:var(--panel2);border-radius:18px;padding:13px 14px;color:var(--muted);font-weight:900}
.day.today{background:var(--lime);color:#08090d}
.day.today .icon-btn{background:rgba(7,8,11,.16);border-color:rgba(7,8,11,.25);color:#08090d}
.day span:nth-child(2){color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise{padding:14px;display:grid;gap:10px;margin:10px 0}
.ex-head{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}
.thumb{width:72px;height:72px;border-radius:16px;background:#0b0c12;object-fit:cover;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.play{color:var(--lime);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;background:rgba(184,255,44,.14);color:var(--lime);border-radius:999px;font-weight:1000}
.pill.dark{background:#0b0c12;color:var(--muted)}
.muscles{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;background:#0b0c12;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);width:0}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 46px 30px;gap:6px;align-items:center}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:13px;text-align:center}
.field.left{text-align:left}
textarea.field{min-height:112px;text-align:left;resize:vertical}
.check{height:48px;border-radius:15px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center}
.check.done{background:var(--lime);color:#08090d}
.set-remove{width:30px;height:48px;border-radius:12px;background:transparent;color:var(--muted);border:1px solid var(--line);display:grid;place-items:center}
.workout-bar{position:sticky;top:-20px;z-index:5;margin:-20px -20px 16px;padding:16px 20px 14px;background:var(--panel);border-bottom:1px solid var(--line);border-radius:28px 28px 0 0}
.workout-bar-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.workout-bar-title h1{font-size:20px}
.workout-bar-top{display:flex;align-items:center;gap:12px}
.mini-ring{position:relative;width:56px;height:56px;flex:0 0 auto}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring .ring-track{fill:none;stroke:var(--panel2);stroke-width:6}
.mini-ring .ring-fg{fill:none;stroke:var(--lime);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.mini-ring-center{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:1000}
.workout-bar-info{flex:1;min-width:0}
.workout-bar-info small{display:block;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.workout-bar-info strong{font-size:20px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.icon-btn.tiny{width:30px;height:30px;font-size:13px}
.icon-btn.danger{color:var(--pink)}
.rest-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}
.chip.active{background:var(--lime);color:#07080b;border-color:var(--lime)}
.feed{padding:16px;margin:12px 0}
.feed-title{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.leader{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.body-diagram{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.body-figure{text-align:center}
.body-figure svg{width:100%;height:auto}
.muscle-region{cursor:pointer;transition:opacity .15s}
.muscle-region:hover,.muscle-region:active{opacity:.82}
.muscle-legend{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.muscle-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.muscle-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:24px}
.auth-logo{font-size:54px;font-weight:1000;color:var(--lime)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-card{width:min(820px,100%);max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;padding:20px}
.x{width:44px;height:44px;border-radius:50%;background:var(--panel2);color:var(--text);display:grid;place-items:center;flex:0 0 auto}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}
.signup-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr}
  .ex-head{grid-template-columns:58px 1fr auto}
  .thumb{width:58px;height:58px}
  .set-row{grid-template-columns:24px 1fr 1fr 42px 26px}
  .app{padding-left:13px;padding-right:13px}
  .brand{font-size:22px}
  .brand-text small{font-size:10px}
  .focus .row{align-items:flex-start}
  .focus h2{font-size:25px}
  .tab{font-size:11px}
  .tab svg{width:24px;height:24px}
}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="auth-box stack">
    <div class="auth-brand">
      <img class="dof-badge" src="/assets/skandi/dof-logo.png" alt="DOF">
      <div class="eyebrow">Skandi Nomad</div>
    </div>
    <div class="auth-ship"><img src="/assets/skandi/skandi-nomad-cutout.png" alt="Skandi Nomad"></div>
    <div>
      <div class="eyebrow">Skandi Fit</div>
      <h1>Train with the crew</h1>
    </div>
    <p>A lightweight DOF crew training app for the Skandi Nomad. Sign in or create an account to build routines, log lifts, and follow the boat's progress.</p>
    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" onclick="setAuthMode('login')">Sign in</button>
      <button id="signupTab" class="auth-tab" onclick="setAuthMode('signup')">Create account</button>
    </div>
    <div id="signupNames" class="signup-names hidden">
      <input id="firstName" class="field left" type="text" placeholder="First name">
      <input id="lastName" class="field left" type="text" placeholder="Last name">
    </div>
    <input id="email" class="field left" type="email" placeholder="you@email.com">
    <input id="password" class="field left" type="password" placeholder="Password">
    <button id="authBtn" class="btn primary" onclick="submitAuth()">Sign in</button>
    <p id="authMsg"></p>
  </div>
</div>

<main id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      <div class="ship-mark"><img src="/assets/skandi/skandi-nomad-cutout.png" alt="Skandi Nomad"></div>
      <div class="brand-text"><span>Skandi Fit</span><small>Skandi Nomad · DOF</small></div>
    </div>
    <button class="avatar" onclick="signOut()" title="Sign out" id="avatar">SF</button>
  </header>
  <section id="screen"></section>
</main>

<nav class="tabs hidden" id="tabs">
  <div class="tabs-inner">
    <button class="tab active" data-view="home" onclick="setView('home')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</button>
    <button class="tab" data-view="train" onclick="setView('train')"><svg viewBox="0 0 24 24"><path d="M4 14h2m12 0h2M7 10v8m10-8v8M9 12h6"/></svg>Train</button>
    <button class="tab" data-view="crew" onclick="setView('crew')"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Crew</button>
    <button class="tab" data-view="progress" onclick="setView('progress')"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 3-3 3 2 5-7"/></svg>Progress</button>
    <button class="tab" data-view="library" onclick="setView('library')"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Library</button>
  </div>
</nav>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script>

const state={user:null,profile:null,view:'home',authMode:'login',exercises:[],templates:[],items:[],sessions:[],sets:[],active:null,activeItems:[],timer:null,elapsed:0,rest:0,restTotal:0};
const REST_RING_C=2*Math.PI*24;

const initials=name=>(name||'SF').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const ICON_PATHS={

};
const icon=(name,size=20)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto">${ICON_PATHS[name]||''}</svg>`;
const THUMB_FALLBACK=icon('image',26);
const fmtSec=s=>`${String(Math.floor((s||0)/60)).padStart(2,'0')}:${String((s||0)%60).padStart(2,'0')}`;
const todayDow=()=>{const d=new Date().getDay();return d===0?6:d-1};
const displayName=()=>state.profile?.name||state.user?.user_metadata?.name||state.user?.email?.split('@')[0]||'crew';
const firstName=()=>displayName().split(/\s+/)[0];

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  state.user=session?.user||null;
  if(!state.user) return showAuth();
  await loadAll();
  showApp();
}

function showAuth(){
  $('auth').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('tabs').classList.add('hidden');
  setAuthMode(state.authMode);
}

function showApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('tabs').classList.remove('hidden');
  const name=displayName();
  $('avatar').textContent=initials(name);
  render();
}

function setAuthMode(mode){
  state.authMode=mode;
  $('loginTab')?.classList.toggle('active',mode==='login');
  $('signupTab')?.classList.toggle('active',mode==='signup');
  $('signupNames')?.classList.toggle('hidden',mode!=='signup');
  if($('authBtn')) $('authBtn').textContent=mode==='login'?'Sign in':'Create account';
  if($('authMsg')) $('authMsg').textContent='';
}

async function submitAuth(){
  const email=$('email').value.trim();
  const password=$('password').value;
  const firstName=($('firstName')?.value||'').trim();
  const lastName=($('lastName')?.value||'').trim();
  const fullName=[firstName,lastName].filter(Boolean).join(' ');
  if(!email||!password) return $('authMsg').textContent='Email and password are required.';
  if(state.authMode==='signup'&&(!firstName||!lastName)) return $('authMsg').textContent='First name and last name are required.';
  $('authMsg').textContent=state.authMode==='login'?'Signing in...':'Creating account...';
  if(state.authMode==='login'){
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) return $('authMsg').textContent=error.message;
    state.user=data.user;
    await loadAll();
    return showApp();
  }
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:fullName},emailRedirectTo:location.href}});
  if(error) return $('authMsg').textContent=error.message;
  if(data.session){
    state.user=data.user;
    await loadAll();
    return showApp();
  }
  $('authMsg').textContent='Account created. Check your email if confirmation is required, then sign in.';
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

async function loadAll(){
  const [{data:profile},{data:exercises},{data:templates},{data:items},{data:sessions},{data:sets}]=await Promise.all([
    sb.from('profiles').select('id,name,email,avatar_url').eq('id',state.user.id).maybeSingle(),
    sb.from('skandi_exercises').select('*').order('name'),
    sb.from('skandi_templates').select('*, profile:profiles(name,avatar_url)').order('weekday',{nullsFirst:false}).order('created_at',{ascending:false}),
    sb.from('skandi_template_items').select('*, exercise:skandi_exercises(*)').order('sort_order'),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').order('started_at',{ascending:false}).limit(60),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').order('created_at',{ascending:false}).limit(600)
  ]);
  state.profile=profile||{name:state.user.email};
  state.exercises=exercises||[];
  state.templates=templates||[];
  state.items=items||[];
  state.sessions=sessions||[];
  state.sets=sets||[];
}

function muscleGroupOf(e){
  const muscles=Object.entries(e.muscles||{}).sort((a,b)=>b[1]-a[1]);
  if(!muscles.length) return 'Other';
  return MUSCLE_GROUP_MAP[muscles[0][0]]||'Other';
}

function groupExercisesByMuscle(list){
  const groups=new Map();
  list.forEach(e=>{
    const g=muscleGroupOf(e);
    if(!groups.has(g)) groups.set(g,[]);
    groups.get(g).push(e);
  });
  return MUSCLE_GROUP_ORDER
    .filter(g=>groups.has(g))
    .map(g=>[g,groups.get(g).sort((a,b)=>a.name.localeCompare(b.name))]);
}

function leaderboard(){
  const profiles=new Map(state.sessions.map(s=>[s.user_id,s.profile?.name||'Crew member']));
  const best=new Map();
  state.sets.filter(s=>s.done&&Number(s.weight_kg)>0).forEach(s=>{
    const key=`${s.user_id}:${s.exercise_id}`;
    const current=best.get(key);
    if(!current||Number(s.weight_kg)>current.weight) best.set(key,{
      user_id:s.user_id,name:profiles.get(s.user_id)||'Crew member',exercise:s.exercise?.name||'Exercise',weight:Number(s.weight_kg),reps:s.reps
    });
  });
  return [...best.values()].sort((a,b)=>b.weight-a.weight);
}

function heatColor(score){
  const stops=[[47,211,125],[255,189,57],[255,100,120]];
  const t=Math.max(0,Math.min(100,score))/100;
  const seg=t<0.5?0:1;
  const local=t<0.5?t/0.5:(t-0.5)/0.5;
  const a=stops[seg],b=stops[seg+1];
  const mix=i=>Math.round(a[i]+(b[i]-a[i])*local);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

function bodyRegionShape(r,fill,clickable){
  const attrs=`fill="${fill}" stroke="#07080b" stroke-width="1.5"`;
  const inner=r.shape==='ellipse'
    ?`<ellipse cx="${r.cx}" cy="${r.cy}" rx="${r.rx}" ry="${r.ry}" ${attrs}/>`
    :`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx}" ${attrs}/>`;
  return clickable?`<g class="muscle-region" onclick="openMuscleDetail('${r.name}')">${inner}</g>`:inner;
}

function bodyFigureSVG(view,scoreByName){
  const scaffold=MUSCLE_BODY_SCAFFOLD.map(r=>bodyRegionShape(r,'#1d1e27',false)).join('');
  const armFiller=view==='back'?MUSCLE_BODY_SCAFFOLD_ARMS.map(r=>bodyRegionShape(r,'#1d1e27',false)).join(''):'';
  const regions=MUSCLE_BODY_REGIONS.filter(r=>r.view===view)
    .map(r=>bodyRegionShape(r,heatColor(scoreByName.get(r.name)||0),true)).join('');
  return `<svg viewBox="0 0 170 350" xmlns="http://www.w3.org/2000/svg">${scaffold}${armFiller}${regions}</svg>`;
}

function bodyDiagram(scoreByName,userOnly){

    <div class="body-figure"><small class="muted">BACK</small>${bodyFigureSVG('back',scoreByName)}</div>
  </div>
  <div class="muscle-legend">
    <span><i style="background:${heatColor(5)}"></i>Fresh</span>
    <span><i style="background:${heatColor(50)}"></i>Moderate</span>
    <span><i style="background:${heatColor(100)}"></i>Very loaded</span>
  </div>
  <p class="muted" style="text-align:center;margin-top:8px;font-size:12px">Tap a muscle for details</p>`;
}

function muscleDetailBreakdown(name,userOnly){
  const since=Date.now()-7*864e5;
  const exById=new Map(state.exercises.map(e=>[e.id,e]));
  const byExercise=new Map();
  state.sets.filter(s=>{
    const session=state.sessions.find(x=>x.id===s.session_id);
    const when=new Date(session?.completed_at||s.created_at).getTime();
    return s.done && when>=since && (!userOnly || s.user_id===state.user.id);
  }).forEach(s=>{
    const ex=exById.get(s.exercise_id);
    const pct=ex?.muscles?.[name];
    if(!ex||!pct) return;
    const cur=byExercise.get(ex.id)||{name:ex.name,pct,sets:0};
    cur.sets++;
    byExercise.set(ex.id,cur);
  });
  return [...byExercise.values()].sort((a,b)=>b.sets-a.sets);
}

function muscleLoad(userOnly){
  const since=Date.now()-7*864e5;
  const exById=new Map(state.exercises.map(e=>[e.id,e]));
  const scores=new Map();
  state.sets.filter(s=>{
    const session=state.sessions.find(x=>x.id===s.session_id);
    const when=new Date(session?.completed_at||s.created_at).getTime();
    return s.done && when>=since && (!userOnly || s.user_id===state.user.id);
  }).forEach(s=>{
    const ex=exById.get(s.exercise_id);
    const muscles=ex?.muscles||{};
    const work=(Number(s.weight_kg)||1)*(Number(s.reps)||Math.max(1,(Number(s.seconds)||30)/30));
    Object.entries(muscles).forEach(([muscle,pct])=>{
      scores.set(muscle,(scores.get(muscle)||0)+(work*(Number(pct)||0)/100));
    });
  });
  const max=Math.max(1,...scores.values());
  const all=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Glutes','Hamstrings','Core','Forearms'];
  return all.map(name=>({name,score:Math.min(100,Math.round(((scores.get(name)||0)/max)*100))}))
    .sort((a,b)=>b.score-a.score);
}

function loadLabel(score){
  if(score>=75) return 'very loaded';
  if(score>=45) return 'loaded';
  if(score>=20) return 'moderate';
  return 'fresh';
}

async function startWorkout(templateId){
  if(state.active){
    if(state.active.template_id===templateId){ openActiveWorkout(); return; }
    return alert('Finish or cancel your current workout before starting another.');
  }
  const tpl=state.templates.find(t=>t.id===templateId);
  const its=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  if(!tpl||!its.length) return;
  const {data:session,error}=await sb.from('skandi_sessions').insert({user_id:state.user.id,template_id:tpl.id,title:tpl.name}).select().single();
  if(error) return alert(error.message);
  const rows=its.flatMap(item=>Array.from({length:item.target_sets},(_,idx)=>({
    session_id:session.id,user_id:state.user.id,exercise_id:item.exercise_id,set_idx:idx+1,target_reps:item.target_reps
  })));
  await sb.from('skandi_sets').insert(rows);
  state.active=session;
  state.activeItems=its;
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  await loadAll();
  resumeWorkoutTimer();
  openActiveWorkout();
}

function resumeWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    state.elapsed++;
    if(state.rest>0) state.rest--;
    updateWorkoutClocks();
  },1000);
}

function pauseWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=null;
}

function restRingOffset(){
  if(!state.restTotal) return REST_RING_C;
  const frac=Math.max(0,Math.min(1,state.rest/state.restTotal));
  return REST_RING_C*(1-frac);
}

function updateWorkoutClocks(){
  const stopwatch=$('activeStopwatch');
  const rest=$('activeRest');
  const ring=$('restRingFg');
  if(stopwatch) stopwatch.textContent=fmtSec(state.elapsed);
  if(rest) rest.textContent=fmtSec(state.rest);
  if(ring) ring.setAttribute('stroke-dashoffset',restRingOffset().toFixed(1));
}

function toggleWorkoutTimer(){
  if(state.timer) pauseWorkoutTimer(); else resumeWorkoutTimer();
  renderActiveWorkout();
}

function setRest(seconds){
  state.rest=seconds;
  state.restTotal=seconds;
  renderActiveWorkout();
}

function openActiveWorkout(){
  $('modal').classList.add('show');
  renderActiveWorkout();
}

  const allSets=state.sets.filter(s=>s.session_id===state.active.id);
  const done=allSets.filter(s=>s.done).length;
  const running=!!state.timer;
  const restPresets=[30,60,90,120,180];
  $('modalCard').innerHTML=`
    <div class="workout-bar">
      <div class="workout-bar-title">
        <div><small class="muted">Today workout</small><h1>${esc(state.active.title)}</h1></div>
        <button class="x" onclick="closeModal()">${icon('close',20)}</button>
      </div>
      <div class="workout-bar-top">
        <div class="mini-ring">
          <svg viewBox="0 0 60 60">
            <circle class="ring-track" cx="30" cy="30" r="24"></circle>
            <circle id="restRingFg" class="ring-fg" cx="30" cy="30" r="24" stroke-dasharray="${REST_RING_C.toFixed(1)}" stroke-dashoffset="${restRingOffset().toFixed(1)}"></circle>
          </svg>
          <div class="mini-ring-center" id="activeRest">${fmtSec(state.rest)}</div>
        </div>
        <div class="workout-bar-info"><small>Elapsed</small><strong id="activeStopwatch">${fmtSec(state.elapsed)}</strong></div>
        <button class="icon-btn" onclick="toggleWorkoutTimer()" aria-label="${running?'Pause':'Resume'}">${running?icon('pause',16):icon('play',16)}</button>
        <button class="icon-btn danger" onclick="cancelWorkout()" aria-label="Cancel workout">${icon('close',16)}</button>
      </div>
      <div class="rest-presets">
        ${restPresets.map(s=>`<button type="button" class="chip ${state.restTotal===s?'active':''}" onclick="setRest(${s})">${s<60?s+'s':(s/60)+'m'}</button>`).join('')}

}

async function updateSet(id,key,value){
  const patch={updated_at:new Date().toISOString()};
  patch[key]=value===''?null:Number(value);
  const {error}=await sb.from('skandi_sets').update(patch).eq('id',id);
  if(error) return alert(error.message);
  const s=state.sets.find(x=>x.id===id);
  if(s) Object.assign(s,patch);
}

async function toggleSet(id,rest){
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  const done=!s.done;
  const {error}=await sb.from('skandi_sets').update({done,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alert(error.message);
  s.done=done;
  state.rest=done?rest:0;
  state.restTotal=done?rest:0;
  renderActiveWorkout();
}

async function addSet(exerciseId,targetReps){
  if(!state.active) return;
  const sessionId=state.active.id;
  const existing=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===exerciseId);
  const nextIdx=(existing.length?Math.max(...existing.map(s=>s.set_idx)):0)+1;
  const {data,error}=await sb.from('skandi_sets').insert({
    session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:nextIdx,target_reps:targetReps
  }).select().single();
  if(error) return alert(error.message);
  state.sets.push(data);
  renderActiveWorkout();
}

async function removeSet(id){
  const {error}=await sb.from('skandi_sets').delete().eq('id',id);
  if(error) return alert(error.message);
  state.sets=state.sets.filter(s=>s.id!==id);
  renderActiveWorkout();
}

async function cancelWorkout(){
  if(!state.active) return;
  if(!confirm('Cancel this workout? Your logged sets will be deleted.')) return;
  const sessionId=state.active.id;
  pauseWorkoutTimer();
  const {error}=await sb.from('skandi_sessions').delete().eq('id',sessionId);
  if(error) return alert(error.message);
  state.active=null;
  state.activeItems=[];
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  closeModal();
  await loadAll();
  render();
}

function renderTemplateExercisePicker(){
  const q=($('tplExSearch')?.value||'').trim().toLowerCase();
  const list=state.exercises.filter(e=>{
    if(builderState.group!=='All'&&muscleGroupOf(e)!==builderState.group) return false;
    if(q&&!`${e.name} ${e.english_name||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const filters=['All',...MUSCLE_GROUP_ORDER].map(g=>
    `<button type="button" class="btn small ${builderState.group===g?'primary':''}" style="margin:0 6px 8px 0" onclick="setBuilderGroup('${esc(g)}')">${esc(g)}</button>`
  ).join('');
  const groups=groupExercisesByMuscle(list).map(([group,items])=>`
    <div class="eyebrow" style="margin-top:14px">${esc(group)} · ${items.length}</div>
    ${items.map(e=>templateExerciseOption(e)).join('')}
  `).join('')||empty('No exercises match your search.');
  $('tplExPicker').innerHTML=`<div style="margin-top:10px">${filters}</div><div class="stack">${groups}</div>`;
}

function setBuilderGroup(group){
  builderState.group=group;
  renderTemplateExercisePicker();
}

function toggleBuilderExercise(id,checked){
  if(checked) builderState.selected.set(id,{sets:3,reps:'8-12',rest:90});
  else builderState.selected.delete(id);
  renderTemplateExercisePicker();
}

function updateBuilderConfig(id,key,value){
  const cfg=builderState.selected.get(id);
  if(!cfg) return;
  if(key==='reps') cfg.reps=value.trim()||'8-12';
  else cfg[key]=Math.max(0,Number(value)||0)||(key==='sets'?1:0);
}

async function saveTemplate(id){
  const checked=[...builderState.selected.keys()];
  if(!$('tplName').value.trim()||!checked.length) return alert('Add a name and at least one exercise.');
  const payload={user_id:state.user.id,name:$('tplName').value.trim(),weekday:Number($('tplDay').value),notes:$('tplNotes').value.trim()||null,is_public:true,updated_at:new Date().toISOString()};
  let templateId=id;
  if(id) await sb.from('skandi_templates').update(payload).eq('id',id);
  else {
    const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
    if(error) return alert(error.message);
    templateId=data.id;
  }
  await sb.from('skandi_template_items').delete().eq('template_id',templateId);
  const rows=checked.map((exercise_id,idx)=>{
    const cfg=builderState.selected.get(exercise_id);
    return {template_id:templateId,exercise_id,sort_order:idx,target_sets:cfg.sets,target_reps:cfg.reps,target_rest_sec:cfg.rest};
  });
  await sb.from('skandi_template_items').insert(rows);
  closeModal();
  await loadAll();
  render();
}

async function forkTemplateToDay(templateId,weekday){
  const t=state.templates.find(x=>x.id===templateId);
  if(!t) return {error:{message:'Routine not found.'}};
  const sourceItems=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  const payload={user_id:state.user.id,name:t.name,notes:t.notes,weekday,is_public:true,forked_from:t.id,forked_from_name:t.profile?.name||'Crew member',updated_at:new Date().toISOString()};
  const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
  if(error) return {error};
  const rows=sourceItems.map((i,idx)=>({template_id:data.id,exercise_id:i.exercise_id,sort_order:idx,target_sets:i.target_sets,target_reps:i.target_reps,target_rest_sec:i.target_rest_sec,note:i.note}));
  if(rows.length) await sb.from('skandi_template_items').insert(rows);
  return {data};
}

    <input id="exName" class="field left" placeholder="Name">
    <input id="exEnglish" class="field left" placeholder="Alternative name">
    <input id="exMedia" class="field left" placeholder="Direct GIF/video URL">
    <input id="exPage" class="field left" placeholder="Gymvisual reference URL">
    <textarea id="exMuscles" class="field" placeholder='Muscles JSON: {"Chest":60,"Triceps":25}'></textarea>
    <button class="btn primary" style="width:100%" onclick="saveExercise()">Save exercise</button>`;
}

async function saveExercise(){
  const name=$('exName').value.trim();
  if(!name) return;
  let muscles={};
  try{ muscles=JSON.parse($('exMuscles').value||'{}'); }catch{ return alert('El JSON de musculos no es valido.'); }
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const {error}=await sb.from('skandi_exercises').insert({
    slug,name,english_name:$('exEnglish').value.trim()||null,category:'Strength',
    muscles,media_url:$('exMedia').value.trim()||null,media_page_url:$('exPage').value.trim()||null,
    instructions:[],coach_tips:[],created_by:state.user.id
  });
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

function closeModal(){
  $('modal').classList.remove('show');
  pauseWorkoutTimer();
}

function empty(msg){ return `<div class="empty">${esc(msg)}</div>`; }

sb.auth.onAuthStateChange((_event,session)=>{ if(session&&!state.user){ state.user=session.user; loadAll().then(showApp); } });
init();
</script>
</body>
</html>
