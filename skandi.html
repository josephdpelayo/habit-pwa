<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#012456">
<title>Skandi Fit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="skandi-recovery.js"></script>
<style>
:root{
  --bg:#eef4f8;
  --panel:#ffffff;
  --panel2:#f5f8fb;
  --panel3:#e7eef5;
  --line:#d7e1ea;
  --text:#071f42;
  --muted:#607086;
  --dof-navy:#012456;
  --dof-deep:#000f32;
  --dof-blue:#334c6d;
  --dof-steel:#788ba1;
  --dof-ice:#f4fafe;
  --lime:#00a8c8;
  --green:#1d9a6c;
  --amber:#f0a22e;
  --pink:#d44854;
  --blue:#245f9f;
  --wash:rgba(1,36,86,.08);
  --shadow:0 18px 44px rgba(1,36,86,.12);
  --glow:0 18px 38px rgba(0,168,200,.18);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{position:relative;min-height:100dvh;padding-bottom:76px}
body:before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:radial-gradient(circle at 18% -8%,rgba(1,36,86,.18),transparent 34%),linear-gradient(180deg,#f8fbfe 0%,#eef4f8 48%,#e7eff5 100%);opacity:1}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 104px;overflow:hidden}
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 42px;align-items:center;gap:12px;margin:-18px -14px 22px;padding:14px 14px 12px;background:rgba(244,250,254,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(1,36,86,.08)}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.ship-mark{width:70px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);box-shadow:0 8px 22px rgba(1,36,86,.10)}
.ship-mark img{width:72px;height:34px;object-fit:contain}
.brand-text{display:grid;line-height:1.05}
.brand-text small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:1000}
.brand-text span,.brand-text small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dof-badge{height:36px;max-width:78px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line);box-shadow:0 10px 22px rgba(1,36,86,.10)}
.auth-brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.auth-ship{width:100%;height:138px;border-radius:14px;background:linear-gradient(180deg,#fff,#e9f1f7);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -18px 32px rgba(1,36,86,.08)}
.auth-ship img{width:96%;height:112px;object-fit:contain}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px}
.auth-tab{background:transparent;color:var(--muted);border-radius:8px;padding:11px;font-weight:1000}
.auth-tab.active{background:var(--dof-navy);color:#fff;box-shadow:0 10px 20px rgba(1,36,86,.18)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--dof-navy);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden;box-shadow:0 10px 22px rgba(1,36,86,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:grid;gap:14px;margin-bottom:16px;padding-top:4px}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--dof-steel);font-weight:900;font-size:12px}
h1{font-size:clamp(32px,7.8vw,52px);line-height:.98;margin:0;letter-spacing:0;overflow-wrap:anywhere}
h2{font-size:24px;margin:0 0 10px;line-height:1.05}
h3{font-size:19px;margin:0;line-height:1.1}
p{color:var(--muted);line-height:1.45;margin:0}
.focus{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--dof-navy),#183d68 64%,#55708b);color:#fff;border-radius:14px;padding:18px;box-shadow:0 22px 52px rgba(1,36,86,.22)}
.focus.action{width:100%;border:0;text-align:left;display:block;cursor:pointer}
.focus.action:hover{transform:translateY(-1px);box-shadow:0 26px 58px rgba(1,36,86,.26)}
.focus:after{content:"";position:absolute;right:-18px;bottom:-24px;width:210px;height:110px;background:url('/assets/skandi/skandi-nomad-cutout.png') center/contain no-repeat;opacity:.20}
.focus>*{position:relative;z-index:1}
.focus p{color:#d9e5ee}
.focus .eyebrow{color:#aebdca!important}
.focus-cta{display:flex;align-items:center;gap:8px;margin-top:14px;color:#fff;font-weight:1000}
.focus-cta i{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:#fff;color:var(--dof-navy);font-style:normal}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),rgba(255,255,255,.24) 0);position:relative;font-weight:1000;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--dof-navy)}
.ring span{position:relative;z-index:1;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat,.card,.workout,.exercise,.feed,.modal-card{background:rgba(255,255,255,.86);border:1px solid rgba(1,36,86,.10);border-radius:8px;box-shadow:var(--shadow)}
.click-card{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.click-card:hover{transform:translateY(-1px);border-color:rgba(1,36,86,.20);box-shadow:0 22px 48px rgba(1,36,86,.16)}
.stat{padding:18px;min-height:100px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--dof-navy),var(--blue),#a9bac9);opacity:.82}
.stat strong{display:block;font-size:36px;line-height:1;color:var(--text)}
.stat small{display:block;color:var(--muted);font-weight:800;margin-top:12px}
.card{padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.accent{color:var(--blue)}
.btn{background:#fff;color:var(--dof-navy);border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease;box-shadow:0 8px 18px rgba(1,36,86,.06)}
.btn:hover{transform:translateY(-1px);background:var(--panel3)}
.btn.primary{background:var(--dof-navy);color:#fff;box-shadow:0 16px 30px rgba(1,36,86,.22);border-color:var(--dof-navy)}
.btn.ghost{background:var(--panel2)}
.btn.danger{color:var(--pink)}
.btn.small{padding:9px 12px;border-radius:10px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-top:1px solid rgba(1,36,86,.10);z-index:20;box-shadow:0 -16px 34px rgba(1,36,86,.10)}
.tabs-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{background:transparent;color:#727482;display:grid;gap:2px;place-items:center;font-weight:900;font-size:11px;padding:6px 1px;border-radius:8px;min-height:50px}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none}
.tab.active{color:var(--dof-navy);background:rgba(1,36,86,.08)}
.week{display:grid;gap:9px}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;background:var(--panel2);border-radius:8px;padding:13px 14px;color:var(--muted);font-weight:900;border:1px solid rgba(1,36,86,.08)}
.day.today{background:var(--dof-navy);color:#fff;box-shadow:0 14px 28px rgba(1,36,86,.16)}
.day.today .icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.day span:nth-child(2){color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exercise{padding:14px;display:grid;gap:10px;margin:10px 0}
.ex-head{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}
.thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(180deg,#eef4f8,#dfe9f1);object-fit:cover;display:grid;place-items:center;color:var(--dof-steel);overflow:hidden;border:1px solid rgba(1,36,86,.08)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.play{color:var(--blue);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;background:rgba(36,95,159,.10);color:var(--dof-navy);border-radius:999px;font-weight:1000}
.pill.dark{background:var(--panel2);color:var(--muted)}
.muscles{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;background:#e2eaf2;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dof-navy),var(--blue));width:0}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 46px 30px;gap:6px;align-items:center}
.field{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px;text-align:center;box-shadow:inset 0 1px 0 rgba(1,36,86,.03)}
.field.left{text-align:left}
textarea.field{min-height:112px;text-align:left;resize:vertical}
.check{height:48px;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center}
.check.done{background:var(--dof-navy);color:#fff}
.set-remove{width:30px;height:48px;border-radius:10px;background:transparent;color:var(--muted);border:1px solid var(--line);display:grid;place-items:center}
.workout-bar{position:sticky;top:-20px;z-index:5;margin:-20px -20px 0;padding:14px 18px 12px;background:linear-gradient(180deg,rgba(247,251,254,.98),rgba(247,251,254,.82));backdrop-filter:blur(18px);border-bottom:1px solid rgba(1,36,86,.08);border-radius:8px 8px 0 0;overflow:visible}
.workout-bar-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.workout-bar-title h1{font-size:22px;line-height:1}
.workout-bar-title small{display:block;color:var(--muted);font-weight:800;font-size:12px;margin-bottom:3px}
.timer-console{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:rgba(255,255,255,.88);border:1px solid rgba(1,36,86,.10);border-radius:14px;padding:10px;box-shadow:0 18px 38px rgba(1,36,86,.14);color:var(--text)}
.timer-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-width:0}
.timer-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:9px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}
.timer-label:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dof-navy);box-shadow:0 0 0 4px rgba(1,36,86,.08)}
.timer-main strong{display:block;margin-top:4px;color:var(--text);font-size:34px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.timer-main em{display:block;margin-top:4px;color:var(--muted);font-style:normal;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-toggle{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#082653,#031833);border:1px solid rgba(1,36,86,.18);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px rgba(1,36,86,.20),inset 0 1px 0 rgba(255,255,255,.20)}
.timer-side{display:grid;grid-template-columns:auto auto;gap:8px;align-items:center}
.timer-step{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid rgba(1,36,86,.12);color:var(--dof-navy);font-size:12px;font-weight:1000;box-shadow:0 8px 18px rgba(1,36,86,.08)}
.timer-rest{min-width:74px;text-align:center;background:linear-gradient(180deg,#fff,#f7fbfe);border:1px solid rgba(1,36,86,.10);border-radius:999px;padding:7px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.timer-rest span{display:block;color:#d8922f;font-size:8px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
.timer-rest strong{display:block;color:var(--text);font-size:18px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer-meta{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.rest-progress{height:5px;background:#dce8f1;border-radius:999px;overflow:hidden}
.rest-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb451,#2dd4bf);border-radius:999px;transition:width .25s linear}
.timer-meta .unit-toggle{background:#eef4f8;border-color:rgba(1,36,86,.08)}
.workout-content{margin:0 -20px -20px;padding:22px 20px 20px;background:linear-gradient(180deg,#f3f8fc,#f7fbfe 88px,#f7fbfe)}
.workout-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.workout-section-head h2{font-size:20px;margin:0}
.workout-progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.progress-pill{display:inline-flex;align-items:baseline;gap:4px;background:#e7f0f7;color:var(--dof-navy);border-radius:999px;padding:8px 12px;font-weight:1000}
.progress-pill strong{font-size:18px}
.progress-pill small{color:var(--muted);font-weight:900}
.unit-toggle{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.unit-toggle button{background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}
.unit-toggle button.active{background:var(--dof-navy);color:#fff}
.workout-footer{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:10px;margin:14px 0 0;padding:4px 0 0}
.workout-footer .btn{min-height:52px;box-shadow:none}
.workout-footer .danger-action{color:var(--pink);border-color:rgba(212,72,84,.32);background:#fff}
.modal-card .exercise{box-shadow:0 10px 26px rgba(1,36,86,.08);background:rgba(255,255,255,.92)}
.modal-card .exercise h3{font-size:18px}
.modal-card .field{box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;flex:0 0 auto;box-shadow:0 6px 14px rgba(1,36,86,.06)}
.icon-btn.tiny{width:30px;height:30px;font-size:13px}
.icon-btn.danger{color:var(--pink)}
.rest-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}
.chip.active{background:var(--dof-navy);color:#fff;border-color:var(--dof-navy)}
.feed{padding:16px;margin:12px 0}
.feed-title{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.leader{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.body-fig-wrap{position:relative;margin-top:14px;text-align:center}
.body-fig-wrap svg{width:auto;height:auto;max-width:100%;max-height:56vh;display:inline-block}
.mini-body-card{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;overflow:hidden}
.mini-body-fig{height:170px;display:grid;place-items:center;background:linear-gradient(180deg,#f7fbfe,#edf4f9);border:1px solid var(--line);border-radius:8px}
.mini-body-fig svg{height:152px;max-width:100%}
.mini-body-card h2{margin-bottom:5px}
.mini-body-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.muscle-builder{display:grid;gap:8px;margin:10px 0 14px}
.muscle-builder-row{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.muscle-builder-row strong{font-size:14px}
.muscle-builder-row input[type="range"]{width:100%;accent-color:var(--dof-navy)}
.muscle-builder-row .field{padding:8px}
.form-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.body-flip-btn{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 10px 22px rgba(1,36,86,.14)}
.muscle-region{cursor:pointer;transition:opacity .15s}
.muscle-region:hover,.muscle-region:active{opacity:.82}
.muscle-legend{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.muscle-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.muscle-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.auth{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(460px,100%);background:rgba(255,255,255,.90);border:1px solid rgba(1,36,86,.10);border-radius:8px;padding:24px;box-shadow:0 28px 70px rgba(1,36,86,.18)}
.auth-logo{font-size:54px;font-weight:1000;color:var(--dof-navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center;overflow:hidden}
.modal.show{display:flex}
.modal-card{width:min(820px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:88dvh;overflow:auto;overflow-x:hidden;border-radius:8px 8px 0 0;padding:20px;margin:0 auto}
.x{width:44px;height:44px;border-radius:12px;background:var(--panel2);color:var(--text);display:grid;place-items:center;flex:0 0 auto}
.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}
.signup-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.empty{padding:28px 18px;border:1px dashed #bfd0df;border-radius:8px;text-align:center;color:var(--muted);background:rgba(255,255,255,.58)}
@media (min-width:760px){
  .modal{align-items:center;padding:24px}
  .modal-card{border-radius:8px}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr}
  .ex-head{grid-template-columns:58px 1fr auto}
  .thumb{width:58px;height:58px}
  .set-row{grid-template-columns:24px 1fr 1fr 42px 26px}
  .app{padding-left:13px;padding-right:13px}
  .brand{font-size:22px}
  .brand-text small{font-size:10px}
  .focus .row{align-items:flex-start}
  .focus h2{font-size:25px}
  .tab{font-size:9.5px;min-height:46px;padding:5px 0}
  .tab svg{width:20px;height:20px}
  body{padding-bottom:68px}
  .row{align-items:flex-start}
  .row>.btn,.row>.pill{flex:0 0 auto}
  .signup-names{grid-template-columns:1fr}
  .workout-bar{margin:-16px -16px 0;padding:12px 12px 10px}
  .workout-bar-title{margin-bottom:10px}
  .workout-bar-title h1{font-size:21px}
  .timer-console{grid-template-columns:1fr;gap:8px;padding:9px}
  .timer-main{grid-template-columns:minmax(0,1fr) 44px;gap:8px}
  .timer-main strong{font-size:32px}
  .timer-main em{font-size:10px}
  .timer-toggle{width:44px;height:44px}
  .timer-side{grid-template-columns:44px minmax(68px,1fr) 44px;gap:7px}
  .timer-step{width:44px;height:40px;border-radius:999px;font-size:11px}
  .timer-rest{min-width:0;padding:6px 8px}
  .timer-rest strong{font-size:17px}
  .timer-meta{grid-template-columns:1fr auto;gap:8px}
  .modal-card{width:calc(100vw - 16px);max-width:calc(100vw - 16px);padding:16px}
  .workout-content{margin:0 -16px -16px;padding:16px}
  .workout-section-head{margin-bottom:10px}
  .workout-footer{grid-template-columns:1fr 1fr;margin:12px 0 0;padding:0}
  .modal-card .exercise{padding:12px;margin:8px 0}
  .modal-card .field{padding:10px 8px}
  .modal-card .set-row{gap:5px}
  .mini-body-card{grid-template-columns:92px 1fr;gap:12px}
  .mini-body-fig{height:142px}
  .mini-body-fig svg{height:128px}

const kgToDisplay=kg=>state.weightUnit==='lb'?Number(kg)*2.2046226218:Number(kg);
const displayToKg=value=>state.weightUnit==='lb'?Number(value)/2.2046226218:Number(value);
function fmtWeightInput(kg){

function fmtWorkoutTime(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const d=Math.floor(sec/86400);
  const h=Math.floor((sec%86400)/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  if(d>0) return `${d}d ${h}h`;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function workoutTimeHint(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const d=Math.floor(sec/86400);
  if(d>0) return `${Math.floor(sec/3600)} total hours`;
  if(sec>=3600) return 'hours : minutes : seconds';
  return 'minutes : seconds';
}
const todayDow=()=>{const d=new Date().getDay();return d===0?6:d-1};
const displayName=()=>state.profile?.name||state.user?.user_metadata?.name||state.user?.email?.split('@')[0]||'crew';

const ignoredSessionKey=()=>state.user?`skandi_ignored_sessions_${state.user.id}`:'skandi_ignored_sessions';
function ignoredSessionIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(ignoredSessionKey())||'[]')); }

}
function ignoreSessionLocally(id){
  if(!id) return;
  const ids=ignoredSessionIds();

}

  const {data:{session}}=await sb.auth.getSession();
  state.user=session?.user||null;
  if(!state.user) return showAuth();
  await loadAll();
  showApp();
}

function showAuth(){
  $('auth').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('tabs').classList.add('hidden');
  setAuthMode(state.authMode);
}

function showApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('tabs').classList.remove('hidden');
  const name=displayName();
  $('avatar').textContent=initials(name);
  render();
}

function setAuthMode(mode){
  state.authMode=mode;
  $('loginTab')?.classList.toggle('active',mode==='login');
  $('signupTab')?.classList.toggle('active',mode==='signup');
  $('signupNames')?.classList.toggle('hidden',mode!=='signup');
  if($('authBtn')) $('authBtn').textContent=mode==='login'?'Sign in':'Create account';
  if($('authMsg')) $('authMsg').textContent='';
}

async function submitAuth(){
  const email=$('email').value.trim();
  const password=$('password').value;
  const firstName=($('firstName')?.value||'').trim();
  const lastName=($('lastName')?.value||'').trim();
  const fullName=[firstName,lastName].filter(Boolean).join(' ');
  if(!email||!password) return $('authMsg').textContent='Email and password are required.';
  if(state.authMode==='signup'&&(!firstName||!lastName)) return $('authMsg').textContent='First name and last name are required.';
  $('authMsg').textContent=state.authMode==='login'?'Signing in...':'Creating account...';
  if(state.authMode==='login'){
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) return $('authMsg').textContent=error.message;
    state.user=data.user;
    await loadAll();
    return showApp();
  }
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:fullName},emailRedirectTo:location.href}});
  if(error) return $('authMsg').textContent=error.message;
  if(data.session){
    state.user=data.user;
    await loadAll();
    return showApp();
  }
  $('authMsg').textContent='Account created. Check your email if confirmation is required, then sign in.';
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

async function loadAll(){
  let [{data:profile},{data:exercises},{data:templates},{data:items},{data:sessions},{data:sets},{data:externalActivities}]=await Promise.all([
    sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle(),
    sb.from('skandi_exercises').select('*').order('name'),
    sb.from('skandi_templates').select('*, profile:profiles(name,avatar_url)').order('weekday',{nullsFirst:false}).order('created_at',{ascending:false}),
    sb.from('skandi_template_items').select('*, exercise:skandi_exercises(*)').order('sort_order'),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').order('started_at',{ascending:false}).limit(60),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').order('created_at',{ascending:false}).limit(600),
    sb.from('skandi_external_activities').select('*').eq('user_id',state.user.id).order('performed_at',{ascending:false}).limit(200)
  ]);
  if(!profile){
    // Some signups end up with an auth user but no profiles row (trigger race condition).
    // Every Skandi write is FK'd to profiles(id), so self-heal it here before anything breaks.
    await sb.rpc('ensure_own_profile',{p_name:state.user?.user_metadata?.name||state.user?.email?.split('@')[0]||''});
    ({data:profile}=await sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle());
  }
  state.profile=profile||{name:state.user.email};
  const ignored=ignoredSessionIds();
  state.exercises=exercises||[];
  state.templates=templates||[];
  state.items=items||[];
  state.sessions=(sessions||[]).filter(s=>!(ignored.has(s.id)&&!s.completed_at));
  state.sets=(sets||[]).filter(s=>!ignored.has(s.session_id));
  state.externalActivities=externalActivities||[];
  hydrateActiveWorkout();
}

function hydrateActiveWorkout(){
  if(!state.user||state.active) return;
  const maxAgeMs=ACTIVE_WORKOUT_MAX_HOURS*3600e3;
  state.sessions.filter(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()>maxAgeMs)
    .forEach(s=>ignoreSessionLocally(s.id));
  const ignored=ignoredSessionIds();
  state.sessions=state.sessions.filter(s=>!(ignored.has(s.id)&&!s.completed_at));
  state.sets=state.sets.filter(s=>!ignored.has(s.session_id));
  const active=state.sessions.find(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()<=maxAgeMs);
  if(!active) return;
  state.active=active;
  state.activeItems=state.items.filter(i=>i.template_id===active.template_id).sort((a,b)=>a.sort_order-b.sort_order);
  state.elapsed=Math.max(0,Math.floor((Date.now()-new Date(active.started_at).getTime())/1000));
  state.rest=0;
  state.restTotal=0;
  resumeWorkoutTimer();
}

function groupExercisesByMuscle(list){

function leaderboard(){

  const best=new Map();
  state.sets.filter(s=>s.done&&Number(s.weight_kg)>0).forEach(s=>{
    const key=`${s.user_id}:${s.exercise_id}`;
    const current=best.get(key);
    if(!current||Number(s.weight_kg)>current.weight) best.set(key,{
      user_id:s.user_id,name:profiles.get(s.user_id)||'Crew member',exercise:s.exercise?.name||'Exercise',weight:Number(s.weight_kg),reps:s.reps
    });
  });
  return [...best.values()].sort((a,b)=>b.weight-a.weight);
}

// ---- Recovery engine wiring (math itself lives in skandi-recovery.js) ----

function getMyRecovery(){
  return SkandiRecovery.computeMuscleRecovery({
    sets:state.sets, sessions:state.sessions, exercises:state.exercises,
    activities:state.externalActivities, userId:state.user.id, now:Date.now()
  });
}

function formatHours(h){
  if(h<=0) return 'now';
  if(h<1) return '<1h';
  if(h<24) return `${Math.ceil(h)}h`;
  const d=Math.floor(h/24),r=Math.round(h%24);
  return r?`${d}d ${r}h`:`${d}d`;
}

// score 0 (still fatigued) -> muted grey, score 100 (rested & ready) -> bright accent.
function freshColor(score){
  const stops=[[42,44,56],[255,189,57],[184,255,44]];
  const t=Math.max(0,Math.min(100,score))/100;
  const seg=t<0.5?0:1;
  const local=t<0.5?t/0.5:(t-0.5)/0.5;
  const a=stops[seg],b=stops[seg+1];
  const mix=i=>Math.round(a[i]+(b[i]-a[i])*local);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

// ---- Body figure: single anatomical silhouette (front/back toggle), left-side shapes mirrored ----

function bodyPrim(s,fill,extraAttrs){
  const common=`${extraAttrs||''} fill="${fill}" stroke="#ffffff" stroke-width="1.5"`;
  return s.shape==='ellipse'
    ?`<ellipse cx="${s.cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}" ${common}/>`
    :`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${s.rx}" ${common}/>`;
}

function mirrorShape(s){
  return s.shape==='ellipse'?{...s,cx:BODY_VIEWBOX_W-s.cx}:{...s,x:BODY_VIEWBOX_W-s.x-s.w};
}

function bodySilhouetteMarkup(pieces){
  return pieces.map(s=>{
    const base=bodyPrim(s,'#d8e3ec');
    return s.mirror?base+bodyPrim(mirrorShape(s),'#d8e3ec'):base;
  }).join('');
}

function bodyRegionMarkup(region,score){
  const fill=freshColor(score);
  const attrs=` data-muscle="${esc(region.name)}" class="muscle-region"`;
  const base=bodyPrim(region,fill,attrs);
  return region.mirror?base+bodyPrim(mirrorShape(region),fill,attrs):base;
}

function onBodyFigureClick(evt){
  const el=evt.target.closest('[data-muscle]');
  if(el) openMuscleDetail(el.getAttribute('data-muscle'));

function bodyFigureSVG(view,scoreByName,interactive=true){
  const silhouette=view==='back'?BODY_SILHOUETTE_BACK:BODY_SILHOUETTE_FRONT;
  const regions=view==='back'?BODY_REGIONS_BACK:BODY_REGIONS_FRONT;
  return `<svg viewBox="0 0 ${BODY_VIEWBOX_W} ${BODY_VIEWBOX_H}" xmlns="http://www.w3.org/2000/svg" ${interactive?'onclick="onBodyFigureClick(event)"':''}>${bodySilhouetteMarkup(silhouette)}${regions.map(r=>bodyRegionMarkup(r,scoreByName.get(r.name)||0)).join('')}</svg>`;
}

// ---- Muscle detail modal ----

function muscleDetailBreakdown(name){
  const since=Date.now()-SkandiRecovery.RECOVERY_LOOKBACK_DAYS*864e5;
  const exById=new Map(state.exercises.map(e=>[e.id,e]));
  const byExercise=new Map();
  state.sets.filter(s=>{
    const session=state.sessions.find(x=>x.id===s.session_id);
    const when=new Date(session?.completed_at||s.created_at).getTime();
    return s.done && when>=since && s.user_id===state.user.id;
  }).forEach(s=>{
    const ex=exById.get(s.exercise_id);
    const pct=ex?.muscles?.[name];
    if(!ex||!pct) return;
    const cur=byExercise.get(ex.id)||{name:ex.name,pct,sets:0};
    cur.sets++;
    byExercise.set(ex.id,cur);
  });
  const activityRows=(state.externalActivities||[]).filter(a=>{
    const t=new Date(a.performed_at).getTime();
    const map=SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other;
    return t>=since && !!map[name];
  }).map(a=>({label:activityTypeLabel(a.activity_type),pct:(SkandiRecovery.ACTIVITY_MUSCLE_MAP[a.activity_type]||SkandiRecovery.ACTIVITY_MUSCLE_MAP.other)[name],when:a.performed_at}));
  return {exerciseRows:[...byExercise.values()].sort((a,b)=>b.sets-a.sets),activityRows};
}

  $('modalCard').innerHTML=`

    <section class="card" style="text-align:center">

function localDatetimeValue(d){
  const pad=n=>String(n).padStart(2,'0');

async function saveExternalActivity(){
  const duration=Number($('actDuration').value);
  const intensity=Number($('actIntensity').value);
  if(!duration||duration<1) return alert('Enter a duration in minutes.');
  if(!intensity||intensity<1||intensity>10) return alert('Intensity must be between 1 and 10.');
  if(!$('actWhen').value) return alert('Choose when this activity happened.');
  const payload={

function previousCompletedSetsForExercise(exerciseId){
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  for(const session of completed){
    const rows=state.sets
      .filter(s=>s.session_id===session.id&&s.exercise_id===exerciseId&&s.done)
      .sort((a,b)=>a.set_idx-b.set_idx);
    if(rows.length) return rows;
  }
  return [];
}

async function startWorkout(templateId){
  if(state.active){
    if(state.active.template_id===templateId){ openActiveWorkout(); return; }
    return alert('Finish or cancel your current workout before starting another.');
  }
  const tpl=state.templates.find(t=>t.id===templateId);
  const its=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  if(!tpl||!its.length) return;
  const {data:session,error}=await sb.from('skandi_sessions').insert({user_id:state.user.id,template_id:tpl.id,title:tpl.name}).select().single();
  if(error) return alert(error.message);
  const rows=its.flatMap(item=>{
    const previous=previousCompletedSetsForExercise(item.exercise_id);
    return Array.from({length:item.target_sets},(_,idx)=>{
      const prev=previous[idx]||previous[previous.length-1]||{};
      return {
        session_id:session.id,user_id:state.user.id,exercise_id:item.exercise_id,set_idx:idx+1,target_reps:item.target_reps,
        weight_kg:prev.weight_kg??null,reps:prev.reps??null
      };
    });
  });
  const {error:setsError}=await sb.from('skandi_sets').insert(rows);
  if(setsError){
    await sb.from('skandi_sessions').delete().eq('id',session.id);
    return alert(setsError.message);
  }
  state.active=session;
  state.activeItems=its;
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  await loadAll();
  resumeWorkoutTimer();
  openActiveWorkout();
}

function resumeWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    state.elapsed++;
    if(state.rest>0) state.rest--;
    updateWorkoutClocks();
  },1000);
}

function pauseWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=null;
}

function restProgressPct(){
  if(!state.restTotal) return 0;
  return Math.max(0,Math.min(100,(state.rest/state.restTotal)*100));
}

function updateWorkoutClocks(){
  const stopwatch=$('activeStopwatch');
  const stopwatchHint=$('activeStopwatchHint');
  const rest=$('activeRest');
  const progress=$('restProgress');
  if(stopwatch) stopwatch.textContent=fmtWorkoutTime(state.elapsed);
  if(stopwatchHint) stopwatchHint.textContent=workoutTimeHint(state.elapsed);
  if(rest) rest.textContent=fmtSec(state.rest);
  if(progress) progress.style.width=`${restProgressPct()}%`;
}

function toggleWorkoutTimer(){
  if(state.timer) pauseWorkoutTimer(); else resumeWorkoutTimer();
  renderActiveWorkout();
}

function setRest(seconds){
  state.rest=seconds;
  state.restTotal=seconds;
  renderActiveWorkout();
}

function adjustRest(delta){
  const next=Math.max(0,state.rest+delta);
  state.rest=next;
  state.restTotal=next>0?Math.max(next,state.restTotal+delta):0;
  if(state.restTotal<state.rest) state.restTotal=state.rest;
  renderActiveWorkout();
}

function confirmFinishWorkout(){
  if(!state.active) return;

  openReport();
}

async function updateSet(id,key,value){
  const patch={updated_at:new Date().toISOString()};
  const parsed=value===''?null:(key==='weight_kg'?displayToKg(value):Number(value));
  if(parsed!==null&&!Number.isFinite(parsed)) return alert('Enter a valid number.');
  patch[key]=parsed===null?null:(key==='weight_kg'?Math.round(parsed*100)/100:Math.round(parsed));
  const {error}=await sb.from('skandi_sets').update(patch).eq('id',id);
  if(error) return alert(error.message);
  const s=state.sets.find(x=>x.id===id);
  if(s) Object.assign(s,patch);
  if(s&&s.set_idx===1&&patch[key]!=null&&(key==='weight_kg'||key==='reps')){
    const targets=state.sets.filter(x=>x.session_id===s.session_id&&x.exercise_id===s.exercise_id&&x.id!==s.id&&!x.done&&(x[key]==null||x[key]===''));
    if(targets.length){
      const ids=targets.map(x=>x.id);
      const {error:fillError}=await sb.from('skandi_sets').update({[key]:patch[key],updated_at:new Date().toISOString()}).in('id',ids);
      if(!fillError) targets.forEach(x=>{ x[key]=patch[key]; });
      renderActiveWorkout();
    }
  }
}

async function toggleSet(id,rest){
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  const done=!s.done;
  const {error}=await sb.from('skandi_sets').update({done,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alert(error.message);
  s.done=done;
  state.rest=done?rest:0;
  state.restTotal=done?rest:0;
  renderActiveWorkout();
}

async function addSet(exerciseId,targetReps){
  if(!state.active) return;
  const sessionId=state.active.id;
  const existing=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===exerciseId);
  const nextIdx=(existing.length?Math.max(...existing.map(s=>s.set_idx)):0)+1;
  const seed=existing.find(s=>s.set_idx===1)||{};
  const {data,error}=await sb.from('skandi_sets').insert({
    session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:nextIdx,target_reps:targetReps,
    weight_kg:seed.weight_kg??null,reps:seed.reps??null
  }).select().single();
  if(error) return alert(error.message);
  state.sets.push(data);
  renderActiveWorkout();
}

async function removeSet(id){
  const {error}=await sb.from('skandi_sets').delete().eq('id',id);
  if(error) return alert(error.message);
  state.sets=state.sets.filter(s=>s.id!==id);
  renderActiveWorkout();
}

async function cancelWorkout(){
  if(!state.active) return;
  if(!confirm('Cancel this workout? Your logged sets will be deleted.')) return;
  const sessionId=state.active.id;
  const cancelledSession=state.active;
  const cancelledElapsed=state.elapsed;
  pauseWorkoutTimer();
  ignoreSessionLocally(sessionId);
  state.active=null;
  state.activeItems=[];
  state.sessions=state.sessions.filter(s=>s.id!==sessionId);
  state.sets=state.sets.filter(s=>s.session_id!==sessionId);
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  closeModal();
  render();
  const {data,error}=await sb.from('skandi_sessions').delete().eq('id',sessionId).eq('user_id',state.user.id).select('id');
  if(error||!data?.length){
    await sb.from('skandi_sessions').update({
      completed_at:new Date().toISOString(),
      duration_sec:cancelledSession.duration_sec||cancelledElapsed||0,
      visibility:'private',
      report_note:'Cancelled locally'
    }).eq('id',sessionId).eq('user_id',state.user.id);
  }
  await loadAll();
  render();
}

async function forkTemplateToDay(templateId,weekday){
  const t=state.templates.find(x=>x.id===templateId);
  if(!t) return {error:{message:'Routine not found.'}};
  const sourceItems=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  const bumped=state.templates.find(x=>x.user_id===state.user.id&&x.weekday===weekday);
  if(bumped){
    const {error:bumpError}=await sb.from('skandi_templates').update({weekday:null,updated_at:new Date().toISOString()}).eq('id',bumped.id);
    if(bumpError) return {error:bumpError};
  }
  const payload={user_id:state.user.id,name:t.name,notes:t.notes,weekday,is_public:true,forked_from:t.id,forked_from_name:t.profile?.name||'Crew member',updated_at:new Date().toISOString()};
  const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
  if(error) return {error};
  const rows=sourceItems.map((i,idx)=>({template_id:data.id,exercise_id:i.exercise_id,sort_order:idx,target_sets:i.target_sets,target_reps:i.target_reps,target_rest_sec:i.target_rest_sec,note:i.note}));
  if(rows.length){
    const {error:itemsError}=await sb.from('skandi_template_items').insert(rows);
    if(itemsError) return {error:itemsError};
  }
  return {data};
}

}

async function removeRoutineFromDay(templateId){
  if(!confirm('Remove this routine from that day? The routine itself is kept, just unscheduled.')) return;
  const {error}=await sb.from('skandi_templates').update({weekday:null,updated_at:new Date().toISOString()}).eq('id',templateId);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  setView('train');
}

function openDayPicker(day){
  const mine=state.templates.filter(t=>t.user_id===state.user.id);
  const community=state.templates.filter(t=>t.user_id!==state.user.id);
  const pickerRow=(t,isMine)=>`<div class="row card" style="margin:0 0 8px">
    <div><strong>${esc(t.name)}</strong><p>${state.items.filter(i=>i.template_id===t.id).length} exercises${isMine?'':' · by '+esc(t.profile?.name||'Crew member')}</p></div>
    <button class="btn small primary" onclick="${isMine?`assignOwnRoutineToDay('${t.id}',Number($('dayPickerDay').value))`:`useCommunityRoutineForDay('${t.id}')`}">Use</button>
  </div>`;
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>Choose a routine</h1><button class="x" onclick="closeModal()">${icon('close',20)}</button></div>
    <select id="dayPickerDay" class="field left">${DOW.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}</option>`).join('')}</select>
    <h2 style="margin-top:16px">My routines</h2>
    ${mine.length?mine.map(t=>pickerRow(t,true)).join(''):empty('You have not created a routine yet.')}
    <h2 style="margin-top:16px">Community routines</h2>
    ${community.length?community.map(t=>pickerRow(t,false)).join(''):empty('No routines shared by other crew yet.')}
    <button class="btn" style="width:100%;margin-top:6px" onclick="createRoutineForPickedDay()">+ Create a new routine instead</button>`;
}

async function useCommunityRoutineForDay(templateId){
  const weekday=Number($('dayPickerDay').value);
  const {error}=await forkTemplateToDay(templateId,weekday);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  setView('train');
}

function createRoutineForPickedDay(){
  const day=Number($('dayPickerDay').value);
  closeModal();
  openTemplateBuilder(day);
}

function openDayManage(templateId,day){
  const t=state.templates.find(x=>x.id===templateId);
  if(!t) return;
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t.name)}</h1><button class="x" onclick="closeModal()">${icon('close',20)}</button></div>
    <p class="muted">Scheduled for ${DOW[day]}</p>
    <div class="stack" style="margin-top:14px">
      <button class="btn primary" style="width:100%" onclick="closeModal();startWorkout('${t.id}')">${icon('play',16)} Start workout</button>
      <button class="btn" style="width:100%" onclick="openDayPicker(${day})">${icon('swap',16)} Replace routine</button>
      <button class="btn" style="width:100%" onclick="openTemplateBuilder(null,'${t.id}')">${icon('edit',16)} Edit routine</button>
      <button class="btn" style="width:100%" onclick="openMoveRoutine('${t.id}',${day})">${icon('calendar',16)} Move to another day</button>
      <button class="btn danger" style="width:100%" onclick="removeRoutineFromDay('${t.id}')">${icon('trash',16)} Remove from ${DOW[day]}</button>
    </div>`;
}

function openMoveRoutine(templateId,day){
  const t=state.templates.find(x=>x.id===templateId);
  if(!t) return;
  $('modalCard').innerHTML=`
    <div class="row"><h1>Move ${esc(t.name)}</h1><button class="x" onclick="closeModal()">${icon('close',20)}</button></div>
    <p class="muted">Currently on ${DOW[day]}</p>
    <select id="moveDay" class="field left">${DOW.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}</option>`).join('')}</select>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="assignOwnRoutineToDay('${templateId}',Number($('moveDay').value))">Move routine</button>`;
}

function openExerciseBuilder(){
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>New exercise</h1><button class="x" onclick="closeModal()">${icon('close',20)}</button></div>
    <label class="eyebrow">Exercise name</label>
    <input id="exName" class="field left" placeholder="e.g. Dumbbell Row">
    <label class="eyebrow">Alternative name</label>
    <input id="exEnglish" class="field left" placeholder="Optional">
    <label class="eyebrow">Category</label>
    <select id="exCategory" class="field left">
      ${['Strength','Cardio','Mobility','Core','Conditioning','Rehab'].map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
    <label class="eyebrow">Equipment</label>
    <input id="exEquipment" class="field left" placeholder="Optional: dumbbells, bench">
    <label class="eyebrow">Media</label>
    <input id="exMedia" class="field left" placeholder="Direct GIF/video URL (optional)">
    <input id="exPage" class="field left" placeholder="Reference page URL (optional)">
    <div class="row" style="margin-top:12px"><div><h2>Muscles</h2><p class="form-note">Set only the muscles this exercise actually uses. Total does not need to equal 100.</p></div><button class="btn small" onclick="resetExerciseMuscles()">Clear</button></div>
    <div class="rest-presets" style="margin-top:0">
      ${Object.keys(EXERCISE_PRESETS).map(p=>`<button type="button" class="chip" onclick="applyExercisePreset('${p}')">${p}</button>`).join('')}
    </div>
    <div class="muscle-builder">
      ${EXERCISE_MUSCLES.map(m=>`<div class="muscle-builder-row">
        <strong>${m}</strong>
        <input id="muscleRange${m}" type="range" min="0" max="100" step="5" value="0" oninput="setExerciseMuscle('${m}',this.value,'range')">
        <input id="muscleVal${m}" class="field" type="number" min="0" max="100" step="5" value="0" inputmode="numeric" onchange="setExerciseMuscle('${m}',this.value,'number')">
      </div>`).join('')}
    </div>
    <button class="btn primary" style="width:100%" onclick="saveExercise()">Save exercise</button>`;
}

function setExerciseMuscle(name,value,source){
  const n=Math.max(0,Math.min(100,Number(value)||0));
  const range=$(`muscleRange${name}`);
  const input=$(`muscleVal${name}`);
  if(range&&source!=='range') range.value=n;
  if(input&&source!=='number') input.value=n;
}

function resetExerciseMuscles(){
  EXERCISE_MUSCLES.forEach(m=>setExerciseMuscle(m,0));
}

function applyExercisePreset(name){
  resetExerciseMuscles();
  Object.entries(EXERCISE_PRESETS[name]||{}).forEach(([muscle,value])=>setExerciseMuscle(muscle,value));
}

async function saveExercise(){
  const name=$('exName').value.trim();
  if(!name) return alert('Add an exercise name.');
  let muscles={};
  document.querySelectorAll('[id^="muscleVal"]').forEach(input=>{
    const muscle=input.id.replace('muscleVal','');
    const value=Math.max(0,Math.min(100,Number(input.value)||0));
    if(value>0) muscles[muscle]=value;
  });
  if(!Object.keys(muscles).length) return alert('Set at least one muscle above 0%.');
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const equipment=$('exEquipment').value.split(',').map(x=>x.trim()).filter(Boolean);
  const {error}=await sb.from('skandi_exercises').insert({
    slug,name,english_name:$('exEnglish').value.trim()||null,category:$('exCategory').value,
    equipment,muscles,media_url:$('exMedia').value.trim()||null,media_page_url:$('exPage').value.trim()||null,
    instructions:[],coach_tips:[],created_by:state.user.id
  });
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

function closeModal(){
  $('modal').classList.remove('show');
}

function empty(msg){ return `<div class="empty">${esc(msg)}</div>`; }

sb.auth.onAuthStateChange((_event,session)=>{ if(session&&!state.user){ state.user=session.user; loadAll().then(showApp); } });
init();
</script>
</body>
</html>
