<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --bg:#eef4f8;
  --panel:#ffffff;
  --panel2:#f5f8fb;
  --panel3:#e7eef5;
  --line:#d7e1ea;
  --text:#071f42;
  --muted:#607086;
  --dof-navy:#012456;
  --dof-deep:#000f32;
  --dof-blue:#334c6d;
  --dof-steel:#788ba1;
  --dof-ice:#f4fafe;
  --lime:#00a8c8;
  --green:#1d9a6c;
  --amber:#f0a22e;
  --pink:#d44854;
  --blue:#245f9f;
  --wash:rgba(1,36,86,.08);
  --shadow:0 18px 44px rgba(1,36,86,.12);
  --glow:0 18px 38px rgba(0,168,200,.18);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{position:relative;min-height:100dvh;padding-bottom:76px}
body:before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:radial-gradient(circle at 18% -8%,rgba(1,36,86,.18),transparent 34%),linear-gradient(180deg,#f8fbfe 0%,#eef4f8 48%,#e7eff5 100%);opacity:1}
button,input,textarea,select{font:inherit}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--dof-navy);cursor:pointer;flex:0 0 auto}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 104px;overflow:hidden}
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr 42px;align-items:center;gap:12px;margin:-18px -14px 22px;padding:14px 14px 12px;background:rgba(244,250,254,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(1,36,86,.08)}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}
.ship-mark{width:70px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);box-shadow:0 8px 22px rgba(1,36,86,.10)}
.ship-mark img{width:72px;height:34px;object-fit:contain}
.brand-text{display:grid;line-height:1.05}
.brand-text small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:1000}
.brand-text span,.brand-text small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dof-badge{height:36px;max-width:78px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;border:1px solid var(--line);box-shadow:0 10px 22px rgba(1,36,86,.10)}
.auth-brand{display:flex;align-items:center;justify-content:space-between;gap:14px}
.auth-ship{width:100%;height:138px;border-radius:14px;background:linear-gradient(180deg,#fff,#e9f1f7);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -18px 32px rgba(1,36,86,.08)}
.auth-ship img{width:96%;height:112px;object-fit:contain}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px}
.auth-tab{background:transparent;color:var(--muted);border-radius:8px;padding:11px;font-weight:1000}
.auth-tab.active{background:var(--dof-navy);color:#fff;box-shadow:0 10px 20px rgba(1,36,86,.18)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--dof-navy);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden;box-shadow:0 10px 22px rgba(1,36,86,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{display:grid;gap:14px;margin-bottom:16px;padding-top:4px}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--dof-steel);font-weight:900;font-size:12px}
h1{font-size:clamp(32px,7.8vw,52px);line-height:.98;margin:0;letter-spacing:0;overflow-wrap:anywhere}
h2{font-size:24px;margin:0 0 10px;line-height:1.05}
h1.compact{font-size:26px;line-height:1.12;letter-spacing:-.015em}
h3{font-size:19px;margin:0;line-height:1.1}
p{color:var(--muted);line-height:1.45;margin:0}
.focus{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--dof-navy),#183d68 64%,#55708b);color:#fff;border-radius:14px;padding:18px;box-shadow:0 22px 52px rgba(1,36,86,.22)}
.focus.action{width:100%;border:0;text-align:left;display:block;cursor:pointer}
.focus.action:hover{transform:translateY(-1px);box-shadow:0 26px 58px rgba(1,36,86,.26)}
.focus:after{content:"";position:absolute;right:-18px;bottom:-24px;width:210px;height:110px;background:url('/assets/skandi/skandi-nomad-cutout.png') center/contain no-repeat;opacity:.20}
.focus>*{position:relative;z-index:1}
.focus p{color:#d9e5ee}
.focus .eyebrow{color:#aebdca!important}
.focus-cta{display:flex;align-items:center;gap:8px;margin-top:14px;color:#fff;font-weight:1000}
.focus-cta i{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:#fff;color:var(--dof-navy);font-style:normal}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),rgba(255,255,255,.24) 0);position:relative;font-weight:1000;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--dof-navy)}
.ring span{position:relative;z-index:1;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat,.card,.workout,.exercise,.feed,.modal-card{background:rgba(255,255,255,.86);border:1px solid rgba(1,36,86,.10);border-radius:8px;box-shadow:var(--shadow)}
.click-card{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.click-card:hover{transform:translateY(-1px);border-color:rgba(1,36,86,.20);box-shadow:0 22px 48px rgba(1,36,86,.16)}
.stat{padding:18px;min-height:100px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--dof-navy),var(--blue),#a9bac9);opacity:.82}
.stat strong{display:block;font-size:36px;line-height:1;color:var(--text)}
.stat small{display:block;color:var(--muted);font-weight:800;margin-top:12px}
.card{padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.accent{color:var(--blue)}
.btn{background:#fff;color:var(--dof-navy);border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease;box-shadow:0 8px 18px rgba(1,36,86,.06)}
.btn:hover{transform:translateY(-1px);background:var(--panel3)}
.btn.primary{background:var(--dof-navy);color:#fff;box-shadow:0 16px 30px rgba(1,36,86,.22);border-color:var(--dof-navy)}
.btn.ghost{background:var(--panel2)}
.btn.danger{color:var(--pink)}
.btn.small{padding:9px 12px;border-radius:10px;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-top:1px solid rgba(1,36,86,.10);z-index:20;box-shadow:0 -16px 34px rgba(1,36,86,.10)}
.tabs-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{background:transparent;color:#727482;display:grid;gap:2px;place-items:center;font-weight:900;font-size:11px;padding:6px 1px;border-radius:8px;min-height:50px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:430px){.tab{font-size:9.5px;padding:6px 0}.tab svg{width:20px;height:20px}}
/* ── Más (hoja de navegación secundaria) ────────────────────────────────── */
.more-list{display:grid;gap:8px;margin-top:4px}
.more-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-weight:900;font-size:15px;text-align:left}
.more-row svg:first-child{color:var(--blue);flex:0 0 auto}
.more-row span{flex:1}
.more-row svg:last-child{color:var(--dof-steel);flex:0 0 auto}
/* ── Inicio: semana a la vista + tarjeta de hoy consolidada ────────────────── */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:78px}
.week-day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.week-box{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;padding:2px}
.week-day.today .week-box{background:rgba(1,36,86,.06);border:1.5px solid var(--dof-navy)}
.week-day i{display:block;width:100%;border-radius:3px 3px 0 0}
.week-day small{font-size:10.5px;font-weight:800;color:var(--muted)}
.week-day.today small{color:var(--dof-navy)}
.week-stats{display:flex;justify-content:space-around;text-align:center;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.week-stats strong{display:block;font-size:16px}
.week-stats small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:3px}
.week-sep{width:1px;background:var(--line)}
.detail-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.detail-row:first-child{border-top:none;padding-top:2px}
.detail-row svg{flex:0 0 auto;color:var(--blue);margin-top:1px}
.detail-row b{display:block;font-size:13px;color:var(--text);font-weight:800}
.detail-row span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.detail-row.click{cursor:pointer}
.detail-row .detail-body{flex:1;min-width:0}
.detail-row .chev{align-self:center;margin-left:auto;flex:0 0 auto;display:flex}
.detail-row .chev svg{color:var(--dof-steel)}
/* ── Comida ─────────────────────────────────────────────────────────────── */
.kcal-ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:conic-gradient(var(--lime) var(--p),rgba(1,36,86,.10) 0);position:relative}
.kcal-ring.over{background:conic-gradient(var(--pink) 100%,var(--pink) 0)}
.kcal-ring i{position:absolute;inset:9px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-style:normal;line-height:1.05}
.kcal-ring b{display:block;font-size:25px;font-weight:1000}
.kcal-ring small{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:1000}
.macro-grid{display:grid;gap:11px;flex:1;min-width:0}
.macro-row .row{margin-bottom:5px;font-size:13px}
.macro-row .bar i{background:var(--dof-navy)}
.macro-row.p .bar i{background:var(--blue)}
.macro-row.c .bar i{background:var(--amber)}
.macro-row.f .bar i{background:var(--lime)}
.macro-row.s .bar i{background:var(--dof-steel)}
.macro-row.s.over .bar i{background:var(--pink)}
.macro-row.s.over{color:var(--pink)}
.meal-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-top:9px;cursor:pointer;text-align:left;width:100%}
.meal-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel3);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.meal-thumb img{width:100%;height:100%;object-fit:cover}
.meal-card h3{font-size:15px;margin:0}
.meal-card p{color:var(--muted);font-size:12px;margin:2px 0 0}
.meal-kcal{font-weight:1000;font-size:16px;white-space:nowrap}
.pick-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.pick{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:900;font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px}
.pick b{font-weight:1000}
.pick small{color:var(--muted);font-weight:900}
.photostrip{display:flex;gap:8px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.photostrip:empty{display:none}
.ph-tile{position:relative;flex:0 0 auto;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--panel3);border:1px solid var(--line)}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tile button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(7,20,42,.72);color:#fff;display:grid;place-items:center;font-size:12px;line-height:1}
.add-fab{position:fixed;right:max(14px,calc(50% - 396px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--dof-navy);color:#fff;display:grid;place-items:center;box-shadow:0 16px 32px rgba(1,36,86,.34);z-index:19}
.item-row{display:grid;grid-template-columns:26px 1fr 92px;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item-row:first-of-type{border-top:0}
.item-row .lbl{min-width:0}
.item-row .lbl strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row .lbl small{color:var(--muted);font-size:11.5px}
.item-row .g-wrap{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.item-row .g-wrap small{color:var(--muted);font-weight:800;font-size:11.5px;flex:0 0 auto}
.item-row input.g{width:64px;padding:8px;text-align:right;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:900}
.item-row.off{opacity:.45}
.item-row.fat{background:rgba(240,162,46,.07);border-radius:9px;padding:9px 7px;border-top:0;margin-top:6px}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.conf.hi{background:var(--green)}.conf.mid{background:var(--amber)}.conf.lo{background:var(--pink)}
.input-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.input-choice.cols-3{grid-template-columns:repeat(3,1fr)}
.input-choice button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px 11px;display:grid;gap:5px;place-items:center;font-weight:1000;color:var(--text);text-align:center;font-size:13px}
.input-choice button small{color:var(--muted);font-weight:900;font-size:10.5px;letter-spacing:.03em}
.input-choice button:disabled{opacity:.5}
.venue-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none}
.tab.active{color:var(--dof-navy);background:rgba(1,36,86,.08)}
.week{display:grid;gap:9px}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;background:var(--panel2);border-radius:8px;padding:13px 14px;color:var(--muted);font-weight:900;border:1px solid rgba(1,36,86,.08)}
.day.today{background:var(--dof-navy);color:#fff;box-shadow:0 14px 28px rgba(1,36,86,.16)}
.day.today .icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.day span:nth-child(2){color:inherit;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day>*{min-width:0}
.week-lines{display:flex;flex-direction:column;gap:5px;min-width:0}
/* display:block, no flex: el nombre es un nodo de texto suelto y en un contenedor flex eso
   se envuelve en un item anónimo, al que `text-overflow` no le aplica. Por eso el nombre se
   cortaba a filo ("Front Lever A + Pul") en vez de con puntos suspensivos: el overflow:hidden
   sí recortaba, la elipsis nunca se pintaba. */
.week-item{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.week-item .glyph{margin-right:6px}
.week-item.add{opacity:.7;font-weight:800}
.week-item .glyph{font-style:normal;opacity:.75;flex:0 0 auto}
/* Calendario (migración 080).
   La semana es un renglón de siete celdas: a 375 px una celda de mes completo mide 50 px y
   no cabe el nombre del entrenamiento. Color solo para el estado, nunca para la disciplina.

   minmax(0,1fr) y no 1fr: `1fr` es `minmax(auto,1fr)`, y ese `auto` impide que una columna
   baje de su contenido — con etiquetas que no parten renglón, la rejilla crecía más que la
   tarjeta y el domingo se salía por la derecha.

   Cada marca es un chip de un solo renglón, tope de 3 por día (+N si hay más): dos o tres
   sesiones el mismo día (una descarga reemplazando a la rutina normal, fuerza + carrera)
   dejaban de leerse encimadas cuando el chip era glifo + hasta dos líneas de texto con
   -webkit-line-clamp dentro de un <button> sin reset de apariencia nativa — punto débil
   conocido de WebKit. */
.cal-nav{display:inline-flex;align-items:center;gap:6px}
.cal-empty{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-bottom:10px;padding:12px 14px;
  background:transparent;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:left}
.cal-empty span{font-weight:900;font-size:13px;color:var(--dof-steel)}
.cal-empty small{flex:1;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-empty i{font-style:normal;font-weight:900;font-size:12px;color:var(--blue);flex:0 0 auto}
.load-bars{display:flex;align-items:flex-end;gap:6px;margin-top:14px;height:74px}
.load-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.load-bar i{display:block;width:100%;border-radius:4px 4px 0 0}
.load-bar small{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Cuatro cifras en una fila de 390 px: con `.row` (flex y espacio entre extremos) las cajas
   se encogían a su hueco y "6h35m" pedía 123 px teniendo 56, así que salía cortado. Rejilla
   de columnas iguales con minmax(0,1fr), que sí permite encoger sin desbordar. */
.wellness-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.wellness-grid .stat{padding:10px 4px;min-width:0}
.wellness-grid .stat strong{font-size:15px;white-space:nowrap}
.wellness-grid .stat small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cal-week{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px 10px;margin-bottom:10px;box-shadow:0 8px 20px rgba(1,36,86,.05)}
.cal-week.current{border-color:rgba(1,36,86,.22);box-shadow:0 14px 30px rgba(1,36,86,.10)}
.cal-week-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.cal-week-actions{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.cal-week-name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dof-steel);font-weight:900;
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-week-name b{font-weight:900;letter-spacing:normal;text-transform:none;color:var(--dof-navy)}
.cal-score{font-size:13px;font-weight:1000;color:var(--muted);white-space:nowrap}
.cal-score i{font-style:normal;font-weight:900;opacity:.55}
.cal-score.full{color:var(--green)}
/* 3 px de alto: la semana se lee de un vistazo sin que la barra compita con el contenido. */
.cal-bar{height:3px;background:var(--panel3);border-radius:999px;overflow:hidden;margin:0 2px 10px}
.cal-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--dof-navy),var(--blue))}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-day{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;min-height:78px;
  padding:6px 2px 5px;background:var(--panel2);border:1px solid transparent;border-radius:9px;text-align:center;overflow:hidden}
.cal-day.rest{background:transparent;border-style:dashed;border-color:var(--line)}
.cal-day.past{opacity:.72}
/* Hoy va con fondo, no con borde grueso: un borde de 2 px se recorta contra el filo de la
   tarjeta y además desalinea su columna respecto a las otras seis. */
.cal-day.today{background:var(--dof-navy);border-color:var(--dof-navy);opacity:1}
.cal-day.today .cal-dow,.cal-day.today .cal-num{color:#fff}
.cal-dow{font-size:8px;letter-spacing:.06em;color:var(--dof-steel);font-weight:900;text-transform:uppercase}
.cal-num{font-size:14px;font-weight:1000;color:var(--text);line-height:1}
.cal-marks{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-mark{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;
  background:rgba(36,95,159,.10);border-radius:6px;padding:2px 3px}
.cal-mark .cal-dot{font-style:normal;font-size:9px;line-height:1;color:var(--dof-navy);flex:0 0 auto}
.cal-mark b{font-size:8.5px;line-height:1.2;font-weight:900;color:var(--dof-navy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-mark.done{background:rgba(29,154,108,.16)}
.cal-mark.done .cal-dot,.cal-mark.done b{color:var(--green)}
.cal-mark.partial{background:rgba(240,162,46,.18)}
.cal-mark.partial .cal-dot,.cal-mark.partial b{color:#8a5c07}
/* Saltado ya no compite por atención con lo activo: sin relleno y atenuado, solo el
   tachado -- es información de fondo, no un plan vigente. */
.cal-mark.skipped{background:transparent;opacity:.6}
.cal-mark.skipped .cal-dot,.cal-mark.skipped b{color:var(--dof-steel);text-decoration:line-through}
/* El extra (entrenaste algo que no estaba planeado) va punteado y sin relleno: existe, se ve,
   y no se confunde con lo que sí estaba en el plan. */
.cal-mark.extra{background:transparent;border:1px dashed #bfd0df}
.cal-mark.extra .cal-dot,.cal-mark.extra b{color:var(--muted)}
.cal-mark.more{background:transparent;color:var(--dof-steel);font-size:8.5px;font-weight:900;padding:2px 0}
.cal-day.today .cal-mark{background:rgba(255,255,255,.16)}
.cal-day.today .cal-mark .cal-dot,.cal-day.today .cal-mark b{color:#fff}
.cal-day.today .cal-mark.extra{border-color:rgba(255,255,255,.45)}
.cal-day.today .cal-mark.more{color:rgba(255,255,255,.75)}
/* Renglón de sesión (hoy y hoja del día) */
.plan-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:11px 12px;
  background:var(--panel2);border:1px solid rgba(1,36,86,.08);border-radius:8px;text-align:left;cursor:pointer}
.plan-row.done{background:rgba(29,154,108,.08);border-color:rgba(29,154,108,.22)}
.plan-row.skipped{opacity:.55}
.plan-row.skipped .plan-body strong{text-decoration:line-through}
.plan-row.extra{background:transparent;border-style:dashed}
.plan-row .disc{font-size:15px;color:var(--dof-navy);text-align:center}
.plan-body strong{display:block;font-size:15px}
.plan-body p{margin:2px 0 0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-status{font-size:10px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;color:var(--dof-steel)}
.plan-status.done{color:var(--green)}
.plan-status.extra{color:var(--muted)}
.exercise{padding:14px;display:grid;gap:10px;margin:10px 0}
.ex-head{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}
.ex-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ex-actions-row{display:flex;gap:6px}
.ex-info-hint{display:inline-flex;vertical-align:middle;color:var(--dof-steel);opacity:.55}
.thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(180deg,#eef4f8,#dfe9f1);object-fit:cover;display:grid;place-items:center;color:var(--dof-steel);overflow:hidden;border:1px solid rgba(1,36,86,.08)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.play{color:var(--blue);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;background:rgba(36,95,159,.10);color:var(--dof-navy);border-radius:999px;font-weight:1000}
.pill.dark{background:var(--panel2);color:var(--muted)}
.pill.tiny{padding:3px 8px;font-size:11px;letter-spacing:.02em}
.pill.warn{background:rgba(240,162,46,.16);color:#8a5a05}
.muscles{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;background:#e2eaf2;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dof-navy),var(--blue));width:0}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 34px 46px 30px;gap:6px;align-items:center}
.set-row.no-weight{grid-template-columns:26px 1fr 34px 46px 30px}
.quality-select{-webkit-appearance:none;appearance:none;width:100%;height:48px;padding:0;text-align:center;text-align-last:center;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);font-weight:900;font-size:13px}
.quality-select.q-good{background:#e4f7ee;color:#1f9d5c;border-color:#bfe9d3}
.quality-select.q-mid{background:#fff6e5;color:#a86a08;border-color:#f3ddb3}
.quality-select.q-bad{background:#fdeceb;color:var(--pink);border-color:#f6c9c5}
.set-num{height:100%;border:0;background:transparent;color:var(--text);font-weight:900;font-size:13px;padding:0;text-align:left;line-height:1.1}
.set-num small{display:block;font-size:9px;font-weight:800;color:var(--blue);letter-spacing:.04em}
.set-options{margin:2px 0 8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.set-options video{width:100%;border-radius:8px;margin-top:8px;background:#000}
.prog-criteria{margin-top:6px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.prog-criteria b{color:var(--text);font-weight:800}
.progression-ready{display:block;width:100%;text-align:left;margin-top:6px;padding:7px 10px;background:#e4f7ee;color:#1f9d5c;border:1px solid #bfe9d3;border-radius:8px;font-weight:700;font-size:12px}
.deload-note{margin-top:6px;padding:5px 9px 5px 8px;border-left:3px solid var(--amber);background:var(--panel2);border-radius:6px;font-size:11px;line-height:1.3;color:#8a5a12}
.prog-info-toggle{display:inline-flex;align-items:center;gap:3px;background:transparent;border:0;padding:0;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.prog-info-toggle span{font-size:9px}
.prog-live-progress{margin-top:6px;font-size:11px;font-weight:700;color:var(--blue)}
.field{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px;text-align:center;box-shadow:inset 0 1px 0 rgba(1,36,86,.03)}
.field-narrow{padding:13px 3px}
.field.left{text-align:left}
textarea.field{min-height:112px;text-align:left;resize:vertical}
.field.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.check{position:relative;height:48px;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center;transition:transform .1s ease-out,background .16s ease,border-color .16s ease,color .16s ease}
.check.sm::after{content:"";position:absolute;inset:-4px}
.check.done{background:var(--dof-navy);color:#fff}
/* La presión responde al toque mismo (pseudo-clase, cero JS) — no depende de que
   renderActiveWorkout ya haya vuelto de la red. El "pop" de abajo es el remate satisfactorio
   una vez que el estado ya se aplicó (ver pulseCheck): como cada tap reconstruye el botón entero
   vía innerHTML, una transition normal no tiene "antes" del que animar, así que el pop se dispara
   agregando la clase por JS en el nodo recién creado, no horneándola en la plantilla — si viviera
   en la plantilla, CUALQUIER re-render (cambiar el peso de otra serie, p.ej.) la repetiría en
   cada set ya marcado, no solo en el que acabas de tocar. */
.check:active{transform:scale(.88)}
@keyframes check-pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.check.pop{animation:check-pop .32s cubic-bezier(.34,1.56,.64,1)}
.set-remove{width:30px;height:48px;background:transparent;border:none;color:#c7ccd3;display:grid;place-items:center}
.add-set-link{justify-self:start;background:transparent;border:none;box-shadow:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 2px;margin-top:2px}
.workout-bar{position:sticky;top:-20px;z-index:5;margin:-20px -20px 0;padding:14px 18px 12px;background:linear-gradient(180deg,rgba(247,251,254,.98),rgba(247,251,254,.78));backdrop-filter:blur(18px);border-bottom:0;border-radius:8px 8px 0 0;overflow:visible}
.workout-bar-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.workout-bar-title h1{font-size:22px;line-height:1}
.workout-bar-title small{display:block;color:var(--muted);font-weight:800;font-size:12px;margin-bottom:3px}
/* Floating timer: a small tap-to-expand pill instead of a full-width hero console, so the
   clock doesn't compete with the exercise list for attention while training. Fixed-positioned
   (escapes .modal-card's overflow:auto clipping since no ancestor sets a transform/filter). */
.float-timer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 28px)}
.float-timer-chip{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#051a3a,#062f68);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 14px;box-shadow:0 14px 30px rgba(1,36,86,.30);color:#fff}
.float-timer-dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf;flex:0 0 auto}
.float-timer-dot.paused{background:rgba(255,255,255,.4)}
.float-timer-chip strong{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.float-timer-restbadge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.6);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .16s ease,color .16s ease,border-color .16s ease}
.float-timer-restbadge.resting{background:rgba(255,180,81,.20);border-color:rgba(255,180,81,.40);color:#ffb451}
.float-timer-chevron{color:rgba(255,255,255,.6);display:flex;transition:transform .16s ease}
.float-timer.open .float-timer-chevron{transform:rotate(90deg)}
.float-timer-panel{width:min(220px,calc(100vw - 28px));background:linear-gradient(135deg,#051a3a,#062f68);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px;box-shadow:0 18px 38px rgba(1,36,86,.30);color:#fff}
.float-timer-panel .row-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.timer-label{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.66);font-size:9px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}
.timer-label:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.float-timer-panel .elapsed-big{display:block;margin-top:4px;color:#fff;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.float-timer-panel .elapsed-hint{display:block;margin-top:3px;color:rgba(255,255,255,.58);font-style:normal;font-size:10px;font-weight:800}
.timer-toggle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.20);flex:0 0 auto}
.float-timer-panel .rest-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:14px}
.timer-step{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);color:#fff;font-size:11px;font-weight:1000;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.timer-rest{text-align:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.timer-rest span{display:block;color:#d8922f;font-size:8px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
.timer-rest strong{display:block;color:#fff;font-size:17px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.rest-progress{margin-top:10px;height:5px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.rest-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb451,#2dd4bf);border-radius:999px;transition:width .25s linear}
.float-timer-panel .unit-toggle{margin-top:12px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.float-timer-panel .unit-toggle button{color:rgba(255,255,255,.76)}
.float-timer-panel .unit-toggle button.active{background:#fff;color:var(--dof-navy)}
.workout-content{margin:16px -20px -20px;padding:22px 20px 20px;background:linear-gradient(180deg,#f3f8fc,#f7fbfe 88px,#f7fbfe);border-top:1px solid rgba(1,36,86,.08)}
.workout-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.workout-section-head h2{font-size:20px;margin:0}
.workout-progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.progress-pill{display:inline-flex;align-items:baseline;gap:4px;background:#e7f0f7;color:var(--dof-navy);border-radius:999px;padding:8px 12px;font-weight:1000}
.progress-pill strong{font-size:18px}
.progress-pill small{color:var(--muted);font-weight:900}
.unit-toggle{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.unit-toggle button{background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}
.unit-toggle button.active{background:var(--dof-navy);color:#fff}
.workout-footer{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:10px;margin:14px 0 0;padding:4px 0 0}
.workout-footer .btn{min-height:52px;box-shadow:none}
.btn.danger-action{color:var(--pink);border-color:rgba(212,72,84,.32);background:#fff}
/* Sticks "Save routine" to the bottom of the modal-card's own scroll area (mirrors the
   sticky-top .workout-bar trick) so it stays reachable without scrolling past ~100 exercises. */
.sheet-cta{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));z-index:5;margin:14px -20px calc(-20px - env(safe-area-inset-bottom));padding:12px 20px calc(12px + 20px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(247,251,254,.98),rgba(247,251,254,.85) 70%,rgba(247,251,254,0));backdrop-filter:blur(18px)}
.modal-card .exercise{box-shadow:0 10px 26px rgba(1,36,86,.08);background:rgba(255,255,255,.92)}
.modal-card .exercise h3{font-size:18px}
.modal-card .field{box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;flex:0 0 auto;box-shadow:0 6px 14px rgba(1,36,86,.06)}
.icon-btn.tiny{width:30px;height:30px;font-size:13px}
.icon-btn.danger{color:var(--pink)}
.rest-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}
.chip.active{background:var(--dof-navy);color:#fff;border-color:var(--dof-navy)}
.routine-card{cursor:pointer}
.routine-card .routine-summary{align-items:center}
.routine-card .routine-title{min-width:0}
.routine-card .routine-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routine-count{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.routine-toggle{width:34px;height:34px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;transition:transform .16s ease,background .16s ease,color .16s ease}
.routine-card.open .routine-toggle{transform:rotate(90deg);background:var(--dof-navy);color:#fff;border-color:var(--dof-navy)}
.routine-details{display:grid;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.feed{padding:16px;margin:12px 0}
.feed-title{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.leader{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.body-fig-wrap{position:relative;margin-top:14px;text-align:center}
.body-fig-wrap svg{width:auto;height:auto;max-width:100%;max-height:50vh;display:inline-block}
.mini-body-card{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;overflow:hidden}
.mini-body-fig{height:170px;display:grid;place-items:center;background:linear-gradient(180deg,#f7fbfe,#edf4f9);border:1px solid var(--line);border-radius:8px}
.mini-body-fig svg{height:152px;max-width:100%}
.mini-body-card h2{margin-bottom:5px}
.mini-body-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.muscle-builder{display:grid;gap:8px;margin:10px 0 14px}
.muscle-builder-row{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.muscle-builder-row strong{font-size:14px}
.muscle-builder-row input[type="range"]{width:100%;accent-color:var(--dof-navy)}
.muscle-builder-row .field{padding:8px}
.form-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.body-flip-btn{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 10px 22px rgba(1,36,86,.14)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--dof-steel)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.photo-thumb span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);color:#fff;font-size:10px;font-weight:800;text-align:left}
.muscle-region{cursor:pointer;transition:opacity .15s}
.muscle-region:hover,.muscle-region:active{opacity:.82}
.muscle-legend{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.muscle-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.muscle-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.muscle-legend .scale{width:min(150px,38%);height:7px;border-radius:999px}
.auth{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(460px,100%);background:rgba(255,255,255,.90);border:1px solid rgba(1,36,86,.10);border-radius:8px;padding:24px;box-shadow:0 28px 70px rgba(1,36,86,.18)}
.auth-logo{font-size:54px;font-weight:1000;color:var(--dof-navy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center;overflow:hidden}
.modal.show{display:flex}
.modal-card{width:min(820px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:88dvh;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));margin:0 auto}
/* Reemplazo de confirm()/alert() nativos: overlay aparte de #modal (z-index más alto), para

/* ── Movimiento y tacto ──────────────────────────────────────────────────────
   Toda la app vive en hojas modales —51 sitios las abren— y hasta aquí entraban con
   `display:flex`, sin transición: tocabas y la pantalla ya había cambiado, sin que nada
   acusara el toque. Las transiciones que había eran todas de `:hover`, un gesto que un
   teléfono no tiene, así que en el dispositivo real donde se usa la app (un iPhone, a
   bordo) no se movía absolutamente nada.

   La regla de aquí en adelante: el acuse del toque es `:active` y es inmediato (90 ms);
   la entrada de una hoja es corta (220 ms) y se hace con `transform`/`opacity`, que la
   GPU compone sin repintar; y todo esto se apaga si el sistema pide menos movimiento.

   Los tamaños: 44 px es el mínimo táctil de Apple, y en una cubierta que se mueve no es
   una recomendación de estilo. Donde el dibujo del control sí debe seguir siendo chico
   (el "•••" de un renglón), se agranda solo el ÁREA con un ::after, no el botón. */

@keyframes sheet-in{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes veil-in{from{opacity:0}to{opacity:1}}
.modal.show{animation:veil-in .16s ease-out}
.modal.show>.modal-card{animation:sheet-in .22s cubic-bezier(.22,.61,.36,1)}

/* El cambio de pantalla, cuando el navegador trae View Transitions (ver render()). Se le pone
   nombre solo al contenedor del contenido: si se anima la raíz, el encabezado y la barra de
   pestañas —que no cambian— se desvanecen con él y la app entera parpadea. Lo que cambia es
   la pantalla; el cromo se queda quieto, que es justo lo que hace que se lea como una app y
   no como una página que se recarga. */
#screen{view-transition-name:screen}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(screen){animation:vt-out .12s ease-out both}
::view-transition-new(screen){animation:vt-in .20s cubic-bezier(.22,.61,.36,1) both}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vt-out{to{opacity:0}}

.btn:active,button.chip:active,.pill:active,.seg button:active,.icon-btn:active,
.plan-row:active,.meal-card:active,.pick:active,.more-row:active,.day:active,
.week-item:active,.cal-day:active,.member:active,.click-card:active,
.focus.action:active,.add-fab:active,.auth-tab:active,.x:active,
.input-choice button:active,.lib-row:active,.skill-chip:active,.cal-empty:active{
  transform:scale(.97);
  transition:transform .09s ease-out
}
.tab:active{transform:scale(.93);transition:transform .09s ease-out}

/* Piso táctil de 44 px. */
.btn.small{min-height:44px}
.seg button{min-height:44px}
button.chip{min-height:44px}
.pick{min-height:44px}
.week-item{min-height:44px;line-height:44px}
/* El "•••" sigue midiendo 30 px a la vista y 44 px al dedo. El inset cabe dentro del
   `gap` de su renglón, así que no le roba el toque a lo que tiene al lado. */
.icon-btn{position:relative}
.icon-btn.tiny::after{content:"";position:absolute;inset:-7px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important
  }
}
</style>

let LANG=(()=>{
  const saved=localStorage.getItem(LANG_STORAGE_KEY);
  if(saved&&I18N[saved]) return saved;
  return (navigator.language||navigator.userLanguage||'en').toLowerCase().startsWith('es')?'es':'en';
})();
function t(key,vars){
  let s=I18N[LANG]?.[key];
  if(s==null) s=I18N.en[key];
  if(s==null) return key;
  return vars?s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m):s;
}
// Counted strings: `<key>_one` / `<key>_other`, with {n} always available.
function tp(n,key,vars){ return t(`${key}_${n===1?'one':'other'}`,Object.assign({n},vars||{})); }

const DOW_BY_LANG={
  en:['MON','TUE','WED','THU','FRI','SAT','SUN'],
  es:['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM']
};
// Reassigned by applyLang() so every existing `DOW[i]` / `DOW.map(...)` call site stays as-is.
let DOW=DOW_BY_LANG[LANG]||DOW_BY_LANG.en;
// Dos letras, no una: en español "M" es martes y miércoles, y en una celda de calendario esa
// ambigüedad se paga cada vez que se lee.
const DOW_MINI_BY_LANG={
  en:['Mo','Tu','We','Th','Fr','Sa','Su'],
  es:['Lu','Ma','Mi','Ju','Vi','Sá','Do']
};
let DOW_MINI=DOW_MINI_BY_LANG[LANG]||DOW_MINI_BY_LANG.en;
// Stored DB values on the left, translated labels on the right (rebuilt on language change).
const ACTIVITY_TYPES=['running','cycling','swimming','rowing','walking','hiit','hyrox','other'];
let ACTIVITY_LABELS={};
function rebuildActivityLabels(){
  ACTIVITY_LABELS=Object.fromEntries(ACTIVITY_TYPES.map(k=>[k,t('activity.'+k)]));
}
// Stored values reach these helpers straight out of the database, so a row written before a
// label existed (a custom category, a muscle key we don't translate) has to fall back to the
// raw value rather than rendering a bare "cat.Whatever" key.
function tOr(key,fallback){ const s=t(key); return s===key?fallback:s; }
const muscleLabel=name=>tOr('m.'+name,name);
const groupLabel=name=>tOr('group.'+name,name);
const categoryLabel=name=>name?tOr('cat.'+name,name):'';
const presetLabel=name=>tOr('preset.'+name,name);
const difficultyLabel=v=>{ const key=v||'normal'; return tOr('diff.'+key,key); };

// Fills the static markup (auth screen, tab bar, avatar button) that lives outside render().
function applyStaticI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label',t(el.dataset.i18nAria)); });
}

// Re-renders the whole app in the new language. The modal is deliberately left alone: the only
// two call sites are the auth-screen toggle (no modal open) and the Settings sheet, which
// re-renders itself right after — closing/reopening it here would fight that and thrash the
// body-scroll lock.
function applyLang(lang){
  LANG=I18N[lang]?lang:'en';
  localStorage.setItem(LANG_STORAGE_KEY,LANG);
  DOW=DOW_BY_LANG[LANG]||DOW_BY_LANG.en;
  DOW_MINI=DOW_MINI_BY_LANG[LANG]||DOW_MINI_BY_LANG.en;
  rebuildActivityLabels();
  applyStaticI18n();
  // setAuthMode owns the auth button/tab labels (they depend on login vs signup), so re-run it
  // rather than letting the static pass stamp a stale "Sign in" over a signup form.
  if(!$('auth').classList.contains('hidden')) setAuthMode(state.authMode);
  if(state.user) render();
}
function setLang(lang){ if(lang!==LANG) applyLang(lang); }
function toggleLang(){ applyLang(LANG==='es'?'en':'es'); }

function fmtWorkoutTime(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const d=Math.floor(sec/86400);
  const h=Math.floor((sec%86400)/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  if(d>0) return `${d}d ${h}h`;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

}

function showApp(){

  $('avatar').textContent=initials(name);

function setAuthMode(mode){
  state.authMode=mode;
  $('loginTab')?.classList.toggle('active',mode==='login');
  $('signupTab')?.classList.toggle('active',mode==='signup');
  $('signupNames')?.classList.toggle('hidden',mode!=='signup');
  if($('authBtn')) $('authBtn').textContent=mode==='login'?t('auth.signin'):t('auth.createAccount');
  if($('authMsg')) $('authMsg').textContent='';
}

let submittingAuth=false;
async function submitAuth(){
  if(submittingAuth) return; // guards a double-tap firing two concurrent sign-in/sign-up calls
  const email=$('email').value.trim();
  const password=$('password').value;
  const firstName=($('firstName')?.value||'').trim();
  const lastName=($('lastName')?.value||'').trim();
  const fullName=[firstName,lastName].filter(Boolean).join(' ');
  if(!email||!password) return $('authMsg').textContent=t('auth.errRequired');
  if(state.authMode==='signup'&&(!firstName||!lastName)) return $('authMsg').textContent=t('auth.errNames');
  submittingAuth=true;
  const btn=$('authBtn');
  if(btn) btn.disabled=true;
  $('authMsg').textContent=state.authMode==='login'?t('auth.signingIn'):t('auth.creatingAccount');
  try{
    if(state.authMode==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) return $('authMsg').textContent=error.message;
      state.user=data.user;
      await loadAll();
      return showApp();
    }
    // app:'skandi' lets handle_new_user() (migration 055) tag this profile as a Skandi-only
    // signup so it doesn't show up in HABIT's admin members list/search.
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:fullName,app:'skandi'},emailRedirectTo:location.href}});
    if(error) return $('authMsg').textContent=error.message;
    if(data.session){
      state.user=data.user;
      await loadAll();
      return showApp();
    }
    $('authMsg').textContent=t('auth.created');
  } finally {
    submittingAuth=false;
    if(btn) btn.disabled=false;
  }
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

function dedupeById(rows){
  const byId=new Map();
  rows.forEach(r=>{ if(r&&r.id) byId.set(r.id,r); });
  return [...byId.values()];
}

async function loadAll(){
  // La nutrición vive en sus propias tablas y no la necesita nada de abajo: se dispara en
  // paralelo y se espera al final, para no sumarle un viaje redondo al arranque.
  const nutritionLoad=loadNutrition();
  // Igual: ni Strava ni los ajustes los necesita nada de abajo.
  const integrationsLoad=loadIntegrations();
  // Sessions/sets are split into "own" (unbounded — this is the data an active workout and a
  // user's own stats/history depend on, and silently truncating it is a real bug: it can make
  // exercises vanish mid-workout or PRs disappear once the crew collectively logs enough rows)
  // vs. "crew" (other members' shared activity, capped since it only feeds the social feed).
  let [{data:profile},{data:exercises},{data:templates},{data:items},
       {data:ownSessions},{data:crewSessions},{data:ownSets},{data:crewSets},
       {data:externalActivities},{data:activityTemplates},{data:progressionState},{data:trainingBlocks},{data:bodyweightLogs},
       {data:programs},{data:programDays},{data:programWeeks},{data:progressionEvents},{data:skillGoals},
       {data:bodyMeasurements},{data:progressPhotos},{data:supplements},{data:supplementLogs},
       {data:planned,error:plannedError}]=await Promise.all([
    sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle(),
    sb.from('skandi_exercises').select('*').order('name'),
    sb.from('skandi_templates').select('*, profile:profiles(name,avatar_url)').order('weekday',{nullsFirst:false}).order('created_at',{ascending:false}),
    sb.from('skandi_template_items').select('*, exercise:skandi_exercises(*)').order('sort_order'),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').eq('user_id',state.user.id).order('started_at',{ascending:false}),
    sb.from('skandi_sessions').select('*, profile:profiles(name,avatar_url)').eq('visibility','crew').order('started_at',{ascending:false}).limit(60),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    sb.from('skandi_sets').select('*, exercise:skandi_exercises(name,slug)').neq('user_id',state.user.id).order('created_at',{ascending:false}).limit(600),
    sb.from('skandi_external_activities').select('*').eq('user_id',state.user.id).order('performed_at',{ascending:false}).limit(200),
    sb.from('skandi_activity_templates').select('*').eq('user_id',state.user.id).order('weekday',{nullsFirst:false}),
    sb.from('skandi_progression_state').select('*').eq('user_id',state.user.id),
    sb.from('skandi_training_blocks').select('*').eq('user_id',state.user.id).order('start_date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('skandi_bodyweight_logs').select('*').eq('user_id',state.user.id).order('logged_at',{ascending:false}),
    sb.from('skandi_programs').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    // No user_id filter: skandi_program_days has no user_id column of its own, its RLS policy
    // resolves ownership through the parent program (migration 069).
    sb.from('skandi_program_days').select('*'),
    // Metadatos de P3 (fase y nota) viven aparte de los días: no compiten con week_index,
    // solo describen cada semana del mismo programa.
    sb.from('skandi_program_weeks').select('*'),
    sb.from('skandi_progression_events').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    sb.from('skandi_skill_goals').select('*').eq('user_id',state.user.id),
    // [] si la migración 090 no se ha corrido, igual que programs/progressionEvents arriba.
    sb.from('skandi_body_measurements').select('*').eq('user_id',state.user.id).order('measured_at',{ascending:false}),
    sb.from('skandi_progress_photos').select('*').eq('user_id',state.user.id).order('taken_at',{ascending:false}),
    // [] si la migración 093 todavía no se corrió, igual que measurements/photos arriba.
    sb.from('skandi_supplements').select('*').eq('user_id',state.user.id).order('sort_order'),
    sb.from('skandi_supplement_logs').select('*').eq('user_id',state.user.id).gte('taken_on',dayKey(addDays(new Date(),-1))),
    // Ventana del calendario: un mes atrás (para leer adherencia reciente) y medio año
    // adelante. Traer todo el histórico de un plan no sirve para nada y crece sin techo.
    sb.from('skandi_planned_sessions').select('*')
      .eq('user_id',state.user.id)
      .gte('day',dayKey(addDays(mondayOf(new Date()),-126)))
      .lte('day',dayKey(addDays(mondayOf(new Date()),182)))
      .order('day')
  ]);
  if(!profile){
    // Some signups end up with an auth user but no profiles row (trigger race condition).
    // Every Skandi write is FK'd to profiles(id), so self-heal it here before anything breaks.
    const {error:ensureError}=await sb.rpc('ensure_own_profile',{p_name:state.user?.user_metadata?.name||state.user?.email?.split('@')[0]||''});
    if(ensureError){
      alert(t('auth.profileError',{msg:ensureError.message}));
    } else {
      ({data:profile}=await sb.from('profiles').select('id,name,avatar_url').eq('id',state.user.id).maybeSingle());
    }
  }
  state.profile=profile||{name:state.user.email};
  const ignored=ignoredSessionIds();
  state.exercises=exercises||[];
  state.templates=templates||[];
  state.items=items||[];
  const sessions=dedupeById([...(ownSessions||[]),...(crewSessions||[])]);
  const sets=dedupeById([...(ownSets||[]),...(crewSets||[])]);
  if(state.active){
    // A background loadAll() (e.g. the one fired right after startWorkout) can resolve after
    // the member has already checked off sets locally — its server snapshot is racing those
    // in-flight updates, so overwriting wholesale can silently revert sets just marked done,
    // surfacing on the next render as unchecked. Each edit during a live workout is already
    // persisted individually (toggleSet/updateSet/addSet/removeSet), so keep the active
    // session's own data from local state and only merge in everything outside it.
    const localActiveSets=state.sets.filter(s=>s.session_id===state.active.id);

    state.sets=dedupeById([...localActiveSets,...sets.filter(s=>s.session_id!==state.active.id)]).filter(s=>!ignored.has(s.session_id));
  }else{
    state.sessions=sessions.filter(s=>!(ignored.has(s.id)&&!s.completed_at));
    state.sets=sets.filter(s=>!ignored.has(s.session_id));
  }
  state.externalActivities=externalActivities||[];
  state.activityTemplates=activityTemplates||[];
  state.progressionState=progressionState||[];
  state.trainingBlocks=trainingBlocks||[];
  state.bodyweightLogs=bodyweightLogs||[];
  // Both default to [] rather than throwing when migration 069 hasn't been run yet — the rest
  // of the app (and the week itself) works fine without programs.
  state.programs=programs||[];
  state.programDays=programDays||[];
  state.programWeeks=programWeeks||[];
  // Igual que programs: [] en vez de reventar si la migración 079 todavía no se corrió.
  state.progressionEvents=progressionEvents||[];
  state.skillGoals=skillGoals||[];
  // Igual: [] si la migración 090 (medidas y fotos) todavía no se corrió.
  state.bodyMeasurements=bodyMeasurements||[];
  state.progressPhotos=progressPhotos||[];
  // Igual: [] si la migración 093 (suplementos) todavía no se corrió.
  state.supplements=supplements||[];
  state.supplementLogs=supplementLogs||[];
  // plannedReady=false = la migración 080 todavía no se corrió. La app entera sigue
  // funcionando sin calendario; Entrenar se cae a las tarjetas de siempre.
  state.plannedReady=!plannedError;
  state.planned=planned||[];
  // Si cambió qué rutina vive en qué día, los estampados anteriores pueden haber quedado
  // obsoletos: se permite que el RPC vuelva a sincronizar las semanas ya visitadas.
  const sig=weekTemplateSignature();
  if(sig!==state.weekSig){ state.weekSig=sig; state.ensuredWeeks.clear(); }
  await nutritionLoad;
  await integrationsLoad;
  hydrateActiveWorkout();
  // La semana en curso se estampa siempre (es la que pinta "Hoy"); las demás, al abrirlas.
  ensureCalendarWeeks(1,0);
}

function hydrateActiveWorkout(){
  if(!state.user||state.active) return;
  const maxAgeMs=ACTIVE_WORKOUT_MAX_HOURS*3600e3;
  state.sessions.filter(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()>maxAgeMs)
    .forEach(s=>ignoreSessionLocally(s.id));
  const ignored=ignoredSessionIds();
  state.sessions=state.sessions.filter(s=>!(ignored.has(s.id)&&!s.completed_at));
  state.sets=state.sets.filter(s=>!ignored.has(s.session_id));
  const active=state.sessions.find(s=>s.user_id===state.user.id&&!s.completed_at&&Date.now()-new Date(s.started_at).getTime()<=maxAgeMs);
  if(!active) return;
  state.active=active;
  state.activeItems=computeActiveItems(active.id);
  state.elapsed=Math.max(0,Math.floor((Date.now()-new Date(active.started_at).getTime())/1000));
  state.rest=0;
  state.restTotal=0;
  state.pausedMs=0;
  state.pausedAt=null;
  resumeWorkoutTimer();
}

// ---- Training blocks (N build weeks + 1 deload week, per Plan_Hibrido_Final_v3) ----
// A block is never auto-continued by calendar: it just sits at whatever week the date lands
// on, and once it runs past its last week the UI asks the member to review and explicitly
// start the next one (build_weeks can change block to block, e.g. 4+1 vs 5+1).

// Empate en start_date: pasaba solo el flujo normal, un bloque por semana. startAdHocDeload()
// puede insertar un bloque puntual que arranca el mismo lunes que un bloque de varias semanas
// ya en curso — sin desempate, el ganador dependía del orden en que Postgres devolviera filas
// iguales, así que a veces "ganaba" el bloque viejo (build_weeks>0, no en descarga) y el botón
// de descarga puntual parecía no hacer nada aunque la fila sí se hubiera guardado. Ante empate,
// gana el creado más recientemente: es la declaración más deliberada sobre esta semana.
function currentTrainingBlock(){
  if(!state.trainingBlocks.length) return null;
  return state.trainingBlocks.reduce((a,b)=>{
    const byStart=new Date(b.start_date)-new Date(a.start_date);
    if(byStart!==0) return byStart>0?b:a;
    return new Date(b.created_at)>new Date(a.created_at)?b:a;
  });
}

function cycleWeekInfo(source,startDate,buildWeeks,hasDeload=true,refDate=Date.now()){
  if(!source||!startDate) return null;
  const start=new Date(startDate+'T00:00:00');
  // buildWeeks=0 is a real, deliberate value (an ad-hoc single deload week, see
  // startAdHocDeload) — Number(0)||1 would silently coerce it back to 1, so 0 needs its own
  // branch instead of just falling through the || default meant for missing/invalid input.
  const bw=Number.isFinite(Number(buildWeeks))?Math.max(0,Number(buildWeeks)):1;
  const totalWeeks=bw+(hasDeload?1:0);
  const days=Math.floor((new Date(refDate).getTime()-start.getTime())/86400000);
  if(days<0) return {block:source,week:0,totalWeeks,deload:false,ended:false,notStarted:true};
  const week=Math.floor(days/7)+1;
  return {block:source,week:Math.min(week,totalWeeks+1),totalWeeks,
    deload:hasDeload&&week===totalWeeks,ended:week>totalWeeks,notStarted:false};
}

// refDate lets a caller ask "was <some past date> inside a deload week?" (e.g. progression-stall
// detection checking a session's completed_at) instead of only ever answering for right now.
// Assumes today's block/program was also the one active on refDate — fine for a date within the
// current cycle, wrong if the member has since switched blocks, which is an acceptable miss here.
function trainingBlockWeekInfo(block,refDate=Date.now()){
  if(!block){
    // Un bloque puntual (build_weeks===0, ver startAdHocDeload) es la declaración más
    // deliberada sobre ESTA semana en concreto -- gana incluso sobre un programa activo. Sin
    // esto, quien tiene un programa cargado (start_date propio, ciclo propio) nunca llegaba a
    // leer skandi_training_blocks aquí: el botón "Es mi semana de descarga" guardaba la fila
    // pero trainingBlockWeekInfo() seguía calculando la semana desde el programa, así que el
    // aviso de estancamiento no cambiaba y deloadAdjustedWeight() no bajaba el peso sugerido.
    const adHoc=(state.trainingBlocks||[]).find(b=>Number(b.build_weeks)===0
      &&cycleWeekInfo(b,b.start_date,0,true,refDate)?.deload);
    if(adHoc) return cycleWeekInfo(adHoc,adHoc.start_date,0,true,refDate);
    const program=typeof activeProgram==='function'?activeProgram():null;
    if(program?.start_date){
      const source={start_date:program.start_date,build_weeks:program.weeks||4,program_id:program.id};
      return {...cycleWeekInfo(source,program.start_date,program.weeks||4,program.deload_week!==false,refDate),program};
    }
    block=currentTrainingBlock();
  }
  if(!block) return null;
  return cycleWeekInfo(block,block.start_date,block.build_weeks,true,refDate);
}

// Deload-week load suggestion: ~30% lighter than last time, rounded to a plate-friendly
// 0.5kg step. Only ever touches the PRELOADED value shown when a set is created — every
// field stays a normal editable input, so this is a starting point, not an enforced cap.
function deloadAdjustedWeight(weightKg){
  if(weightKg==null) return weightKg;
  const info=trainingBlockWeekInfo();
  if(!info?.deload) return weightKg;
  return Math.round(weightKg*0.7*2)/2;
}

function render(){
  const map={home:homeView,train:trainView,food:foodView,crew:crewView,progress:progressView,body:bodyView,library:libraryView};
  const paint=()=>{ $('screen').innerHTML=map[state.view](); };
  // Un re-render dentro de la misma vista (marcar una serie, abrir una semana del calendario)
  // no debería mandarte al principio de la pantalla: eso es lo que hacía que la app se
  // sintiera como si se reiniciara a cada toque. Al CAMBIAR de vista sí se vuelve arriba,
  // que es lo que se espera al entrar a otra pantalla.
  const sameView=state.view===lastRenderedView;
  const y=window.scrollY;
  lastRenderedView=state.view;
  if(!document.startViewTransition||prefersReducedMotion()){
    paint();
    if(sameView) window.scrollTo(0,y);
    return;
  }
  // Un render nuevo mientras otro está en vuelo (marcar dos series seguidas) cancela el
  // anterior, y esa cancelación rechaza `ready`/`finished`. Es el funcionamiento normal, no
  // un fallo: sin capturarlo, la consola se llena de "Transition was skipped".
  const vt=document.startViewTransition(()=>{
    paint();
    if(sameView) window.scrollTo(0,y);
  });
  vt.ready.catch(()=>{});
  vt.finished.catch(()=>{});
}
let lastRenderedView=null;
const prefersReducedMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

// One tap from the stall warning: "this specific week, no plan behind it, is a deload" —
// skips openTrainingBlockForm's build-weeks picker entirely. build_weeks=0 + 1 deload week
// covers exactly Monday–Sunday of the current week and expires on its own the week after
// (currentTrainingBlock/beyondActiveBlock stop picking it up), so there is nothing to clean up.
// confirmSheet/alertSheet, not confirm()/alert(): this button lives on the Home banner and in
// Progreso, both reachable from inside the installed (standalone) PWA, where native dialogs
// are exactly the ones already replaced elsewhere in this file (see confirmSheet's own comment)
// for silently doing nothing — a tap that looked like a no-op instead of a real cancel.
async function startAdHocDeload(){
  if(trainingBlockWeekInfo()?.deload) return;
  if(!await confirmSheet(t('block.confirmAdHocDeload'))) return;
  const startDate=dayKey(mondayOf(new Date()));
  const {error}=await sb.from('skandi_training_blocks')
    .insert({user_id:state.user.id,start_date:startDate,build_weeks:0,note:t('block.adHocNote')});
  if(error) return alertSheet(error.message);
  await loadAll();
  render();
}

// Lo que toca HOY, leído del calendario. Antes Inicio preguntaba "¿qué rutina tiene asignado
// este día de la semana?", que es otra pregunta: no veía una tirada en bici planeada para hoy,
// y cuando el día no tenía rutina asignada caía a `state.templates.find(...)` —cualquier rutina
// suya— y ofrecía empezar la del lunes un domingo.
function todayFocus(){
  const key=todayKey();
  const rows=plannedOfDay(key);
  const extras=extrasOfDay(key);
  const sessions=rows.filter(p=>p.discipline!=='rest');
  const pending=sessions.filter(p=>p.status==='planned');
  return {
    key, rows, extras, sessions,
    next:pending[0]||null,
    isRest:!sessions.length&&rows.some(p=>p.discipline==='rest'),
    allDone:sessions.length>0&&!pending.length,
    doneToday:sessions.filter(p=>p.status==='done').length
  };
}

// "El porqué de este día": junta lo que la app ya sabía por separado —qué toca, en qué semana
// del bloque vas, cómo dormiste, qué músculo sigue cansado, cuánta carga llevas y cuánto
// deberías comer— y lo explica. Las reglas viven en skandi-brief.js; aquí solo se arman los
// datos y se pinta.
// El "porqué" de hoy: antes era su propia tarjeta (briefCard) más otras dos (bienestar, bloque)
// que Home apilaba casi igual a como ya las muestra Entrenar > Hoy. Se consolidan en una lista
// de líneas — el detalle completo de bienestar/bloque sigue en Entrenar, y el plan de
// combustible completo en Comida; aquí solo lo necesario para decidir si hace falta abrir algo.
function todayDetailCard(){
  const f=todayFocus();
  const block=trainingBlockWeekInfo();
  const isDeload=!!block?.deload;

  // Sueño y pulso de hoy contra los 7 días previos: en absoluto no significan nada.
  const rows=(state.wellness||[]).slice().sort((a,b)=>b.day.localeCompare(a.day));
  const latest=rows[0]&&rows[0].day===f.key?rows[0]:null;
  const prev=rows.filter(w=>w.day!==f.key).slice(0,7);
  const mean=field=>{const v=prev.map(r=>Number(r[field])).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const sleepAvg=mean('sleep_secs'), hrAvg=mean('resting_hr');

  // computeMuscleRecovery devuelve un arreglo de {name, score, ...} ya ordenado del más
  // cansado al más fresco; `score` es la frescura en porcentaje.
  const tiredMuscles=(getMyRecovery()||[]).map(m=>({muscle:m.name,label:muscleLabel(m.name),freshness:m.score}));

  const refs={maxHeartRate:state.skandiSettings?.max_heart_rate||null,hrZones:state.skandiSettings?.hr_zone_bounds||null};
  const load=SkandiLoad.readout({
    series:SkandiLoad.dailySeries({sessions:state.sessions,sets:state.sets,activities:state.externalActivities,
      userId:state.user.id,refs,days:SkandiLoad.CHRONIC_DAYS*2}),
    isDeloadWeek:isDeload});
  const jointWorst=SkandiJointLoad.allJointsReadout({sets:state.sets,sessions:state.sessions,exercises:state.exercises,userId:state.user.id})
    .find(r=>r.level==='high');
  const jointHigh=jointWorst?{name:jointLabel(jointWorst.joint),pct:Math.round((jointWorst.ratio-1)*100)}:null;

  const weightKg=latestWeightKg();
  const {rec,targets}=nutritionForBrief();

  const brief=SkandiBrief.today({
    sessions:f.rows,
    isDeload, blockWeek:block?.week, blockTotal:block?.totalWeeks,
    exercisesOf:p=>p.template_id?state.items.filter(i=>i.template_id===p.template_id).map(i=>i.exercise).filter(Boolean):[],
    sleepGapMin:(latest?.sleep_secs&&sleepAvg)?(latest.sleep_secs-sleepAvg)/60:null,
    restingHrJump:(latest?.resting_hr&&hrAvg)?latest.resting_hr-hrAvg:null,
    loadLevel:load.level,
    jointHigh,
    tiredMuscles,
    rec, targets,
    // Sin un peso registrado no hay cómo escalar gramos por kilo, y meter un peso inventado
    // daría un consejo con cara de preciso. Se omite el timing y ya.
    fuelFor:weightKg?(p=>SkandiNutrition.fuelPlan(plannedToFuelSession(p,weightKg),weightKg)):null
  });

  // El módulo razona en minutos porque es la unidad del umbral; para leerlo, hora y minutos.
  const line=x=>{
    const params={...(x.params||{})};
    if(x.key==='brief.caution.sleep') params.min=formatSleep(params.min*60);
    return t(x.key,params);
  };

  // Solo el ejemplo de "antes de entrenar" — el plan completo (durante, después, por sesión)
  // ya vive en Comida, que es donde de verdad hace falta cuando llega la hora de comer.
  const fuelBefore=brief.fuel.find(x=>x.key==='brief.fuel.before');

  // Cada fila era texto plano — la única forma de ver más era adivinar en qué pestaña vivía.
  // Ahora cada una lleva a donde de verdad está el detalle completo: el plan de combustible
  // entero (antes+durante+después) vive en Comida, no aquí; el sueño/pulso completos en un
  // modal que reusa wellnessCardHtml (no hay pestaña propia para eso); la fatiga muscular en
  // Cuerpo; la carga en Progreso.
  const cautionTarget=key=>
    (key==='brief.caution.sleep'||key==='brief.caution.hr')?'openWellnessDetail()'
    :(key==='brief.caution.load'||key==='brief.caution.deloadWeak'||key==='brief.caution.joint')?`setView('progress')`
    :key==='brief.caution.muscle'?`setView('body')`
    :`setView('train')`;
  const rowLink=(name,title,sub,action,tone)=>
    `<div class="detail-row click" onclick="${action}" style="${tone?`color:${tone}`:''}">${icon(name,18)}<div class="detail-body"><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div><i class="chev">${icon('chevronRight',16)}</i></div>`;

  const rows2=[
    rowLink('trending',t(brief.headline.key,brief.headline.params||{}),block?t('block.weekOf',{week:block.week,total:block.totalWeeks}):'',`setView('train')`),
    ...brief.cautions.map(x=>rowLink('warning',t('brief.cautionTitle'),line(x),cautionTarget(x.key),'var(--amber)')),
    fuelBefore?rowLink('food',t('brief.fuelTitle'),line(fuelBefore),`setView('food')`):''
  ].filter(Boolean).join('');

  return `<section class="card">
    <div class="eyebrow">${esc(t('home.today'))}</div>
    <div style="margin-top:6px">${rows2}</div>
  </section>`;
}

// Una fila del calendario traducida a lo que fuelPlan() espera. Antes esa entrada venía de
// `skandi_activity_templates` por día de la semana, que es el modelo viejo y no ve una sesión
// planeada para una fecha concreta.
function plannedToFuelSession(p,weightKg){
  const minutes=Number(p.target_duration_min)||0;
  const kind=p.discipline==='strength'?'strength':'endurance';
  const intensity=Number(p.target_zone)?[3,5,6.5,8,9.5][Number(p.target_zone)-1]:5;
  return {kind,activity_type:DISC_TO_ACT[p.discipline]||'other',minutes,
    // El mismo nombre que ve en el calendario ("Descarga · Front Lever A + Pull"), no el
    // genérico "Fuerza": el consejo de timing habla de la sesión que tiene enfrente.
    name:plannedTitle(p),
    distance_km:p.target_distance_km||null,intensity,
    kcal:kind==='strength'?SkandiNutrition.strengthKcal(minutes/3,weightKg)
                          :SkandiNutrition.activityKcal({activity_type:DISC_TO_ACT[p.discipline]||'other',duration_min:minutes,intensity},weightKg)};
}

// Lo que se entrena un día concreto, en el formato que fuelPlan() consume. El calendario
// (skandi_planned_sessions) es la única fuente que ve tanto la semana recurrente de siempre
// como una semana especial: una descarga o un viaje viven SOLO ahí, con weekday NULL en sus
// rutinas (migración 086), así que preguntarle al día de la semana devolvía [] justo en las
// semanas donde más importa lo que toca comer.
function sessionsForFuel(key,weightKg){
  return plannedOfDay(key).filter(p=>p.discipline!=='rest')
    .map(p=>plannedToFuelSession(p,weightKg));
}

// El promedio contra el que se mide "hoy": los 7 días de ESTA semana del calendario. Es el
// denominador del ajuste, no un dato de adorno — si sale de otra fuente que las sesiones del
// día, el delta compara dos cosas distintas.
function weeklyPlannedFromCalendar(weightKg){
  const monday=mondayOf(new Date());
  const byDay={};
  let total=0;
  for(let i=0;i<7;i++){
    const key=dayKey(addDays(monday,i));
    const kcal=sessionsForFuel(key,weightKg).reduce((a,x)=>a+(x.kcal||0),0);
    byDay[key]=kcal;
    total+=kcal;
  }
  return {byDay,total,avgDaily:Math.round(total/7)};
}

function nutritionForBrief(){
  const today=todayKey();
  // La meta del día, no la base: si el coach fijó un número para hoy (migración 094), es ese
  // el que tiene que ver en Inicio — leer la base aquí y la del día en Comida hacía que las
  // dos tarjetas mostraran kcal distintas el mismo día.
  const targets=targetsForDay(today);
  if(!targets) return {rec:null,targets:null};
  const weightKg=latestWeightKg();
  const loggedToday=state.externalActivities.filter(a=>dayKey(a.performed_at)===today);
  const loggedSets=state.sets.filter(x=>x.user_id===state.user.id&&x.done&&dayKey(x.created_at)===today).length;
  const loggedKcal=loggedToday.reduce((acc,a)=>acc+SkandiNutrition.activityKcal(a,weightKg),0)
    +SkandiNutrition.strengthKcal(loggedSets,weightKg);
  const rows=(state.wellness||[]).slice().sort((a,b)=>b.day.localeCompare(a.day));
  const stepsToday=rows.find(w=>w.day===today)?.steps??null;
  const prevSteps=rows.filter(w=>w.day!==today).slice(0,7).map(w=>w.steps).filter(n=>Number.isFinite(n));
  const avgSteps=prevSteps.length>=3?prevSteps.reduce((a,b)=>a+b,0)/prevSteps.length:null;
  const sessions=sessionsForFuel(today,weightKg);
  const rec=SkandiNutrition.dayRecommendation({
    targets,
    plannedKcal:sessions.reduce((a,x)=>a+(x.kcal||0),0),
    avgDaily:weeklyPlannedFromCalendar(weightKg).avgDaily,
    loggedKcal,
    hasLoggedActivity:loggedToday.length>0||loggedSets>0,
    steps:stepsToday,avgSteps,weightKg});
  // Mismo criterio que trainingDayInnerHtml(): con un número fijado por el coach no hay nada
  // que ajustar encima — el delta ya está dentro de ese número.
  if(rec&&nutritionOverrideFor(today)){
    rec.kcalTarget=targets.kcal_target;
    rec.carbsTarget=targets.carbs_g_target;
    rec.delta=0;
  }
  return {targets,rec};
}

// La tira de 7 días responde "¿cómo va mi semana?" antes de pedir nada — mismo lenguaje visual
// que la tarjeta "Carga" de Progreso (load-bars), pero por día en vez de por semana. Solo el
// día de HOY se colorea con el tono real (alto/bajo/ok); los demás son referencia neutra.
function weekStripCard(monday){
  const refs={maxHeartRate:state.skandiSettings?.max_heart_rate||null,hrZones:state.skandiSettings?.hr_zone_bounds||null};
  const series=SkandiLoad.dailySeries({
    sessions:state.sessions,sets:state.sets,activities:state.externalActivities,
    userId:state.user.id,refs,days:14
  });
  const byDay=new Map(series.map(r=>[r.day,r]));
  const today=todayKey();
  const days=Array.from({length:7},(_,i)=>byDay.get(dayKey(addDays(monday,i)))||{day:dayKey(addDays(monday,i)),load:0});
  const peak=Math.max(1,...days.map(d=>d.load));
  const block=trainingBlockWeekInfo();
  const readout=SkandiLoad.readout({series,isDeloadWeek:!!block?.deload});
  const tone={high:'var(--pink)',low:'var(--amber)',deloadWeak:'var(--amber)',
              deload:'var(--green)',ok:'var(--green)',none:'var(--muted)',building:'var(--muted)'}[readout.level];

  const weekEnd=addDays(monday,7);
  const weekMinutes=
    state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at&&new Date(s.completed_at)>=monday&&new Date(s.completed_at)<weekEnd)
      .reduce((a,s)=>a+(Number(s.duration_sec)||0)/60,0)
    +state.externalActivities.filter(a=>a.user_id===state.user.id&&new Date(a.performed_at)>=monday&&new Date(a.performed_at)<weekEnd)
      .reduce((a,x)=>a+(Number(x.duration_min)||0),0);
  const {done,total}=weekAdherence(monday);

  return `<section class="card">
    <div class="week-strip">
      ${days.map((d,i)=>{
        const isToday=d.day===today;
        const h=Math.max(4,Math.round(d.load/peak*54));
        return `<div class="week-day ${isToday?'today':''}">
          <div class="week-box"><i style="height:${h}px;background:${isToday?tone:'var(--panel3)'}"></i></div>
          <small>${DOW[i][0]}</small>
        </div>`;
      }).join('')}
    </div>
    <div class="week-stats">
      <div><strong>${weekMinutes?formatSleep(weekMinutes*60):'—'}</strong><small>${esc(t('home.time'))}</small></div>
      <div class="week-sep"></div>
      <div><strong>${readout.currentWeek||0}</strong><small>${esc(t('home.load'))}</small></div>
      <div class="week-sep"></div>
      <div><strong>${done}/${total}</strong><small>${esc(t('home.sessions'))}</small></div>
    </div>
  </section>`;
}
