async function saveExternalActivity(){
  const duration=Number($('actDuration').value);
  const intensity=Number($('actIntensity').value);
  if(!duration||duration<1) return alert(t('logAct.errDuration'));
  if(!intensity||intensity<1||intensity>10) return alert(t('logAct.errIntensity'));
  if(!$('actWhen').value) return alert(t('logAct.errWhen'));
  const performedAt=new Date($('actWhen').value);
  // The datetime input's max="now" is only a soft browser hint (unreliable on mobile) — a
  // future-dated activity would otherwise show up in "Recent activities" while contributing
  // nothing to the freshness score above it (the recovery engine already excludes t > now),
  // a visibly contradictory state. Reject it outright instead.
  if(performedAt.getTime()>Date.now()+60000) return alert(t('logAct.errFuture'));
  const heartRateStr=$('actHeartRate').value;
  const heartRate=heartRateStr?Number(heartRateStr):null;
  if(heartRate!==null&&(heartRate<30||heartRate>230)) return alert(t('logAct.errHr'));
  const payload={
    user_id:state.user.id,
    activity_type:$('actType').value,
    duration_min:duration,
    distance_km:$('actDistance').value?Number($('actDistance').value):null,
    avg_heart_rate:heartRate,
    template_id:$('actTemplateId').value||null,
    intensity,
    performed_at:performedAt.toISOString(),
    note:$('actNote').value.trim()||null
  };
  const {error}=await sb.from('skandi_external_activities').insert(payload);
  if(error) return alert(error.message);
  closeModal();
  await loadAll();
  render();
}

function externalActivityRow(a){
  // Pace is derived from distance/duration rather than stored separately — the two can't
  // disagree, and it's the only extra number worth showing on a run that a target didn't set.
  const pace=a.distance_km?Math.round((a.duration_min*60)/a.distance_km):null;
  const parts=[
    `${a.duration_min} ${t('common.min')}`,t('logAct.rowIntensity',{v:a.intensity}),
    a.distance_km?`${a.distance_km} km`:null,
    pace?`${fmtPace(pace)}/km`:null,
    a.avg_heart_rate?`${a.avg_heart_rate} bpm`:null,
    new Date(a.performed_at).toLocaleDateString(LANG)
  ].filter(Boolean).join(' · ');
  return `<div class="row" style="margin-top:10px">
    <div><strong>${esc(activityTypeLabel(a.activity_type))}</strong><p>${esc(parts)}</p></div>
    <button class="icon-btn tiny danger" onclick="deleteExternalActivity('${a.id}')" aria-label="${esc(t('common.delete'))}">${icon('trash',16)}</button>
  </div>`;
}

async function deleteExternalActivity(id){
  if(!confirm(t('logAct.confirmDelete'))) return;
  const {error}=await sb.from('skandi_external_activities').delete().eq('id',id);

  await loadAll();
  render();
}

// Progressions (front lever, back lever, planche, handstand): skandi_exercises rows chained
// by progression_group/progression_rank, and skandi_progression_state remembers which rank a
// user is currently training in each group so a fixed routine slot ("Front Lever Hold")
// always resolves to whatever variant they're actually working right now.
function progressionSiblings(group){
  return state.exercises.filter(e=>e.progression_group===group).sort((a,b)=>a.progression_rank-b.progression_rank);
}

// Resolves a template/session exercise into the user's current working variant for its
// progression group. Exercises with no progression_group (or with no saved state yet)
// resolve to themselves.
function currentProgressionExercise(exercise){
  if(!exercise?.progression_group) return exercise;
  const saved=state.progressionState.find(p=>p.progression_group===exercise.progression_group);
  if(!saved) return exercise;
  return state.exercises.find(e=>e.id===saved.exercise_id)||exercise;
}

async function saveProgressionState(group,exerciseId){
  const {error}=await sb.from('skandi_progression_state').upsert(
    {user_id:state.user.id,progression_group:group,exercise_id:exerciseId,updated_at:new Date().toISOString()},
    {onConflict:'user_id,progression_group'}
  );
  if(error) return; // best-effort — the session-local swap already happened either way
  const existing=state.progressionState.find(p=>p.progression_group===group);
  if(existing) existing.exercise_id=exerciseId;
  else state.progressionState.push({user_id:state.user.id,progression_group:group,exercise_id:exerciseId});
}

function previousCompletedSetsForExercise(exerciseId){
  // A progression exercise (front lever, planche, ...) matches sets logged against ANY
  // sibling in the same skill line, not just this exact variant — so hold-time history
  // carries forward across a level-up instead of resetting to blank every time the user
  // advances to a harder variant.
  const exercise=state.exercises.find(e=>e.id===exerciseId);
  const matchIds=exercise?.progression_group
    ?new Set(progressionSiblings(exercise.progression_group).map(e=>e.id))
    :new Set([exerciseId]);
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  for(const session of completed){
    const rows=state.sets.filter(s=>s.session_id===session.id&&matchIds.has(s.exercise_id));
    if(!rows.length) continue;
    const doneRows=rows.filter(s=>s.done).sort((a,b)=>a.set_idx-b.set_idx);
    if(doneRows.length) return doneRows;
    // Nobody tapped the check mark that session (easy to forget mid-workout), but the
    // numbers were still logged — that's still worth preloading over leaving it blank.
    const loggedRows=rows.filter(s=>s.weight_kg!=null||s.reps!=null||s.seconds!=null).sort((a,b)=>a.set_idx-b.set_idx);
    if(loggedRows.length) return loggedRows;
  }
  return [];
}

// Progression readiness: has the user hit this exact variant's progression_target CLEAN
// in each of the last two sessions where they trained it? Unlike previousCompletedSetsFor-
// Exercise, siblings aren't pooled here — readiness is about mastering the CURRENT rank,
// not the skill line's history overall. Sessions where this variant wasn't trained are
// skipped rather than breaking the streak; a session where it WAS trained but missed the
// target does break it, so this needs two CONSECUTIVE qualifying sessions, not just two ever.
function exerciseBestMark(exerciseId,sessionId){
  const ex=state.exercises.find(e=>e.id===exerciseId);
  if(!ex) return null;
  const seconds=ex.log_mode==='seconds';
  const sets=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===exerciseId&&s.done);
  // Only clean holds count toward a hold's standard — a broken-form hold that happened to
  // last long enough shouldn't push someone into a harder variant.
  const usable=seconds?sets.filter(s=>s.hold_clean===true):sets;
  if(!usable.length) return null;
  return Math.max(...usable.map(s=>seconds?(s.seconds||0):(s.reps||0)));
}

function progressionReadiness(exercise){
  if(!exercise?.progression_group||!exercise.progression_target) return false;
  const siblings=progressionSiblings(exercise.progression_group);
  if(siblings.findIndex(x=>x.id===exercise.id)===siblings.length-1) return false; // already the hardest rank
  const completed=state.sessions
    .filter(s=>s.user_id===state.user.id&&s.completed_at&&s.id!==state.active?.id)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  let qualifying=0;
  for(const session of completed){
    const mark=exerciseBestMark(exercise.id,session.id);
    if(mark==null) continue;
    if(mark<exercise.progression_target) return false;
    if(++qualifying>=2) return true;
  }
  return false;
}

// supabase-js resolves (rather than throws) on a fetch failure, surfacing it as
// error.message — "Load failed" on Safari/iOS, "Failed to fetch" on Chrome — for something
// as ordinary as a brief signal drop when starting a workout. One retry after a short pause
// clears most of those instead of dead-ending the member on a raw browser error string.
function isTransientFetchError(err){
  const msg=String(err&&err.message||'').toLowerCase();
  return msg.includes('load failed')||msg.includes('failed to fetch')||msg.includes('networkerror');
}
async function withNetworkRetry(fn){
  const first=await fn();
  if(first.error&&isTransientFetchError(first.error)){
    await new Promise(r=>setTimeout(r,900));
    return await fn();
  }
  return first;
}

async function startWorkout(templateId){
  if(startingWorkout) return; // guards a double-tap from creating two sessions before either
                               // await resolves and state.active gets set
  if(state.active){
    if(state.active.template_id===templateId){ openActiveWorkout(); return; }
    return alert(t('workout.busy'));
  }
  const tpl=state.templates.find(x=>x.id===templateId);
  const templateItems=state.items.filter(i=>i.template_id===templateId);
  // A routine can deliberately include more than one rung of the same progression ladder in one
  // day (e.g. Wall Handstand as a fixed technique slot before Freestanding Handstand as the main
  // set that actually progresses — see migration 060's Wednesday routine). Only the
  // highest-rank authored slot per progression_group tracks the user's saved progression state;
  // lower authored rungs stay exactly what they are regardless of how far the user has
  // progressed. A collision guard on top of that (authored ids + ids already assigned this
  // pass) covers any resolved variant that happens to match another slot's exercise, including
  // when it's not itself one of this routine's authored exercises. Both matter: resolving every
  // same-group slot (or resolving past a target another slot already owns) would collapse two
  // distinct exercises into the same exercise_id and violate the (session_id, exercise_id,
  // set_idx) uniqueness on skandi_sets at insert time.
  const highestRankByGroup=new Map();
  templateItems.forEach(i=>{
    const g=i.exercise?.progression_group;
    if(!g) return;
    const rank=i.exercise.progression_rank??0;
    if(!highestRankByGroup.has(g)||rank>highestRankByGroup.get(g)) highestRankByGroup.set(g,rank);
  });
  const authoredIds=new Set(templateItems.map(i=>i.exercise_id));
  const usedIds=new Set();
  const its=templateItems.slice().sort((a,b)=>a.sort_order-b.sort_order)
    .map(item=>{
      const g=item.exercise?.progression_group;
      const isHighestRankSlot=!g||item.exercise.progression_rank===highestRankByGroup.get(g);
      const resolved=isHighestRankSlot?currentProgressionExercise(item.exercise):item.exercise;
      const collides=resolved.id!==item.exercise_id&&(authoredIds.has(resolved.id)||usedIds.has(resolved.id));
      const finalExercise=collides?item.exercise:resolved;
      usedIds.add(finalExercise.id);
      return finalExercise.id===item.exercise_id?item:{...item,exercise:finalExercise,exercise_id:finalExercise.id};
    });
  if(!tpl||!its.length) return;
  startingWorkout=true;
  try{
    const {data:session,error}=await withNetworkRetry(()=>sb.from('skandi_sessions').insert({user_id:state.user.id,template_id:tpl.id,title:tpl.name}).select().single());
    if(error) return alert(isTransientFetchError(error)?t('workout.netHiccup'):error.message);
    const rows=its.flatMap(item=>{
      const previous=previousCompletedSetsForExercise(item.exercise_id);
      return Array.from({length:item.target_sets},(_,idx)=>{
        const prev=previous[idx]||previous[previous.length-1]||{};
        return {
          session_id:session.id,user_id:state.user.id,exercise_id:item.exercise_id,set_idx:idx+1,target_reps:item.target_reps,
          target_rest_sec:item.target_rest_sec,target_rir:item.target_rir??null,sort_order:item.sort_order,
          // rir starts from what was actually logged last time, same as weight/reps/seconds —
          // the routine's target_rir only kicks in the very first time this exercise (or its
          // progression line) has ever been trained, when there's no prior rir to carry.
          weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??item.target_rir??null
        };
      });
    });
    const {data:insertedSets,error:setsError}=await withNetworkRetry(()=>sb.from('skandi_sets').insert(rows).select());
    if(setsError){
      await sb.from('skandi_sessions').delete().eq('id',session.id);
      return alert(isTransientFetchError(setsError)?t('workout.netHiccup'):setsError.message);
    }
    state.active=session;
    state.sets=dedupeById([...state.sets,...(insertedSets||[])]);
    // Derived from state.sets (computeActiveItems is a pure local computation, no network
    // round-trip) rather than waiting on a fresh loadAll(). A flaky connection here used to
    // leave state.active set with an empty exercise list forever, since hydrateActiveWorkout
    // only (re)computes activeItems when state.active isn't already set.
    state.activeItems=computeActiveItems(session.id);
    state.elapsed=0;
    state.rest=0;
    state.restTotal=0;
    state.pausedMs=0;
    state.pausedAt=null;
    resumeWorkoutTimer();
    openActiveWorkout();
    loadAll().catch(()=>{}); // best-effort background refresh of the rest of state; the workout itself no longer depends on it
  } finally {
    startingWorkout=false;
  }
}

// An active workout's exercise list is derived from the session's own sets (each set
// carries its own target_reps/target_rest_sec/sort_order), not from skandi_template_items.
// That's what lets performSwap() below replace one exercise with another mid-workout
// without touching the shared template, and have it survive a page reload.
function computeActiveItems(sessionId){
  const bySlot=new Map();
  state.sets.filter(s=>s.session_id===sessionId).forEach(s=>{
    // A set keeps its original sort_order when it's moved to a different exercise mid-workout
    // (progression step, manual swap — see moveActiveSetsToExercise, which only ever touches
    // not-yet-done sets). Grouping by sort_order instead of exercise_id keeps that as ONE card
    // — otherwise the already-completed sets get stranded on an orphaned card under the old
    // exercise_id while the remaining sets render as a second, unrelated-looking exercise.
    const key=s.sort_order!=null?`so:${s.sort_order}`:`ex:${s.exercise_id}`;
    if(!bySlot.has(key)) bySlot.set(key,[]);
    bySlot.get(key).push(s);
  });
  return [...bySlot.values()].map(group=>{
    // Whichever exercise still has undone sets is the one actually being trained right now.
    // Completed sets from before a swap/step stay attributed to whatever they were actually
    // performed on — history isn't rewritten, only the card display is merged.
    const current=group.find(s=>!s.done)||group[0];
    const exercise_id=current.exercise_id;
    const withOrder=group.filter(s=>s.sort_order!=null);
    // Sessions predating migration 051, or whose template was later deleted (FK sets
    // template_id null), can have every set's sort_order null. Collapsing all of those to a
    // shared "0" scrambled the exercise order to whatever state.sets happened to be sorted by.
    // Push them after every exercise that DOES have a real sort_order instead, ordered among
    // themselves by when they were first logged.
    const sortOrder=withOrder.length
      ?Math.min(...withOrder.map(s=>s.sort_order))
      :1000+Math.min(...group.map(s=>new Date(s.created_at).getTime()));
    // Completed sets (from whichever exercise they were logged against) surface first, then
    // whatever's left to do — each half kept in its own set_idx order. A set's displayed row
    // number comes from its position here, not its raw set_idx, since a moved set's set_idx
    // restarts from 1 under its new exercise_id and would otherwise collide with a leftover
    // set_idx 1 still sitting on the old exercise_id.
    const sets=group.slice().sort((a,b)=>a.done===b.done?a.set_idx-b.set_idx:(a.done?-1:1));
    return {
      exercise_id,
      exercise:state.exercises.find(e=>e.id===exercise_id),
      target_sets:group.length,
      target_reps:current.target_reps||'8-12',
      target_rest_sec:current.target_rest_sec??90,
      target_rir:current.target_rir??null,
      sort_order:sortOrder,
      sets
    };
  }).filter(i=>i.exercise).sort((a,b)=>a.sort_order-b.sort_order);
}

let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// Boxing-bell "ding-ding" for when the rest countdown hits zero. Synthesized with Web
// Audio instead of a bundled file — this is a single-file no-build-step app, and a
// synthesized bell still works offline once the PWA shell is cached.
function strikeBell(ctx,startTime){
  const master=ctx.createGain();
  master.gain.value=0.5;
  master.connect(ctx.destination);
  // Inharmonic partials (not integer multiples of the fundamental) read as "metal bell"
  // rather than a pure tone.
  [660,990,1657,2211].forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    osc.type='sine';
    osc.frequency.value=freq;
    const gain=ctx.createGain();
    const peak=i===0?0.9:0.9/(i+1.6);
    gain.gain.setValueAtTime(0,startTime);
    gain.gain.linearRampToValueAtTime(peak,startTime+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0005,startTime+1.4-i*0.12);
    osc.connect(gain).connect(master);
    osc.start(startTime);
    osc.stop(startTime+1.5);
  });
  const bufferSize=Math.floor(ctx.sampleRate*0.05);
  const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const noise=ctx.createBufferSource();
  noise.buffer=buffer;
  const noiseFilter=ctx.createBiquadFilter();
  noiseFilter.type='highpass';
  noiseFilter.frequency.value=1500;
  const noiseGain=ctx.createGain();
  noiseGain.gain.value=0.4;
  noise.connect(noiseFilter).connect(noiseGain).connect(master);
  noise.start(startTime);
}
function playRestBell(){
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    strikeBell(ctx,now);
    strikeBell(ctx,now+0.22);
  }catch(e){ /* Web Audio unsupported/blocked — the visual "Rest 0:00" is still there */ }
}

// iOS Safari's autoplay unlock is stricter than ctx.state === 'running': resume() on a
// context that was first created outside a real gesture can flip the state flag to
// 'running' while the hardware output stays silent. The reliable unlock is to actually
// start an audio node — even an inaudible one — synchronously inside the gesture handler.
function unlockAudioCtx(){
  try{
    const ctx=getAudioCtx();
    const buffer=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buffer;
    src.connect(ctx.destination);
    src.start(0);
  }catch(e){}
}

function resumeWorkoutTimer(){
  clearInterval(state.timer);
  if(state.pausedAt){ state.pausedMs+=Date.now()-state.pausedAt; state.pausedAt=null; }
  // started_at (a real timestamp) minus accumulated pause time, not a per-tick counter: a
  // throttled setInterval — screen locked during a long rest, tab backgrounded — used to
  // silently undercount elapsed++ ticks, so the total shown at the end of the workout could
  // be far lower than the real time spent. Recomputing from wall-clock time on every tick
  // self-corrects even after the interval was stalled for minutes.
  const startedAtMs=state.active?new Date(state.active.started_at).getTime():Date.now()-state.elapsed*1000;
  state.timer=setInterval(()=>{
    state.elapsed=Math.max(0,Math.floor((Date.now()-startedAtMs-state.pausedMs)/1000));
    if(state.rest>0){
      state.rest--;
      if(state.rest===0) playRestBell();
    }
    updateWorkoutClocks();
  },1000);
}

function pauseWorkoutTimer(){
  clearInterval(state.timer);
  state.timer=null;
  if(!state.pausedAt) state.pausedAt=Date.now();
}

function restProgressPct(){
  if(!state.restTotal) return 0;
  return Math.max(0,Math.min(100,(state.rest/state.restTotal)*100));
}

function updateWorkoutClocks(){
  const stopwatch=$('activeStopwatch');
  const stopwatchHint=$('activeStopwatchHint');
  const rest=$('activeRest');
  const progress=$('restProgress');
  const floatStopwatch=$('floatStopwatch');
  const floatRestBadge=$('floatRestBadge');
  if(stopwatch) stopwatch.textContent=fmtWorkoutTime(state.elapsed);
  if(stopwatchHint) stopwatchHint.textContent=workoutTimeHint(state.elapsed);
  if(rest) rest.textContent=fmtSec(state.rest);
  if(progress) progress.style.width=`${restProgressPct()}%`;
  if(floatStopwatch) floatStopwatch.textContent=fmtWorkoutTime(state.elapsed);
  if(floatRestBadge){
    floatRestBadge.textContent=fmtSec(state.rest);
    floatRestBadge.classList.toggle('resting',state.rest>0);
  }
}

// Collapsed pill vs. expanded controls for the floating workout timer (see .float-timer CSS) —
// kept open/closed across re-renders via state so adjusting rest doesn't snap it shut.
function toggleFloatTimer(){
  state.floatTimerOpen=!state.floatTimerOpen;
  renderActiveWorkout();
}

function toggleWorkoutTimer(){
  if(state.timer) pauseWorkoutTimer(); else resumeWorkoutTimer();
  renderActiveWorkout();
}

function setRest(seconds){
  state.rest=seconds;
  state.restTotal=seconds;
  renderActiveWorkout();
}

function adjustRest(delta){
  const next=Math.max(0,state.rest+delta);
  state.rest=next;
  state.restTotal=next>0?Math.max(next,state.restTotal+delta):0;
  if(state.restTotal<state.rest) state.restTotal=state.rest;
  renderActiveWorkout();
}

function confirmFinishWorkout(){
  if(!state.active) return;
  if(!confirm(t('workout.confirmFinish'))) return;
  openReport();
}

function openActiveWorkout(){
  $('modal').classList.add('show');
  renderActiveWorkout();
}

function renderActiveWorkout(){
  if(!state.active) return;
  const allSets=state.sets.filter(s=>s.session_id===state.active.id);
  const done=allSets.filter(s=>s.done).length;
  const running=!!state.timer;
  const blockInfo=trainingBlockWeekInfo();
  const blockLabel=blockInfo&&!blockInfo.ended
    ?t('workout.blockLabel',{week:blockInfo.week,total:blockInfo.totalWeeks})+(blockInfo.deload?t('workout.deloadSuffix'):'')
    :t('workout.todayLabel');
  const card=$('modalCard');
  // Checking off a set, editing weight/reps/time, adding/removing a set — all of these
  // re-render this whole card via one big innerHTML replace, which silently resets its
  // scrollTop to 0. Scrolled halfway down a long exercise list and tap a checkmark, and the
  // page appears to violently "jump" back to the top. Snapshot/restore scrollTop around the
  // replace so the member's place in the list survives every one of those re-renders.
  const scrollTop=card.scrollTop;
  card.innerHTML=`
    <div class="float-timer ${state.floatTimerOpen?'open':''}">
      <button type="button" class="float-timer-chip" onclick="toggleFloatTimer()" aria-label="${esc(state.floatTimerOpen?t('workout.collapseTimer'):t('workout.expandTimer'))}" aria-expanded="${state.floatTimerOpen}" title="${esc(state.floatTimerOpen?t('workout.collapseTimer'):t('workout.expandTimer'))}">

        <span class="float-timer-chevron">${icon('chevronRight',14)}</span>
      </button>
      ${state.floatTimerOpen?`
      <div class="float-timer-panel">
        <div class="row-head">
          <div>
            <span class="timer-label">${esc(t('workout.elapsed'))}</span>
            <strong class="elapsed-big" id="activeStopwatch">${fmtWorkoutTime(state.elapsed)}</strong>
            <em class="elapsed-hint" id="activeStopwatchHint">${esc(workoutTimeHint(state.elapsed))}</em>
          </div>
          <button class="timer-toggle" onclick="toggleWorkoutTimer()" aria-label="${esc(running?t('workout.pauseTimer'):t('workout.resumeTimer'))}" title="${esc(running?t('workout.pauseTimer'):t('workout.resumeTimer'))}">${running?icon('pause',18):icon('play',18)}</button>
        </div>
        <div class="rest-row">
          <button class="timer-step" onclick="adjustRest(-30)" aria-label="${esc(t('workout.minus30'))}">-30s</button>
          <div class="timer-rest">
            <span>${esc(t('workout.rest'))}</span>
            <strong id="activeRest">${fmtSec(state.rest)}</strong>
          </div>
          <button class="timer-step" onclick="adjustRest(30)" aria-label="${esc(t('workout.plus30'))}">+30s</button>
        </div>
        <div class="rest-progress" aria-label="${esc(t('workout.restProgress'))}"><i id="restProgress" style="width:${restProgressPct()}%"></i></div>
        <div class="unit-toggle" aria-label="${esc(t('workout.defaultUnit'))}">
          <button class="${state.weightUnit==='kg'?'active':''}" onclick="setWeightUnit('kg')">KG</button>
          <button class="${state.weightUnit==='lb'?'active':''}" onclick="setWeightUnit('lb')">LB</button>
        </div>
      </div>`:''}
    </div>
    <div class="workout-bar">
      <div class="workout-bar-title">
        <div><small>${esc(blockLabel)}</small><h1>${esc(state.active.title)}</h1></div>
        <button class="x" onclick="closeModal()" aria-label="${esc(t('workout.minimize'))}" title="${esc(t('workout.minimize'))}">${icon('minimize',22)}</button>
      </div>
    </div>
    <div class="workout-content">
      <div class="workout-section-head">
        <h2>${esc(t('workout.exercises'))}</h2>
        <div class="workout-progress-row">
          <span class="progress-pill"><strong>${done}</strong><small>${esc(t('workout.slashSets',{n:allSets.length}))}</small></span>
        </div>
      </div>
      ${state.activeItems.map(item=>activeExercise(item,item.sets)).join('')}
      <button class="btn small ghost" style="width:100%;margin-top:4px" onclick="toggleAddExercise()">${icon('plus',16)} ${esc(t('workout.addExercise'))}</button>
      <div id="addExPanel">${addExercisePanelHtml()}</div>
      <div class="workout-footer">
        <button class="btn danger-action" onclick="cancelWorkout()">${icon('close',15)} ${esc(t('common.cancel'))}</button>

// Progression exercises (front lever, back lever, planche, handstand) get a quick
// easier/harder stepper instead of having to open the full swap search every session.
// Stepping persists the new variant via saveProgressionState so next week's workout
// starts on it automatically (see startWorkout's currentProgressionExercise resolve).
function progressionStepperHtml(e,exerciseId){
  if(!e?.progression_group) return '';
  const siblings=progressionSiblings(e.progression_group);
  const idx=siblings.findIndex(x=>x.id===e.id);
  if(idx<0) return '';
  const prev=siblings[idx-1],next=siblings[idx+1];
  const prevBtn=prev?`<button class="btn small ghost" onclick="event.stopPropagation();stepProgression('${exerciseId}','${prev.id}')" aria-label="${esc(t('prog.easier'))}" title="${esc(t('prog.easierName',{name:prev.name}))}">◀</button>`
    :`<button class="btn small ghost" disabled aria-label="${esc(t('prog.easiest'))}">◀</button>`;
  const nextBtn=next?`<button class="btn small ghost" onclick="event.stopPropagation();stepProgression('${exerciseId}','${next.id}')" aria-label="${esc(t('prog.harder'))}" title="${esc(t('prog.harderName',{name:next.name}))}">▶</button>`
    :`<button class="btn small ghost" disabled aria-label="${esc(t('prog.hardest'))}">▶</button>`;
  return `<div class="row" style="margin-top:6px" onclick="event.stopPropagation()">${prevBtn}<small class="muted">${esc(t('prog.step',{i:idx+1,n:siblings.length}))}</small>${nextBtn}</div>`;
}

// Surfaced once progressionReadiness() confirms two consecutive clean sessions at target —
// tapping it is exactly the same step the ▶ button above already performs.
function progressionReadinessHtml(e,exerciseId){
  if(!progressionReadiness(e)) return '';
  const siblings=progressionSiblings(e.progression_group);
  const next=siblings[siblings.findIndex(x=>x.id===e.id)+1];
  if(!next) return '';
  return `<button type="button" class="progression-ready" onclick="event.stopPropagation();stepProgression('${exerciseId}','${next.id}')">${esc(t('prog.readyFor',{name:next.name}))}</button>`;
}

function activeExercise(item,sets){
  const e=item.exercise;
  const undone=sets.filter(s=>!s.done).length;
  const seconds=e.log_mode==='seconds';
  const showWeight=e.log_weight!==false; // pure plyometric/balance drills (migration 061) skip the weight field entirely
  const unit=exerciseWeightUnit(item.exercise_id);
  // Every set row gets one extra column beyond weight/reps-or-seconds: RIR for rep-based work
  // (the plan's progression rules are RIR 1-2 on compounds) or a clean/broken toggle for
  // seconds-based skill holds (front lever, handstand, planche — judged on position, not load).
  const rowClass=showWeight?'set-row':'set-row no-weight';
  return `<article class="exercise">
    <div class="ex-head" onclick="openExercise('${e.id}',true)">${mediaThumb(e)}<div><h3>${esc(e.name)} <span class="ex-info-hint">${icon('chevronRight',13)}</span></h3><p>${[esc(exerciseSubtitle(e)),`${item.target_sets} x ${esc(item.target_reps)}`,esc(t('ex.restSec',{n:item.target_rest_sec}))].filter(Boolean).join(' · ')}</p>${progressionStepperHtml(e,item.exercise_id)}${progressionReadinessHtml(e,item.exercise_id)}</div>
      <div class="ex-actions">
        <span class="muted">${sets.filter(s=>s.done).length}/${sets.length}${seconds&&sets.some(s=>s.done)?' · '+esc(t('ex.cleanCount',{done:sets.filter(s=>s.done&&s.hold_clean===true).length,total:sets.filter(s=>s.done).length})):''}</span>
        <div class="ex-actions-row">
          ${undone?`<button class="icon-btn tiny" onclick="event.stopPropagation();toggleSwap('${item.exercise_id}')" aria-label="${esc(t('ex.swap'))}" title="${esc(t('ex.swap'))}">${icon('swap',14)}</button>`:''}
          <button class="icon-btn tiny danger" onclick="event.stopPropagation();removeExerciseFromSession('${item.exercise_id}')" aria-label="${esc(t('ex.removeFromSession'))}" title="${esc(t('ex.removeShort'))}">${icon('trash',14)}</button>
        </div>
      </div>
    </div>
    <div id="swapPanel-${item.exercise_id}">${swapPanelHtml(item.exercise_id)}</div>
    <div class="stack">
      <div class="${rowClass}">
        <span></span>
        ${showWeight?`<button type="button" class="pill dark" style="cursor:pointer;justify-self:start" onclick="event.stopPropagation();setExerciseWeightUnit('${item.exercise_id}','${unit==='kg'?'lb':'kg'}')" aria-label="${esc(unit==='kg'?t('ex.switchToLb'):t('ex.switchToKg'))}" title="${esc(unit==='kg'?t('ex.switchToLb'):t('ex.switchToKg'))}">${unit.toUpperCase()}</button>`:''}
        <small class="muted">${esc(seconds?t('ex.colSec'):t('ex.colReps'))}</small><small class="muted" style="font-size:10px">${esc(seconds?t('ex.colClean'):t('ex.colRir'))}</small><span></span><span></span>
      </div>
      ${sets.map((s,i)=>{
        // A row's own exercise can differ from the card's current one (item.exercise) right
        // after a mid-exercise swap/progression-step — completed sets stay attributed to
        // whatever they were actually logged against (see computeActiveItems), so each row
        // reads its own log_mode/log_weight/unit instead of inheriting the header's. Row
        // number is this set's position in the card, not its raw set_idx: a moved set's
        // set_idx restarts at 1 under its new exercise_id and would otherwise collide with a
        // leftover set_idx 1 still sitting on the old exercise_id.
        const rowEx=s.exercise_id===item.exercise_id?e:(state.exercises.find(x=>x.id===s.exercise_id)||e);
        const rowSeconds=rowEx.log_mode==='seconds';
        const rowShowWeight=rowEx.log_weight!==false;
        const rowUnit=exerciseWeightUnit(s.exercise_id);
        const rc=rowShowWeight?'set-row':'set-row no-weight';
        const cleanLabel=s.hold_clean===true?t('ex.holdClean'):s.hold_clean===false?t('ex.holdBroken'):t('ex.holdUnset');
        return `<div class="${rc}">
        <strong>${i+1}</strong>
        ${rowShowWeight?`<input class="field" inputmode="decimal" value="${fmtWeightInput(s.weight_kg,rowUnit)}" placeholder="${rowUnit}" onchange="updateSet('${s.id}','weight_kg',this.value)">`:''}
        ${rowSeconds
          ?`<input class="field" inputmode="numeric" value="${s.seconds??''}" placeholder="${esc(s.target_reps||t('ex.secPh'))}" onchange="updateSet('${s.id}','seconds',this.value)">`
          :`<input class="field" inputmode="numeric" value="${s.reps??''}" placeholder="${esc(s.target_reps||t('common.reps'))}" onchange="updateSet('${s.id}','reps',this.value)">`}
        ${rowSeconds
          ?`<button type="button" class="clean-toggle ${s.hold_clean===true?'clean':s.hold_clean===false?'broken':''}" onclick="event.stopPropagation();toggleHoldClean('${s.id}')" aria-label="${esc(t('ex.holdQuality',{v:cleanLabel}))}" title="${esc(cleanLabel)}">${s.hold_clean===true?'✓':s.hold_clean===false?'✕':'–'}</button>`
          :`<input class="field field-narrow" inputmode="numeric" value="${s.rir??''}" onchange="updateSet('${s.id}','rir',this.value)">`}
        <button class="check ${s.done?'done':''}" onclick="toggleSet('${s.id}',${item.target_rest_sec})">${icon('check',18)}</button>
        <button class="set-remove" onclick="removeSet('${s.id}')" aria-label="${esc(t('ex.removeSet'))}">${icon('close',11)}</button>
      </div>`;}).join('')}
    </div>
    <button class="add-set-link" onclick="addSet('${item.exercise_id}')">${esc(t('ex.addSet'))}</button>
  </article>`;
}

// Swapping only ever touches this exercise's not-yet-done sets in the current session
// (skandi_sets.exercise_id), never skandi_template_items — the weekly routine is
// untouched, this session just plays out with a substitute for whatever's left.
function toggleSwap(exerciseId){
  state.swapTarget=state.swapTarget===exerciseId?null:exerciseId;
  state.swapQuery='';
  renderActiveWorkout();
}

function swapPanelHtml(exerciseId){
  if(state.swapTarget!==exerciseId) return '';
  return `<div class="stack" style="margin:8px 0;padding:10px;border:1px solid var(--border,#e5e5e5);border-radius:10px" onclick="event.stopPropagation()">
    <input id="swapQuery-${exerciseId}" class="field left" placeholder="${esc(t('ex.replaceWith'))}" value="${esc(state.swapQuery)}" oninput="renderSwapList('${exerciseId}')" autofocus>
    <div id="swapList-${exerciseId}" class="stack">${swapListHtml(exerciseId)}</div>
  </div>`;
}

function swapListHtml(exerciseId){
  const q=state.swapQuery.trim().toLowerCase();
  let list=state.exercises.filter(e=>e.id!==exerciseId&&(!q||`${e.name} ${e.english_name||''}`.toLowerCase().includes(q)));
  // With no search typed yet, surface same-family progressions first (e.g. swapping out of
  // Front Lever Tuck leads with the other front lever variants) instead of a flat A-Z list.
  const group=!q&&state.exercises.find(e=>e.id===exerciseId)?.progression_group;
  if(group){
    list=list.slice().sort((a,b)=>{
      const aIn=a.progression_group===group,bIn=b.progression_group===group;
      if(aIn&&bIn) return a.progression_rank-b.progression_rank;
      if(aIn!==bIn) return aIn?-1:1;
      return a.name.localeCompare(b.name);
    });
  }
  list=list.slice(0,20);
  if(!list.length) return `<p class="muted">${esc(t('common.noMatches'))}</p>`;
  return list.map(e=>`<button type="button" class="btn small ghost" style="width:100%;text-align:left" onclick="performSwap('${exerciseId}','${e.id}')">${esc(e.name)}${exerciseSubtitle(e)?` <small class="muted">${esc(exerciseSubtitle(e))}</small>`:''}</button>`).join('');
}

function renderSwapList(exerciseId){
  state.swapQuery=$(`swapQuery-${exerciseId}`)?.value||'';
  const list=$(`swapList-${exerciseId}`);
  if(list) list.innerHTML=swapListHtml(exerciseId);
}

// Shared by the full swap search and the quick progression stepper (◀ ▶): moves this
// session's not-yet-done sets from one exercise to another, preloading from that exercise's
// own history. If the new exercise belongs to a progression line, this also remembers it as
// the user's current variant for that line (saveProgressionState) so future sessions default
// to it — that's what lets leveling up from Front Lever Tuck to Advanced Tuck stick without
// ever touching the shared routine. Returns true if sets were actually moved.
async function moveActiveSetsToExercise(oldExerciseId,newExerciseId){
  if(!state.active||oldExerciseId===newExerciseId) return false;
  const sessionId=state.active.id;
  const moving=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===oldExerciseId&&!s.done);
  if(!moving.length) return false;
  // set_idx is unique per (session_id, exercise_id): if newExerciseId already has sets in this
  // session (e.g. two separate swaps landing on the same replacement), reassigning straight
  // across would collide. Continue numbering after whatever's already there instead.
  const existingForNew=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===newExerciseId);
  let nextIdx=(existingForNew.length?Math.max(...existingForNew.map(s=>s.set_idx)):0)+1;
  const previous=previousCompletedSetsForExercise(newExerciseId);
  let idx=0;
  for(const s of moving){
    const prev=previous[idx]||previous[previous.length-1]||{};
    const patch={exercise_id:newExerciseId,set_idx:nextIdx,target_rir:prev.target_rir??null,weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??prev.target_rir??null,updated_at:new Date().toISOString()};
    const {error}=await sb.from('skandi_sets').update(patch).eq('id',s.id);
    if(error){ alert(error.message); return false; }
    Object.assign(s,patch);
    nextIdx++;
    idx++;
  }
  state.activeItems=computeActiveItems(sessionId);
  const newExercise=state.exercises.find(e=>e.id===newExerciseId);
  if(newExercise?.progression_group) await saveProgressionState(newExercise.progression_group,newExerciseId);
  return true;
}

async function performSwap(oldExerciseId,newExerciseId){
  if(!state.active||oldExerciseId===newExerciseId){ toggleSwap(oldExerciseId); return; }
  const moved=await moveActiveSetsToExercise(oldExerciseId,newExerciseId);
  if(moved){ state.swapTarget=null; state.swapQuery=''; }
  renderActiveWorkout();
}

async function stepProgression(oldExerciseId,newExerciseId){
  if(!newExerciseId) return;
  await moveActiveSetsToExercise(oldExerciseId,newExerciseId);
  renderActiveWorkout();
}

// Adding/removing an exercise here only ever touches this session's skandi_sets rows,
// same as performSwap above — skandi_template_items (the weekly routine) is never touched.
function toggleAddExercise(){
  state.addExOpen=!state.addExOpen;
  state.addExQuery='';
  renderActiveWorkout();
}

function addExercisePanelHtml(){
  if(!state.addExOpen) return '';
  return `<div class="stack" style="margin:8px 0;padding:10px;border:1px solid var(--border,#e5e5e5);border-radius:10px">
    <input id="addExQuery" class="field left" placeholder="${esc(t('common.searchExercise'))}" value="${esc(state.addExQuery)}" oninput="renderAddExerciseList()" autofocus>
    <div id="addExList" class="stack">${addExerciseListHtml()}</div>
  </div>`;
}

function addExerciseListHtml(){
  const q=state.addExQuery.trim().toLowerCase();
  const already=new Set(state.activeItems.map(i=>i.exercise_id));
  const list=state.exercises.filter(e=>!already.has(e.id)&&(!q||`${e.name} ${e.english_name||''}`.toLowerCase().includes(q))).slice(0,20);
  if(!list.length) return `<p class="muted">${esc(t('common.noMatches'))}</p>`;
  return list.map(e=>`<button type="button" class="btn small ghost" style="width:100%;text-align:left" onclick="addExerciseToSession('${e.id}')">${esc(e.name)}${exerciseSubtitle(e)?` <small class="muted">${esc(exerciseSubtitle(e))}</small>`:''}</button>`).join('');
}

function renderAddExerciseList(){
  state.addExQuery=$('addExQuery')?.value||'';
  const list=$('addExList');
  if(list) list.innerHTML=addExerciseListHtml();
}

async function addExerciseToSession(exerciseId){
  if(!state.active) return;
  const sessionId=state.active.id;
  const sortOrder=state.activeItems.length?Math.max(...state.activeItems.map(i=>i.sort_order))+1:1;
  const previous=previousCompletedSetsForExercise(exerciseId);
  const targetSets=previous.length||3;
  const rows=Array.from({length:targetSets},(_,idx)=>{
    const prev=previous[idx]||previous[previous.length-1]||{};
    return {
      session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:idx+1,
      target_reps:prev.target_reps||'8-12',target_rest_sec:prev.target_rest_sec??90,target_rir:prev.target_rir??null,sort_order:sortOrder,
      weight_kg:deloadAdjustedWeight(prev.weight_kg??null),reps:prev.reps??null,seconds:prev.seconds??null,rir:prev.rir??prev.target_rir??null
    };
  });
  const {data,error}=await sb.from('skandi_sets').insert(rows).select();
  if(error) return alert(error.message);
  state.sets.push(...(data||[]));
  state.activeItems=computeActiveItems(sessionId);
  state.addExOpen=false;
  state.addExQuery='';
  renderActiveWorkout();
}

async function removeExerciseFromSession(exerciseId){
  if(!state.active) return;
  const sessionId=state.active.id;
  const item=state.activeItems.find(i=>i.exercise_id===exerciseId);
  if(!item) return;
  if(!confirm(t('ex.confirmRemove',{name:item.exercise?.name||t('ex.thisExercise')}))) return;
  // Delete by id, not by exercise_id: after a mid-exercise swap/progression-step this card can
  // hold sets logged against more than one exercise_id (see computeActiveItems) — filtering by
  // the current exercise_id alone would leave the older exercise's completed sets behind.
  const ids=item.sets.map(s=>s.id);
  const {error}=await sb.from('skandi_sets').delete().in('id',ids);
  if(error) return alert(error.message);
  state.sets=state.sets.filter(s=>!ids.includes(s.id));
  state.activeItems=computeActiveItems(sessionId);
  renderActiveWorkout();
}

async function updateSet(id,key,value){
  const patch={updated_at:new Date().toISOString()};
  const existing=state.sets.find(x=>x.id===id);
  const parsed=value===''?null:(key==='weight_kg'?displayToKg(value,exerciseWeightUnit(existing?.exercise_id)):Number(value));
  if(parsed!==null&&!Number.isFinite(parsed)) return alert(t('ex.errNumber'));
  // Matches the DB check constraints on skandi_sets (migrations 040/053/064) — catch it here
  // instead of round-tripping to a raw Postgres error.
  if(key==='weight_kg'&&parsed!==null&&(parsed<0||parsed>500)) return alert(t('ex.errWeight'));
  if(key==='seconds'&&parsed!==null&&(parsed<0||parsed>7200)) return alert(t('ex.errSeconds'));
  if(key==='rir'&&parsed!==null&&(parsed<0||parsed>10)) return alert(t('ex.errRir'));
  patch[key]=parsed===null?null:(key==='weight_kg'?Math.round(parsed*100)/100:Math.round(parsed));
  const {error}=await sb.from('skandi_sets').update(patch).eq('id',id);
  if(error) return alert(error.message);
  const s=state.sets.find(x=>x.id===id);
  if(s) Object.assign(s,patch);
  if(s&&s.set_idx===1&&patch[key]!=null&&(key==='weight_kg'||key==='reps'||key==='seconds'||key==='rir')){
    const targets=state.sets.filter(x=>x.session_id===s.session_id&&x.exercise_id===s.exercise_id&&x.id!==s.id&&!x.done&&(x[key]==null||x[key]===''));
    if(targets.length){
      const ids=targets.map(x=>x.id);
      const {error:fillError}=await sb.from('skandi_sets').update({[key]:patch[key],updated_at:new Date().toISOString()}).in('id',ids);
      if(!fillError) targets.forEach(x=>{ x[key]=patch[key]; });
      renderActiveWorkout();
    }
  }
}

// Cycles a hold's quality tag: unset -> clean -> broken -> unset. Three states because
// "unset" (never tapped) has to stay distinguishable from "explicitly broken" — collapsing
// them into a plain checkbox would make every untagged historical hold look intentionally bad.
async function toggleHoldClean(id){
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  const next=s.hold_clean===true?false:s.hold_clean===false?null:true;
  const {error}=await sb.from('skandi_sets').update({hold_clean:next,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alert(error.message);
  s.hold_clean=next;
  renderActiveWorkout();
}

async function toggleSet(id,rest){
  const s=state.sets.find(x=>x.id===id);
  if(!s) return;
  // Checking off a set is what actually starts the rest countdown whose end the bell needs to
  // mark — and it's a real synchronous tap, unlike the resumeWorkoutTimer() call in
  // startWorkout() (several `await`s removed from the original tap by the time it runs) or in
  // hydrateActiveWorkout() (no tap at all, page just loaded on an already-running workout).
  // On iOS Safari a plain resume() isn't enough if the context's first resume attempt ever
  // happened outside a gesture (both call sites above do exactly that) — the state flag can
  // read 'running' while the speaker stays silent for the whole session. unlockAudioCtx()
  // starts a real (inaudible) node here, synchronously and before any `await`, on the one
  // call site that's guaranteed to be a genuine tap.
  unlockAudioCtx();
  const done=!s.done;
  const {error}=await sb.from('skandi_sets').update({done,updated_at:new Date().toISOString()}).eq('id',id);
  if(error) return alert(error.message);
  s.done=done;
  state.rest=done?rest:0;
  state.restTotal=done?rest:0;
  renderActiveWorkout();
}

async function addSet(exerciseId){
  if(!state.active) return;
  const sessionId=state.active.id;
  const existing=state.sets.filter(s=>s.session_id===sessionId&&s.exercise_id===exerciseId);
  const nextIdx=(existing.length?Math.max(...existing.map(s=>s.set_idx)):0)+1;
  const seed=existing.find(s=>s.set_idx===1)||{};
  // Look target_reps/rest/sort up server-side-derived state rather than taking it as a caller
  // argument — target_reps is free text a user can set when building a routine, and passing it
  // through an inline onclick('...') string argument is an XSS vector (HTML-escaping a value
  // that lands inside a JS string literal in an attribute does not neutralize it).
  const item=state.activeItems.find(i=>i.exercise_id===exerciseId);
  const {data,error}=await sb.from('skandi_sets').insert({
    session_id:sessionId,user_id:state.user.id,exercise_id:exerciseId,set_idx:nextIdx,
    target_reps:seed.target_reps||item?.target_reps||'8-12',
    target_rest_sec:seed.target_rest_sec??item?.target_rest_sec??null,
    target_rir:seed.target_rir??item?.target_rir??null,
    sort_order:seed.sort_order??item?.sort_order??null,
    weight_kg:seed.weight_kg??null,reps:seed.reps??null,seconds:seed.seconds??null,rir:seed.rir??item?.target_rir??null
  }).select().single();
  if(error) return alert(error.message);
  state.sets.push(data);
  renderActiveWorkout();
}

async function removeSet(id){
  const {error}=await sb.from('skandi_sets').delete().eq('id',id);
  if(error) return alert(error.message);
  state.sets=state.sets.filter(s=>s.id!==id);
  renderActiveWorkout();
}

async function cancelWorkout(){
  if(!state.active) return;
  if(!confirm(t('workout.confirmCancel'))) return;
  const sessionId=state.active.id;
  const cancelledSession=state.active;
  const cancelledElapsed=state.elapsed;
  pauseWorkoutTimer();
  ignoreSessionLocally(sessionId);
  state.active=null;
  state.activeItems=[];
  state.sessions=state.sessions.filter(s=>s.id!==sessionId);
  state.sets=state.sets.filter(s=>s.session_id!==sessionId);
  state.elapsed=0;
  state.rest=0;
  state.restTotal=0;
  closeModal();
  render();
  const {data,error}=await sb.from('skandi_sessions').delete().eq('id',sessionId).eq('user_id',state.user.id).select('id');
  if(error||!data?.length){
    await sb.from('skandi_sessions').update({
      completed_at:new Date().toISOString(),

      visibility:'private',
      report_note:'Cancelled locally'
    }).eq('id',sessionId).eq('user_id',state.user.id);
  }
  await loadAll();
  render();
}

async function finishWorkout(){
  const sleepRaw=$('sleepHours').value.trim();
  const sleepHours=sleepRaw===''?null:Number(sleepRaw);
  if(sleepHours!==null&&(!Number.isFinite(sleepHours)||sleepHours<0||sleepHours>24)) return alert(t('report.errSleep'));
  const minutes=Number($('repDuration').value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>600) return alert(t('sedit.errDuration'));
  const durationSec=Math.round(minutes*60);
  // A workout nobody remembered to finish gets closed out hours later, so "now" is the wrong
  // completion time: once the duration is corrected, the session ended when it ended
  // (started_at + duration). Capped at now so a padded duration can't land in the future.
  const completedAt=new Date(Math.min(Date.now(),new Date(state.active.started_at).getTime()+durationSec*1000));
  const patch={
    completed_at:completedAt.toISOString(),
    duration_sec:durationSec,
    report_difficulty:$('difficulty').value,
    report_energy:Number($('energy').value),
    report_sleep_hours:sleepHours===null?null:Math.round(sleepHours*10)/10,
    report_felt_worse:$('feltWorse').checked,
    report_soreness:$('sore').checked,
    report_soreness_area:$('soreArea').value.trim()||null,
    report_note:$('note').value.trim()||null,
    visibility:$('shareCrew').checked?'crew':'private'
  };
  const {error}=await sb.from('skandi_sessions').update(patch).eq('id',state.active.id);
  if(error) return alert(error.message);
  pauseWorkoutTimer();
  state.active=null;
  state.activeItems=[];
  closeModal();
  await loadAll();
  setView('crew');
}

// For a progression exercise (front lever, back lever, planche, handstand), pulls the user's
// own completed sessions and shows, per session, which variant of the line they trained and
// their best mark that day (hold seconds or reps, plus load if any) — the trend a fixed
// routine slot can't show on its own since the exercise trained keeps changing underneath it.
// Tiny inline trend line (the "evolución últimos N registros" pattern) for a progression
// line's best mark per session, oldest to newest left-to-right.
function sparklineSvg(values){
  if(values.length<2) return '';
  const w=240,h=36,pad=4;
  const min=Math.min(...values),max=Math.max(...values);
  const span=max-min||1;
  const pts=values.map((v,i)=>{
    const x=pad+(i/(values.length-1))*(w-pad*2);
    const y=h-pad-((v-min)/span)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const [lastX,lastY]=pts[pts.length-1].split(',');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;margin-top:6px">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="3" fill="var(--blue)"/>
  </svg>`;
}

function progressionHistoryHtml(exercise){
  if(!exercise?.progression_group) return '';
  const ids=new Set(progressionSiblings(exercise.progression_group).map(e=>e.id));
  const sessions=state.sessions.filter(s=>s.user_id===state.user.id&&s.completed_at)
    .sort((a,b)=>new Date(b.completed_at).getTime()-new Date(a.completed_at).getTime());
  const rows=[];
  for(const session of sessions){
    const byExercise=new Map();
    state.sets.filter(s=>s.session_id===session.id&&ids.has(s.exercise_id)&&(s.seconds!=null||s.reps!=null))
      .forEach(s=>{ if(!byExercise.has(s.exercise_id)) byExercise.set(s.exercise_id,[]); byExercise.get(s.exercise_id).push(s); });
    for(const [exId,exSets] of byExercise){
      const ex=state.exercises.find(x=>x.id===exId);
      if(!ex) continue;
      const best=ex.log_mode==='seconds'
        ?Math.max(...exSets.map(s=>s.seconds||0))
        :Math.max(...exSets.map(s=>s.reps||0));
      const weight=exSets.find(s=>s.weight_kg)?.weight_kg;
      rows.push({date:session.completed_at,name:ex.name,best,mode:ex.log_mode,weight});
    }
    if(rows.length>=12) break;
  }
  if(!rows.length) return '';
  const shown=rows.slice(0,12);
  // rows is newest-first (for the list below); the trend line reads left-to-right oldest-first.
  const trend=sparklineSvg(shown.slice().reverse().map(r=>r.best));
  return `<section class="card"><div class="eyebrow">${esc(t('prog.history'))}</div>
    ${trend?`<div>${trend}<p class="muted" style="margin-top:2px">${esc(t('prog.trend',{n:shown.length}))}</p></div>`:''}
    ${shown.map(r=>`
    <div class="row" style="margin-top:8px">
      <div><strong>${esc(r.name)}</strong><p class="muted">${new Date(r.date).toLocaleDateString(LANG)}</p></div>
      <span>${r.mode==='seconds'?fmtSec(r.best):esc(r.best+' '+t('common.reps'))}${r.weight?` · +${fmtWeightInput(r.weight)}${state.weightUnit}`:''}</span>
    </div>`).join('')}</section>`;
}

  // to find them again.
  const list=state.exercises.filter(e=>{
    if(builderState.group==='Selected') return builderState.selected.has(e.id);
    if(builderState.group!=='All'&&muscleGroupOf(e)!==builderState.group) return false;
    if(q&&!`${e.name} ${e.english_name||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
  // Keys stay English (they drive the muscleGroupOf filter); only the button label is translated.
  const filters=[['All',t('tpl.filterAll')],['Selected',t('tpl.filterSelected',{n:builderState.selected.size})],
    ...MUSCLE_GROUP_ORDER.map(g=>[g,groupLabel(g)])].map(([key,label])=>
    `<button type="button" class="btn small ${builderState.group===key?'primary':''}" style="margin:0 6px 8px 0" onclick="setBuilderGroup('${key}')">${esc(label)}</button>`
  ).join('');

  // the exercise, not a blank field they have to fill in themselves every time.

function updateBuilderConfig(id,key,value){
  const cfg=builderState.selected.get(id);
  if(!cfg) return;
  if(key==='reps') cfg.reps=value.trim()||'8-12';
  // Clamp client-side to the same bounds skandi_template_items enforces in the DB
  // (target_sets 1-12, target_rest_sec 0-900, target_rir 0-10) so a bad hand-typed value
  // gets caught here instead of failing the save_template_items RPC after the fact.
  else if(key==='sets') cfg.sets=Math.min(12,Math.max(1,Number(value)||1));
  else if(key==='rest') cfg.rest=Math.min(900,Math.max(0,Number(value)||0));
  // Empty input clears the target (no RIR guidance for this slot) rather than snapping to 0.
  else if(key==='rir') cfg.rir=value===''?null:Math.min(10,Math.max(0,Number(value)||0));
}

let savingTemplate=false;
async function saveTemplate(id){
  if(savingTemplate) return; // guards against a double-tap racing two delete+insert cycles into the
                              // same (template_id, exercise_id, sort_order) unique constraint
  const checked=[...builderState.selected.keys()];
  if(!$('tplName').value.trim()||!checked.length) return alert(t('tpl.errName'));
  savingTemplate=true;
  const btn=document.querySelector('#modalCard button.primary');
  if(btn){btn.disabled=true;btn.textContent=t('common.saving');}
  try{
    const payload={user_id:state.user.id,name:$('tplName').value.trim(),weekday:Number($('tplDay').value),notes:$('tplNotes').value.trim()||null,is_public:$('tplPublic').checked,updated_at:new Date().toISOString()};
    let templateId=id;
    if(id){
      const {error}=await sb.from('skandi_templates').update(payload).eq('id',id);
      if(error) return alert(error.message);
    }
    else {
      const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
      if(error) return alert(error.message);
      templateId=data.id;
    }
    // Delete-old + insert-new happen inside one Postgres function (save_template_items,
    // migration 052) instead of two separate client requests, so a bad row can't leave the
    // template with its old items deleted and nothing to replace them.
    const items=checked.map((exercise_id,idx)=>{
      const cfg=builderState.selected.get(exercise_id);
      return {exercise_id,sort_order:idx,target_sets:cfg.sets,target_reps:cfg.reps,target_rest_sec:cfg.rest,target_rir:cfg.rir??null};
    });
    const {error:itemsError}=await sb.rpc('save_template_items',{p_template_id:templateId,p_items:items});
    if(itemsError) return alert(itemsError.message);
    closeModal();
    await loadAll();
    render();
  } finally {
    savingTemplate=false;
    // btn may already be gone from the DOM if closeModal() ran (success path) — harmless no-op then.
    if(btn){btn.disabled=false;btn.textContent=t('tpl.save');}
  }
}

// Shared by every path that assigns/forks a routine onto a weekday (confirmAddToWeek,
// assignOwnRoutineToDay, useCommunityRoutineForDay) — these do a non-atomic bump-then-write and,
// without a guard, a double-tap can create two templates claiming the same day.
let assigningTemplateDay=false;
async function confirmAddToWeek(templateId){
  if(assigningTemplateDay) return;
  assigningTemplateDay=true;
  try{
    const weekday=Number($('forkDay').value);
    const {error}=await forkTemplateToDay(templateId,weekday);
    if(error) return alert(error.message);
    closeModal();
    await loadAll();
    setView('train');
  } finally {
    assigningTemplateDay=false;
  }
}

async function forkTemplateToDay(templateId,weekday){
  const tpl=state.templates.find(x=>x.id===templateId);
  if(!tpl) return {error:{message:t('tpl.notFound')}};
  const sourceItems=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  const bumped=state.templates.find(x=>x.user_id===state.user.id&&x.weekday===weekday);
  if(bumped){
    const {error:bumpError}=await sb.from('skandi_templates').update({weekday:null,updated_at:new Date().toISOString()}).eq('id',bumped.id);
    if(bumpError) return {error:bumpError};
  }
  const payload={user_id:state.user.id,name:tpl.name,notes:tpl.notes,weekday,is_public:true,forked_from:tpl.id,forked_from_name:tpl.profile?.name||t('common.crewMember'),updated_at:new Date().toISOString()};
  const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
  if(error) return {error};
  const rows=sourceItems.map((i,idx)=>({template_id:data.id,exercise_id:i.exercise_id,sort_order:idx,target_sets:i.target_sets,target_reps:i.target_reps,target_rest_sec:i.target_rest_sec,target_rir:i.target_rir,note:i.note}));
  if(rows.length){
    const {error:itemsError}=await sb.from('skandi_template_items').insert(rows);
    if(itemsError) return {error:itemsError};
  }
  return {data};
}

async function assignOwnRoutineToDay(templateId,weekday){
  if(assigningTemplateDay) return;
  assigningTemplateDay=true;
  try{
    const bumped=state.templates.find(x=>x.user_id===state.user.id&&x.weekday===weekday&&x.id!==templateId);
    if(bumped) await sb.from('skandi_templates').update({weekday:null,updated_at:new Date().toISOString()}).eq('id',bumped.id);
    const {error}=await sb.from('skandi_templates').update({weekday,updated_at:new Date().toISOString()}).eq('id',templateId);
    if(error) return alert(error.message);
    closeModal();
    await loadAll();
    setView('train');
  } finally {
    assigningTemplateDay=false;
  }
}

function setExerciseMuscle(name,value,source){
  const n=Math.max(0,Math.min(100,Number(value)||0));
  const range=$(`muscleRange${name}`);
  const input=$(`muscleVal${name}`);
  if(range&&source!=='range') range.value=n;
  if(input&&source!=='number') input.value=n;
}

function resetExerciseMuscles(){
  EXERCISE_MUSCLES.forEach(m=>setExerciseMuscle(m,0));
}

function applyExercisePreset(name){
  resetExerciseMuscles();
  Object.entries(EXERCISE_PRESETS[name]||{}).forEach(([muscle,value])=>setExerciseMuscle(muscle,value));
}

  const name=$('exName').value.trim();

// iOS Safari lets a touch-scroll "leak" from the modal card's own overflow:auto content
// through to the page underneath once the inner scroll hits its end — plain overflow:hidden
// on body doesn't stop that on iOS, only actually freezing the body's scroll position does.
// A MutationObserver (rather than editing every one of the ~10 call sites that do
// `$('modal').classList.add('show')`, plus closeModal) keeps this correct no matter how or
// where a modal gets shown.
let lockedScrollY=0;
function lockBodyScroll(){
  lockedScrollY=window.scrollY;
  document.body.style.position='fixed';
  document.body.style.top=`-${lockedScrollY}px`;
  document.body.style.width='100%';
}
function unlockBodyScroll(){
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.width='';
  window.scrollTo(0,lockedScrollY);
}
new MutationObserver(()=>{
  const open=$('modal').classList.contains('show');
  if(open&&document.body.style.position!=='fixed') lockBodyScroll();
  else if(!open&&document.body.style.position==='fixed') unlockBodyScroll();
}).observe($('modal'),{attributes:true,attributeFilter:['class']});

const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
const foodDay=()=>{const d=new Date();d.setDate(d.getDate()+state.foodDayOffset);return dayKey(d);};

async function loadNutrition(){
  if(!state.user) return;
  // 45 días: suficiente para la tira de tendencia semanal sin traerse el historial entero.
  const since=new Date();since.setDate(since.getDate()-45);
  const [{data:meals},{data:items},{data:foods},{data:dishes},{data:dishItems},{data:targets},{data:usage}]=await Promise.all([
    sb.from('skandi_meals').select('*').eq('user_id',state.user.id).gte('eaten_at',since.toISOString()).order('eaten_at',{ascending:false}),
    sb.from('skandi_meal_items').select('*').eq('user_id',state.user.id).order('sort_order'),
    sb.from('skandi_foods').select('*').or(`user_id.eq.${state.user.id},user_id.is.null`).order('times_used',{ascending:false}).limit(300),
    sb.from('skandi_dishes').select('*').eq('user_id',state.user.id).order('times_used',{ascending:false}),
    sb.from('skandi_dish_items').select('*').eq('user_id',state.user.id).order('sort_order'),
    sb.from('skandi_nutrition_targets').select('*').eq('user_id',state.user.id).maybeSingle(),
    sb.from('skandi_ai_usage').select('calls').eq('user_id',state.user.id).eq('day',dayKey(new Date())).maybeSingle()
  ]);
  // Todo cae a vacío si las migraciones 073-076 no se han corrido: el resto de la app no
  // tiene por qué dejar de funcionar porque falte la parte de nutrición.
  state.meals=meals||[];
  state.mealItems=items||[];
  state.foods=foods||[];
  state.dishes=dishes||[];
  state.dishItems=dishItems||[];
  state.nutritionTargets=targets||null;
  state.aiCallsToday=usage?.calls||0;
}

// Lo que entrenas hoy cambia lo que deberías comer hoy — pero solo la DIFERENCIA contra tu
// día promedio, porque la meta base ya supone que entrenas (ver skandi-nutrition.js).
function trainingDayCard(){
  const targets=state.nutritionTargets;
  if(!targets||state.foodDayOffset!==0) return '';
  const weightKg=latestWeightKg();
  if(!weightKg) return '';

  const plan={
    weightKg,
    templates:state.templates.filter(x=>x.user_id===state.user.id),
    templateItems:state.items,
    activityTemplates:state.activityTemplates
  };
  const today=dayKey(new Date());
  const loggedToday=state.externalActivities.filter(a=>dayKey(a.performed_at)===today);
  const loggedSets=state.sets.filter(x=>x.user_id===state.user.id&&x.done&&dayKey(x.created_at)===today).length;
  const loggedKcal=loggedToday.reduce((acc,a)=>acc+SkandiNutrition.activityKcal(a,weightKg),0)
    +SkandiNutrition.strengthKcal(loggedSets,weightKg);
  const rec=SkandiNutrition.dayRecommendation({
    targets,plan,dow:todayDow(),loggedKcal,
    hasLoggedActivity:loggedToday.length>0||loggedSets>0
  });
  if(!rec||(!rec.plannedKcal&&!rec.todayKcal)) return '';

  const label=rec.level==='alto'?t('food.trainHigh'):rec.level==='bajo'?t('food.trainLow'):t('food.trainNormal');
  const deltaStr=(rec.delta>0?'+':'')+rec.delta+' kcal';
  const line=rec.fromLog?t('food.trainLogged',{kcal:rec.todayKcal,delta:deltaStr})
                        :t('food.trainPlanned',{kcal:rec.todayKcal,delta:deltaStr});
  const tone=rec.level==='alto'?'border-color:rgba(0,168,200,.35);background:#f2fbfd'
            :rec.level==='bajo'?'border-color:rgba(240,162,46,.35);background:#fffaf2':'';
  return `<section class="card" style="${tone}">
    <div class="eyebrow">${esc(label)}</div>
    <p style="margin-top:6px">${esc(line)}</p>
    ${rec.delta?`<p style="margin-top:6px"><strong>${esc(t('food.trainAdjust',{kcal:rec.kcalTarget,carbs:rec.carbsTarget}))}</strong></p>
    <p class="muted" style="font-size:11.5px;margin-top:6px">${esc(t('food.trainWhy'))}</p>`:''}
  </section>`;
}

function mealPhotoUrl(path){
  // El bucket es privado, así que no hay URL pública: firmamos en el cliente y cacheamos la
  // firma en memoria mientras dure la sesión.
  if(!path) return '';
  if(mealPhotoUrl.cache[path]) return mealPhotoUrl.cache[path];
  mealPhotoUrl.cache[path]='';
  sb.storage.from('skandi-meals').createSignedUrl(path,3600).then(({data})=>{
    if(data?.signedUrl){
      mealPhotoUrl.cache[path]=data.signedUrl;
      if(state.view==='food') render();
      // El detalle abierto también espera esa foto; sin esto se queda en blanco hasta cerrar.
      document.querySelectorAll(`img[data-photo="${path}"]`).forEach(img=>{img.src=data.signedUrl;});
    }
  });
  return '';
}

async function onMealPhotoPicked(input){
  const file=input.files&&input.files[0];

    const url=URL.createObjectURL(blob);
    $('mealPhotoPreview').innerHTML=`<img src="${url}" alt="" style="width:100%;border-radius:12px;margin-top:10px;max-height:220px;object-fit:cover">`;
    $('photoBtnLabel').textContent=`${Math.round(blob.size/1024)} KB ✓`;
  }catch(e){
    alert(e.message||String(e));
  }
}

// Comprimir en el cliente no es cosmético: sube una foto de 4 MB del celular y estás pagando
// tokens por píxeles que el modelo no aprovecha, además de tardar en subir con datos móviles.
function compressImage(file,maxSide=MEAL_PHOTO_MAX_SIDE,quality=MEAL_PHOTO_QUALITY){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(b=>b?resolve(b):reject(new Error('No se pudo procesar la imagen')),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No se pudo leer la imagen'));};
    img.src=url;
  });
}

async function submitMealForAnalysis(){
  const pending=state.pendingMeal;
  if(!pending) return;
  const desc=$('mealDesc').value.trim();
  if(!pending.blob&&!desc) return alert(t('food.errNoInput'));
  const btn=$('mealGo');
  btn.disabled=true;btn.textContent=t('food.uploading');

  try{
    let photoPath=null;
    if(pending.blob){
      photoPath=`${state.user.id}/${crypto.randomUUID()}.jpg`;
      const {error:upErr}=await sb.storage.from('skandi-meals').upload(photoPath,pending.blob,{contentType:'image/jpeg'});
      if(upErr) throw upErr;
    }
    // La comida se guarda ANTES de llamar al modelo: si el análisis falla o tarda, ya quedó
    // registrada y se puede reintentar o capturar a mano.
    const {data:meal,error}=await sb.from('skandi_meals').insert({
      user_id:state.user.id,
      meal_type:$('mealType').value,
      venue:pickedVenue(),
      note:desc||null,
      photo_path:photoPath,
      input_kind:photoPath?'photo':'text',
      analysis_status:'pending'
    }).select().single();
    if(error) throw error;

    closeModal();
    state.pendingMeal=null;
    await loadNutrition();
    setView('food');
    analyzeMeal(meal.id);
  }catch(e){
    btn.disabled=false;btn.textContent=t('food.analyze');
    alert(e.message||String(e));
  }
}

async function analyzeMeal(mealId){

    const res=await fetch('/api/analyze-meal',{
      method:'POST',

      body:JSON.stringify({meal_id:mealId})
    });
    const body=await res.json().catch(()=>({}));
    await loadNutrition();
    if(state.view==='food') render();
    if(!res.ok){

    }

  }catch(e){

    if(state.view==='food') render();
    alert(e.message||String(e));
  }
}

  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('food.byBarcode'))}</h1><button class="x" onclick="closeBarcode()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    ${canScan?`<video id="bcVideo" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover"></video>
      <p class="muted" style="margin-top:8px">${esc(t('food.scanning'))}</p>`
      :`<p class="muted">${esc(t('food.noScanner'))}</p>`}
    <label class="eyebrow">${esc(t('food.barcodePh'))}</label>
    <input id="bcNumber" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="7501000673209">
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="lookupBarcode()">${esc(t('food.scan'))}</button>`;
  if(canScan) startBarcodeScan();
}

let bcStream=null,bcTimer=null;

async function startBarcodeScan(){
  try{
    const detector=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    bcStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=$('bcVideo');
    if(!video){stopBarcodeScan();return;}
    video.srcObject=bcStream;
    await video.play();
    bcTimer=setInterval(async()=>{
      if(!$('bcVideo')) return stopBarcodeScan();
      try{
        const codes=await detector.detect(video);
        if(codes.length&&codes[0].rawValue){
          $('bcNumber').value=codes[0].rawValue;
          stopBarcodeScan();
          lookupBarcode();
        }
      }catch(e){/* un frame ilegible no es un error que valga interrumpir */}
    },600);
  }catch(e){
    // Sin permiso de cámara el camino manual sigue funcionando: no hay nada que avisar.
    stopBarcodeScan();
  }
}

function stopBarcodeScan(){
  if(bcTimer){clearInterval(bcTimer);bcTimer=null;}
  if(bcStream){bcStream.getTracks().forEach(tr=>tr.stop());bcStream=null;}
}

function closeBarcode(){
  stopBarcodeScan();
  closeModal();
}

async function lookupBarcode(){
  const code=($('bcNumber').value||'').replace(/\D/g,'');
  if(code.length<8) return alert(t('food.errNoInput'));
  stopBarcodeScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/lookup-barcode',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({barcode:code})
    });
    const body=await res.json().catch(()=>({}));
    if(!res.ok||!body.food) return alert(body.message||t('food.noMatches'));
    await loadNutrition();
    // El escaneo da el producto; la porción la pones tú, que es lo único que el código no sabe.
    if(body.food.id) openFoodPortion(body.food.id,null);
    else alert(t('food.noMatches'));
  }catch(e){
    alert(e.message||String(e));
  }
}
