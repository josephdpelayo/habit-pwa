    ${meal.analysis_status==='failed'?`<section class="card" style="border-color:rgba(212,72,84,.3);background:#fff7f7;margin-top:10px">
      <strong style="color:var(--pink)">${esc(t('food.failed'))}</strong>
      <p class="muted" style="margin-top:4px">${esc(meal.analysis_error||'')}</p>
      <button class="btn" style="width:100%;margin-top:9px" onclick="retryAnalysis('${mealId}')">${esc(t('food.retry'))}</button>
    </section>`:''}
    ${meal.photo_path?`<img data-photo="${esc(meal.photo_path)}" ${detailPhoto?`src="${esc(detailPhoto)}"`:''} alt="" style="width:100%;border-radius:12px;margin-top:10px;max-height:200px;object-fit:cover">`:''}
    <div class="eyebrow" style="margin-top:14px">${esc(t('food.items'))}</div>
    ${rest.map(i=>itemRowHtml(i)).join('')||empty(t('food.empty'))}
    ${fat.map(i=>itemRowHtml(i,true)).join('')}
    ${fat.length?`<p class="muted" style="font-size:12px;margin-top:6px">${esc(t('food.cookingFatHint'))}</p>`:''}
    <p class="muted" style="margin-top:10px">P ${Math.round(totals.protein_g)} · C ${Math.round(totals.carbs_g)} · G ${Math.round(totals.fat_g)}</p>
    <button class="btn" style="width:100%;margin-top:10px" onclick="openFoodPicker('${mealId}')">${icon('plus',18)} ${esc(t('food.byFood'))}</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="promptSaveAsDish('${mealId}')">${icon('check',18)} ${esc(t('food.saveAsDish'))}</button>
    <button class="btn" style="width:100%;margin-top:8px;color:var(--pink)" onclick="deleteMeal('${mealId}')">${icon('trash',18)} ${esc(t('food.delete'))}</button>`;
}

function itemRowHtml(item,isFat=false){
  const conf=item.ai_confidence==null?'':`<span class="conf ${item.ai_confidence>=0.8?'hi':item.ai_confidence>=0.5?'mid':'lo'}"></span>`;
  return `<div class="item-row ${item.included?'':'off'} ${isFat?'fat':''}">
    <input type="checkbox" ${item.included?'checked':''} onchange="toggleMealItem('${item.id}',this.checked)" aria-label="${esc(item.label)}">
    <span class="lbl"><strong>${conf}${esc(isFat?t('food.cookingFat'):item.label)}</strong>
      <small>${Math.round(item.kcal)} kcal · P ${item.protein_g} · C ${item.carbs_g} · G ${item.fat_g}</small></span>
    <input class="g" type="number" min="0" max="5000" inputmode="numeric" value="${item.grams==null?'':Math.round(item.grams)}"
      onchange="updateItemGrams('${item.id}',this.value)" aria-label="${esc(t('food.grams'))}">
  </div>`;
}

async function toggleMealItem(itemId,included){
  const {error}=await sb.from('skandi_meal_items').update({included}).eq('id',itemId);
  if(error) return alert(error.message);
  const item=state.mealItems.find(i=>i.id===itemId);
  await loadNutrition();
  render();
  if(item) openMealDetail(item.meal_id);
}

// Corregir los gramos reescala el renglón conservando su densidad: el modelo acertó qué era,
// se equivocó en cuánto. Y la corrección se guarda como alimento del catálogo, que es lo que
// hace que la próxima vez este platillo ya no necesite IA.
async function updateItemGrams(itemId,value){
  const item=state.mealItems.find(i=>i.id===itemId);
  if(!item) return;
  const grams=Number(value);
  if(!grams||grams<=0) return alert(t('food.errGrams'));
  const next=SkandiNutrition.rescaleItem(item,grams);
  const {error}=await sb.from('skandi_meal_items').update({
    grams:next.grams,kcal:next.kcal,protein_g:next.protein_g,carbs_g:next.carbs_g,fat_g:next.fat_g,fiber_g:next.fiber_g,
    source:'manual'
  }).eq('id',itemId);
  if(error) return alert(error.message);
  await rememberFood(next);
  await loadNutrition();
  render();
  openMealDetail(item.meal_id);
}

async function rememberFood(item){
  if(item.is_cooking_fat||item.food_id) return;
  const food=SkandiNutrition.itemToFood(item);
  if(!food||!food.name) return;
  // onConflict con el índice único (usuario, nombre, marca) de la migración 073: corregir dos
  // veces el mismo alimento lo actualiza en vez de llenar el catálogo de duplicados.
  await sb.from('skandi_foods').upsert(
    {...food,user_id:state.user.id,source:'manual',brand:null},
    {onConflict:'user_id,name,brand',ignoreDuplicates:false}
  );
}

function promptSaveAsDish(mealId){
  const meal=state.meals.find(m=>m.id===mealId);
  const name=prompt(t('food.dishName'),meal?.note||mealTypeLabel(meal?.meal_type||'snack'));
  if(name===null) return;
  if(!name.trim()) return alert(t('food.errName'));
  saveMealAsDish(mealId,name.trim());
}

async function saveMealAsDish(mealId,name){
  const {error}=await sb.rpc('skandi_save_meal_as_dish',{p_meal_id:mealId,p_name:name});
  if(error) return alert(error.message);
  await loadNutrition();
  render();
  alert(t('food.dishSaved',{name}));
}

async function deleteMeal(mealId){
  if(!confirm(t('food.deleteConfirm'))) return;
  const meal=state.meals.find(m=>m.id===mealId);
  const {error}=await sb.from('skandi_meals').delete().eq('id',mealId);
  if(error) return alert(error.message);
  // La foto se va con la comida: dejarla en el bucket es basura privada acumulándose.
  if(meal?.photo_path) sb.storage.from('skandi-meals').remove([meal.photo_path]);
  closeModal();
  await loadNutrition();
  render();
}

// ---- Metas ----

function openTargets(){
  const tg=state.nutritionTargets;
  const weight=latestWeightKg();
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('food.setTarget'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <label class="eyebrow">${esc(t('food.targetMode'))}</label>
    <select id="tgMode" class="field left">${['deficit','mantenimiento','superavit'].map(m=>
      `<option value="${m}" ${(tg?.mode||'mantenimiento')===m?'selected':''}>${esc(t('food.mode.'+m))}</option>`).join('')}</select>
    <label class="eyebrow">${esc(t('food.activity'))}</label>
    <select id="tgActivity" class="field left">${Object.entries(SkandiNutrition.ACTIVITY_FACTORS).map(([k,v])=>
      `<option value="${v}" ${Number(tg?.activity_factor||1.55)===v?'selected':''}>${k}</option>`).join('')}</select>
    <button class="btn" style="width:100%;margin-top:10px" onclick="fillSuggestedTargets()" ${weight?'':'disabled'}>${esc(weight?t('food.suggest'):t('food.needWeight'))}</button>
    <label class="eyebrow">${esc(t('food.targetKcal'))}</label>
    <input id="tgKcal" class="field" type="number" min="800" max="8000" inputmode="numeric" value="${tg?.kcal_target||''}">
    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">
      <div><label class="eyebrow">${esc(t('food.protein'))}</label><input id="tgP" class="field" type="number" min="0" max="500" value="${tg?.protein_g_target||''}"></div>
      <div><label class="eyebrow">${esc(t('food.carbs'))}</label><input id="tgC" class="field" type="number" min="0" max="1200" value="${tg?.carbs_g_target||''}"></div>
      <div><label class="eyebrow">${esc(t('food.fat'))}</label><input id="tgF" class="field" type="number" min="0" max="400" value="${tg?.fat_g_target||''}"></div>
    </div>
    <label class="eyebrow">${esc(t('food.targetSugar'))}</label>
    <input id="tgS" class="field" type="number" min="0" max="500" inputmode="numeric" value="${tg?.sugar_g_target??''}">
    <p class="muted" style="font-size:12px;margin-top:6px">${esc(t('food.sugarHint'))}</p>
    <p class="muted" style="font-size:12px;margin-top:10px">${esc(t('food.targetHint'))}</p>
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="saveTargets()">${esc(t('food.save'))}</button>`;
}

function fillSuggestedTargets(){
  const weight=latestWeightKg();
  if(!weight) return alert(t('food.needWeight'));
  const s=SkandiNutrition.suggestTargets({
    weightKg:weight,
    activityFactor:Number($('tgActivity').value),
    mode:$('tgMode').value
  });
  if(!s) return;
  $('tgKcal').value=s.kcal;
  $('tgP').value=s.protein_g;
  $('tgC').value=s.carbs_g;
  $('tgF').value=s.fat_g;
  $('tgS').value=s.sugar_g;
}

async function saveTargets(){
  const kcal=Number($('tgKcal').value);
  if(!kcal||kcal<800||kcal>8000) return alert(t('food.errGrams'));
  const {error}=await sb.from('skandi_nutrition_targets').upsert({
    user_id:state.user.id,
    mode:$('tgMode').value,
    kcal_target:Math.round(kcal),
    protein_g_target:Math.round(Number($('tgP').value)||0),
    carbs_g_target:Math.round(Number($('tgC').value)||0),
    fat_g_target:Math.round(Number($('tgF').value)||0),
    // Vacío significa "no me lo vigiles", que no es lo mismo que un techo de cero.
    sugar_g_target:$('tgS').value===''?null:Math.round(Number($('tgS').value)),
    activity_factor:Number($('tgActivity').value),
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  if(error) return alert(error.message);
  closeModal();
  await loadNutrition();
  render();
}

sb.auth.onAuthStateChange((_event,session)=>{ if(session&&!state.user){ state.user=session.user; loadAll().then(showApp); } });
// Stamp the stored/detected language onto the static markup before the first paint, so the auth
// screen and tab bar never flash English at a Spanish user.
rebuildActivityLabels();
applyStaticI18n();
init();

// Service worker: es el mismo /sw.js que registra app.html (alcance '/', una sola
// registración por origen — dos service workers en la raíz se desalojarían entre sí).
// Su handler de navegación ya distingue /skandi de /app.html para el fallback offline.
if('serviceWorker' in navigator){
  let swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshing) return;
    swRefreshing=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('/sw.js?v='+SKANDI_VERSION);
      reg.update();
    }catch(e){ console.warn(e); }
  });
}
</script>
