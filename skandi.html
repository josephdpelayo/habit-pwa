function updateBuilderConfig(id,key,value){
  const cfg=builderState.selected.get(id);
  if(!cfg) return;
  if(key==='reps') cfg.reps=value.trim()||'8-12';
  // Clamp client-side to the same bounds skandi_template_items enforces in the DB
  // (target_sets 1-12, target_rest_sec 0-900, target_rir 0-10) so a bad hand-typed value
  // gets caught here instead of failing the save_template_items RPC after the fact.
  else if(key==='sets') cfg.sets=Math.min(12,Math.max(1,Number(value)||1));
  else if(key==='rest') cfg.rest=Math.min(900,Math.max(0,Number(value)||0));
  // Empty input clears the target (no RIR guidance for this slot) rather than snapping to 0.
  else if(key==='rir') cfg.rir=value===''?null:Math.min(10,Math.max(0,Number(value)||0));
}

let savingTemplate=false;
async function saveTemplate(id){
  if(savingTemplate) return; // guards against a double-tap racing two delete+insert cycles into the
                              // same (template_id, exercise_id, sort_order) unique constraint
  const checked=[...builderState.selected.keys()];
  if(!$('tplName').value.trim()||!checked.length) return alert(t('tpl.errName'));
  savingTemplate=true;
  const btn=document.querySelector('#modalCard button.primary');
  if(btn){btn.disabled=true;btn.textContent=t('common.saving');}
  try{
    const dayVal=$('tplDay').value;
    const weekday=dayVal===''?null:Number(dayVal);
    // El día NO va en el payload: lo escribe assignToDay al final, que es quien sabe si manda
    // el programa o weekday. Escribirlo aquí además dejaría dos asignaciones compitiendo.
    const payload={user_id:state.user.id,name:$('tplName').value.trim(),notes:$('tplNotes').value.trim()||null,is_public:$('tplPublic').checked,updated_at:new Date().toISOString()};
    let templateId=id;
    if(id){
      const {error}=await sb.from('skandi_templates').update(payload).eq('id',id);
      if(error) return alert(error.message);
    }
    else {
      const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
      if(error) return alert(error.message);
      templateId=data.id;
    }
    // Delete-old + insert-new happen inside one Postgres function (save_template_items,
    // migration 052) instead of two separate client requests, so a bad row can't leave the
    // template with its old items deleted and nothing to replace them.
    const items=checked.map((exercise_id,idx)=>{
      const cfg=builderState.selected.get(exercise_id);
      return {exercise_id,sort_order:idx,target_sets:cfg.sets,target_reps:cfg.reps,target_rest_sec:cfg.rest,target_rir:cfg.rir??null};
    });
    const {error:itemsError}=await sb.rpc('save_template_items',{p_template_id:templateId,p_items:items});
    if(itemsError) return alert(itemsError.message);
    // Rutina creada desde un día del programa (createRoutineForProgramDay): ocupa esa ranura
    // sola, aunque ese programa no sea el que manda la semana -- por eso no pasa por
    // assignToDay, que siempre escribiría el activo.
    const slot=pendingProgramSlot;
    pendingProgramSlot=null;
    if(!id&&slot){
      const slotError=await writeProgramDay(slot.programId,slot.weekIndex||0,slot.weekday,'template',templateId);
      if(slotError) alert(slotError.message);
      else if(!(slot.weekIndex||0)&&!programOwnsWeek('template')&&activeProgramForKind('template')?.id===slot.programId){
        const mirrorError=await writeWeekdayColumn('template',slot.weekday,templateId);
        if(mirrorError) alert(mirrorError.message);
      }
    } else {
      const dayError=await assignToDay('template',weekday,templateId);
      if(dayError) return alert(dayError.message);
    }
    closeModal();
    await loadAll();
    render();
  } finally {
    savingTemplate=false;
    // btn may already be gone from the DOM if closeModal() ran (success path) — harmless no-op then.
    if(btn){btn.disabled=false;btn.textContent=t('tpl.save');}
  }
}

async function forkTemplateToDay(templateId,weekday){
  const tpl=state.templates.find(x=>x.id===templateId);
  if(!tpl) return {error:{message:t('tpl.notFound')}};
  const sourceItems=state.items.filter(i=>i.template_id===templateId).sort((a,b)=>a.sort_order-b.sort_order);
  const payload={user_id:state.user.id,name:tpl.name,notes:tpl.notes,is_public:true,forked_from:tpl.id,forked_from_name:tpl.profile?.name||t('common.crewMember'),updated_at:new Date().toISOString()};
  const {data,error}=await sb.from('skandi_templates').insert(payload).select().single();
  if(error) return {error};
  const rows=sourceItems.map((i,idx)=>({template_id:data.id,exercise_id:i.exercise_id,sort_order:idx,target_sets:i.target_sets,target_reps:i.target_reps,target_rest_sec:i.target_rest_sec,target_rir:i.target_rir,note:i.note}));
  if(rows.length){
    const {error:itemsError}=await sb.from('skandi_template_items').insert(rows);
    if(itemsError) return {error:itemsError};
  }
  // La asignación va DESPUÉS de que el fork completo (cabecera + ejercicios) ya funcionó, no
  // antes. Al revés, un insert fallido dejaba el día sin la rutina nueva Y sin la que ya tenía
  // — el peor de los dos mundos.
  const dayError=await assignToDay('template',weekday,data.id);
  if(dayError) return {error:dayError};
  return {data};
}

function setExerciseMuscle(name,value,source){
  const n=Math.max(0,Math.min(100,Number(value)||0));
  const range=$(`muscleRange${name}`);
  const input=$(`muscleVal${name}`);
  if(range&&source!=='range') range.value=n;
  if(input&&source!=='number') input.value=n;
}

function resetExerciseMuscles(){
  EXERCISE_MUSCLES.forEach(m=>setExerciseMuscle(m,0));
}

function applyExercisePreset(name){
  resetExerciseMuscles();
  Object.entries(EXERCISE_PRESETS[name]||{}).forEach(([muscle,value])=>setExerciseMuscle(muscle,value));
}

async function saveExercise(){
  const name=$('exName').value.trim();
  if(!name) return alert(t('newex.errName'));
  let muscles={};
  document.querySelectorAll('[id^="muscleVal"]').forEach(input=>{
    const muscle=input.id.replace('muscleVal','');
    const value=Math.max(0,Math.min(100,Number(input.value)||0));
    if(value>0) muscles[muscle]=value;
  });
  if(!Object.keys(muscles).length) return alert(t('newex.errMuscle'));
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const equipment=$('exEquipment').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(state.exercises.some(e=>e.slug===slug)) return alert(t('newex.errDup'));
  const {error}=await sb.from('skandi_exercises').insert({
    slug,name,english_name:$('exEnglish').value.trim()||null,category:$('exCategory').value,
    equipment,muscles,media_url:$('exMedia').value.trim()||null,media_page_url:$('exPage').value.trim()||null,

  });
  if(error) return alert(error.code==='23505'?t('newex.errDup'):error.message);

  render();
}

// ---- Exportar CSV (Fase 5, "pulido analítico") --------------------------------------------
//
// Los datos que el estado ya tiene cargado no alcanzan para un export honesto: las comidas solo
// traen los últimos 45 días (loadNutrition, para la tira de tendencia) y las actividades externas
// vienen topadas a las 200 más recientes (loadAll). Un botón de "exportar mis datos" que en
// silencio recorta tu historial sería peor que no tenerlo. Por eso cada tipo pide su propia
// consulta completa al tocar el botón, sin límite ni ventana — igual que "ver parciales" (105):
// se paga el viaje a la base solo cuando de verdad se quiere, no de antemano.
const CSV_EXPORTS = ['sets','activities','meals','bodyweight'];

function csvEscape(v){
  const s=v==null?'':String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadCsv(name,headers,rows){
  const lines=[headers.join(','),...rows.map(r=>r.map(csvEscape).join(','))];
  // BOM: Excel en Windows no adivina UTF-8 sin él y "Front Lever Á" sale con acentos rotos.
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`skandi-${name}-${todayKey()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function exportCsv(dataset){
  const btn=$('exportCsvBtn');
  if(btn){btn.disabled=true;btn.textContent=t('export.working');}
  try{
    if(dataset==='sets'){
      const {data,error}=await sb.from('skandi_sets')
        .select('sort_order,weight_kg,reps,rir,form_quality,side,done,session:skandi_sessions(title,completed_at),exercise:skandi_exercises(name)')
        .eq('user_id',state.user.id).eq('done',true).order('created_at');
      if(error) throw error;
      downloadCsv('series',['fecha','rutina','ejercicio','serie','peso_kg','reps','rir','calidad','lado'],
        (data||[]).filter(s=>s.session?.completed_at).map(s=>[
          s.session.completed_at.slice(0,10),s.session.title||'',s.exercise?.name||'',
          s.sort_order??'',s.weight_kg??'',s.reps??'',s.rir??'',s.form_quality??'',s.side||''
        ]));
    }else if(dataset==='activities'){
      const {data,error}=await sb.from('skandi_external_activities').select('*')
        .eq('user_id',state.user.id).order('performed_at');
      if(error) throw error;
      downloadCsv('cardio',['fecha','tipo','duracion_min','distancia_km','fc_prom','fc_max','intensidad','fuente'],
        (data||[]).map(a=>[
          a.performed_at.slice(0,10),a.activity_type,a.duration_min,a.distance_km??'',
          a.avg_heart_rate??'',a.max_heart_rate??'',a.intensity,a.external_source||'manual'
        ]));
    }else if(dataset==='meals'){
      const {data,error}=await sb.from('skandi_meals').select('*')
        .eq('user_id',state.user.id).order('eaten_at');
      if(error) throw error;
      downloadCsv('comidas',['fecha','tipo','kcal','proteina_g','carbos_g','grasa_g','azucar_g','lugar'],
        (data||[]).map(m=>[
          m.eaten_at.slice(0,10),m.meal_type||'',m.kcal??'',m.protein_g??'',m.carbs_g??'',
          m.fat_g??'',m.sugar_g??'',m.venue||''
        ]));
    }else if(dataset==='bodyweight'){
      // Esta ya vive completa en el estado (loadAll no la topa), no hace falta una consulta nueva.
      downloadCsv('peso',['fecha','peso_kg','nota'],
        state.bodyweightLogs.map(l=>[l.logged_at,l.weight_kg,l.note||'']));
    }
  }catch(e){ alert(e.message||String(e)); }
  finally{ if(btn){btn.disabled=false;btn.textContent=t('export.download');} }
}

// La tarjeta de Strava vive en Ajustes y no en Entrenar a propósito: conectar un reloj se
// hace una vez en la vida y el jalón manual es el respaldo del webhook, no el camino normal.
// Lo que sí se ve todos los días —la carrera ya importada— aparece solo en la lista de
// actividades, sin que nadie tenga que venir aquí a pedirla.
// Las zonas del reloj vienen de una prueba de umbral; las que la app deduce por %FCmáx son
// una fórmula. Con FCmáx 193 esa fórmula metía un rodaje suave de 140-150 ppm en la misma
// casilla que 160 ppm, así que los días fáciles contaban como medio duros. Por eso se copian
// a mano una vez y mandan sobre la deducción.
//
// Vive en su propia tarjeta y no dentro de Strava o Intervals: no pertenece a ninguna de las
// dos —la usa el motor de fatiga con cualquier origen, incluso capturando a mano— y antes
// estaba duplicada en ambas, con el mismo id de campo en las dos. Con las dos integraciones
// conectadas eso son ids repetidos en el DOM, y $('setMaxHr') devolvía el de la otra tarjeta.
// Un entrenamiento del reloj que no encontró sesión no se descarta: se pregunta. El
// emparejador automático exige solape o inicios cercanos —sin eso enlazaría al azar— pero una
// sesión que se te olvidó cerrar y cerraste horas después es un caso legítimo que ningún
// umbral distingue de un error. Esa decisión es tuya, no del algoritmo.

// Enseña en qué se traduce cada zona, porque un renglón de números no dice si quedaron bien.
function zonePreviewHtml(){
  const z=state.skandiSettings?.hr_zone_bounds;
  if(!Array.isArray(z)||z.length!==4) return '';
  const ranges=[`< ${z[0]}`,`${z[0]}–${z[1]-1}`,`${z[1]}–${z[2]-1}`,`${z[2]}–${z[3]-1}`,`≥ ${z[3]}`];
  return `<div class="row" style="gap:4px;margin-top:12px">

}

// Reemplazo de confirm()/alert() nativos en el mismo lenguaje visual de la app — un diálogo del
// sistema operativo, gris y sin relación con el diseño, es exactamente el tipo de interrupción
// que se está tratando de sacar de la experiencia de entrenar. Vive en su PROPIO overlay
// (#confirmOverlay), no dentro de #modalCard: #modalCard se reconstruye entera en cada
// renderActiveWorkout, así que un confirm ahí adentro se perdería (o perdería el scroll/los
// paneles abiertos del entrenamiento) en cuanto algo más disparara un re-render mientras está
// abierto. Como overlay aparte, encima de todo (ver z-index en el CSS), el entrenamiento activo
// sigue intacto debajo.
function closeConfirmSheet(){
  const overlay=$('confirmOverlay');
  overlay.classList.remove('show');
  overlay.innerHTML='';
}

function confirmSheet(body,opts){
  const {title='',confirmLabel=t('common.ok'),cancelLabel=t('common.cancel'),danger=false}=opts||{};
  return new Promise(resolve=>{
    const overlay=$('confirmOverlay');
    const settle=result=>{ closeConfirmSheet(); resolve(result); };
    overlay.innerHTML=`
      <div class="confirm-card" onclick="event.stopPropagation()">
        ${title?`<h3>${esc(title)}</h3>`:''}
        <p>${esc(body)}</p>
        <div class="confirm-actions">
          <button type="button" class="btn ghost">${esc(cancelLabel)}</button>
          <button type="button" class="btn ${danger?'danger-action':'primary'}">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    overlay.classList.add('show');
    // Tocar el fondo oscuro cuenta como cancelar, nunca como confirmar — el default seguro.
    overlay.onclick=()=>settle(false);
    const [cancelBtn,okBtn]=overlay.querySelectorAll('button');
    cancelBtn.onclick=()=>settle(false);
    okBtn.onclick=()=>settle(true);
    okBtn.focus();
  });
}

function alertSheet(body,opts){
  const {title=''}=opts||{};
  return new Promise(resolve=>{
    const overlay=$('confirmOverlay');
    const settle=()=>{ closeConfirmSheet(); resolve(); };
    overlay.innerHTML=`
      <div class="confirm-card" onclick="event.stopPropagation()">
        ${title?`<h3>${esc(title)}</h3>`:''}
        <p>${esc(body)}</p>
        <div class="confirm-actions"><button type="button" class="btn primary">${esc(t('common.ok'))}</button></div>
      </div>`;
    overlay.classList.add('show');
    overlay.onclick=settle;
    const btn=overlay.querySelector('button');
    btn.onclick=settle;
    btn.focus();
  });
}

// iOS Safari lets a touch-scroll "leak" from the modal card's own overflow:auto content
// through to the page underneath once the inner scroll hits its end — plain overflow:hidden
// on body doesn't stop that on iOS, only actually freezing the body's scroll position does.
// A MutationObserver (rather than editing every one of the ~10 call sites that do
// `$('modal').classList.add('show')`, plus closeModal) keeps this correct no matter how or
// where a modal gets shown.
let lockedScrollY=0;
function lockBodyScroll(){
  lockedScrollY=window.scrollY;
  document.body.style.position='fixed';
  document.body.style.top=`-${lockedScrollY}px`;
  document.body.style.width='100%';
}
function unlockBodyScroll(){
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.width='';
  window.scrollTo(0,lockedScrollY);
}
new MutationObserver(()=>{
  const open=$('modal').classList.contains('show');
  if(open&&document.body.style.position!=='fixed') lockBodyScroll();
  else if(!open&&document.body.style.position==='fixed') unlockBodyScroll();
}).observe($('modal'),{attributes:true,attributeFilter:['class']});

// El estado de la integración NO se lee de skandi_integrations: esa tabla tiene RLS que niega
// todo, porque guarda los tokens. skandi_strava_status() (migración 081) devuelve solo lo que
// el cliente puede saber, y cero filas cuando no hay conexión.
async function loadIntegrations(){
  if(!state.user) return;
  const since=new Date();since.setDate(since.getDate()-45);
  const [{data:status},{data:settings},intervals,{data:wellness}]=await Promise.all([
    sb.rpc('skandi_strava_status'),
    sb.from('skandi_settings').select('*').eq('user_id',state.user.id).maybeSingle(),
    skandiApi('intervals-status').catch(()=>null),
    // 45 días: lo que necesita una tendencia de sueño y descanso, sin traerse el historial.
    sb.from('skandi_daily_wellness').select('*').eq('user_id',state.user.id)
      .gte('day',dayKey(since)).order('day',{ascending:false})
  ]);
  // Todo a null si la migración 081 no se ha corrido: el resto de la app no tiene por qué
  // dejar de funcionar porque falte Strava.
  state.stravaStatus=(status&&status[0])||null;
  state.intervalsStatus=intervals&&intervals.connected?intervals:null;
  state.skandiSettings=settings||null;
  // [] si la migración 085 no se ha corrido: la tarjeta simplemente no se pinta.
  state.wellness=wellness||[];
}

// El mismo fetch se reintenta una vez si Safari lo corta a medio viaje (ver isTransientFetchError
// más arriba): las acciones que pasan por aquí (barcode, meal-suggestion, intervals-*, strava-*)
// son upserts o lecturas del lado del servidor, así que repetir la llamada no duplica nada. Las
// que sí podrían duplicar (analyze/append de una comida) no usan este helper — ver analyzeMeal.
async function skandiApi(action,body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error(t('auth.sessionExpired'));
  const call=async()=>{
    const res=await fetch('/api/skandi',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({action,...(body||{})})
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.message||t(action.startsWith('intervals-')?'intervals.failed':'strava.failed'));
    return data;
  };
  try{
    return await call();
  }catch(e){
    if(!isTransientFetchError(e)) throw e;
    await new Promise(r=>setTimeout(r,900));
    return await call();
  }
}

// Lo que el reloj vio y Skandi no tiene que decirse. Antes el aviso solo contaba lo enlazado,
// así que un entrenamiento de fuerza sin sesión en la app desaparecía sin dejar rastro: ni
// enlazado, ni importado, ni mencionado.
function intervalsSyncMessage(result){
  let msg=t('intervals.syncDone',result);
  const missing=Number(result.unmatched_strength)||0;
  if(missing>0){
    const list=(result.unmatched_strength_detail||[])
      .map(d=>`${new Date(d.started_at).toLocaleDateString(LANG,{day:'numeric',month:'short'})} · ${d.minutes} min`)
      .join(', ');
    msg+='\n\n'+tp(missing,'intervals.unmatched',{list});
  }
  return withMergeNote(msg,result);
}

// Fusionar dos renglones del mismo entrenamiento cambia lo que ves en pantalla, así que se
// dice. Un cambio silencioso en los datos es indistinguible de un bug.
function withMergeNote(msg,result){
  const merged=Number(result&&result.merged)||0;
  return merged>0?msg+'\n\n'+tp(merged,'sync.merged'):msg;
}

async function saveEffortSettings(){
  const read=(id,min,max,label)=>{
    const raw=$(id).value.trim();
    if(raw==='') return null;
    const n=Number(raw);
    if(!Number.isFinite(n)||n<min||n>max) throw new Error(t('zones.errRange',{label,min,max}));
    return Math.round(n);
  };
  const readPace=(id,label)=>{
    const raw=$(id).value.trim();
    if(raw==='') return null;
    const sec=parsePaceToSec(raw);
    if(sec===null) throw new Error(t('zones.errPace',{label}));
    return sec;
  };
  let maxHr,rest,lthr,bounds,runPace,swimCss,bikeFtp;
  try{
    maxHr=read('setMaxHr',120,230,t('zones.maxHr'));
    rest=read('setRestHr',25,120,t('zones.restingHr'));
    lthr=read('setLthr',90,220,t('zones.lthr'));
    const z=[read('setZ2',60,230,'Z2'),read('setZ3',60,230,'Z3'),read('setZ4',60,230,'Z4'),read('setZ5',60,230,'Z5')];
    const filled=z.filter(n=>n!==null).length;
    // O las cuatro o ninguna: tres fronteras dejan una zona sin definir, y el motor tendría
    // que adivinar justo lo que estas fronteras existen para no adivinar.
    if(filled!==0&&filled!==4) throw new Error(t('zones.errAllFour'));
    if(filled===4&&!(z[0]<z[1]&&z[1]<z[2]&&z[2]<z[3])) throw new Error(t('zones.errOrder'));
    bounds=filled===4?z:null;
    runPace=readPace('setRunPace',t('zones.runPace'));
    swimCss=readPace('setSwimCss',t('zones.swimCss'));
    bikeFtp=read('setBikeFtp',40,500,t('zones.bikeFtp'));
  }catch(e){ return alert(e.message); }

  const {error}=await sb.from('skandi_settings').upsert({
    user_id:state.user.id,
    max_heart_rate:maxHr,
    resting_hr:rest,
    lthr,
    hr_zone_bounds:bounds,
    run_threshold_sec_km:runPace,
    swim_css_sec_100m:swimCss,
    bike_ftp_w:bikeFtp,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  if(error) return alert(error.message);
  await loadIntegrations();
  // La FCmáx cambia el esfuerzo derivado de cada actividad con pulso, así que el cuerpo y la
  // frescura se repintan: sería raro guardarla y no ver moverse nada.
  render();
  openSettings();
}

// Strava regresa al navegador con ?strava=ok|error. Se lee una vez, se limpia de la URL (para
// que un refresh no repita el aviso) y en el caso bueno se jala de inmediato: acabar de
// conectar y no ver ninguna carrera se siente roto, aunque el webhook ya esté escuchando.
async function handleStravaReturn(){
  const params=new URLSearchParams(window.location.search);
  const result=params.get('strava');
  if(!result) return;
  params.delete('strava');
  const reason=params.get('reason');
  params.delete('reason');
  const rest=params.toString();
  history.replaceState(null,'',window.location.pathname+(rest?'?'+rest:''));
  if(result==='ok'){ await syncStrava(); return; }
  // t() devuelve la propia llave cuando no existe: eso es exactamente lo que queremos para
  // un motivo que Strava inventó y nosotros no traducimos — se ve el código crudo, no vacío.
  alert(t('strava.connectError',{reason:t('strava.reason.'+(reason||'unknown'))}));
}

async function loadNutrition(){
  if(!state.user) return;
  // 45 días: suficiente para la tira de tendencia semanal sin traerse el historial entero.
  const since=new Date();since.setDate(since.getDate()-45);
  const [{data:meals},{data:items},{data:foods},{data:dishes},{data:dishItems},{data:targets},{data:usage},{data:overrides},{data:pantry}]=await Promise.all([
    withNetworkRetry(()=>sb.from('skandi_meals').select('*').eq('user_id',state.user.id).gte('eaten_at',since.toISOString()).order('eaten_at',{ascending:false})),
    withNetworkRetry(()=>sb.from('skandi_meal_items').select('*').eq('user_id',state.user.id).order('sort_order')),
    withNetworkRetry(()=>sb.from('skandi_foods').select('*').or(`user_id.eq.${state.user.id},user_id.is.null`).order('times_used',{ascending:false}).limit(300)),
    withNetworkRetry(()=>sb.from('skandi_dishes').select('*').eq('user_id',state.user.id).order('times_used',{ascending:false})),
    withNetworkRetry(()=>sb.from('skandi_dish_items').select('*').eq('user_id',state.user.id).order('sort_order')),
    withNetworkRetry(()=>sb.from('skandi_nutrition_targets').select('*').eq('user_id',state.user.id).maybeSingle()),
    withNetworkRetry(()=>sb.from('skandi_ai_usage').select('calls').eq('user_id',state.user.id).eq('day',dayKey(new Date())).maybeSingle()),
    // migración 094: metas por fecha específica (p.ej. una semana de descarga), por encima de
    // la meta base de arriba. Últimos 45 días para atrás y todo lo que haya hacia delante.
    withNetworkRetry(()=>sb.from('skandi_nutrition_target_overrides').select('*').eq('user_id',state.user.id).gte('target_date',dayKey(since))),
    // migración 111: alacena — [] si todavía no se ha corrido, igual que el resto de abajo.
    withNetworkRetry(()=>sb.from('skandi_pantry').select('*').eq('user_id',state.user.id))
  ]);
  // Todo cae a vacío si las migraciones 073-076, 094 y 111 no se han corrido: el resto de la
  // app no tiene por qué dejar de funcionar porque falte la parte de nutrición.
  state.meals=meals||[];
  state.mealItems=items||[];
  state.foods=foods||[];
  state.dishes=dishes||[];
  state.dishItems=dishItems||[];
  state.nutritionTargets=targets||null;
  state.aiCallsToday=usage?.calls||0;
  state.nutritionTargetOverrides=overrides||[];
  state.pantry=pantry||[];
}

// Los alimentos (propios o globales) que el usuario marcó como disponibles ahora mismo.
function pantryFoods(){
  const ids=new Set((state.pantry||[]).map(p=>p.food_id));
  return state.foods.filter(f=>ids.has(f.id));
}

// La meta de un día concreto: la fila por fecha (migración 094) manda donde exista — pisa solo
// los campos que trae, el resto cae a la meta base — y si no hay override, es la meta base tal
// cual. Sin meta base no hay nada que mostrar, override o no.
function nutritionOverrideFor(key){
  return state.nutritionTargetOverrides.find(o=>o.target_date===key)||null;
}
function targetsForDay(key){
  const base=state.nutritionTargets;
  if(!base) return null;
  const override=nutritionOverrideFor(key);
  if(!override) return base;
  const pick=(field)=>override[field]!=null?override[field]:base[field];
  return {...base,
    kcal_target:pick('kcal_target'),
    protein_g_target:pick('protein_g_target'),
    carbs_g_target:pick('carbs_g_target'),
    fat_g_target:pick('fat_g_target')
  };
}

// Lo que entrenas hoy cambia lo que deberías comer hoy — pero solo la DIFERENCIA contra tu
// día promedio, porque la meta base ya supone que entrenas (ver skandi-nutrition.js).
// Devuelve el CONTENIDO (sin el <section class="card">), no la tarjeta completa: desde que
// esta tarjeta y la de sugerencia IA (ver todaysPlanCard) comparten exactamente la misma
// condición de aparición (hoy, con metas), viven en un solo <section> — este consejo gratis
// arriba, el botón de IA abajo — en vez de dos tarjetas apiladas diciendo "qué comer hoy" por
// separado. `tone` es el color de fondo/borde que antes vivía en el <section> mismo.
function trainingDayInnerHtml(){
  const today=dayKey(new Date());
  const override=nutritionOverrideFor(today);
  const targets=targetsForDay(today);
  if(!targets||state.foodDayOffset!==0) return {tone:'',html:''};
  const weightKg=latestWeightKg();
  if(!weightKg) return {tone:'',html:''};

  const sessions=sessionsForFuel(today,weightKg);
  const loggedToday=state.externalActivities.filter(a=>dayKey(a.performed_at)===today);
  const loggedSets=state.sets.filter(x=>x.user_id===state.user.id&&x.done&&dayKey(x.created_at)===today).length;
  const loggedKcal=loggedToday.reduce((acc,a)=>acc+SkandiNutrition.activityKcal(a,weightKg),0)
    +SkandiNutrition.strengthKcal(loggedSets,weightKg);
  // Los pasos del día contra tu propio promedio de 7 días. El promedio es lo que importa: la
  // meta ya asume tu nivel normal de movimiento, así que solo la desviación cambia lo que
  // toca comer. Se piden 8 días para poder comparar hoy contra los 7 anteriores.
  const wellnessRows=(state.wellness||[]).slice().sort((a,b)=>b.day.localeCompare(a.day));
  const stepsToday=wellnessRows.find(w=>w.day===today)?.steps??null;
  const prevSteps=wellnessRows.filter(w=>w.day!==today).slice(0,7).map(w=>w.steps).filter(n=>Number.isFinite(n));
  const avgSteps=prevSteps.length>=3?prevSteps.reduce((a,b)=>a+b,0)/prevSteps.length:null;
  const rec=SkandiNutrition.dayRecommendation({
    targets,
    plannedKcal:sessions.reduce((a,x)=>a+(x.kcal||0),0),
    avgDaily:weeklyPlannedFromCalendar(weightKg).avgDaily,
    loggedKcal,
    hasLoggedActivity:loggedToday.length>0||loggedSets>0,
    steps:stepsToday,avgSteps,weightKg
  });
  if(!rec) return {tone:'',html:''};

  // El coach ya fijó el número exacto de hoy (migración 094, metas por fecha): no hace falta
  // adivinar con el promedio semanal, y menos etiquetar de "descanso" un día que sí entrena —
  // aquí solo queda el consejo de timing (fuelPlanHtml), no el delta ni la etiqueta alto/bajo.
  // Va antes del corte por "hoy no se quema nada": un día de descanso de la semana de descarga
  // no tiene timing que dar, pero sí tiene un número fijado y la razón por la que bajó.
  if(override){
    const fuel=fuelPlanHtml(sessions,weightKg,rec);
    // El "por qué" corto que el coach ya escribió al fijar el día ("Descarga · Martes ·
    // Handstand + Push + Pierna + Z2"): estaba en la base desde la 094 y no se veía en
    // ningún lado. Sin nota y sin timing no queda tarjeta que pintar.
    const note=(override.note||'').trim();
    if(!fuel&&!note) return {tone:'',html:''};
    return {tone:'',html:`<div class="eyebrow">${esc(t('food.coachTarget'))}</div>
      ${note?`<p class="muted" style="margin-top:6px">${esc(note)}</p>`:''}
      ${fuel}`};
  }
  if(!rec.plannedKcal&&!rec.todayKcal) return {tone:'',html:''};

  // "Día de descanso" solo si de verdad no hay sesión planeada hoy — si la hay pero quema
  // menos que tu promedio semanal (p.ej. un día de skills corto), es un día ligero, no un
  // descanso: decir lo contrario es lo que contradecía la tarjeta de "cómo comerlo" de abajo.
  const label=rec.level==='alto'?t('food.trainHigh')
    :rec.level==='bajo'?(sessions.length?t('food.trainLight'):t('food.trainLow'))
    :t('food.trainNormal');
  const deltaStr=(rec.delta>0?'+':'')+rec.delta+' kcal';
  const line=(rec.fromLog?t('food.trainLogged',{kcal:rec.todayKcal,delta:deltaStr})
                         :t('food.trainPlanned',{kcal:rec.todayKcal,delta:deltaStr}))
    // Un ajuste sin explicación se lee como un número que se movió solo.
    +(Math.abs(rec.stepsDelta||0)>=60&&stepsToday
      ? ' '+t('food.stepsDelta',{steps:stepsToday.toLocaleString(LANG),kcal:(rec.stepsDelta>0?'+':'')+rec.stepsDelta})
      : '');
  const tone=rec.level==='alto'?'border-color:rgba(0,168,200,.35);background:#f2fbfd'
            :rec.level==='bajo'?'border-color:rgba(240,162,46,.35);background:#fffaf2':'';
  return {tone,html:`<div class="eyebrow">${esc(label)}</div>
    <p style="margin-top:6px">${esc(line)}</p>
    ${rec.delta?`<p style="margin-top:6px"><strong>${esc(t('food.trainAdjust',{kcal:rec.kcalTarget,carbs:rec.carbsTarget}))}</strong></p>`:''}
    ${fuelPlanHtml(sessions,weightKg,rec)}
    ${rec.delta?`<p class="muted" style="font-size:11.5px;margin-top:8px">${esc(t('food.trainWhy'))}</p>`:''}`};
}

// El consejo accionable: cuándo comer, no solo cuánto. Un número no le dice a nadie qué hacer;
// "80 g de carbos 75 min antes de la carrera" sí.
// Qué se entrenó hoy, según lo registrado: la actividad más reciente, o 'strength' si lo que
// hay son series marcadas.
function lastLoggedType(){
  const today=dayKey(new Date());
  const acts=state.externalActivities.filter(a=>dayKey(a.performed_at)===today)
    .sort((a,b)=>new Date(b.performed_at)-new Date(a.performed_at));
  if(acts.length) return acts[0].activity_type;
  const sets=state.sets.some(x=>x.user_id===state.user.id&&x.done&&dayKey(x.created_at)===today);
  return sets?'strength':null;
}

function fuelPlanHtml(sessions,weightKg,rec){
  if(!sessions.length) return '';
  // Lo ya entrenado abre la ventana de recuperación. Los gramos salen de la sesión que
  // coincide con lo registrado, no de la primera de la lista: una carrera suave pide la mitad
  // de carbos que un día de pierna, y dar el número del otro es dar un número casi correcto.
  const doneSession=rec.hasLog?(sessions.find(x=>x.activity_type===lastLoggedType())||sessions[0]):null;
  const doneFuel=doneSession?SkandiNutrition.fuelPlan(doneSession,weightKg):null;
  const doneLine=doneFuel
    ? `<p style="margin-top:8px">${esc(t('fuel.done',{carbs:doneFuel.after.carbs_g,protein:doneFuel.after.protein_g}))}</p>`
    : '';
  // ...pero si todavía falta parte de lo planeado, los consejos de esa sesión siguen siendo
  // lo más útil de la tarjeta. Registrar la carrera de la mañana no debe borrar el plan de
  // la sesión de pesas de la tarde.
  if(rec.fromLog) return doneLine;
  const blocks=sessions.slice(0,2).map(session=>{
    const fuel=SkandiNutrition.fuelPlan(session,weightKg);
    if(!fuel) return '';
    // El nombre que la sesión tiene en el calendario ("Descarga · Z2 suave") gana sobre la
    // etiqueta genérica del tipo de actividad ("Correr"): es el mismo renglón que ve en
    // Entrenar, y la sesión de fuerza de arriba ya se nombra así. Sin nombre —una sesión que
    // venga de otro lado— cae a la etiqueta de siempre.
    const label=session.name||ACTIVITY_LABELS[session.activity_type]||session.activity_type;
    const title=session.kind==='strength'
      ? t('fuel.session',{name:session.name||t('fuel.strength'),min:session.minutes})
      : session.distance_km
        ? `${label} · ${t('fuel.sessionKm',{km:session.distance_km,min:session.minutes})}`
        : t('fuel.session',{name:label,min:session.minutes});
    const lines=[
      fuel.before?t('fuel.before',{g:fuel.before.carbs_g,min:fuel.before.minutes_before}):t('fuel.beforeEasy'),
      fuel.during?t('fuel.during',{g:fuel.during.carbs_g_per_hour}):'',
      t('fuel.after',{min:fuel.after.minutes_after,carbs:fuel.after.carbs_g,protein:fuel.after.protein_g})
    ].filter(Boolean);
    return `<div style="margin-top:10px">
      <div class="eyebrow">${esc(title)}</div>
      <ul style="margin:6px 0 0;padding-left:18px">${lines.map(l=>`<li style="margin-top:3px">${esc(l)}</li>`).join('')}</ul>
    </div>`;
  }).join('');
  return `${doneLine}<div class="eyebrow" style="margin-top:12px">${esc(t('fuel.plan'))}</div>${blocks}`;
}

// ---- Qué comer hoy: consejo gratis + sugerencia con IA, una sola tarjeta ----
//
// trainingDayInnerHtml() ya calcula el ajuste algorítmico (gratis, instantáneo); esto añade el
// EJEMPLO concreto con IA ("dos tortillas con miel") y "qué cocinar para llegar a tus macros
// del día" — una tarea de creatividad acotada por números que un prompt resuelve mejor que una
// fórmula. Antes eran dos <section class="card"> con exactamente la misma condición de
// aparición (hoy, con metas) — se fusionan en una: el consejo gratis primero si lo hay, el
// botón de IA siempre al final, nunca como su propia tarjeta aparte diciendo lo mismo dos veces.
function todaysPlanCard(){
  const day=trainingDayInnerHtml();
  const heading=day.html?'':`<div class="row"><div><h2>${esc(t('food.suggestTitle'))}</h2><p class="muted">${esc(t('food.suggestHint'))}</p></div></div>`;
  return `<section class="card" style="${day.tone}">
    ${day.html}
    ${heading}
    <button class="btn ${day.html?'':'primary'}" style="width:100%;margin-top:${day.html?'12':'10'}px" onclick="openMealSuggestion()">${esc(t('food.suggestBtn'))}</button>
    <p class="muted" style="font-size:11px;margin-top:8px;text-align:center">${esc(t('food.aiLeft',{n:aiLeft()}))}</p>
  </section>`;
}

function openMealSuggestion(){
  return loadMealSuggestion('brief');
}

// 'brief' es la primera llamada, siempre corta — no cuesta leerla ni de más ni de menos.
// 'full' solo se pide con el botón "Más detalle", cuando la corta ya se vio y no bastó: un
// segundo golpe de cuota explícito, nunca automático.
async function loadMealSuggestion(detail){
  const key=foodDay();
  const totals=SkandiNutrition.dayTotals(mealsOfDay(key));
  // La meta de ESE día, override del coach incluido: "cuánto te falta hoy" es la mitad del
  // prompt, y calcularlo contra la meta base manda un número que no es el del día.
  const targets=targetsForDay(key);
  if(!targets) return alert(t('food.noTarget'));
  const remaining=SkandiNutrition.remaining(targets,totals);
  const weightKg=latestWeightKg();
  // El mismo catálogo que ya se le muestra en "Rápidos": lo que de verdad prepara seguido,
  // no una receta que un modelo se inventó. Nombre y kind nada más — sin macros, que esos ya
  // los tiene el modelo por otro lado y no hace falta mandarlos dos veces.
  const catalog=[
    ...state.dishes.slice(0,10).map(d=>d.name),
    ...state.foods.filter(f=>f.user_id).slice(0,10).map(f=>f.name)
  ];
  // La alacena (migración 111) va aparte del catálogo: es "lo que hay a bordo ahora", no
  // "lo que suele preparar", y el prompt del servidor le da prioridad distinta a cada lista.
  const pantry=pantryFoods().slice(0,20).map(f=>f.name);
  const sessions=sessionsForFuel(key,weightKg);

  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(t('food.suggestTitle'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${esc(t('food.suggestLoading'))}</p>`;

  try{
    const data=await skandiApi('meal-suggestion',{remaining,sessions,catalog,pantry,detail,diet_notes:targets.diet_notes||null});
    await loadNutrition();
    if(state.view==='food') render();
    $('modalCard').innerHTML=`
      <div class="row"><h1>${esc(t('food.suggestTitle'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
      <div class="eyebrow">${esc(t('food.suggestCook'))}</div>
      <p style="margin-top:6px;white-space:pre-line">${esc(data.cook_suggestion)}</p>
      ${data.pre_workout?`<div class="eyebrow" style="margin-top:14px">${esc(t('food.suggestPre'))}</div><p style="margin-top:6px">${esc(data.pre_workout)}</p>`:''}
      ${data.post_workout?`<div class="eyebrow" style="margin-top:14px">${esc(t('food.suggestPost'))}</div><p style="margin-top:6px">${esc(data.post_workout)}</p>`:''}
      ${data.detail!=='full'?`<button class="btn" style="width:100%;margin-top:14px" onclick="loadMealSuggestion('full')">${icon('plus',16)} ${esc(t('food.suggestMore'))}</button>`:''}
      <p class="muted" style="font-size:11px;margin-top:${data.detail!=='full'?'10':'14'}px">${esc(t('food.aiLeft',{n:aiLeft()}))}</p>`;
  }catch(e){
    $('modalCard').innerHTML=`
      <div class="row"><h1>${esc(t('food.suggestTitle'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
      <p class="muted" style="color:var(--pink)">${esc(e.message||String(e))}</p>`;
  }
}

function dayRingCard(totals,targets){
  const left=SkandiNutrition.remaining(targets,totals);
  const p=SkandiNutrition.pct(totals.kcal,targets.kcal_target);
  const over=left.kcal<0;
  // Prefiere el techo de azúcar AÑADIDA (migración 089) sobre el de azúcar total en cuanto
  // exista: es el que de verdad hay que vigilar (la fruta entera no debería llenar la barra).
  // Si la migración no se ha corrido, added_sugar_g_target no viene en la fila y esto cae solo
  // al comportamiento de antes — nada se rompe por adelantarse a correrla.
  const usingAdded=targets.added_sugar_g_target!=null;
  const sugarCap=usingAdded?targets.added_sugar_g_target:targets.sugar_g_target;
  const sugarValue=usingAdded?totals.added_sugar_g:totals.sugar_g;
  return `<section class="card click-card" onclick="openTargets()">
    <div class="row" style="gap:16px;align-items:center">
      <div class="kcal-ring ${over?'over':''}" style="--p:${Math.min(p,100)}%">
        <i><span><b>${Math.abs(left.kcal)}</b><small>${esc(over?t('food.over'):t('food.left'))}</small></span></i>
      </div>
      <div class="macro-grid">
        ${macroRowHtml('p',t('food.protein'),totals.protein_g,targets.protein_g_target)}
        ${macroRowHtml('c',t('food.carbs'),totals.carbs_g,targets.carbs_g_target)}
        ${macroRowHtml('f',t('food.fat'),totals.fat_g,targets.fat_g_target)}
        ${sugarCap?sugarRowHtml(sugarValue,sugarCap,usingAdded):''}
      </div>
    </div>
    <p class="muted" style="margin-top:10px;font-size:12px">${Math.round(totals.kcal)} / ${targets.kcal_target} kcal · ${esc(t('food.aiLeft',{n:aiLeft()}))}</p>
  </section>`;
}

// El azúcar se pinta distinto porque significa otra cosa: llenar la barra es malo, no bueno.
function sugarRowHtml(value,cap,isAdded){
  const p=SkandiNutrition.pct(value,cap);
  const over=value>cap;
  return `<div class="macro-row s ${over?'over':''}">
    <div class="row"><span>${esc(isAdded?t('food.addedSugar'):t('food.sugar'))}</span><span>${Math.round(value)} / ${cap} g ${esc(t('food.sugarCap'))}</span></div>
    <div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>
  </div>`;
}

function macroRowHtml(kind,label,value,target){
  const p=SkandiNutrition.pct(value,target);
  return `<div class="macro-row ${kind}">
    <div class="row"><span>${esc(label)}</span><span>${Math.round(value)} / ${target} g</span></div>
    <div class="bar"><i style="width:${Math.min(p,100)}%"></i></div>
  </div>`;
}

function noTargetCard(){
  return `<section class="card click-card" onclick="openTargets()" style="border-color:rgba(0,168,200,.35)">
    <div class="row"><div><h2>${esc(t('food.noTarget'))}</h2><p class="muted">${esc(t('food.noTargetHint'))}</p></div>${icon('chevronRight',20)}</div>
  </section>`;
}

// Una comida que lleva más de esto en 'pending' ya no está analizándose: se perdió la
// respuesta (se cerró la app, se cayó la red, el endpoint murió sin poder marcarla). Pintarla
// como fallida es lo honesto, y además saca el botón de reintentar.
const STALE_PENDING_MS=5*60*1000;

function mealCardHtml(m){
  const stale=m.analysis_status==='pending'&&Date.now()-new Date(m.created_at||m.eaten_at).getTime()>STALE_PENDING_MS;
  const pending=m.analysis_status==='pending'&&!stale;
  const failed=m.analysis_status==='failed'||stale;
  const time=new Date(m.eaten_at).toLocaleTimeString(LANG==='es'?'es-MX':'en-US',{hour:'numeric',minute:'2-digit'});
  const sub=failed?t('food.failed'):pending?t('food.analyzing'):`${mealTypeLabel(m.meal_type)} · ${time}`;
  const title=m.note||mealTypeLabel(m.meal_type);
  const photoUrl=m.photo_path?mealPhotoUrl(m.photo_path):'';
  return `<button class="meal-card" onclick="openMealDetail('${m.id}')">
    <span class="meal-thumb">${photoUrl?`<img src="${esc(photoUrl)}" alt="" loading="lazy">`:icon('image',22)}</span>
    <span class="lbl"><h3>${esc(String(title).slice(0,60))}</h3><p>${esc(sub)}</p></span>
    <span class="meal-kcal" style="${failed?'color:var(--pink)':''}">${pending?'…':Math.round(m.kcal)+' kcal'}</span>
  </button>`;
}

// ---- Agregar rápido: repetir algo (por frecuencia) o lo que hay a bordo (alacena, migración
// 111) ────────────────────────────────────────────────────────────────────────────────────
//
// Antes eran dos <section class="card"> separadas con el mismo patrón visual (una tira de
// chips que se toca una vez para registrar) — solo cambiaba de dónde salía la lista: la de
// arriba por frecuencia de uso, la de abajo por lo que de verdad está marcado a bordo ahorita.
// Esa diferencia real de fuente se conserva (loadMealSuggestion() sigue mandando `pantry` aparte
// de `catalog` al servidor), pero la presentación se fusiona en una sola tarjeta con pestañas
// — mismo componente `.seg.sub` que ya usa Progreso — en vez de dos tarjetas apiladas
// diciendo básicamente "toca esto para registrarlo" dos veces seguidas.
function setFoodQuickTab(tab){
  state.foodQuickTab=tab;
  render();
}

function quickAddCard(){
  const dishes=state.dishes.slice(0,10);
  const foods=state.foods.filter(f=>f.user_id&&f.times_used>0).slice(0,12);
  const pantryItems=pantryFoods();
  const tab=state.foodQuickTab==='pantry'?'pantry':'frequent';
  const rows=tab==='pantry'
    ?(pantryItems.length?`<div class="pick-row" style="margin-top:9px">${pantryItems.map(f=>
        `<button class="pick" onclick="openFoodPortion('${f.id}',null)"><b>${esc(f.name)}</b><small>${Math.round(f.kcal_100g)}/100g</small></button>`
      ).join('')}</div>`:`<p class="muted" style="margin-top:8px">${esc(t('food.pantryEmptyHint'))}</p>`)
    :((dishes.length||foods.length)?`${dishes.length?`<div class="pick-row" style="margin-top:9px">${dishes.map(d=>{
        const kcal=Math.round(SkandiNutrition.itemsTotal(itemsOfDish(d.id)).kcal);
        return `<button class="pick" onclick="openDishLog('${d.id}')"><b>${esc(d.name)}</b><small>${kcal} kcal</small></button>`;
      }).join('')}</div>`:''}
      ${foods.length?`<div class="pick-row" style="${dishes.length?'':'margin-top:9px'}">${foods.map(f=>
        `<button class="pick" onclick="openFoodPortion('${f.id}',null)"><b>${esc(f.name)}</b><small>${Math.round(f.kcal_100g)}/100g</small></button>`
      ).join('')}</div>`:''}`:`<p class="muted" style="margin-top:8px">${esc(t('food.quickPicksEmptyHint'))}</p>`);
  return `<section class="card">
    <div class="row">
      <div class="seg sub" style="flex:1">
        <button class="${tab==='frequent'?'active':''}" onclick="setFoodQuickTab('frequent')">${esc(t('food.quickPicks'))}</button>
        <button class="${tab==='pantry'?'active':''}" onclick="setFoodQuickTab('pantry')">${esc(t('food.pantry'))}</button>
      </div>
      ${tab==='pantry'?`<button class="chip" style="margin-left:8px" onclick="openManagePantry()">${esc(t('food.pantryManage'))}</button>`:''}
    </div>
    ${rows}
  </section>`;
}

function openManagePantry(){
  state.pantryPicker={query:''};
  $('modal').classList.add('show');

// Toggle optimista: la fila cambia al toque, y si el guardado falla se revierte solo con el
// loadAll() del catch — sentir el check como instantáneo importa más aquí que en casi cualquier
// otro botón de la app, porque se toca varias veces al día.
async function toggleSupplementToday(id,wasOn){
  const today=dayKey(new Date());
  if(wasOn){
    state.supplementLogs=state.supplementLogs.filter(l=>!(l.supplement_id===id&&l.taken_on===today));
  }else{
    state.supplementLogs=[...state.supplementLogs,{supplement_id:id,taken_on:today,user_id:state.user.id}];
  }
  render();
  const {error}=wasOn
    ? await sb.from('skandi_supplement_logs').delete().eq('supplement_id',id).eq('taken_on',today)
    : await sb.from('skandi_supplement_logs').insert({user_id:state.user.id,supplement_id:id,taken_on:today});
  if(error){ alert(error.message); await loadAll(); render(); }
}

function mealPhotoUrl(path){
  // El bucket es privado, así que no hay URL pública: firmamos en el cliente y cacheamos la
  // firma en memoria mientras dure la sesión.
  if(!path) return '';
  if(mealPhotoUrl.cache[path]) return mealPhotoUrl.cache[path];
  mealPhotoUrl.cache[path]='';
  sb.storage.from('skandi-meals').createSignedUrl(path,3600).then(({data})=>{
    if(data?.signedUrl){
      mealPhotoUrl.cache[path]=data.signedUrl;
      if(state.view==='food') render();
      // El detalle abierto también espera esa foto; sin esto se queda en blanco hasta cerrar.
      document.querySelectorAll(`img[data-photo="${path}"]`).forEach(img=>{img.src=data.signedUrl;});
    }
  });
  return '';
}
mealPhotoUrl.cache={};

// arrancar ahí. En vez de copiar la dieta de una persona en particular al código compartido de
// toda la tripulación, se combinan alimentos genéricos del catálogo global en unos cuantos
// platillos de ejemplo — cada quien los edita, escala o borra igual que cualquier otro.
const STARTER_DISHES=[
  {name:'Pollo con arroz y aguacate',items:[
    {food:'Pechuga de pollo',grams:150},{food:'Arroz blanco cocido',grams:150},{food:'Aguacate',grams:50}
  ]},
  {name:'Avena con proteína y plátano',items:[
    {food:'Avena',grams:60},{food:'Proteína de suero (whey)',grams:30},{food:'Plátano',grams:100}
  ]},
  {name:'Atún con camote',items:[
    {food:'Atún en agua',grams:150},{food:'Camote cocido',grams:200},{food:'Aceite de oliva',grams:10}
  ]},
  {name:'Huevo con frijoles y tortillas',items:[
    {food:'Huevo entero',grams:150},{food:'Frijol negro cocido',grams:150},{food:'Tortilla de maíz',grams:50}
  ]}
];

async function seedStarterCatalog(){
  if(!confirm(t('food.seedConfirm'))) return;
  const globalFoods=state.foods.filter(f=>!f.user_id);
  if(!globalFoods.length) return alert(t('food.seedNoFoods'));
  const existingNames=new Set(state.dishes.map(d=>d.name.toLowerCase()));
  let created=0;
  for(const d of STARTER_DISHES){
    if(existingNames.has(d.name.toLowerCase())) continue;
    const rows=d.items.map(it=>{
      const food=globalFoods.find(f=>f.name.toLowerCase()===it.food.toLowerCase());
      return food?{food_id:food.id,label:food.name,...SkandiNutrition.scaleFood(food,it.grams)}:null;
    }).filter(Boolean);
    if(!rows.length) continue;
    const {data:dish,error:dishErr}=await sb.from('skandi_dishes').insert({user_id:state.user.id,name:d.name}).select().single();
    if(dishErr||!dish) continue;
    const {error:itemsErr}=await writeToleratingMissingColumn(
      withCol=>sb.from('skandi_dish_items').insert(rows.map((r,i)=>({
        ...(withCol?r:omit(r,'added_sugar_g')),
        dish_id:dish.id,user_id:state.user.id,sort_order:i,included:true,is_cooking_fat:false
      }))),
      'added_sugar_g'
    );
    if(!itemsErr) created++;
  }
  closeModal();
  await loadAll();
  render();
  if(created) alert(t('food.seedDone',{n:created}));
  else alert(t('food.seedNothingNew'));
}

// Lo mismo que rememberMealItems, pero para TODO el historial en vez de una comida recién
// analizada — para quien ya traía meses de comidas analizadas antes de que esto existiera.
// state.mealItems no tiene límite de fecha (loadNutrition la carga completa), así que no hace
// falta ninguna consulta nueva. Un renglón por nombre: el upsert de rememberFood ya reconcilia
// el mismo alimento exacto, esto solo evita cientos de writes redundantes en un historial largo.
// Se deja siempre visible en vez de esconderse tras un "ya corrí esto" — no hay dónde guardar
// esa marca sin una columna nueva, y volver a correrlo es barato.
async function backfillFoodsFromMealHistory(){
  if(!await confirmSheet(t('food.backfillConfirm'))) return;
  const seen=new Set();
  let created=0;
  for(const item of state.mealItems){
    if(item.source!=='ai'||item.is_cooking_fat||item.food_id) continue;
    const key=(item.label||'').trim().toLowerCase();
    if(!key||seen.has(key)) continue;
    seen.add(key);
    await rememberFood(item);
    created++;
  }
  closeModal();
  await loadNutrition();
  render();
  alertSheet(t('food.backfillDone',{n:created}));
}

// La hora decide el tipo de comida por default: nadie quiere elegir "desayuno" a las 8 am.
function guessMealType(){
  const h=new Date().getHours();
  return h<11?'desayuno':h<17?'comida':h<22?'cena':'snack';
}

function pickVenue(v){
  document.querySelectorAll('.venue-chip').forEach(b=>b.classList.toggle('active',b.dataset.venue===v));
}
const pickedVenue=()=>document.querySelector('.venue-chip.active')?.dataset.venue||'casa';

// Elegir fotos AÑADE a lo que ya se había elegido en vez de reemplazarlo — así que tocar
// "Agregar fotos" una segunda vez suma más en vez de perder las primeras, tanto si el celular
// deja elegir varias de una vez como si solo deja una por toque.
async function onMealPhotoPicked(input){
  const files=Array.from(input.files||[]);
  input.value='';
  if(!files.length) return;
  try{
    // El EXIF hay que leerlo del archivo ORIGINAL: compressImage dibuja en un canvas y el
    // canvas no conserva metadatos, así que del blob comprimido ya no se puede sacar nada. Solo
    // de la primera foto del lote: es la que decide "cuándo" si el usuario no la toca a mano.
    if(!state.pendingMeal.photoTakenAt){
      readExifDateTaken(files[0]).then(date=>{
        if(!date||date.getTime()>Date.now()) return; // una fecha futura es un reloj mal puesto, se ignora
        state.pendingMeal.photoTakenAt=date.toISOString();
        if(state.pendingMeal.whenTouched||!$('mealWhen')) return; // el usuario ya la cambió a mano: no se pisa
        $('mealWhen').value=toLocalDatetimeValue(date);
        if($('mealWhenHint')) $('mealWhenHint').textContent=t('food.whenFromPhoto');
      });
    }
    for(const file of files){
      const blob=await compressImage(file);
      state.pendingMeal.blobs.push(blob);
    }
    renderMealPhotoStrip();
  }catch(e){
    alert(e.message||String(e));
  }
}

function renderMealPhotoStrip(){
  const blobs=state.pendingMeal.blobs;
  $('mealPhotoPreview').innerHTML=blobs.map((b,i)=>
    `<div class="ph-tile"><img src="${URL.createObjectURL(b)}" alt=""><button type="button" onclick="removeMealPhoto(${i})" aria-label="${esc(t('common.close'))}">${icon('close',12)}</button></div>`
  ).join('');
  $('photoBtnLabel').textContent=blobs.length
    ?`${blobs.length} ${tp(blobs.length,'common.photos')} · ${Math.round(blobs.reduce((s,b)=>s+b.size,0)/1024)} KB`
    :t('food.addPhotos');
  if($('mealPhotoHint')) $('mealPhotoHint').textContent=blobs.length>1?t('food.multiPhotoHint'):'';
}

function removeMealPhoto(i){
  state.pendingMeal.blobs.splice(i,1);
  renderMealPhotoStrip();
}

// Comprimir en el cliente no es cosmético: sube una foto de 4 MB del celular y estás pagando
// tokens por píxeles que el modelo no aprovecha, además de tardar en subir con datos móviles.
function compressImage(file,maxSide=MEAL_PHOTO_MAX_SIDE,quality=MEAL_PHOTO_QUALITY){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(b=>b?resolve(b):reject(new Error('No se pudo procesar la imagen')),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No se pudo leer la imagen'));};
    img.src=url;
  });
}

// ---- Cuándo: fecha/hora de la comida ----
//
// Las cuatro rutas de alta guardaban eaten_at como now() siempre: registrar a las 11pm la cena
// de las 8 quedaba bien, pero registrar en el desayuno la cena de ANOCHE la contaba como hoy, y
// no había forma de corregirlo después. Aquí se deja elegir la fecha/hora al capturar, y se
// puede corregir desde el detalle de la comida (updateMealEatenAt).

// input[type=datetime-local] quiere "YYYY-MM-DDTHH:mm" en hora LOCAL, sin zona horaria.
function toLocalDatetimeValue(d){
  const x=new Date(d);
  const pad=n=>String(n).padStart(2,'0');
  return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`;
}

// El propio input tiene max="ahora", pero un reloj de sistema adelantado o el propio valor
// pegado a mano puede colarse: se revalida al enviar.
function parseWhenInput(id){
  const raw=$(id)?.value;
  if(!raw) return new Date();
  const d=new Date(raw);
  return Number.isNaN(d.getTime())?new Date():d;
}

// Best-effort: solo entiende JPEG con EXIF (lo normal en una foto de cámara/celular). HEIC,
// capturas de pantalla o una imagen ya sin metadatos devuelven null sin quejarse, y el campo de
// fecha se queda en "ahora", editable a mano — nunca se bloquea el registro por esto.
async function readExifDateTaken(file){
  try{
    if(!file||!file.type||!/jpe?g/i.test(file.type)) return null;
    const buf=await file.slice(0,131072).arrayBuffer();
    const view=new DataView(buf);
    if(view.byteLength<4||view.getUint16(0)!==0xFFD8) return null;
    let offset=2;
    while(offset+4<=view.byteLength){
      const marker=view.getUint16(offset);
      if(marker===0xFFD9||marker===0xFFDA) return null;
      const size=view.getUint16(offset+2);
      if(marker===0xFFE1&&size>=8&&offset+2+size<=view.byteLength){
        const tiffStart=offset+4;
        if(view.getUint32(tiffStart)===0x45786966&&view.getUint16(tiffStart+4)===0){
          const date=parseExifTiff(view,tiffStart+6);
          if(date) return date;
        }
      }
      offset+=2+size;
    }
    return null;
  }catch(e){ return null; }
}

function readExifIfd(view,tiffStart,ifdStart,little){
  const out=new Map();
  if(ifdStart+2>view.byteLength) return out;
  const count=view.getUint16(ifdStart,little);
  for(let i=0;i<count;i++){
    const entry=ifdStart+2+i*12;
    if(entry+12>view.byteLength) break;
    const tag=view.getUint16(entry,little);
    const type=view.getUint16(entry+2,little);
    const n=view.getUint32(entry+4,little);
    if(tag!==0x9003&&tag!==0x9004&&tag!==0x8769) continue;
    if(type===2){
      const valOffset=n<=4?entry+8:tiffStart+view.getUint32(entry+8,little);
      if(valOffset+n<=view.byteLength){
        let s='';
        for(let j=0;j<n;j++){const c=view.getUint8(valOffset+j); if(c===0) break; s+=String.fromCharCode(c);}
        out.set(tag,s);
      }
    }else if(type===4){
      out.set(tag,view.getUint32(entry+8,little));
    }
  }
  return out;
}

function parseExifTiff(view,tiffStart){
  if(tiffStart+8>view.byteLength) return null;
  const bo=view.getUint16(tiffStart);
  const little=bo===0x4949;
  if(!little&&bo!==0x4D4D) return null;
  if(view.getUint16(tiffStart+2,little)!==42) return null;
  const ifd0=readExifIfd(view,tiffStart,tiffStart+view.getUint32(tiffStart+4,little),little);
  const exifPtr=ifd0.get(0x8769);
  if(exifPtr==null) return null;
  const exifIfd=readExifIfd(view,tiffStart,tiffStart+exifPtr,little);
  const raw=exifIfd.get(0x9003)||exifIfd.get(0x9004);
  if(!raw) return null;
  const m=/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(raw);
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
  return Number.isNaN(d.getTime())?null:d;
}

// ---- Escritura tolerante a la migración 089 (azúcar añadida) ----
//
// added_sugar_g / added_sugar_100g / added_sugar_g_target son columnas nuevas (migración 089,
// todavía sin correr en producción al escribir esto). Un select('*') las omite en silencio si
// no existen, pero un insert/update/upsert directo a una columna inexistente SÍ tira error y
// pierde el guardado completo — a diferencia de los RPC con jsonb, que ignoran claves de más
// sin quejarse. Por eso los tres sitios que escriben esas columnas por fuera de un RPC
// reintentan sin ellas si Postgres se queja, y así nunca dependen de si ya se corrió la
// migración: funcionan igual antes, y se ponen al día solos en cuanto se corra.
function omit(obj,key){ const {[key]:_omitted,...rest}=obj; return rest; }

async function writeToleratingMissingColumn(run,column){
  let res=await run(true);
  if(res.error&&res.error.message&&res.error.message.includes(column)){
    res=await run(false);
  }
  return res;
}

async function submitMealForAnalysis(){
  const pending=state.pendingMeal;
  if(!pending) return;
  const desc=$('mealDesc').value.trim();
  if(!pending.blobs.length&&!desc) return alert(t('food.errNoInput'));
  if(pending.mealId) return appendMealPhotos(pending,desc);
  const btn=$('mealGo');
  btn.disabled=true;btn.textContent=t('food.uploading');

  const eatenAt=parseWhenInput('mealWhen');
  if(eatenAt.getTime()>Date.now()+60000){
    btn.disabled=false;btn.textContent=t('food.analyze');
    return alert(t('food.errFuture'));
  }

  try{
    // La comida en sí solo carga UNA foto (photo_path); si se eligieron varias, las demás se
    // analizan como "más fotos de esta comida" (mismo camino que append) una vez que la comida
    // ya existe — ver analyzeExtraPhotos.
    const [first,...rest]=pending.blobs;
    let photoPath=null;
    if(first){
      photoPath=`${state.user.id}/${crypto.randomUUID()}.jpg`;
      const {error:upErr}=await sb.storage.from('skandi-meals').upload(photoPath,first,{contentType:'image/jpeg'});
      if(upErr) throw upErr;
    }
    const base={
      user_id:state.user.id,
      meal_type:$('mealType').value,
      venue:pickedVenue(),
      note:desc||null,
      photo_path:photoPath,
      input_kind:photoPath?'photo':'text',
      analysis_status:'pending',
      eaten_at:eatenAt.toISOString()
    };
    // La comida se guarda ANTES de llamar al modelo: si el análisis falla o tarda, ya quedó
    // registrada y se puede reintentar o capturar a mano.
    const {data:meal,error}=await writeToleratingMissingColumn(
      withCol=>sb.from('skandi_meals')
        .insert(withCol&&pending.photoTakenAt?{...base,photo_taken_at:pending.photoTakenAt}:base)
        .select().single(),
      'photo_taken_at'
    );
    if(error) throw error;

    closeModal();
    state.pendingMeal=null;
    await loadNutrition();
    setView('food');
    analyzeMeal(meal.id).then(()=>rest.length&&analyzeExtraPhotos(meal.id,rest));
  }catch(e){
    btn.disabled=false;btn.textContent=t('food.analyze');
    alert(e.message||String(e));
  }
}

// Fotos de más allá de la primera, para una comida que se está creando apenas: se procesan en
// segundo plano una por una, igual que la primera (analyzeMeal ya se fue en background desde
// submitMealForAnalysis) — el usuario ya vio cerrarse el modal y puede seguir usando la app
// mientras se van sumando renglones.
async function analyzeExtraPhotos(mealId,blobs){
  for(const blob of blobs){
    await appendOnePhoto(mealId,blob,null);
    if(state.view==='food') render();
  }
}

// Agregar una foto MÁS a una comida que ya existe: a diferencia de una comida nueva, aquí sí
// esperamos la respuesta con el modal abierto (como openFoodPortion/addBarcodeResult) en vez
// de cerrar y analizar en segundo plano — no hay una fila "pending" propia que muestre el
// avance, así que el botón es lo único que puede contarlo. Con varias fotos elegidas a la vez
// se analizan una por una, EN SECUENCIA (cada llamada agrega renglones sobre lo que dejó la
// anterior) — mandarlas en paralelo arriesgaría que dos analyze() lean el mismo estado de la
// comida a la vez y se pisen entre sí.
async function appendMealPhotos(pending,desc){
  const btn=$('mealGo');
  // Sin fotos (solo texto) sigue siendo UNA llamada, no cero: total=0 haría que el ciclo nunca
  // corriera y "Agregar" se sintiera como que no hizo nada — exactamente lo que pasaba aquí.
  const total=pending.blobs.length||1;
  for(let i=0;i<total;i++){
    btn.disabled=true;
    btn.textContent=total>1?t('food.analyzingProgress',{i:i+1,n:total}):t('food.uploading');
    const onUploaded=()=>{ btn.textContent=total>1?t('food.analyzingProgress',{i:i+1,n:total}):t('food.analyzing'); };
    const {error}=await appendOnePhoto(pending.mealId,pending.blobs[i]||null,i===0?desc:null,onUploaded);
    if(error){
      btn.disabled=false;btn.textContent=t('food.addToMeal');
      return alert(error.message||String(error));
    }
  }
  closeModal();
  state.pendingMeal=null;
  await loadNutrition();
  await rememberMealItems(pending.mealId);
  setView('food');
  openMealDetail(pending.mealId);
}

// El envío de una sola foto a skandi_append_meal_items(), con la misma tolerancia a "se cortó
// la respuesta pero sí se guardó" que ya tenía appendMealPhoto. Devuelve {error} en vez de
// tirar, para que quien la llama en secuencia (appendMealPhotos, analyzeExtraPhotos) decida qué
// hacer sin un try/catch propio en cada vuelta del ciclo.
async function appendOnePhoto(mealId,blob,note,onUploaded){
  const beforeCount=itemsOfMeal(mealId).length;
  try{
    let photoPath=null;
    if(blob){
      photoPath=`${state.user.id}/${crypto.randomUUID()}.jpg`;
      const {error:upErr}=await sb.storage.from('skandi-meals').upload(photoPath,blob,{contentType:'image/jpeg'});
      if(upErr) throw upErr;
    }
    if(onUploaded) onUploaded();
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/skandi',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'analyze',meal_id:mealId,append:true,photo_path:photoPath,note:note||null})
    });
    const body=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(body.message||t('food.failed'));
    await loadNutrition();
    return {error:null};
  }catch(e){
    if(isTransientFetchError(e)){
      const appended=await waitForAppendedItems(mealId,beforeCount);
      if(appended) return {error:null};
    }
    return {error:e};
  }
}

// ---- Analizar sin registrar (foto y/o texto) — igual que openFoodInspect() pero para lo que
// no tiene código de barras: una foto del plato, o describirlo, antes de decidir si comerlo ----
//
// A diferencia de agregar una foto a la comida que se está armando (submitMealForAnalysis /
// appendMealPhotos), aquí NO se crea ni se toca ninguna comida en el servidor — inspect_only
// en api/skandi.js analiza y no guarda nada. Si el usuario decide registrarlo, confirmInspectAdd
// inserta los renglones que ya regresó esa llamada directo por RLS, sin volver a gastar cuota.
async function submitInspect(){
  const pending=state.pendingMeal;
  if(!pending) return;
  const desc=$('mealDesc').value.trim();
  if(!pending.blobs.length&&!desc) return alert(t('food.errNoInput'));
  const btn=$('mealGo');
  btn.disabled=true;btn.textContent=t('food.uploading');
  const uploaded=[];
  try{
    for(const blob of pending.blobs){
      const path=`${state.user.id}/${crypto.randomUUID()}.jpg`;
      const {error:upErr}=await sb.storage.from('skandi-meals').upload(path,blob,{contentType:'image/jpeg'});
      if(upErr) throw upErr;
      uploaded.push(path);
    }
    btn.textContent=t('food.analyzing');
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/skandi',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'analyze',inspect_only:true,photo_paths:uploaded,note:desc||null})
    });
    const body=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(body.message||t('food.failed'));
    await loadNutrition(); // refresca "te quedan N análisis hoy"
    const mealId=pending.mealId;
    state.pendingMeal=null;
    closeModal();
    openAnalyzeResult(body,mealId);
  }catch(e){
    if(uploaded.length){ try{ await sb.storage.from('skandi-meals').remove(uploaded); }catch{/* mejor esfuerzo */} }
    btn.disabled=false;btn.textContent=t('food.analyze');
    alert(e.message||String(e));
  }
}

function openAnalyzeResult(data,mealId){
  const items=data.items||[];
  const totals=SkandiNutrition.itemsTotal(items);
  let verdictHtml=`<p class="muted" style="margin-top:8px">${esc(t('food.noTarget'))}</p>`;
  const targets=state.nutritionTargets;
  if(targets){
    const dayTotals=SkandiNutrition.dayTotals(mealsOfDay(foodDay()));
    const remaining=SkandiNutrition.remaining(targets,dayTotals);
    const {verdict,reasons}=SkandiNutrition.evaluateScaled(totals,remaining,targets);
    const tone=verdict==='bad'?'border-color:rgba(212,72,84,.35);background:#fff7f7'
      :verdict==='caution'?'border-color:rgba(240,162,46,.35);background:#fffaf2'
      :'border-color:rgba(29,154,108,.3);background:#f3fbf7';
    verdictHtml=`<section class="card" style="${tone};margin-top:10px">
      <strong>${esc(t('food.verdict.'+verdict))}</strong>
      <ul style="margin:8px 0 0;padding-left:18px">${reasons.map(r=>`<li style="margin-top:4px">${esc(t('food.reason.'+r.kind,r))}</li>`).join('')}</ul>
    </section>`;
  }
  state.pendingInspect={items,mealId};
  $('modal').classList.add('show');
  $('modalCard').innerHTML=`
    <div class="row"><h1>${esc(data.dish_name||t('food.analyzeOnly'))}</h1><button class="x" onclick="closeModal()" aria-label="${esc(t('common.close'))}">${icon('close',20)}</button></div>
    <p class="muted">${Math.round(totals.kcal)} kcal · P ${totals.protein_g}g · C ${totals.carbs_g}g · G ${totals.fat_g}g</p>
    <div class="eyebrow" style="margin-top:10px">${esc(t('food.items'))}</div>
    ${items.map(i=>`<p style="margin-top:6px"><strong>${esc(i.label)}</strong> — ${Math.round(i.grams)} g · ${Math.round(i.kcal)} kcal</p>`).join('')}
    ${data.notes?`<p class="muted" style="font-size:12px;margin-top:8px">${esc(data.notes)}</p>`:''}
    ${verdictHtml}
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="confirmInspectAdd()">${esc(t('food.inspectAdd'))}</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">${esc(t('food.inspectClose'))}</button>`;
}

async function confirmInspectAdd(){
  const pending=state.pendingInspect;
  if(!pending||!pending.items.length) return;
  let mealId=pending.mealId;
  try{
    if(!mealId){
      const {data:meal,error}=await sb.from('skandi_meals').insert({
        user_id:state.user.id,meal_type:guessMealType(),input_kind:'photo',
        analysis_status:'ready',eaten_at:new Date().toISOString()
      }).select().single();
      if(error) return alert(error.message);
      mealId=meal.id;
    }
    const base=itemsOfMeal(mealId).reduce((m,i)=>Math.max(m,i.sort_order||0),0);
    const rows=pending.items.map((it,i)=>({
      meal_id:mealId,user_id:state.user.id,food_id:it.food_id||null,label:it.label,
      grams:it.grams,kcal:it.kcal,protein_g:it.protein_g,carbs_g:it.carbs_g,fat_g:it.fat_g,fiber_g:it.fiber_g,
      added_sugar_g:it.added_sugar_g??null,source:'ai',ai_confidence:it.ai_confidence??null,
      sort_order:base+i+1,is_cooking_fat:!!it.is_cooking_fat,included:it.included!==false
    }));
    const {error:itemsErr}=await writeToleratingMissingColumn(
      withCol=>sb.from('skandi_meal_items').insert(withCol?rows:rows.map(r=>omit(r,'added_sugar_g'))),
      'added_sugar_g'
    );
    if(itemsErr) return alert(itemsErr.message);
    state.pendingInspect=null;
    await loadNutrition();
    await rememberMealItems(mealId);
    state.foodDayOffset=0;
    setView('food');
    openMealDetail(mealId);
  }catch(e){
    alert(e.message||String(e));
  }
}

async function analyzeMeal(mealId,attempt=0){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/skandi',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'analyze',meal_id:mealId})
    });
    const body=await res.json().catch(()=>({}));
    if(!res.ok){
      // 429/5xx de Claude y 504 de Vercel son transitorios. Antes obligábamos al usuario a
      // pulsar "Reintentar" aunque exactamente la misma llamada funcionara segundos después.
      // El servidor devuelve retryable cuando alcanzó a clasificarlo; status >= 500 cubre el
      // caso en que Vercel mató la función antes de que pudiera mandar JSON.
      if(attempt<1&&(body.retryable===true||res.status>=500)){
        const settled=await waitForAnalysis(mealId);
        if(settled&&settled.analysis_status==='ready'){
          await loadNutrition();
          await rememberMealItems(mealId);
          if(state.view==='food') render();
          return openMealDetail(mealId);
        }
        await prepareMealRetry(mealId);
        return analyzeMeal(mealId,attempt+1);
      }
      // El servidor marca la comida como fallida en casi todos sus caminos, pero no puede
      // hacerlo en los que fallan antes de saber de qué comida hablamos (falta la API key,
      // sesión inválida, cuota agotada). Sin esto la tarjeta se queda en "Analizando..."
      // para siempre y no aparece el botón de reintentar.
      await markMealFailed(mealId,body.message||t('food.failed'));
      await loadNutrition();
      if(state.view==='food') render();
      alert(body.message||t('food.failed'));
      return;
    }
    await loadNutrition();
    await rememberMealItems(mealId);
    if(state.view==='food') render();
    openMealDetail(mealId);
  }catch(e){
    // Safari en iOS corta un fetch largo ("Load failed") aunque el servidor siga trabajando:
    // lo que se pierde es la RESPUESTA, no el análisis. Dar la comida por fallida aquí sería
    // mentir, y peor: reintentar gastaría una llamada de más por algo que ya se pagó. Así que
    // preguntamos por la comida unos segundos más antes de decidir.
    const settled=await waitForAnalysis(mealId);
    await loadNutrition();
    if(settled&&settled.analysis_status==='ready') await rememberMealItems(mealId);
    if(state.view==='food') render();
    if(settled&&settled.analysis_status==='ready') return openMealDetail(mealId);
    if(attempt<1){
      await prepareMealRetry(mealId);
      return analyzeMeal(mealId,attempt+1);
    }
    await markMealFailed(mealId,(settled&&settled.analysis_error)||e.message||String(e));
    await loadNutrition();
    if(state.view==='food') render();
    alert((settled&&settled.analysis_error)||e.message||String(e));
  }
}

// Cuánto esperamos a que el servidor termine cuando la respuesta se perdió. El análisis
// tarda entre 10 y 40 segundos según la foto, así que ~75 s cubre el caso normal sin dejar la
// tarjeta girando para siempre. (No conviene alargar esto de más: si lo que de verdad pasó fue
// que Claude tardó más de AI_TIMEOUT_MS y el servidor respondió "falló" — no que la respuesta se
// perdió después de un éxito real — aquí no hay nada que esperar, y una ventana más larga solo
// retrasa el aviso de un fallo que ya era inevitable.)
const ANALYSIS_POLL_MS=3000;
const ANALYSIS_POLL_TRIES=25;

async function waitForAnalysis(mealId){
  for(let i=0;i<ANALYSIS_POLL_TRIES;i++){
    await new Promise(r=>setTimeout(r,ANALYSIS_POLL_MS));
    const {data}=await sb.from('skandi_meals')
      .select('analysis_status,analysis_error').eq('id',mealId).maybeSingle();
    if(!data) return null;
    if(data.analysis_status!=='pending') return data;
  }
  return null;
}

// El equivalente de waitForAnalysis para appendMealPhoto: ahí no hay un analysis_status que
// cambie (la comida ya estaba 'ready'), así que la señal de "sí se guardó" es que aparezcan
// renglones nuevos.
async function waitForAppendedItems(mealId,beforeCount){
  for(let i=0;i<ANALYSIS_POLL_TRIES;i++){
    await new Promise(r=>setTimeout(r,ANALYSIS_POLL_MS));
    const {count}=await sb.from('skandi_meal_items').select('id',{count:'exact',head:true}).eq('meal_id',mealId);
    if((count||0)>beforeCount){ await loadNutrition(); return true; }
  }
  return false;
}

async function markMealFailed(mealId,message){
  await sb.from('skandi_meals')
    .update({analysis_status:'failed',analysis_error:String(message||'').slice(0,500)})
    .eq('id',mealId);
}

async function prepareMealRetry(mealId){
  await sb.from('skandi_meals')
    .update({analysis_status:'pending',analysis_error:null})
    .eq('id',mealId);
  await loadNutrition();
  if(state.view==='food') render();
}

async function retryAnalysis(mealId){
  await prepareMealRetry(mealId);
  analyzeMeal(mealId);
}

// ---- Alta: platillo guardado (nivel 1, cero tokens) ----

// mealId: si se abre desde una comida ya iniciada ("+ Platillo guardado" en su detalle), tocar
// un platillo lo SUMA a esa comida (quickAddDish) en vez de crear una comida nueva — mismo
// patrón que ya tenían openFoodPicker/openBarcode, para armar un plato combinando un platillo
// guardado con lo demás que ya se agregó.
function openDishPicker(mealId=null){

      return `<button class="meal-card" onclick="${mealId?`quickAddDish('${d.id}','${mealId}')`:`openDishLog('${d.id}')`}">

// Sumar TODOS los renglones de un platillo guardado a una comida que ya existe. A diferencia de
// skandi_create_meal_from_dish (que siempre CREA una comida), esto inserta directo en
// skandi_meal_items copiando los macros absolutos ya guardados en el platillo — el mismo dato
// que usa el RPC del lado del servidor, no una relectura por food_id (que podría no existir para
// un renglón que se corrigió a mano y ya no matchea ningún alimento del catálogo).
async function addDishItemsToMeal(mealId,dishId){
  const items=itemsOfDish(dishId);
  if(!items.length) return {error:null};
  const base=itemsOfMeal(mealId).reduce((m,i)=>Math.max(m,i.sort_order||0),0);
  const rows=items.map((it,i)=>({
    meal_id:mealId,user_id:state.user.id,food_id:it.food_id||null,label:it.label,
    grams:it.grams,kcal:it.kcal,protein_g:it.protein_g,carbs_g:it.carbs_g,fat_g:it.fat_g,fiber_g:it.fiber_g,
    added_sugar_g:it.added_sugar_g??null,source:'catalog',included:it.included,is_cooking_fat:it.is_cooking_fat,
    sort_order:base+i+1
  }));
  const {error}=await writeToleratingMissingColumn(
    withCol=>sb.from('skandi_meal_items').insert(withCol?rows:rows.map(r=>omit(r,'added_sugar_g'))),
    'added_sugar_g'
  );
  if(!error){
    const dish=state.dishes.find(d=>d.id===dishId);
    if(dish) await sb.from('skandi_dishes').update({times_used:(dish.times_used||0)+1,last_used_at:new Date().toISOString()}).eq('id',dishId);
  }
  return {error};
}

async function quickAddDish(dishId,mealId){
  const {error}=await addDishItemsToMeal(mealId,dishId);
  if(error) return alert(error.message);
  await loadNutrition();
  state.foodDayOffset=0;
  setView('food');
  openMealDetail(mealId);
}

// Sumar un alimento del catálogo a una comida ya iniciada en un solo toque, sin pasar por el
// modal de gramos: el mismo alimento se puede reescalar después desde el renglón ya agregado
// (updateItemGrams), así que pedir los gramos ANTES de agregarlo es fricción que no hace falta
// para lo que ya cargaste antes.
async function quickAddFood(foodId,mealId){
  const food=state.foods.find(f=>f.id===foodId);
  if(!food) return;
  const grams=food.serving_grams||100;
  const {error}=await sb.rpc('skandi_add_food_to_meal',{p_meal_id:mealId,p_food_id:foodId,p_grams:grams});
  if(error) return alert(error.message);
  await loadNutrition();
  state.foodDayOffset=0;
  setView('food');
  openMealDetail(mealId);
}

// Lo que ya cargaste antes, ordenado por uso — mismo criterio que la pestaña "Repetir algo" de quickAddCard().
// Con mealId ya fijo (comida ya iniciada) un toque SUMA directo, sin preguntar nada más — tipo
// de comida y hora ya quedaron decididos. Sin mealId (arrancando desde cero) un toque pasa por

  const foods=state.foods.filter(f=>f.user_id&&f.times_used>0).slice(0,8);

  return `<div class="eyebrow" style="margin-top:14px">${esc(t('food.quickPicks'))}</div>
    ${dishes.length?`<div class="pick-row">${dishes.map(d=>{

      return `<button class="pick" onclick="${onclick}"><b>${esc(d.name)}</b><small>${kcal} kcal</small></button>`;
    }).join('')}</div>`:''}
    ${foods.length?`<div class="pick-row">${foods.map(f=>{
      const onclick=mealId?`quickAddFood('${f.id}','${mealId}')`:`openFoodPortion('${f.id}',null)`;
      return `<button class="pick" onclick="${onclick}"><b>${esc(f.name)}</b><small>${Math.round(f.kcal_100g)}/100g</small></button>`;
    }).join('')}</div>`:''}`;
