<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="robots" content="noindex">
<title>HABIT · Competencia</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  Marcador en vivo de la competencia de levantamiento, para la pantalla del gym.

  Se captura en app.html → Admin → Competencia; aquí solo se lee. Sin ?id= muestra
  la competencia marcada "en pantalla" y no pide sesión (la tele no inicia sesión:
  el RLS de la migración 126 deja a anon leer solo esa). Con ?id= es la vista
  previa del admin, que sí necesita su sesión.

  El lugar no se calcula aquí: viene de la vista lift_competition_standings, la
  misma que lee el admin. Se entera de los cambios por Realtime y, por si el
  socket se cae, vuelve a leer cada 15 s.

  Doble clic o la tecla F: pantalla completa.
-->
<style>
:root{
  --black:#070707;--blue:#2563eb;--bl:#7fb0ff;--white:#f7f7f4;--gray:#8f96a3;--gl:#c9ced7;
  --green:#20d492;--amber:#f5b84b;--red:#ff6464;
  --gold:#f5c451;--silver:#dfe3ea;--bronze:#e0a174;
  --line:rgba(255,255,255,.08);
  --pad:clamp(14px,2.2vw,44px);
  --rh:72px;--hh:28px;--gap:8px;--cols:1;
  --tpl:calc(var(--rh)*.72) minmax(0,1fr) calc(var(--rh)*1.55) calc(var(--rh)*1.55) calc(var(--rh)*2.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(ellipse 70% 55% at 50% -14%,rgba(37,99,235,.26),transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 118%,rgba(37,99,235,.12),transparent 70%),
    var(--black);
}
body.idle{cursor:none}
.watermark{position:fixed;right:-9vh;bottom:-11vh;width:64vh;height:64vh;opacity:.035;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,24px);padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));padding-bottom:max(var(--pad),env(safe-area-inset-bottom))}

/* ── Encabezado ── */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(12px,2vw,32px);padding-bottom:clamp(10px,1.6vh,22px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:clamp(10px,1vw,16px);min-width:0}
.brand img{width:clamp(34px,6vh,74px);height:clamp(34px,6vh,74px);object-fit:contain;flex-shrink:0}
.brand-name{font-size:clamp(18px,3.2vh,40px);font-weight:900;letter-spacing:.12em;line-height:1}
.brand-sub{font-size:clamp(8px,1.15vh,14px);font-weight:800;letter-spacing:.24em;color:var(--bl);text-transform:uppercase;margin-top:.45em}
.title{text-align:center;min-width:0;max-width:56vw}
.kicker{font-size:clamp(10px,1.5vh,19px);font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--bl)}
h1{font-size:clamp(22px,5vh,66px);font-weight:900;letter-spacing:.005em;line-height:1.05;text-transform:uppercase;margin-top:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.4vw,22px)}
.live{display:inline-flex;align-items:center;gap:.6em;border:1px solid rgba(32,212,146,.32);background:rgba(32,212,146,.1);color:var(--green);border-radius:999px;padding:.55em 1.05em;font-size:clamp(10px,1.4vh,17px);font-weight:900;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.live i{width:.62em;height:.62em;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:pulse 1.6s ease-in-out infinite}
.live.warn{border-color:rgba(245,184,75,.35);background:rgba(245,184,75,.1);color:var(--amber)}
.live.preview{border-color:rgba(127,176,255,.35);background:rgba(37,99,235,.14);color:var(--bl)}
.live.preview i{animation:none}
.clock{font-size:clamp(18px,3.6vh,46px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--gl)}
@keyframes pulse{50%{opacity:.35}}

/* ── Tablero ── */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-items:start;gap:0 clamp(14px,1.6vw,34px)}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.head b{font-weight:inherit}
.head{flex:none;height:var(--hh);display:grid;grid-template-columns:var(--tpl);column-gap:calc(var(--rh)*.18);align-items:end;padding:0 calc(var(--rh)*.24) 2px;font-size:clamp(9px,1.25vh,15px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#6f7682;white-space:nowrap}
.head span:nth-child(n+3){text-align:right}
.head .ls,.board.compact .head .lf{display:none}
.board.compact .head .ls{display:inline}
.row{position:relative;flex:none;height:var(--rh);display:grid;grid-template-columns:var(--tpl);column-gap:calc(var(--rh)*.18);align-items:center;padding:0 calc(var(--rh)*.24);border-radius:calc(var(--rh)*.2);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);overflow:hidden}
.row>*:not(.bar){position:relative}
/* La barra se enciende hacia la punta: así se lee dónde termina sin una línea que cruce los números. */
.bar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(37,99,235,.08),rgba(37,99,235,.36));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row.unplaced .bar{display:none}
.pos{width:calc(var(--rh)*.72);height:calc(var(--rh)*.72);border-radius:calc(var(--rh)*.18);display:grid;place-items:center;font-size:calc(var(--rh)*.34);font-weight:900;background:rgba(255,255,255,.07);color:var(--gl);font-variant-numeric:tabular-nums}
.name{min-width:0;font-size:min(calc(var(--rh)*.36),54px);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att{text-align:right;font-size:min(calc(var(--rh)*.29),42px);font-weight:800;font-variant-numeric:tabular-nums;color:#a3a9b4;white-space:nowrap}
.att small{display:none}
.att.pending{color:#444952}
.att.counts{color:var(--white)}
.att.null{color:var(--red)}
.att.null .kg{text-decoration:line-through;text-decoration-thickness:.08em}
.best{text-align:right;font-size:min(calc(var(--rh)*.5),78px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.best span{font-size:.42em;font-weight:800;color:var(--gray);margin-left:.16em;letter-spacing:.04em}

.row.p1{border-color:rgba(127,176,255,.55);box-shadow:0 0 0 1px rgba(127,176,255,.18),0 12px 44px rgba(37,99,235,.28)}
.row.p1 .bar{background:linear-gradient(90deg,rgba(37,99,235,.3),rgba(37,99,235,.78))}
.row.p1 .pos{background:var(--gold);color:#1a1405}
.row.p2 .pos{background:var(--silver);color:#15171b}
.row.p3 .pos{background:var(--bronze);color:#1b120b}
.row.unplaced{background:rgba(255,255,255,.02)}
.row.unplaced .pos{background:rgba(255,255,255,.035);color:#5c626d}
.row.unplaced .name{color:#8f96a3}
.row.unplaced .best{color:#444952}

.row.hit-ok{animation:hitok 2.6s ease-out}
.row.hit-bad{animation:hitbad 2.6s ease-out}
@keyframes hitok{0%,25%{background:rgba(32,212,146,.22);border-color:rgba(32,212,146,.9)}}
@keyframes hitbad{0%,25%{background:rgba(255,100,100,.2);border-color:rgba(255,100,100,.9)}}

.board-empty{grid-column:1/-1;align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2vh;color:var(--gray);padding:4vh 0}
.board-empty img{width:clamp(70px,16vh,180px);height:clamp(70px,16vh,180px);opacity:.5}
.board-empty h2{font-size:clamp(22px,4.6vh,58px);font-weight:900;color:var(--white);letter-spacing:.01em}
.board-empty p{font-size:clamp(13px,2vh,26px);max-width:40ch;line-height:1.4}

/* ── Pie ── */
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:clamp(8px,1.4vh,18px);border-top:1px solid var(--line);font-size:clamp(11px,1.6vh,20px);color:var(--gray);font-weight:600}
.ticker{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--white);font-weight:800;text-transform:uppercase}
.ticker .ok{color:var(--green);font-weight:800}
.ticker .bad{color:var(--red);font-weight:800}
.ticker .tag{color:var(--bl);font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-right:.5em}
.foot-meta{white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── Aviso de cada intento (tercio inferior, estilo transmisión) ── */
.flash{position:fixed;z-index:10;left:50%;bottom:calc(var(--pad) + 7vh);transform:translate(-50%,160%);opacity:0;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .45s;
  width:min(76vw,1180px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(14px,2vw,40px);
  padding:clamp(14px,2.4vh,32px) clamp(18px,2.6vw,48px);border-radius:clamp(14px,2.2vh,28px);
  background:rgba(9,11,17,.94);border:1px solid rgba(127,176,255,.38);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 60px rgba(37,99,235,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.flash.show{transform:translate(-50%,0);opacity:1}
.flash-tag{font-size:clamp(11px,1.8vh,23px);font-weight:900;letter-spacing:.18em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:rgba(32,212,146,.14);color:var(--green);white-space:nowrap}
.flash-name{font-size:clamp(20px,4.6vh,62px);font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.flash-sub{font-size:clamp(11px,1.8vh,23px);color:var(--gl);font-weight:700;margin-top:.35em}
.flash-kg{font-size:clamp(36px,8.4vh,116px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.flash-kg .n{font-weight:inherit}
.flash-kg span{font-size:.36em;color:var(--gray);margin-left:.14em}
.flash.lead{border-color:rgba(245,196,81,.6);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 70px rgba(245,196,81,.2)}
.flash.lead .flash-tag{background:var(--gold);color:#1a1405}
.flash.bad{border-color:rgba(255,100,100,.5)}
.flash.bad .flash-tag{background:rgba(255,100,100,.14);color:var(--red)}
.flash.bad .flash-kg{color:var(--red)}
.flash.bad .flash-kg .n{text-decoration:line-through;text-decoration-thickness:.06em}

.fs-btn{position:fixed;right:14px;bottom:14px;z-index:20;border:1px solid rgba(255,255,255,.14);background:rgba(20,20,22,.85);color:var(--gl);border-radius:12px;padding:10px 14px;font:700 12px 'Inter',sans-serif;letter-spacing:.06em;cursor:pointer;opacity:.85;transition:opacity .3s}
body.idle .fs-btn{opacity:0;pointer-events:none}

/* ── Celular / pantalla vertical: una columna que se desplaza ── */
@media (max-width:760px),(orientation:portrait) and (max-width:1100px){
  html,body{overflow:auto}
  .stage{height:auto;min-height:100dvh}
  .top{grid-template-columns:minmax(0,1fr) auto}
  .title{grid-column:1/-1;grid-row:2;text-align:left;max-width:none}
  h1{white-space:normal}
  .clock{display:none}
  .board{display:block}
  .head{display:none}
  .row{height:auto;min-height:66px;padding:10px 12px;border-radius:14px;column-gap:10px;row-gap:3px;
    grid-template-columns:40px auto minmax(0,1fr) auto;grid-template-areas:"pos name name best" "pos a1 a2 best"}
  .pos{grid-area:pos;width:40px;height:40px;border-radius:11px;font-size:17px}
  .name{grid-area:name;font-size:17px}
  .a1{grid-area:a1}.a2{grid-area:a2}
  .att{text-align:left;font-size:13px}
  .att small{display:inline;font-size:10px;font-weight:800;color:#6f7682;letter-spacing:.06em}
  .best{grid-area:best;font-size:30px}
  .flash{width:calc(100vw - 24px);bottom:14px;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px}
  .flash-tag{grid-column:1/-1;justify-self:start}
  .fs-btn{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<img class="watermark" src="/icons/logo-original.png" alt="">
<div class="stage">
  <header class="top">
    <div class="brand">
      <img src="/icons/logo-original.png" alt="">
      <div><div class="brand-name">HABIT</div><div class="brand-sub">Training Hub</div></div>
    </div>
    <div class="title"><div class="kicker" id="kicker">Competencia</div><h1 id="title">HABIT</h1></div>
    <div class="status"><div class="live" id="live"><i></i><span>En vivo</span></div><div class="clock" id="clock">--:--</div></div>
  </header>
  <main class="board" id="board" aria-live="polite"></main>
  <footer class="foot">
    <div class="ticker" id="ticker"></div>
    <div class="foot-meta" id="meta"></div>
  </footer>
</div>
<div class="flash" id="flash" role="status">
  <div class="flash-tag" id="flash-tag"></div>
  <div style="min-width:0"><div class="flash-name" id="flash-name"></div><div class="flash-sub" id="flash-sub"></div></div>
  <div class="flash-kg" id="flash-kg"></div>
</div>
<button class="fs-btn" id="fs" type="button">Pantalla completa</button>

<script>
const SUPABASE_URL='https://pmpjteuqjusbiduevbwq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGp0ZXVxanVzYmlkdWV2YndxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2OTI1NjUsImV4cCI6MjA5MzI2ODU2NX0.XbMzZoo2yqtrD8znLnyo_1zDfrdJAvAPj1lqGOyXnLw';
const POLL_MS=15000;
const FLASH_MS=4200;
// Más avisos que esto en una sola lectura es una captura en bloque (o volvió la
// conexión): se actualiza el tablero sin un desfile de avisos.
const MAX_FLASHES_PER_UPDATE=3;

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const forcedId=new URLSearchParams(location.search).get('id');
const narrowMq=matchMedia('(max-width:760px),(orientation:portrait) and (max-width:1100px)');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFmt=new Intl.DateTimeFormat('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Mazatlan'});

let competition=null,rows=[],view='loading',fetchOk=true,prevSnap=null,lastEvent=null;
const rowEls=new Map();
let colEls=[];

function fmtKg(v){
  if(v==null)return '';
  const n=Number(v);
  return Number.isInteger(n)?String(n):String(+n.toFixed(2));
}
function isMissing(e){return /lift_compet|schema cache|does not exist|42P01/i.test(((e&&e.message)||'')+' '+((e&&e.code)||''));}
// Con lugar primero (1, 2, 3…); quien aún no tiene intento válido, al final y en
// el orden en que se registró.
function sortRows(list){
  return list.slice().sort((a,b)=>(a.place??1e9)-(b.place??1e9)||String(a.created_at).localeCompare(String(b.created_at)));
}

// ── Lectura ──────────────────────────────────────────────────────────────────
async function load(){
  let q=sb.from('lift_competitions').select('id,name,lift_name,on_screen');
  q=forcedId?q.eq('id',forcedId):q.eq('on_screen',true);
  const{data:comp,error}=await q.limit(1).maybeSingle();
  if(error){
    if(isMissing(error)){competition=null;rows=[];view='missing';return;}
    if(error.code==='22P02'){competition=null;rows=[];view='none';return;} // ?id= mal escrito
    throw error;
  }
  if(!comp){competition=null;rows=[];prevSnap=null;view='none';return;}
  const{data,error:e2}=await sb.from('lift_competition_standings')
    .select('id,name,attempt1_kg,attempt1_valid,attempt2_kg,attempt2_valid,best_kg,best_at,place,created_at')
    .eq('competition_id',comp.id);
  if(e2)throw e2;
  // Otra competencia entró a la pantalla: lo que ya trae no son intentos nuevos.
  if(!competition||competition.id!==comp.id){prevSnap=null;lastEvent=null;}
  competition=comp;rows=sortRows(data||[]);view='ok';
}
let inflight=false,again=false;
async function refresh(){
  if(inflight){again=true;return;}
  inflight=true;
  try{await load();fetchOk=true;}
  catch(e){console.warn('competencia:',e);fetchOk=false;}
  inflight=false;
  render();
  if(again){again=false;refresh();}
}
let debounceT=null;
function scheduleRefresh(){clearTimeout(debounceT);debounceT=setTimeout(refresh,150);}

// ── Qué cambió desde la última lectura ───────────────────────────────────────
function snapOne(r){
  return{
    a1:r.attempt1_kg==null?null:Number(r.attempt1_kg),v1:r.attempt1_valid!==false,
    a2:r.attempt2_kg==null?null:Number(r.attempt2_kg),v2:r.attempt2_valid!==false,
    place:r.place
  };
}
function snapshot(list){const m=new Map();list.forEach(r=>m.set(r.id,snapOne(r)));return m;}
function diff(prev,list){
  if(!prev)return [];
  const out=[];
  list.forEach(r=>{
    const p=prev.get(r.id),c=snapOne(r);
    // Si cambiaron los dos, el que se acaba de levantar es el segundo.
    for(const n of [2,1]){
      const kg=c['a'+n],ok=c['v'+n];
      if(kg==null)continue;
      if(!p||p['a'+n]!==kg||p['v'+n]!==ok){out.push({r,n,kg,valid:ok,place:r.place,prevPlace:p?p.place:null});break;}
    }
  });
  return out;
}
function eventTag(e){
  if(!e.valid)return{text:'Intento nulo',cls:'bad'};
  if(e.place===1&&e.prevPlace!==1)return{text:'¡Nuevo líder!',cls:'lead'};
  if(e.place&&e.prevPlace==null)return{text:'Entra en '+e.place+'° lugar',cls:''};
  if(e.place&&e.place<e.prevPlace)return{text:'Sube al '+e.place+'° lugar',cls:''};
  return{text:'Intento válido',cls:''};
}

// ── Pintado ──────────────────────────────────────────────────────────────────
function render(){
  paintStatus();
  paintHeader();
  if(view!=='ok'||!rows.length){
    paintEmpty();
    if(view==='ok')prevSnap=snapshot(rows);
    return;
  }
  const events=diff(prevSnap,rows);
  prevSnap=snapshot(rows);
  paintBoard();
  if(events.length)announce(events);
  paintFooter();
}
function paintStatus(){
  const el=$('live');
  let cls='live',text='En vivo';
  if(forcedId&&competition&&!competition.on_screen){cls+=' preview';text='Vista previa';}
  else if(!fetchOk){cls+=' warn';text='Reconectando';}
  el.className=cls;
  el.querySelector('span').textContent=text;
}
function paintHeader(){
  $('kicker').textContent=competition?competition.lift_name:'Competencia';
  $('title').textContent=competition?competition.name:'HABIT';
  document.title=competition?'HABIT · '+competition.name:'HABIT · Competencia';
}
function paintFooter(){
  const n=rows.length,marked=rows.filter(r=>r.place!=null).length;
  $('meta').textContent=n?n+' competidor'+(n===1?'':'es')+' · '+marked+' con marca':'';
  const t=$('ticker');
  if(!lastEvent){
    t.innerHTML='<span class="tag">Reglas</span>Cuenta el mejor intento válido · Empate: gana quien lo levantó primero';
    return;
  }
  const e=lastEvent;
  t.innerHTML='<span class="tag">Último</span><b>'+esc(e.r.name)+'</b> · '+(e.n===1?'1er':'2º')+' intento · '+esc(fmtKg(e.kg))+' kg '
    +(e.valid?'<span class="ok">✓ válido</span>':'<span class="bad">✕ nulo</span>');
}
function paintEmpty(){
  rowEls.clear();colEls=[];
  const board=$('board');
  board.style.setProperty('--cols',1);
  const [title,sub]=view==='loading'?['Cargando…','']
    :view==='missing'?['Falta preparar la base de datos','Corre la migración 126 en el SQL Editor de Supabase.']
    :view==='ok'?['Esperando a los competidores','En cuanto se registre el primero, aparece aquí.']
    :forcedId?['Esta competencia no está disponible','Si es una vista previa, abre la pantalla desde una sesión de admin.']
    :['No hay competencia en pantalla','Ponla en pantalla desde Admin → Competencia.'];
  board.innerHTML='<div class="board-empty"><img src="/icons/logo-original.png" alt=""><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>';
  $('meta').textContent='';
  $('ticker').textContent='';
}

// Cuántas columnas y qué alto de fila caben sin desplazar. En la tele todo se ve
// a la vez; en el celular es una lista que se desplaza.
function layout(n){
  if(narrowMq.matches)return{cols:1,per:n,rh:66,hh:0,gap:8};
  const vh=innerHeight,board=$('board');
  const H=board.clientHeight,W=board.clientWidth;
  const gap=Math.min(12,Math.max(5,vh*.008));
  const hh=Math.min(34,Math.max(16,vh*.03));
  const colGap=Math.min(34,Math.max(14,innerWidth*.016));
  // Gana el número de columnas que deja las filas más altas. El tope por ancho
  // (colW/12.5) es lo que le deja al nombre ~16 letras: con filas más altas que
  // eso, peso e intentos crecen y el nombre se corta.
  let best=null;
  for(let cols=1;cols<=3;cols++){
    const per=Math.ceil(n/cols);
    const colW=(W-colGap*(cols-1))/cols;
    const rh=Math.min((H-hh-gap*per)/per,vh*.14,colW/12.5);
    if(!best||rh>best.rh+.5)best={cols,per,rh};
  }
  return{cols:best.cols,per:best.per,rh:Math.max(28,Math.floor(best.rh)),hh,gap};
}
function headEl(){
  const h=document.createElement('div');
  h.className='head';
  h.innerHTML='<span>Pos</span><span>Atleta</span><span><b class="lf">1er intento</b><b class="ls">1º</b></span><span><b class="lf">2º intento</b><b class="ls">2º</b></span><span>Mejor</span>';
  return h;
}
function rowEl(){
  const el=document.createElement('div');
  el.className='row';
  el.innerHTML='<div class="bar"></div><div class="pos"></div><div class="name"></div><div class="att a1"></div><div class="att a2"></div><div class="best"></div>';
  return el;
}
function fillAtt(el,r,n){
  const kg=r['attempt'+n+'_kg'],ok=r['attempt'+n+'_valid']!==false;
  el.classList.toggle('pending',kg==null);
  el.classList.toggle('null',kg!=null&&!ok);
  el.classList.toggle('counts',kg!=null&&ok&&r.best_kg!=null&&Number(kg)===Number(r.best_kg));
  el.innerHTML='<small>'+(n===1?'1º':'2º')+' </small>'+(kg==null?'—':'<span class="kg">'+esc(fmtKg(kg))+'</span>'+(ok?'':' ✕'));
}
function fillRow(el,r){
  const placed=r.place!=null;
  [1,2,3].forEach(p=>el.classList.toggle('p'+p,r.place===p));
  el.classList.toggle('unplaced',!placed);
  el.querySelector('.pos').textContent=placed?String(r.place):'–';
  el.querySelector('.name').textContent=r.name;
  fillAtt(el.querySelector('.a1'),r,1);
  fillAtt(el.querySelector('.a2'),r,2);
  el.querySelector('.best').innerHTML=placed?esc(fmtKg(r.best_kg))+'<span>kg</span>':'—';
}
function paintBoard(){
  const board=$('board');
  const empty=board.querySelector(':scope>.board-empty');if(empty)empty.remove();
  // FLIP: dónde estaba cada fila antes de reordenar…
  const first=new Map();
  if(!reduceMotion)rowEls.forEach((el,id)=>first.set(id,el.getBoundingClientRect()));
  const L=layout(rows.length);
  const root=document.documentElement.style;
  root.setProperty('--rh',L.rh+'px');root.setProperty('--hh',L.hh+'px');root.setProperty('--gap',L.gap+'px');
  board.style.setProperty('--cols',L.cols);
  // Con filas bajas la columna de cada intento ya no cabe "1er intento".
  board.classList.toggle('compact',L.rh<64);
  while(colEls.length<L.cols){const c=document.createElement('div');c.className='col';c.appendChild(headEl());board.appendChild(c);colEls.push(c);}
  while(colEls.length>L.cols)colEls.pop().remove();
  const seen=new Set();
  rows.forEach((r,i)=>{
    let el=rowEls.get(r.id);const isNew=!el;
    if(isNew){el=rowEl();rowEls.set(r.id,el);}
    fillRow(el,r);
    colEls[Math.min(colEls.length-1,Math.floor(i/L.per))].appendChild(el);
    if(isNew&&!reduceMotion)el.animate([{opacity:0,transform:'translateX(-28px)'},{opacity:1,transform:'none'}],{duration:650,delay:Math.min(i*45,700),easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
    seen.add(r.id);
  });
  rowEls.forEach((el,id)=>{if(!seen.has(id)){el.remove();rowEls.delete(id);}});
  // …y se desliza desde ahí hasta su lugar nuevo.
  first.forEach((f,id)=>{
    const el=rowEls.get(id);if(!el)return;
    const l=el.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(Math.abs(dx)>1||Math.abs(dy)>1)el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:950,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
  // La barra es el mejor intento contra el del líder; se fija un cuadro después
  // para que una fila recién creada crezca desde cero en vez de aparecer llena.
  const leader=rows.find(r=>r.place===1);
  const top=leader?Number(leader.best_kg):0;
  requestAnimationFrame(()=>rows.forEach(r=>{
    const el=rowEls.get(r.id);if(!el)return;
    const w=r.place!=null&&top>0?Math.max(3,Number(r.best_kg)/top*100):0;
    el.querySelector('.bar').style.width=w.toFixed(2)+'%';
  }));
}

// ── Avisos ───────────────────────────────────────────────────────────────────
function hit(el,ok){
  el.classList.remove('hit-ok','hit-bad');
  void el.offsetWidth;
  el.classList.add(ok?'hit-ok':'hit-bad');
  setTimeout(()=>el.classList.remove('hit-ok','hit-bad'),2700);
}
function announce(events){
  events.forEach(e=>{const el=rowEls.get(e.r.id);if(el)hit(el,e.valid);});
  lastEvent=events.find(e=>eventTag(e).cls==='lead')||events[events.length-1];
  if(events.length>MAX_FLASHES_PER_UPDATE)return;
  events.forEach(e=>flashQueue.push(e));
  if(!flashing)nextFlash();
}
const flashQueue=[];let flashing=false;
function nextFlash(){
  const e=flashQueue.shift();
  if(!e){flashing=false;return;}
  flashing=true;
  const tag=eventTag(e),box=$('flash');
  box.className='flash'+(tag.cls?' '+tag.cls:'');
  $('flash-tag').textContent=tag.text;
  $('flash-name').textContent=e.r.name;
  $('flash-sub').textContent=(e.n===1?'1er':'2º')+' intento'+(e.valid&&e.place?' · '+e.place+'° lugar':'');
  $('flash-kg').innerHTML='<b class="n">'+esc(fmtKg(e.kg))+'</b><span>kg</span>';
  requestAnimationFrame(()=>box.classList.add('show'));
  setTimeout(()=>{box.classList.remove('show');setTimeout(nextFlash,700);},FLASH_MS);
}

// ── Pantalla: reloj, pantalla completa, que no se apague ─────────────────────
function tick(){$('clock').textContent=clockFmt.format(new Date());}
let wakeLock=null;
async function keepAwake(){
  try{if('wakeLock' in navigator&&!document.hidden&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}
  catch(_){}
}
function toggleFullscreen(){
  if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}
let idleT=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000);}

$('fs').addEventListener('click',toggleFullscreen);
addEventListener('dblclick',toggleFullscreen);
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggleFullscreen();});
addEventListener('mousemove',wake);
addEventListener('touchstart',wake,{passive:true});
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();keepAwake();}});
addEventListener('online',refresh);
let resizeT=null;
const relayout=()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(view==='ok'&&rows.length)paintBoard();},150);};
addEventListener('resize',relayout);
if(narrowMq.addEventListener)narrowMq.addEventListener('change',relayout);

sb.channel('lift-competition-screen')
  .on('postgres_changes',{event:'*',schema:'public',table:'lift_competitors'},scheduleRefresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'lift_competitions'},scheduleRefresh)
  .subscribe();
setInterval(refresh,POLL_MS);
setInterval(tick,1000);
tick();wake();keepAwake();
render();
refresh();
</script>
